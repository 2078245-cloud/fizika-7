(function(){'use strict';
const LABS=[{"id": "1", "title": "Цена деления и объём жидкости", "goal": "Определить цену деления шкалы и научиться измерять объём воды.", "equipment": "Пластиковая мерная ёмкость с читаемой шкалой, вода комнатной температуры, поднос.", "steps": ["Найди два соседних подписанных значения.", "Посчитай промежутки между ними, а не штрихи.", "Вычисли цену деления, затем измерь объём воды на уровне глаз.", "При вогнутом мениске воды считай по нижней части. Запиши единицы и ограничения точности."], "formula": "Цена деления = (большее значение − меньшее)/число промежутков.", "fields": [["low", "Меньшая отметка, мл"], ["high", "Большая отметка, мл"], ["count", "Число промежутков"]], "sample": [50, 100, 5], "cols": ["Прибор", "Цена деления, мл", "Объём воды, мл", "Замечания"], "conclusion": "Я определил цену деления … и измерил объём … . На отсчёт повлияли … .", "questions": ["Почему считаем промежутки?", "Чем цена деления отличается от измеренного объёма?"], "diagram": "<svg viewBox=\"0 0 600 260\" role=\"img\" aria-label=\"Шкала: пять промежутков между 50 и 100 мл\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"260\" rx=\"16\" fill=\"#eef7fa\"/><rect x=\"70\" y=\"75\" width=\"460\" height=\"70\" fill=\"white\" stroke=\"#31566c\"/><path d=\"M90 75v30\" stroke=\"#31566c\" stroke-width=\"2\"/><path d=\"M174 75v30\" stroke=\"#31566c\" stroke-width=\"2\"/><path d=\"M258 75v30\" stroke=\"#31566c\" stroke-width=\"2\"/><path d=\"M342 75v30\" stroke=\"#31566c\" stroke-width=\"2\"/><path d=\"M426 75v30\" stroke=\"#31566c\" stroke-width=\"2\"/><path d=\"M510 75v30\" stroke=\"#31566c\" stroke-width=\"2\"/><text x=\"90\" y=\"180\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">50 мл<\/text><text x=\"510\" y=\"180\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">100 мл<\/text><text x=\"300\" y=\"225\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"20\" fill=\"#173449\">Пять промежутков → 10 мл за деление<\/text><\/svg>", "limits": "Половина деления — возможная школьная оценка ошибки отсчёта по условию, а не универсальная полная погрешность любого прибора."}, {"id": "2", "title": "Размер малого тела методом рядов", "goal": "Оценить средний размер одинаковых небольших предметов.", "equipment": "Линейка, одинаковые гладкие безопасные детали.", "steps": ["Уложи одинаковые предметы без зазоров и перекрытий.", "Посчитай n и измерь длину ряда L.", "Вычисли средний размер d = L/n.", "Повтори с другим n и сравни результаты."], "formula": "d = L/n.", "fields": [["length", "Длина ряда L, мм"], ["count", "Число предметов n"]], "sample": [80, 10], "cols": ["Предметы", "n", "L, мм", "d, мм", "Замечания"], "conclusion": "Средний размер получился … . При повторе … . Возможные причины расхождения … .", "questions": ["Почему результат — средний размер?", "Что изменят зазоры?"], "diagram": "<svg viewBox=\"0 0 600 260\" role=\"img\" aria-label=\"Метод рядов\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"260\" rx=\"16\" fill=\"#eef7fa\"/><rect x=\"65\" y=\"95\" width=\"45\" height=\"50\" fill=\"#b8e1f2\" stroke=\"#31566c\"/><rect x=\"110\" y=\"95\" width=\"45\" height=\"50\" fill=\"#b8e1f2\" stroke=\"#31566c\"/><rect x=\"155\" y=\"95\" width=\"45\" height=\"50\" fill=\"#b8e1f2\" stroke=\"#31566c\"/><rect x=\"200\" y=\"95\" width=\"45\" height=\"50\" fill=\"#b8e1f2\" stroke=\"#31566c\"/><rect x=\"245\" y=\"95\" width=\"45\" height=\"50\" fill=\"#b8e1f2\" stroke=\"#31566c\"/><rect x=\"290\" y=\"95\" width=\"45\" height=\"50\" fill=\"#b8e1f2\" stroke=\"#31566c\"/><rect x=\"335\" y=\"95\" width=\"45\" height=\"50\" fill=\"#b8e1f2\" stroke=\"#31566c\"/><rect x=\"380\" y=\"95\" width=\"45\" height=\"50\" fill=\"#b8e1f2\" stroke=\"#31566c\"/><rect x=\"425\" y=\"95\" width=\"45\" height=\"50\" fill=\"#b8e1f2\" stroke=\"#31566c\"/><rect x=\"470\" y=\"95\" width=\"45\" height=\"50\" fill=\"#b8e1f2\" stroke=\"#31566c\"/><text x=\"300\" y=\"45\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">Одинаковые предметы без зазоров<\/text><text x=\"300\" y=\"210\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"24\" fill=\"#173449\">d = L/n<\/text><\/svg>", "limits": "Метод не устраняет неодинаковость предметов и зазоры. Не используй иглы и острые проволоки."}, {"id": "3", "title": "Измерение массы", "goal": "Измерить массу и учесть контейнер.", "equipment": "Весы, сухой контейнер, небольшая сухая LEGO-модель. В школе — рычажные весы по инструкции.", "steps": ["Проверь допустимую нагрузку, устойчивость и нуль.", "Взвесь пустой контейнер m₀ и контейнер с телом m₁.", "Вычти массу контейнера или используй тарирование.", "Переведи г в кг; приёмы рычажных весов изучаются отдельно."], "formula": "m = m₁ − m₀.", "fields": [["empty", "Масса контейнера, г"], ["total", "Общая масса, г"]], "sample": [150, 900], "cols": ["Предмет", "Контейнер, г", "Общая масса, г", "Масса тела, г", "Масса тела, кг"], "conclusion": "Масса тела … г = … кг. Масса контейнера учтена способом … .", "questions": ["Что будет без учёта контейнера?", "Чем электронные весы отличаются от рычажных?"], "diagram": "<svg viewBox=\"0 0 600 260\" role=\"img\" aria-label=\"Масса контейнера вычитается из общей массы\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"260\" rx=\"16\" fill=\"#eef7fa\"/><rect x=\"60\" y=\"70\" width=\"200\" height=\"110\" rx=\"12\" fill=\"#d5e8db\"/><rect x=\"340\" y=\"70\" width=\"200\" height=\"110\" rx=\"12\" fill=\"#b8e1f2\"/><text x=\"160\" y=\"110\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">Контейнер m₀<\/text><text x=\"440\" y=\"110\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">Вместе m₁<\/text><text x=\"300\" y=\"225\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"22\" fill=\"#173449\">Масса тела: m₁ − m₀<\/text><\/svg>", "limits": "Не клади мокрые, горячие и перегружающие прибор предметы. Домашний аналог не равен автоматически школьной работе."}, {"id": "4", "title": "Объём твёрдого тела", "goal": "Измерить объём по вытеснению воды.", "equipment": "Пластиковая мерная ёмкость, вода, нить, маленький непористый нерастворимый тонущий камень без острых краёв.", "steps": ["Определи цену деления и запиши V₁.", "Полностью погрузи тело без потерь воды.", "Удали пузырьки лёгким покачиванием и считай V₂.", "Вычисли разность в см³ и переведи в м³."], "formula": "V = V₂ − V₁; 1 мл = 1 см³.", "fields": [["before", "Вода до погружения, мл"], ["after", "Показание после, мл"]], "sample": [60, 95], "cols": ["Тело", "V₁, мл", "V₂, мл", "V, см³", "V, м³"], "conclusion": "Объём тела … см³. Метод подходит для этого тела, потому что … .", "questions": ["Почему нужно полное погружение?", "Чем мешают пузырьки и пористость?"], "diagram": "<svg viewBox=\"0 0 600 260\" role=\"img\" aria-label=\"Вытеснение воды погружённым телом\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"260\" rx=\"16\" fill=\"#eef7fa\"/><path d=\"M90 55v115h120V55M390 55v115h120V55\" fill=\"white\" stroke=\"#31566c\" stroke-width=\"3\"/><path d=\"M93 120h114v47H93ZM393 90h114v77H393Z\" fill=\"#b8e1f2\"/><ellipse cx=\"450\" cy=\"135\" rx=\"25\" ry=\"18\" fill=\"#839ba8\"/><text x=\"150\" y=\"205\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">V₁<\/text><text x=\"450\" y=\"205\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">V₂<\/text><text x=\"300\" y=\"105\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"32\" fill=\"#173449\">→<\/text><text x=\"300\" y=\"245\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"22\" fill=\"#173449\">Vтела = V₂ − V₁<\/text><\/svg>", "limits": "Не приписывай прибору лишнюю точность. Изменение меньше деления может плохо разрешаться шкалой."}, {"id": "5", "title": "Плотность твёрдого тела", "goal": "Определить среднюю плотность образца.", "equipment": "Весы, мерная ёмкость, вода, подходящий сухой камень и нить.", "steps": ["Сначала взвесь сухое тело с учётом контейнера.", "Измерь объём по разности уровней.", "Рассчитай плотность в г/см³.", "Для кг/м³ умножь на 1000; осторожно сравни со справочником."], "formula": "ρ = m/(V₂ − V₁).", "fields": [["mass", "Масса тела, г"], ["before", "Вода до, мл"], ["after", "Показание после, мл"]], "sample": [54, 50, 70], "cols": ["m, г", "V₁, мл", "V₂, мл", "V, см³", "ρ, г/см³", "ρ, кг/м³"], "conclusion": "Средняя плотность образца … . Точность ограничена … . Значение совместимо с …, но состав этим не доказан.", "questions": ["Почему взвешивают до погружения?", "Доказывает ли плотность химический состав?"], "diagram": "<svg viewBox=\"0 0 600 260\" role=\"img\" aria-label=\"Вытеснение воды погружённым телом\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"260\" rx=\"16\" fill=\"#eef7fa\"/><path d=\"M90 55v115h120V55M390 55v115h120V55\" fill=\"white\" stroke=\"#31566c\" stroke-width=\"3\"/><path d=\"M93 120h114v47H93ZM393 90h114v77H393Z\" fill=\"#b8e1f2\"/><ellipse cx=\"450\" cy=\"135\" rx=\"25\" ry=\"18\" fill=\"#839ba8\"/><text x=\"150\" y=\"205\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">V₁<\/text><text x=\"450\" y=\"205\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">V₂<\/text><text x=\"300\" y=\"105\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"32\" fill=\"#173449\">→<\/text><text x=\"300\" y=\"245\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"22\" fill=\"#173449\">Vтела = V₂ − V₁<\/text><\/svg>", "limits": "Образец может быть неоднородным. Средняя плотность полой модели не равна автоматически плотности материала стенок."}, {"id": "6", "title": "Динамометр и градуирование пружины", "goal": "Понять измерение силы и нанесение шкалы.", "eq function reportText(l,r){let calculation;try{calculation=calculate(l,r.values)}catch(e){calculation='Расчёт не выполнен: '+e.message}return ['Лабораторная '+l.id+'. '+l.title,'Режим: '+MODES[r.mode],'Подготовка отмечена: '+(r.studied?'да':'нет'),'Цель: '+l.goal,'Рекомендуемое оборудование: '+l.equipment,'Фактически доступное оборудование: '+r.equipment,'','Данные:',...l.fields.map(f=>f[1]+': '+(r.values[f[0]]||'не заполнено')),'Расчёт: '+calculation,'','Таблица:',l.cols.join(' | '),...r.rows.map(row=>row.join(' | ')),'','Наблюдения: '+r.observations,'Вывод: '+r.conclusion,'Ограничения / источник данных: '+r.limits,'','Подготовка и расчёт по учебным данным не подтверждают проведение физического опыта.'].join('\n')}
function nav(){return '<nav class="nav no-print"><a class="link" href="./start.html">Общее меню</a><a class="link" href="./volume.html">Тренажёр объёма</a><a class="link" href="./mechanisms.html">Блоки и рычаги</a></nav>'}
function home(){app.innerHTML=`<section class="card"><span class="tag">Лабораторные · Версия 1.1</span><h2>11 работ: подготовка и отчёты</h2><p>Названия, номера и обязательность работ сверяй с учителем. Без приборов можно изучать порядок и считать по явно учебным данным. Не выдавай придуманные числа за измерения.</p><p class="muted">Исправлено отображение подсказки к выводу. Калькулятор и таблица — отдельные части отчёта: перенос в таблицу выполняется вручную.</p><div id="lab-list"></div></section><section class="card"><h2>Резервная копия</h2><p class="muted">Черновики сохраняются в этом браузере. Очистка данных может удалить их. Персональные данные ребёнка для работы не нужны.</p><button id="backup">Скачать все черновики JSON</button><button id="restore">Восстановить из JSON</button><input id="restore-file" type="file" accept=".json,application/json" hidden><p id="restore-status" role="status"></p></section>${nav()}`;let list=document.getElementById('lab-list');LABS.forEach(l=>{let b=document.createElement('button'),r=reports[l.id];b.textContent=l.id+'. '+l.title+(r?(r.studied?' — подготовка отмечена':' — есть черновик'):'');b.onclick=()=>openLab(l.id);list.appendChild(b)});document.getElementById('backup').onclick=()=>download('fizika-labs-backup.json',JSON.stringify({version:1,reports},null,2),'application/json');let input=document.getElementById('restore-file');document.getElementById('restore').onclick=()=>input.click();input.onchange=async()=>{let status=document.getElementById('restore-status');try{let f=input.files[0];if(!f)return;if(f.size>1000000)throw Error('Файл больше 1 МБ.');let p=JSON.parse(await f.text());if(!p||p.version!==1||!p.reports||typeof p.reports!=='object'||Array.isArray(p.reports))throw Error('Неверный формат копии.');let next=clean(p.reports);if(!Object.keys(next).length&&Object.keys(p.reports).length)throw Error('Нет известных лабораторных.');if(!confirm('Заменить все черновики данными из файла?'))return;reports=next;save();home();document.getElementById('restore-status').textContent='Черновики восстановлены.'}catch(e){status.textContent='Не удалось восстановить: '+e.message}input.value=''};window.scrollTo(0,0)}
function openLab(id){let l=LABS.find(l=>l.id===id);if(!l)return home();let r=draft(l);app.innerHTML=`<button id="back" class="no-print">← К списку работ</button><section class="card" style="margin-top:18px"><span class="tag">Лабораторная ${l.id} · версия 1.1</span><h2>${l.title}</h2><p>Цель: ${l.goal}</p><p>Оборудование: ${l.equipment}</p></section><div class="screen-only"><section class="card"><h2>Порядок действий</h2><ol class="flow">${l.steps.map(s=>'<li>'+s+'</li>').join('')}</ol><figure>${l.diagram}<figcaption>Учебная схема, не результат измерения.</figcaption></figure><p class="feedback hint">${l.limits}</p><p>Формула: ${l.formula}</p></section><section class="card"><h2>Черновик отчёта</h2><label for="mode">Что именно ты делаешь?</label><select id="mode">${Object.entries(MODES).map(([v,t])=>'<option value="'+v+'">'+t+'</option>').join('')}</select><p class="muted">Выбор режима не доказывает проведение опыта. Домашний аналог и школьная работа различаются.</p><label for="equipment">Какое оборудование действительно доступно?</label><textarea id="equipment" maxlength="2000"></textarea><h3>Проверка расчёта</h3><p class="muted">Используй свои измерения либо явно учебные данные. Расчёт с g = 10 Н/кг — приближение. Таблица ниже автоматически не заполняется.</p><form id="calc-form" novalidate>${l.fields.map(f=>'<label for="calc-'+f[0]+'">'+f[1]+'</label><input id="calc-'+f[0]+'" type="text" inputmode="decimal" autocomplete="off" maxlength="100">').join('')}<button type="submit" class="primary">Посчитать по введённым данным</button></form><button id="sample">Загрузить учебный пример — не реальные измерения</button><div id="calc-result" class="feedback good" role="status" aria-live="polite" hidden></div><h3>Таблица наблюдений</h3><p class="muted">При необходимости прокручивай таблицу вбок. Переноси данные и результаты вручную.</p><div class="table-wrap"><table><thead><tr>${l.cols.map(t=>'<th scope="col">'+t+'</th>').join('')}</tr></thead><tbody>${r.rows.map((row,i)=>'<tr>'+l.cols.map((t,j)=>'<td><input id="cell-'+i+'-'+j+'" type="text" maxlength="200"></td>').join('')+'</tr>').join('')}</tbody></table></div><label for="observations">Что наблюдал или что следует из учебных данных?</label><textarea id="observations" maxlength="2000"></textarea><label for="conclusion">Твой вывод</label><textarea id="conclusion" maxlength="2000" aria-describedby="conclusion-help"></textarea><p id="conclusion-help" class="muted"></p><label for="limits">Ограничения точности / источник учебных данных</label><textarea id="limits" maxlength="2000"></textarea><label><input id="studied" type="checkbox"> Я разобрал цель и порядок действий</label><p class="muted">Это отметка подготовки, не подтверждение выполненного опыта и не оценка учителя.</p><p id="save-status" role="status"></p><button id="save" class="primary">Сохранить черновик</button><button id="export">Скачать этот отчёт TXT</button><button id="print">Печать / сохранить в PDF средствами браузера</button></section><section class="card"><h2>Проверь понимание вслух</h2><ol>${l.questions.map(q=>'<li>'+q+'</li>').join('')}</ol></section>${nav()}</div><pre id="print-summary" class="print-summary"></pre>`;
document.getElementById('back').onclick=home;let mode=document.getElementById('mode');mode.value=r.mode;mode.onchange=()=>{r.mode=mode.value;document.getElementById('calc-result').hidden=true;save()};['equipment','observations','conclusion','limits'].forEach(key=>{let el=document.getElementById(key);el.value=r[key];el.oninput=()=>{r[key]=el.value;save()}});
// Assign helper text through DOM properties rather than HTML string concatenation.
document.getElementById('conclusion').placeholder=l.conclusion;
document.getElementById('conclusion-help').textContent='Начало вывода: '+l.conclusion+' Это подсказка, а не готовый вывод. Объясни собственные данные.';
l.fields.forEach(f=>{let el=document.getElementById('calc-'+f[0]);el.value=r.values[f[0]]||'';el.oninput=()=>{r.values[f[0]]=el.value;document.getElementById('calc-result').hidden=true;save()}});r.rows.forEach((row,i)=>row.forEach((value,j)=>{let el=document.getElementById('cell-'+i+'-'+j);el.value=value;el.setAttribute('aria-label','Строка '+(i+1)+', '+l.cols[j]);el.oninput=()=>{r.rows[i][j]=el.value;save()}}));let studied=document.getElementById('studied');studied.checked=r.studied;studied.onchange=()=>{r.studied=studied.checked;save()};function run(){let box=document.getElementById('calc-result');box.hidden=false;try{box.textContent=MODES[r.mode]+'. '+calculate(l,r.values);box.className='feedback good'}catch(e){box.textContent=e.message;box.className='feedback hint'}}document.getElementById('calc-form').onsubmit=e=>{e.preventDefault();run()};document.getElementById('sample').onclick=()=>{if((Object.values(r.values).some(Boolean)||r.observations||r.conclusion)&&!confirm('Заменить только расчётные поля учебным примером и переключить режим? Таблица и заметки останутся.'))return;r.mode='training';mode.value='training';l.fields.forEach((f,i)=>{r.values[f[0]]=String(l.sample[i]).replace('.',',');document.getElementById('calc-'+f[0]).value=r.values[f[0]]});save();run()};document.getElementById('save').onclick=save;document.getElementById('export').onclick=()=>{save();download('laboratory-'+l.id+'.txt',reportText(l,r))};document.getElementById('print').onclick=()=>{save();document.getElementById('print-summary').textContent=reportText(l,r);window.print()};window.scrollTo(0,0)}
try{home()}catch(e){app.innerHTML='<section class="card"><h2>Не удалось открыть лабораторные</h2><pre id="error"></pre></section>';document.getElementById('error').textContent=String(e.message||e)}
})();
</script></body></html>
