t-size=\"20\" fill=\"#173449\">Пять промежутков → 10 мл за деление<\/text><\/svg>", "limits": "Половина деления — возможная школьная оценка ошибки отсчёта по условию, а не универсальная полная погрешность любого прибора."}, {"id": "2", "title": "Размер малого тела методом рядов", "goal": "Оценить средний размер одинаковых небольших предметов.", "equipment": "Линейка, одинаковые гладкие детали без острых краёв.", "steps": ["Уложи одинаковые предметы в прямой ряд без зазоров и перекрытий.", "Посчитай n и измерь общую длину L.", "Вычисли средний размер d = L/n.", "Повтори для другого числа деталей. Сравни результаты."], "formula": "d = L/n.", "fields": [["length", "Длина ряда L, мм"], ["count", "Число предметов n"]], "sample": [80, 10], "cols": ["Предметы", "n", "L, мм", "d, мм", "Замечания"], "conclusion": "Средний размер получился … . При повторе … . Возможные причины расхождения … .", "questions": ["Почему результат — средний размер?", "Что изменят зазоры между деталями?"], "diagram": "<svg viewBox=\"0 0 600 260\" role=\"img\" aria-label=\"Ряд из одинаковых деталей для определения среднего размера\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"260\" rx=\"16\" fill=\"#eef7fa\"/><rect x=\"65\" y=\"95\" width=\"45\" height=\"50\" fill=\"#b8e1f2\" stroke=\"#31566c\"/><rect x=\"110\" y=\"95\" width=\"45\" height=\"50\" fill=\"#b8e1f2\" stroke=\"#31566c\"/><rect x=\"155\" y=\"95\" width=\"45\" height=\"50\" fill=\"#b8e1f2\" stroke=\"#31566c\"/><rect x=\"200\" y=\"95\" width=\"45\" height=\"50\" fill=\"#b8e1f2\" stroke=\"#31566c\"/><rect x=\"245\" y=\"95\" width=\"45\" height=\"50\" fill=\"#b8e1f2\" stroke=\"#31566c\"/><rect x=\"290\" y=\"95\" width=\"45\" height=\"50\" fill=\"#b8e1f2\" stroke=\"#31566c\"/><rect x=\"335\" y=\"95\" width=\"45\" height=\"50\" fill=\"#b8e1f2\" stroke=\"#31566c\"/><rect x=\"380\" y=\"95\" width=\"45\" height=\"50\" fill=\"#b8e1f2\" stroke=\"#31566c\"/><rect x=\"425\" y=\"95\" width=\"45\" height=\"50\" fill=\"#b8e1f2\" stroke=\"#31566c\"/><rect x=\"470\" y=\"95\" width=\"45\" height=\"50\" fill=\"#b8e1f2\" stroke=\"#31566c\"/><text x=\"300\" y=\"45\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">Одинаковые детали без зазоров<\/text><text x=\"300\" y=\"205\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"20\" fill=\"#173449\">Средний размер d = длина ряда L ÷ число n<\/text><\/svg>", "limits": "Увеличение числа деталей уменьшает вклад ошибки отсчёта общей длины на один предмет, но не устраняет зазоры и неодинаковость предметов. Не используй иглы и острые проволоки."}, {"id": "3", "title": "Измерение массы", "goal": "Измерить массу тела и учесть массу контейнера.", "equipment": "Кухонные весы, сухой контейнер и небольшая сухая LEGO-модель; в школе — учебные рычажные весы по инструкции.", "steps": ["Проверь предел нагрузки, устойчивость и нуль.", "Измерь массу пустого контейнера m₀ и общую массу m₁.", "Вычти массу контейнера или используй тарирование.", "Переведи граммы в килограммы. Для школьных рычажных весов отдельно изучи работу с гирями."], "formula": "m = m₁ − m₀; m в кг = m в г / 1000.", "fields": [["empty", "Масса контейнера, г"], ["total", "Общая масса, г"]], "sample": [150, 900], "cols": ["Предмет", "Контейнер, г", "Общая масса, г", "Масса тела, г", "Масса тела, кг"], "conclusion": "Масса тела … г = … кг. Масса контейнера учтена способом … .", "questions": ["Что будет без учёта контейнера?", "Заменяет ли домашняя электронная модель обучение рычажным весам?"], "diagram": "<svg viewBox=\"0 0 600 260\" role=\"img\" aria-label=\"Вычитание массы контейнера из общей массы\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"260\" rx=\"16\" fill=\"#eef7fa\"/><rect x=\"60\" y=\"70\" width=\"200\" height=\"110\" rx=\"12\" fill=\"#d5e8db\"/><rect x=\"340\" y=\"70\" width=\"200\" height=\"110\" rx=\"12\" fill=\"#b8e1f2\"/><text x=\"160\" y=\"105\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">Контейнер<\/text><text x=\"160\" y=\"145\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">m₀<\/text><text x=\"440\" y=\"105\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">Контейнер + тело<\/text><text x=\"440\" y=\"145\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">m₁<\/text><text x=\"300\" y=\"225\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"22\" fill=\"#173449\">Масса тела: m = m₁ − m₀<\/text><\/svg>", "limits": "Не клади мокрые, горячие и перегружающие прибор предметы. Домашний аналог не равен автоматически школьной лабораторной."}, {"id": "4", "title": "Объём твёрдого тела", "goal": "Измерить объём подходящего тела по вытеснению воды.", "equipment": "Мерная пластиковая ёмкость, вода, нить, маленький непористый тонущий нерастворимый камень без острых граней.", "steps": ["Узнай цену деления и запиши V₁.", "Осторожно полностью погрузи тело без потерь воды.", "Удали пузырьки лёгким покачиванием. Запиши V₂.", "Вычисли V₂ − V₁ в мл = см³ и переведи в м³."], "formula": "V = V₂ − V₁; 1 см³ = 0,000001 м³.", "fields": [["before", "Вода до погружения, мл"], ["after", "Показание после, мл"]], "sample": [60, 95], "cols": ["Тело", "V₁, мл", "V₂, мл", "V, см³", "V, м³"], "conclusion": "Объём тела … см³. Метод подходит для этого тела, потому что … .", "questions": ["Почему нужен полный объём под водой?", "Чем мешают пузырьки и пористость?"], "diagram": "<svg viewBox=\"0 0 600 260\" role=\"img\" aria-label=\"Объём тонущего нерастворимого тела по увеличению показания мензурки\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"260\" rx=\"16\" fill=\"#eef7fa\"/><path d=\"M90 55v115h120V55M390 55v115h120V55\" fill=\"white\" stroke=\"#31566c\" stroke-width=\"3\"/><path d=\"M93 120h114v47H93ZM393 90h114v77H393Z\" fill=\"#b8e1f2\"/><ellipse cx=\"450\" cy=\"135\" rx=\"25\" ry=\"18\" fill=\"#839ba8\"/><text x=\"150\" y=\"205\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">V₁<\/text><text x=\"450\" y=\"205\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">V₂<\/text><text x=\"300\" y=\"105\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"32\" fill=\"#173449\">→<\/text><text x=\"300\" y=\"245\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"20\" fill=\"#173449\">Объём тела: V = V₂ − V₁<\/text><\/svg>", "limits": "Если изменение меньше деления шкалы, результат плохо разрешим прибором. Не придумывай цифры точнее показаний."}, {"id": "5", "title": "Плотность твёрдого тела", "goal": "Определить среднюю плотность выбранного образца.", "equipment": "Весы, мерная ёмкость, вода, сухой подходящий камень, нить, поднос.", "steps": ["Сначала взвесь сухое тело с учётом контейнера.", "Определи объём методом вытеснения воды.", "Вычисли ρ = m/V в г/см³.", "Умножь на 1000 для кг/м³. Сравнение со справочником формулируй осторожно."], "formula": "ρ = m/(V₂ − V₁); 1 г/см³ = 1000 кг/м³.", "fields": [["mass", "Масса тела, г"], ["before", "Вода до, мл"], ["after", "Показание после, мл"]], "sample": [54, 50, 70], "cols": ["m, г", "V₁, мл", "V₂, мл", "V, см³", "ρ, г/см³", "ρ, кг/м³"], "conclusion": "Средняя плотность образца … . Точность ограничена … . Значение совместимо с …, но состав этим не доказан.", "questions": ["Почему взвешивают до погружения?", "Доказывает ли совпадение плотности химический состав?"], "diagram": "<svg viewBox=\"0 0 600 260\" role=\"img\" aria-label=\"Объём тонущего нерастворимого тела по увеличению показания мензурки\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"260\" rx=\"16\" fill=\"#eef7fa\"/><path d=\"M90 55v115h120V55M390 55v115h120V55\" fill=\"white\" stroke=\"#31566c\" stroke-width=\"3\"/><path d=\"M93 120h114v47H93ZM393 90h114v77H393Z\" fill=\"#b8e1f2\"/><ellipse cx=\"450\" cy=\"135\" rx=\"25\" switch(l.id){
case '1':positive('count');if(!Number.isInteger(v.count))throw Error('Число промежутков должно быть целым.');if(v.high<=v.low)throw Error('Большая отметка должна быть больше меньшей.');result='Цена деления: '+fmt((v.high-v.low)/v.count)+' мл за деление.';break;

default:throw Error('Неизвестная работа.');}
return result;}
function download(name,text,type){let blob=new Blob([text],{type:type||'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function reportText(l,r){let calc;try{calc=calculate(l,r.values)}catch(e){calc='Расчёт не выполнен: '+e.message}return ['Лабораторная '+l.id+'. '+l.title,'Режим: '+MODES[r.mode],'Отметка подготовки: '+(r.studied?'порядок действий разобран':'не отмечено'),'Цель: '+l.goal,'Оборудование по источнику: '+l.equipment,'Фактически доступное оборудование: '+r.equipment,'','Данные калькулятора:',...l.fields.map(f=>f[1]+': '+(r.values[f[0]]||'не заполнено')),'Расчёт: '+calc,'','Таблица:',l.cols.join(' | '),...r.rows.map(row=>row.join(' | ')),'','Наблюдения: '+r.observations,'Вывод: '+r.conclusion,'Ограничения / источники учебных данных: '+r.limits,'','Режим «подготовка» или «учебные данные» не подтверждает проведение физического опыта.'].join('\n')}
function nav(){return '<nav class="nav no-print" aria-label="Разделы"><a class="link" href="./start.html">Общее меню</a><a class="link" href="./volume.html">Тренажёр объёма</a><a class="link" href="./mechanisms.html">Блоки и рычаги</a></nav>'}
function home(){app.innerHTML=`<section class="card"><span class="tag">Лабораторные · Версия 1.0</span><h2>11 работ: подготовка и отчёты</h2><p>Темы взяты из исходного комплекта. Это не утверждение об обязательном одинаковом перечне для любой школы. Название, номер, оборудование и требования сверяй с учителем.</p><p>Без приборов можно изучать порядок и считать по учебным данным. Нельзя записывать придуманные числа как реальные измерения.</p><div id="lab-list"></div></section><section class="card"><h2>Резервная копия всех черновиков</h2><p class="muted">Данные хранятся в этом браузере. Очистка данных может удалить их. Не вводи фамилию, адрес и другие личные сведения — для работы они не нужны.</p><button id="backup">Скачать все черновики JSON</button><button id="restore">Восстановить из JSON</button><input id="restore-file" type="file" accept=".json,application/json" hidden><p id="restore-status" role="status"></p>${failed?'<p class="feedback hint">Сохранение в браузере недоступно.</p>':''}</section>${nav()}`;let list=document.getElementById('lab-list');LABS.forEach(l=>{let b=document.createElement('button');let r=reports[l.id];b.textContent=l.id+'. '+l.title+(r?(r.studied?' — подготовка отмечена':' — есть черновик'):'');b.onclick=()=>openLab(l.id);list.appendChild(b)});document.getElementById('backup').onclick=()=>download('fizika-labs-backup.json',JSON.stringify({version:1,reports},null,2),'application/json');let input=document.getElementById('restore-file');document.getElementById('restore').onclick=()=>input.click();input.onchange=async()=>{let status=document.getElementById('restore-status');try{let f=input.files[0];if(!f)return;if(f.size>1000000)throw Error('Файл больше 1 МБ.');let p=JSON.parse(await f.text());if(!p||p.version!==1||!p.reports||typeof p.reports!=='object'||Array.isArray(p.reports))throw Error('Неверный формат копии.');let checked=clean(p.reports);if(Object.keys(checked).length===0&&Object.keys(p.reports).length>0)throw Error('В файле нет известных лабораторных.');if(!confirm('Заменить все текущие черновики данными из файла?'))return;reports=checked;save();home();document.getElementById('restore-status').textContent='Черновики восстановлены.'}catch(e){status.textContent='Не удалось восстановить: '+e.message}input.value=''};window.scrollTo(0,0)}
function openLab(id){let l=LABS.find(x=>x.id===id);if(!l)return home();let r=draft(l);app.innerHTML=`<button id="back" class="no-print">← К списку работ</button><section class="card" style="margin-top:18px"><span class="tag">Лабораторная ${l.id}</span><h2>${l.title}</h2><p>Цель: ${l.goal}</p><p>Оборудование: ${l.equipment}</p></section><div class="screen-only"><section class="card"><h2>Порядок действий</h2><ol class="flow">${l.steps.map(s=>'<li>'+s+'</li>').join('')}</ol><figure>${l.diagram}<figcaption>Учебная схема, не результат измерения.</figcaption></figure><p class="feedback hint">${l.limits}</p><p><strong>Формула:</strong> ${l.formula}</p></section><section class="card"><h2>Черновик отчёта</h2><label for="mode">Что именно ты делаешь?</label><select id="mode">${Object.entries(MODES).map(([v,label])=>'<option value="'+v+'">'+label+'</option>').join('')}</select><p class="muted">Школьная работа и домашний аналог различаются. Выбор режима сам по себе не доказывает выполнение опыта.</p><label for="equipment">Какое оборудование действительно доступно?</label><textarea id="equipment" maxlength="2000"></textarea><h3>Проверка расчёта</h3><p class="muted">Калькулятор не создаёт измерения. Вводи свои данные либо явно учебные числа. Расчёты при g = 10 Н/кг — приближение этого комплекта.</p><form id="calc-form" novalidate>${l.fields.map(f=>'<label for="calc-'+f[0]+'">'+f[1]+'</label><input id="calc-'+f[0]+'" type="text" inputmode="decimal" autocomplete="off" maxlength="100">').join('')}<button class="primary" type="submit">Посчитать по введённым данным</button></form><button id="sample">Загрузить учебный пример — не реальные измерения</button><div id="calc-result" class="feedback good" role="status" aria-live="polite" hidden></div><h3>Таблица наблюдений</h3><p class="muted">На телефоне широкую таблицу можно прокрутить вбок. Вноси только нужные строки; пустые допустимы.</p><div class="table-wrap"><table><thead><tr>${l.cols.map(s=>'<th scope="col">'+s+'</th>').join('')}</tr></thead><tbody>${r.rows.map((row,i)=>'<tr>'+l.cols.map((s,j)=>'<td><input type="text" id="cell-'+i+'-'+j+'" maxlength="200" aria-label="Строка '+(i+1)+', '+esc(s)+'"></td>').join('')+'</tr>').join('')}</tbody></table></div><label for="observations">Что наблюдал или что следует из учебных данных?</label><textarea id="observations" maxlength="2000"></textarea><label for="conclusion">Твой вывод</label><textarea id="conclusion" maxlength="2000" placeholder="'+esc(l.conclusion)+'"></textarea><p class="muted">Начало вывода — подсказка, а не фраза для механического копирования. Ответь на цель и объясни свои данные.</p><label for="limits">Ограничения точности / источник учебных данных</label><textarea id="limits" maxlength="2000"></textarea><label><input id="studied" type="checkbox"> Я разобрал цель и порядок действий</label><p class="muted">Это отметка подготовки, не подтверждение выполненного опыта и не оценка учителя.</p><p id="save-status" role="status"></p><button id="save" class="primary">Сохранить черновик</button><button id="export">Скачать этот отчёт TXT</button><button id="print">Печать / сохранить в PDF средствами браузера</button></section><section class="card"><h2>Проверь понимание вслух</h2><ol>${l.questions.map(s=>'<li>'+s+'</li>').join('')}</ol></section>${nav()}</div><pre id="print-summary" class="print-summary"></pre>`;document.getElementById('back').onclick=home;let mode=document.getElementById('mode');mode.value=r.mode;mode.onchange=()=>{r.mode=mode.value;save()};['equipment','observations','conclusion','limits'].forEach(key=>{let el=document.getElementById(key);el.value=r[key];el.oninput=()=>{r[key]=el.value;save()}});l.fields.forEach(f=>{let el=document.getElementById('calc-'+f[0]);el.value=r.values[f[0]]||'';el.oninput=()=>{r.values[f[0]]=el.value;document.getElementById('calc-result').hidden=true;save()}});r.rows.forEach((row,i)=>row.forEach((value,j)=>{let el=document.getElementById('cell-'+i+'-'+j);el.value=value;el.oninput=()=>{r.rows[i][j]=el.value;save()}}));let studied=document.getElementById('studied');studied.checked=r.studied;studied.onchange=()=>{r.studied=studied.checked;save()};function run(){let result=document.getElementById('calc-result');result.hidden=false;try{let text=calculate(l,r.values);result.className='feedback good';result.textContent=MODES[r.mode]+'. '+text}catch(e){result.className='feedback hint';result.textContent=e.message}}
document.getElementById('calc-form').onsubmit=e=>{e.preventDefault();run()};document.getElementById('sample').onclick=()=>{if((Object.values(r.values).some(Boolean)||r.observations||r.conclusion)&&!confirm('Заменить только расчётные поля учебным примером и переключить режим на учебные данные? Таблица и заметки останутся.'))return;r.mode='training';mode.value='training';l.fields.forEach((f,i)=>{r.values[f[0]]=String(l.sample[i]).replace('.',',');document.getElementById('calc-'+f[0]).value=r.values[f[0]]});save();run()};document.getElementById('save').onclick=save;document.getElementById('export').onclick=()=>{save();download('laboratory-'+l.id+'.txt',reportText(l,r))};document.getElementById('print').onclick=()=>{save();document.getElementById('print-summary').textContent=reportText(l,r);window.print()};window.scrollTo(0,0)}
try{home()}catch(e){app.innerHTML='<section class="card"><h2>Не удалось открыть лабораторные</h2><pre id="error"></pre></section>';document.getElementById('error').textContent=String(e.message||e)}
})();
</script></body></html>
