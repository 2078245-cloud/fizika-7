<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142638"><title>Закон Архимеда</title><style>*{box-sizing:border-box}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}body{margin:0;background:#eef3f7;color:#172c3e;font:18px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow-wrap:anywhere}.wrap{max-width:900px;margin:auto}header{padding:32px 20px;background:linear-gradient(130deg,#142638,#21564f);color:white}header p{color:#dce9f1}h1{font-size:clamp(29px,7vw,43px);line-height:1.25}h2{font-size:26px;line-height:1.35;margin-top:0}h3{font-size:21px}main{padding:24px 15px}.card{background:white;border:1px solid #dce5ed;border-radius:19px;padding:24px;margin-bottom:20px}p{margin:0 0 16px}.muted,figcaption{font-size:15px;color:#526879}.tag{display:inline-block;background:#e5f6ef;color:#176344;border-radius:22px;padding:5px 12px;font-size:14px;margin-bottom:14px}button,.link{display:block;width:100%;padding:14px;margin-top:12px;min-height:50px;border:2px solid #dce5ed;border-radius:13px;color:#172c3e;background:#f7fafc;text-decoration:none;text-align:left;font:inherit;line-height:1.5;cursor:pointer;touch-action:manipulation}.primary{background:#237f62;border-color:#237f62;color:white;text-align:center}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #237f62;outline-offset:3px}button:disabled,input:disabled{opacity:.7;cursor:default}input{width:100%;padding:14px;border:2px solid #bdced9;border-radius:12px;font:inherit;font-size:21px}.feedback{padding:16px;border-radius:12px;margin-top:16px}.good{background:#e5f6ef;color:#15583e}.hint{background:#fff3d8;color:#704d10}figure{margin:0}svg{display:block;width:100%;height:auto;max-width:650px;margin:auto}figcaption{margin-top:10px}.flow{padding-left:25px}.flow li{padding:10px;margin:12px 0;background:#eef7fa;border-radius:10px}.bar{height:10px;background:#e5edf2;border-radius:10px;overflow:hidden;margin:16px 0}.bar div{height:100%;background:#237f62}footer{padding:0 20px 28px;text-align:center;font-size:14px;color:#526879}a{color:#176344}summary{cursor:pointer}.nav{display:flex;gap:10px;flex-wrap:wrap}.nav a{flex:1;min-width:180px}@media(max-width:480px){.card{padding:18px}body{font-size:17px}}</style></head><body><header><div class="wrap"><p>ФИЗИКА · 7 КЛАСС</p><h1>Закон Архимеда</h1><p>Поплавки, погружение и выталкивающая сила</p></div></header><main id="app" class="wrap"><section class="card"><h2>Загрузка…</h2></section></main><footer>Закон Архимеда · Тренажёр 1.0</footer><noscript>Для заданий нужен JavaScript.</noscript><script>
(function(){'use strict';
const TASKS=[{"id": "a1", "title": "Первый расчёт", "q": "Тело полностью погружено в пресную воду и вытесняет 100 см³ воды. Найди силу Архимеда. ρводы = 1000 кг/м³, g = 10 Н/кг.", "type": "number", "answer": 1, "unit": "Н", "hints": ["Переведи объём: 100 см³ = 0,0001 м³.", "Умножь 1000 × 10 × 0,0001."], "solution": "FА = ρжgVпогр = 1000 × 10 × 0,0001 = 1 Н.", "level": "А · Прямая формула"}, {"id": "a2", "title": "Объём больше", "q": "Тело вытесняет 250 см³ пресной воды. Найди FА при ρводы = 1000 кг/м³ и g = 10 Н/кг.", "type": "number", "answer": 2.5, "unit": "Н", "hints": ["250 см³ = 0,00025 м³.", "Используй FА = ρжgVпогр."], "solution": "FА = 1000 × 10 × 0,00025 = 2,5 Н.", "level": "А · Прямая формула"}, {"id": "a3", "title": "Объём уже в СИ", "q": "Погружённая часть тела имеет объём 0,002 м³. Жидкость — пресная вода: ρ = 1000 кг/м³, g = 10 Н/кг. Найди FА.", "type": "number", "answer": 20, "unit": "Н", "hints": ["Переводить объём уже не нужно.", "Перемножь 1000, 10 и 0,002."], "solution": "FА = 1000 × 10 × 0,002 = 20 Н.", "level": "А · Прямая формула"}, {"id": "a4", "title": "Другая жидкость", "q": "Тело полностью погружено в условный раствор плотностью 1200 кг/м³. Его объём 0,001 м³. Найди FА при g = 10 Н/кг.", "type": "number", "answer": 12, "unit": "Н", "hints": ["Бери заданную плотность раствора, не плотность материала тела.", "Умножь 1200 × 10 × 0,001."], "solution": "FА = 1200 × 10 × 0,001 = 12 Н. Плотность 1200 кг/м³ задана условием, это не универсальное значение для любого раствора.", "level": "А · Прямая формула"}, {"id": "a5", "title": "Разные материалы", "q": "Два тела одинакового внешнего объёма — алюминиевое и стальное — полностью погружены в одну покоящуюся воду. Они не касаются сосуда и не деформируются. Сравни силы Архимеда.", "type": "choice", "options": ["Одинаковы", "На стальное обязательно больше", "На алюминиевое обязательно больше"], "answer": 0, "hints": ["Сравни плотность жидкости и погружённые объёмы.", "В FА нет плотности материала тела. Массы тел при этом могут различаться."], "solution": "FА одинакова: жидкость одна, g одинаково, вытесненные объёмы равны. Это не означает одинаковую силу тяжести или одинаковое движение.", "level": "Б · Понимание и равновесие"}, {"id": "a6", "title": "Половина объёма", "q": "Модель имеет полный объём 1 л. В воду погружена ровно половина этого объёма. Найди FА при ρводы = 1000 кг/м³ и g = 10 Н/кг. В равновесии ли модель, не задано.", "type": "number", "answer": 5, "unit": "Н", "hints": ["Погружённый объём 0,5 л = 0,0005 м³.", "В формулу подставь половину объёма, а не весь литр."], "solution": "FА = 1000 × 10 × 0,0005 = 5 Н. Нельзя по этому условию без массы и других сил определить равновесие модели.", "level": "Б · Понимание и равновесие"}, {"id": "a7", "title": "Динамометр в воде", "q": "Неподвижный предмет на подвесе даёт показание 5 Н в воздухе и 3,5 Н при полном погружении в воду. Он не касается сосуда. Найди FА; выталкиванием воздуха пренебречь.", "type": "number", "answer": 1.5, "unit": "Н", "hints": ["Вода уменьшила натяжение подвеса.", "Вычти показание в воде из показания в воздухе."], "solution": "FА ≈ 5 − 3,5 = 1,5 Н. Масса предмета не изменилась.", "level": "Б · Понимание и равновесие"}, {"id": "a8", "title": "Удержать маленький камень", "q": "Масса камня 0,3 кг, объём 100 см³. Он полностью погружён в воду и неподвижно висит на вертикальной нити, не касаясь сосуда. Найди натяжение нити. ρводы = 1000 кг/м³, g = 10 Н/кг; выталкиванием воздуха пренебречь.", "type": "number", "answer": 2, "unit": "Н", "hints": ["Fтяж = 0,3 × 10 = 3 Н. FА для 100 см³ воды равна 1 Н.", "Для равновесия натяжение T = Fтяж − FА."], "solution": "T = 3 − 1 = 2 Н. Это сила для удержания подвешенного камня, не сила отрыва от дна.", "level": "Б · Понимание и равновесие"}, {"id": "a9", "title": "Поплавок", "q": "Поплавок массой 40 г спокойно плавает на поверхности воды. Других вертикальных сил нет, нить не тянет. Найди FА при g = 10 Н/кг.", "type": "number", "answer": 0.4, "unit": "Н", "hints": ["При таком равновесии FА = mg.", "40 г = 0,04 кг."], "solution": "FА = 0,04 × 10 = 0,4 Н. У плавающего в покое тела силы уравновешены.", "level": "Б · Понимание и равновесие"}, {"id": "a10", "title": "Начнёт ли всплывать?", "q": "Полностью погружённую модель массой 200 г и объёмом 300 см³ отпускают из состояния покоя в воде. Сосуда она не касается. В начальный момент учитываем только тяжесть и выталкивание: ρводы = 1000 кг/м³, g = 10 Н/кг. Что произойдёт?", "type": "choice", "options": ["Начнёт двигаться вверх", "Начнёт двигаться вниз", "Обязательно останется в покое"], "answer": 0, "hints": ["Сначала сравни Fтяж = 2 Н и FА = 3 Н.", "В начале выталкивающая сила больше тяжести."], "solution": "Fтяж = 0,2 × 10 = 2 Н; FА = 1000 × 10 × 0,0003 = 3 Н. Начальная равнодействующая 1 Н вверх. Если модель затем плавает в покое на поверхности, FА уже равна Fтяж.", "level": "В · Дополнительные задачи"}, {"id": "a11", "title": "Неизвестная жидкость", "q": "Тело полностью погружено, Vпогр = 200 см³. Измеренная сила Архимеда 2 Н. Найди плотность жидкости при g = 10 Н/кг.", "type": "number", "answer": 1000, "unit": "кг/м³", "hints": ["Вырази ρж = FА ÷ (gVпогр).", "Vпогр = 0,0002 м³; знаменатель 10 × 0,0002 = 0,002."], "solution": "ρж = 2 ÷ 0,002 = 1000 кг/м³. Это определение плотности, а не однозначное доказательство химического состава жидкости.", "level": "В · Дополнительные задачи"}, {"id": "a12", "title": "Найди погружённый объём", "q": "В пресной воде FА = 4 Н. Найди объём погружённой части в см³. ρводы = 1000 кг/м³, g = 10 Н/кг.", "type": "number", "answer": 400, "unit": "см³", "hints": ["Vпогр = FА ÷ (ρжg).", "Сначала получи м³: 4 ÷ 10 000 = 0,0004 м³. Для см³ умножь на 1 000 000."], "solution": "Vпогр = 0,0004 м³ = 400 см³. Это погружённый объём, не обязательно весь объём тела.", "level": "В · Дополнительные задачи"}],THEORY="<section class=\"card\"><h2>Сначала разберём смысл<\/h2><p>На тело, погружённое в покоящуюся жидкость, действует выталкивающая сила. В обычной школьной модели она равна силе тяжести вытесненной жидкости.<\/p><p><strong>FА = ρж × g × Vпогр<\/strong><\/p><ul><li>FА — сила Архимеда в ньютонах.<\/li><li>ρж — плотность жидкости, не материала тела, в кг/м³.<\/li><li>g — заданный коэффициент; здесь обычно 10 Н/кг.<\/li><li>Vпогр — объём погружённой части в м³.<\/li><\/ul><p>1 см³ = 1 мл = 0,000001 м³. 1 л = 0,001 м³. Для тела, вытесняющего 50 см³ воды: FА = 1000 × 10 × 0,00005 = 0,5 Н.<\/p><p>При неподвижном плавании без других вертикальных сил FА = mg. Для полностью погружённого тела, отпущенного из покоя, сравнение FА и mg определяет начальное направление движения в нашей модели.<\/p><p class=\"muted\">Сила Архимеда не заменяет все силы: могут быть натяжение нити, сопротивление и контакт с дном. Присосавшийся к дну камень нельзя автоматически считать свободно подвешенным телом.<\/p><\/section>",DIAGRAMS=[["<svg viewBox=\"0 0 600 300\" role=\"img\" aria-label=\"Тело в воде, сила Архимеда вверх и сила тяжести вниз; показаны направления, а не заданное отношение величин\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"300\" rx=\"16\" fill=\"#eef7fa\"/><rect x=\"45\" y=\"65\" width=\"510\" height=\"205\" fill=\"#c6e8f6\"/><path d=\"M45 65H555\" stroke=\"#287eb4\" stroke-width=\"4\"/><rect x=\"245\" y=\"130\" width=\"110\" height=\"70\" rx=\"12\" fill=\"#f5c876\"/><path d=\"M275 160L275 82M281.71195754045885 94.28615586646522L275 82L268.28804245954115 94.28615586646522\" stroke=\"#237f62\" fill=\"none\" stroke-width=\"4\"/><path d=\"M325 165L325 245M318.28804245954115 232.7138441335348L325 245L331.71195754045885 232.7138441335348\" stroke=\"#b85d3c\" fill=\"none\" stroke-width=\"4\"/><text x=\"145\" y=\"112\" text-anchor=\"middle\" font-size=\"21\" fill=\"#173449\" font-family=\"Arial,sans-serif\">FА вверх<\/text><text x=\"450\" y=\"236\" text-anchor=\"middle\" font-size=\"21\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Fтяж вниз<\/text><text x=\"300\" y=\"35\" text-anchor=\"middle\" font-size=\"21\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Погружённое тело: две силы<\/text><\/svg>", "Показаны направления двух сил, а не точное отношение их величин."], ["<svg viewBox=\"0 0 600 300\" role=\"img\" aria-label=\"Прямоугольная модель погружена частично: для закона Архимеда учитывают объём ниже поверхности жидкости\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"300\" rx=\"16\" fill=\"#eef7fa\"/><rect x=\"45\" y=\"160\" width=\"510\" height=\"110\" fill=\"#c6e8f6\"/><rect x=\"245\" y=\"100\" width=\"110\" height=\"120\" fill=\"#f5c876\" stroke=\"#31566c\" stroke-width=\"2\"/><rect x=\"247\" y=\"160\" width=\"106\" height=\"58\" fill=\"#8ac9bf\"/><path d=\"M45 160H555\" stroke=\"#287eb4\" stroke-width=\"3\"/><text x=\"300\" y=\"48\" text-anchor=\"middle\" font-size=\"22\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Берём только погружённую часть<\/text><text x=\"140\" y=\"130\" text-anchor=\"middle\" font-size=\"18\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Над водой<\/text><text x=\"130\" y=\"205\" text-anchor=\"middle\" font-size=\"18\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Под водой<\/text><text x=\"300\" y=\"290\" text-anchor=\"middle\" font-size=\"19\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Vпогр — не всегда полный объём тела<\/text><\/svg>", "Надводную часть в Vпогр не включают. Половина объёма не всегда означает половину высоты: это зависит от формы."], ["<svg viewBox=\"0 0 600 300\" role=\"img\" aria-label=\"Учебный пример динамометра: 5 Н в воздухе и 3 Н в воде; предмет не касается дна\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"300\" rx=\"16\" fill=\"#eef7fa\"/><path d=\"M155 60v35M445 60v35\" stroke=\"#31566c\" stroke-width=\"4\"/><rect x=\"110\" y=\"95\" width=\"90\" height=\"55\" rx=\"10\" fill=\"white\" stroke=\"#31566c\"/><rect x=\"400\" y=\"95\" width=\"90\" height=\"55\" rx=\"10\" fill=\"white\" stroke=\"#31566c\"/><text x=\"155\" y=\"130\" text-anchor=\"middle\" font-size=\"23\" fill=\"#173449\" font-family=\"Arial,sans-serif\">5 Н<\/text><text x=\"445\" y=\"130\" text-anchor=\"middle\" font-size=\"23\" fill=\"#173449\" font-family=\"Arial,sans-serif\">3 Н<\/text><rect x=\"335\" y=\"175\" width=\"220\" height=\"90\" fill=\"#c6e8f6\"/><path d=\"M155 150v48M445 150v48\" stroke=\"#31566c\" stroke-width=\"3\"/><ellipse cx=\"155\" cy=\"220\" rx=\"32\" ry=\"23\" fill=\"#839ba8\"/><ellipse cx=\"445\" cy=\"220\" rx=\"32\" ry=\"23\" fill=\"#839ba8\"/><text x=\"155\" y=\"285\" text-anchor=\"middle\" font-size=\"18\" fill=\"#173449\" font-family=\"Arial,sans-serif\">В воздухе<\/text><text x=\"445\" y=\"285\" text-anchor=\"middle\" font-size=\"18\" fill=\"#173449\" font-family=\"Arial,sans-serif\">В воде<\/text><text x=\"300\" y=\"35\" text-anchor=\"middle\" font-size=\"22\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Пример: FА ≈ 5 − 3 = 2 Н<\/text><\/svg>", "Это разобранный пример с условными числами. Предмет неподвижен и не касается дна; выталкиванием воздуха пренебрегаем."], ["<svg viewBox=\"0 0 600 300\" role=\"img\" aria-label=\"Рыболовный поплавок в равновесии: выталкивающая сила равна силе тяжести, натяжением нити не нагружен\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"300\" rx=\"16\" fill=\"#eef7fa\"/><rect x=\"45\" y=\"150\" width=\"510\" height=\"115\" fill=\"#c6e8f6\"/><ellipse cx=\"300\" cy=\"145\" rx=\"30\" ry=\"68\" fill=\"#f5c876\"/><path d=\"M45 150H555\" stroke=\"#287eb4\" stroke-width=\"3\"/><path d=\"M280 155L280 70M286.71195754045885 82.28615586646522L280 70L273.28804245954115 82.28615586646522\" stroke=\"#237f62\" fill=\"none\" stroke-width=\"4\"/><path d=\"M320 155L320 240M313.28804245954115 227.7138441335348L320 240L326.71195754045885 227.7138441335348\" stroke=\"#b85d3c\" fill=\"none\" stroke-width=\"4\"/><text x=\"155\" y=\"95\" text-anchor=\"middle\" font-size=\"18\" fill=\"#173449\" font-family=\"Arial,sans-serif\">FА<\/text><text x=\"445\" y=\"225\" text-anchor=\"middle\" font-size=\"18\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Fтяж<\/text><text x=\"300\" y=\"35\" text-anchor=\"middle\" font-size=\"23\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Поплавок в покое: FА = Fтяж<\/text><text x=\"300\" y=\"290\" text-anchor=\"middle\" font-size=\"18\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Если других вертикальных сил нет<\/text><\/svg>", "Равенство относится к поплавку в покое без дополнительных вертикальных сил."]],FLOW=["Уточни, что требуется найти", "Выбери плотность жидкости", "Найди погружённый объём и переведи в м³", "Используй FА = ρжgVпогр или условие равновесия", "Проверь единицу и смысл результата"],KEY='fizika7-archimedes-v1',app=document.getElementById('app');let failed=false;
function load(){try{let p=JSON.parse(localStorage.getItem(KEY)),ids=new Set(TASKS.map(t=>t.id));return{done:p&&Array.isArray(p.done)?[...new Set(p.done.filter(id=>ids.has(id)))]:[],help:p&&Array.isArray(p.help)?p.help.filter(id=>ids.has(id)):[]}}catch(e){return{done:[],help:[]}}}
let state=load();function save(){try{localStorage.setItem(KEY,JSON.stringify(state));failed=false}catch(e){failed=true}}function notice(){return failed?'<p class="feedback hint" role="status">Прогресс не удалось сохранить в браузере. Задачи доступны.</p>':''}function nav(){return '<nav class="nav" aria-label="Разделы"><a class="link" href="./start.html">Общее меню</a><a class="link" href="./module4.html">Модуль 4: давление</a><a class="link" href="./volume.html">Тренажёр объёма</a></nav>'}
function home(){let basic=TASKS.slice(0,9).filter(t=>state.done.includes(t.id)).length;app.innerHTML=`<section class="card"><span class="tag">Закон Архимеда · Версия 1.0</span><h2>12 задач с подсказками</h2><p>Девять основных и три дополнительные задачи. Начни с памятки и уровня А, если формула ещё незнакома.</p><div class="bar" role="progressbar" aria-label="Основные задачи" aria-valuemin="0" aria-valuemax="9" aria-valuenow="${basic}"><div style="width:${basic/9*100}%"></div></div><p class="muted">Основные: ${basic} из 9. Всего: ${state.done.length} из 12. Это не школьная оценка.</p><button id="theory" class="primary">Памятка, рисунки и блок-схема</button><button id="continue">Начать / продолжить задачи</button>${notice()}</section><div id="task-groups"></div>${nav()}<details class="card" style="margin-top:20px"><summary>Источники, безопасность и прогресс</summary><p class="muted">Сверка: <a href="https://openstax.org/books/university-physics-volume-1/pages/14-4-archimedes-principle-and-buoyancy" target="_blank" rel="noopener noreferrer">OpenStax: закон Архимеда и плавучесть</a>. Все числа учебные. В этом тренажёре нет опыта с глубоким водоёмом, тяжёлыми камнями, рыболовными крючками, свинцом или самодельной лодкой с человеком.</p><p class="muted">Это тренажёр, а не полный модуль 5: атмосферное давление и приборы сюда не включены. Прогресс хранится только в этом браузере и может исчезнуть после очистки данных.</p></details>`;const groups=document.getElementById('task-groups');[...new Set(TASKS.map(t=>t.level))].forEach(level=>{let section=document.createElement('section');section.className='card';let heading=document.createElement('h2');heading.textContent=level;section.appendChild(heading);TASKS.forEach((t,i)=>{if(t.level!==level)return;let b=document.createElement('button');b.textContent=(i+1)+'. '+t.title+(state.done.includes(t.id)?(state.help.includes(t.id)?' — с помощью':' — выполнено'):'');b.onclick=()=>task(i);section.appendChild(b)});groups.appendChild(section)});document.getElementById('theory').onclick=theory;document.getElementById('continue').onclick=()=>{let i=TASKS.findIndex(t=>!state.done.includes(t.id));task(i<0?0:i)};window.scrollTo(0,0)}
function theory(){app.innerHTML='<button id="back">← К задачам</button>'+THEORY+DIAGRAMS.map(d=>'<section class="card"><h2>Рассмотри рисунок</h2><figure>'+d[0]+'<figcaption>'+d[1]+'</figcaption></figure></section>').join('')+'<section class="card"><h2>Схема решения</h2><ol class="flow">'+FLOW.map(s=>'<li>'+s+'</li>').join('')+'</ol><button id="first" class="primary">Перейти к первой задаче</button></section>'+nav();document.getElementById('back').onclick=home;document.getElementById('first').onclick=()=>task(0);window.scrollTo(0,0)}
function parse(value){let s=value.trim().replace(',','.');return /^\d+(?:\.\d+)?$/.test(s)?Number(s):null}
function task(i){let t=TASKS[i],solved=false,helped=false,h=0;app.innerHTML=`<button id="back">← К списку задач</button><section class="card" style="margin-top:18px"><span class="tag">Задача ${i+1} из 12 · ${t.level}</span><h2>${t.title}</h2><p>${t.q}</p><details><summary>Нужные формулы и переводы</summary><p>FА = ρжgVпогр; Fтяж = mg. 1 см³ = 0,000001 м³; 1 л = 0,001 м³. Для тела в равновесии сумма вертикальных сил равна нулю.</p></details>${t.type==='number'?'<form id="answer-form" novalidate><label for="answer">Ответ, '+t.unit+'</label><input id="answer" type="text" inputmode="decimal" autocomplete="off" aria-describedby="note"><p class="muted" id="note">Введи только число; запятая и точка равноправны.</p><button id="check" class="primary" type="submit">Проверить</button></form>':'<div id="choices"></div>'}<button id="hint">Подсказка</button><div id="feedback" role="status" aria-live="polite" hidden></div><div id="hint-text" class="feedback hint" role="status" hidden></div><details id="solution" hidden><summary>Открыть полный разбор</summary><p>${t.solution}</p></details><button id="next" class="primary" hidden>${i<TASKS.length-1?'Следующая задача →':'Завершить тренажёр'}</button><button id="memo">Открыть памятку и рисунки</button><div id="storage-status"></div></section>${nav()}`;document.getElementById('back').onclick=home;document.getElementById('memo').onclick=theory;let fb=document.getElementById('feedback');function message(s,ok){fb.hidden=false;fb.className='feedback '+(ok?'good':'hint');fb.textContent=s}function verify(value){if(solved)return;if(value===null||!Number.isFinite(value)){message('Введи число, например 1 или 2,5.',false);return}if(Math.abs(value-t.answer)>1e-8){helped=true;message('Пока не совпало. Проверь плотность жидкости, погружённый объём и единицы. Можно открыть подсказку.',false);return}solved=true;if(!state.done.includes(t.id))state.done.push(t.id);if(helped&&!state.help.includes(t.id))state.help.push(t.id);save();message('Верно! '+t.solution,true);if(t.type==='number'){document.getElementById('answer').disabled=true;document.getElementById('check').disabled=true}else document.getElementById('choices').querySelectorAll('button').forEach(b=>b.disabled=true);document.getElementById('hint').hidden=true;document.getElementById('next').hidden=false;document.getElementById('storage-status').innerHTML=notice()}
if(t.type==='number')document.getElementById('answer-form').onsubmit=e=>{e.preventDefault();verify(parse(document.getElementById('answer').value))};else{let choices=document.getElementById('choices');t.options.forEach((s,k)=>{let b=document.createElement('button');b.textContent=s;b.onclick=()=>verify(k);choices.appendChild(b)})}document.getElementById('hint').onclick=function(){helped=true;let box=document.getElementById('hint-text');box.hidden=false;box.textContent=t.hints[Math.min(h,t.hints.length-1)];h++;this.textContent='Ещё подсказка';if(h>=t.hints.length){this.disabled=true;this.textContent='Подсказки открыты';document.getElementById('solution').hidden=false}};document.getElementById('solution').ontoggle=function(){if(this.open)helped=true};document.getElementById('next').onclick=()=>i<TASKS.length-1?task(i+1):home();window.scrollTo(0,0)}
try{home()}catch(e){app.innerHTML='<section class="card"><h2>Не удалось открыть тренажёр</h2><pre id="error"></pre></section>';document.getElementById('error').textContent=String(e.message||e)}
})();
</script></body></html>
