<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142638"><title>Атмосфера, выталкивание и плавание</title><style>*{box-sizing:border-box}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}body{margin:0;background:#eef3f7;color:#172c3e;font:18px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow-wrap:anywhere}.wrap{max-width:900px;margin:auto}header{padding:32px 20px;background:linear-gradient(130deg,#142638,#21564f);color:white}header p{color:#dce9f1}h1{font-size:clamp(29px,7vw,43px);line-height:1.25}h2{font-size:26px;line-height:1.35;margin-top:0}h3{font-size:21px}main{padding:24px 15px}.card{background:white;border:1px solid #dce5ed;border-radius:19px;padding:24px;margin-bottom:20px}p{margin:0 0 16px}.muted,figcaption{font-size:15px;color:#526879}.tag{display:inline-block;background:#e5f6ef;color:#176344;border-radius:22px;padding:5px 12px;font-size:14px;margin-bottom:14px}button,.link{display:block;width:100%;padding:14px;margin-top:12px;min-height:50px;border:2px solid #dce5ed;border-radius:13px;color:#172c3e;background:#f7fafc;text-decoration:none;text-align:left;font:inherit;line-height:1.5;cursor:pointer;touch-action:manipulation}.primary{background:#237f62;border-color:#237f62;color:white;text-align:center}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #237f62;outline-offset:3px}button:disabled,input:disabled{opacity:.7;cursor:default}input{width:100%;padding:14px;border:2px solid #bdced9;border-radius:12px;font:inherit;font-size:21px}.feedback{padding:16px;border-radius:12px;margin-top:16px}.good{background:#e5f6ef;color:#15583e}.hint{background:#fff3d8;color:#704d10}figure{margin:0}svg{display:block;width:100%;height:auto;max-width:650px;margin:auto}figcaption{margin-top:10px}.flow{padding-left:25px}.flow li{padding:10px;margin:12px 0;background:#eef7fa;border-radius:10px}.bar{height:10px;background:#e5edf2;border-radius:10px;overflow:hidden;margin:16px 0}.bar div{height:100%;background:#237f62}footer{padding:0 20px 28px;text-align:center;font-size:14px;color:#526879}a{color:#176344}summary{cursor:pointer}.nav{display:flex;gap:10px;flex-wrap:wrap}.nav a{flex:1;min-width:180px}@media(max-width:480px){.card{padding:18px}body{font-size:17px}}</style></head><body><header><div class="wrap"><p>ФИЗИКА · 7 КЛАСС</p><h1>Атмосфера, выталкивание и плавание</h1><p>От барометра в походе до поплавка и воздушного шара</p></div></header><main id="app" class="wrap"><section class="card"><h2>Загрузка…</h2></section></main><footer>Модуль 5 · Версия 1.0</footer><noscript>Для заданий нужен JavaScript.</noscript><script>
(function(){'use strict';
const DATA=[{"title": "Атмосферное давление и приборы", "sub": "Барометр в походе и изменение высоты", "parts": [["1. Воздух тоже давит", "<p>Воздух имеет массу. Атмосфера оказывает давление на тела. Давление измеряют в паскалях; 1 кПа = 1000 Па, 1 гПа = 100 Па.<\/p><p>Нормальное атмосферное давление — 101 325 Па. Оно соответствует примерно 760 мм рт. ст. Фактическое давление меняется с погодой и высотой: в любой день оно не обязано быть точно нормальным.<\/p>"], ["2. Барометр и манометр", "<p>Барометр измеряет атмосферное давление. В барометре-анероиде нет жидкого ртутного столба: деформируется чувствительная металлическая коробочка, а механизм перемещает стрелку.<\/p><p>Манометр измеряет давление или разность давлений относительно выбранного уровня. Нужно смотреть назначение и единицы конкретного прибора.<\/p><p>Опыт Торричелли связан с равновесием ртутного столба под действием атмосферного давления. Это исторический пример, не домашняя лабораторная: ртуть и стеклянные ртутные приборы не используем.<\/p>"], ["3. Подъём в горы", "<p>С высотой атмосферное давление в целом уменьшается. Но на него влияют также температура и погода.<\/p><p>Правило «на 12 м — на 1 мм рт. ст.» — грубая локальная школьная оценка. Применять её можно только если такое приближение явно задано условием. Это не точный закон и не надёжный метод навигации в горах.<\/p><p>Одного показания барометра недостаточно для точного прогноза погоды или определения высоты без других условий.<\/p>"]], "diagrams": [{"svg": "<svg viewBox=\"0 0 600 300\" role=\"img\" aria-label=\"Условная схема барометра, не шкала для считывания конкретного значения\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"300\" rx=\"16\" fill=\"#eef7fa\"/><circle cx=\"200\" cy=\"145\" r=\"90\" fill=\"white\" stroke=\"#31566c\" stroke-width=\"5\"/><path d=\"M200 145L245 90M242.59937388597672 102.77642337513396L245 90L232.95194661526935 94.88307379000975\" fill=\"none\" stroke=\"#237f62\" stroke-width=\"4\"/><text x=\"200\" y=\"195\" text-anchor=\"middle\" font-size=\"21\" fill=\"#173449\" font-family=\"Arial,sans-serif\">гПа<\/text><text x=\"445\" y=\"125\" text-anchor=\"middle\" font-size=\"18\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Барометр<\/text><text x=\"445\" y=\"158\" text-anchor=\"middle\" font-size=\"18\" fill=\"#173449\" font-family=\"Arial,sans-serif\">давление атмосферы<\/text><text x=\"300\" y=\"275\" text-anchor=\"middle\" font-size=\"19\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Манометр: давление или разность давлений<\/text><\/svg>", "caption": "Условный прибор без подробной шкалы. Считывать с рисунка численное давление не требуется."}, {"svg": "<svg viewBox=\"0 0 600 300\" role=\"img\" aria-label=\"Схема подъёма в гору: атмосферное давление в целом уменьшается с высотой; это не точный закон для любых условий\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"300\" rx=\"16\" fill=\"#eef7fa\"/><path d=\"M80 250L270 70L450 250Z\" fill=\"#c5dbd0\" stroke=\"#31566c\" stroke-width=\"3\"/><path d=\"M500 240L500 65M506.2325320018546 76.40857330457484L500 65L493.7674679981454 76.40857330457484\" fill=\"none\" stroke=\"#237f62\" stroke-width=\"4\"/><text x=\"290\" y=\"35\" text-anchor=\"middle\" font-size=\"19\" fill=\"#173449\" font-family=\"Arial,sans-serif\">При подъёме давление в целом уменьшается<\/text><text x=\"180\" y=\"274\" text-anchor=\"middle\" font-size=\"16\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Ниже: давление больше<\/text><text x=\"380\" y=\"90\" text-anchor=\"middle\" font-size=\"16\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Выше: меньше<\/text><text x=\"525\" y=\"160\" text-anchor=\"middle\" font-size=\"22\" fill=\"#173449\" font-family=\"Arial,sans-serif\">h<\/text><\/svg>", "caption": "Рисунок показывает тенденцию, не точный график зависимости давления от высоты."}], "flow": ["Уточни, что измеряет прибор", "Прочитай единицы", "Для сравнения приведи данные к одинаковым единицам", "Вычисли разность, если она нужна", "Не превращай приближённое правило в точный закон"], "activity": "Если дома есть безопасный барометр, запиши показание и единицу. Если нет, используй учебные данные задач. Не придумывай фактическое измерение.", "tasks": [{"id": "b1", "title": "Выбери прибор", "q": "Какой прибор предназначен для измерения атмосферного давления?", "type": "choice", "options": ["Барометр", "Линейка", "Весы"], "answer": 0, "hint": "Назначение прибора важнее его внешнего вида.", "solution": "Атмосферное давление измеряют барометром.", "extra": false}, {"id": "b2", "title": "Гектопаскали", "q": "Барометр показывает 1000 гПа. Вырази давление в кПа.", "type": "number", "answer": 100, "unit": "кПа", "hint": "1000 гПа = 100 000 Па. В одном кПа 1000 Па.", "solution": "1000 × 100 ÷ 1000 = 100 кПа.", "extra": false}, {"id": "b3", "title": "Разность показаний", "q": "В двух учебных измерениях получено 760 и 740 мм рт. ст. На сколько второе показание меньше первого?", "type": "number", "answer": 20, "unit": "мм рт. ст.", "hint": "Вычти 740 из 760.", "solution": "760 − 740 = 20 мм рт. ст.", "extra": false}, {"id": "b4", "title": "Оценка подъёма — дополнительно", "q": "Только для этой задачи примем: при подъёме на каждые 12 м давление падает на 1 мм рт. ст. Давление уменьшилось на 10 мм рт. ст. Оцени подъём.", "type": "number", "answer": 120, "unit": "м", "hint": "На каждый 1 мм рт. ст. по условию приходится 12 м.", "solution": "h ≈ 10 × 12 = 120 м. Это результат заданного приближения, не точное определение высоты.", "extra": true}]}, {"title": "Выталкивающая сила и закон Архимеда", "sub": "Камень на подвесе и вода в походной ёмкости", "parts": [["1. Почему возникает выталкивание?", "<p>В покоящейся жидкости давление растёт с глубиной. Для обычного погружённого тела суммарная сила давления имеет выталкивающую составляющую вверх.<\/p><p><strong>FА = ρж × g × Vпогр<\/strong>: плотность жидкости, заданное g и объём погружённой части.<\/p><p>Для 50 см³ воды: Vпогр = 0,00005 м³, FА = 1000 × 10 × 0,00005 = 0,5 Н.<\/p>"], ["2. Две главные ловушки", "<p>Подставляют плотность жидкости, а не вещества тела. Берут объём погружённой части, а не всегда полный объём.<\/p><p>Для двух полностью погружённых тел одинакового внешнего объёма в одной жидкости FА одинакова, хотя массы и тяжесть могут различаться.<\/p>"], ["3. Измерение на подвесе", "<p>Для неподвижного предмета на вертикальном подвесе в воде без касания сосуда: T + FА = mg.<\/p><p>Если выталкиванием воздуха пренебречь, FА приблизительно равна разности показаний динамометра в воздухе и воде. Масса предмета не уменьшается.<\/p><p>Для присосавшегося к дну камня условия другие. Нельзя этой простой схемой автоматически рассчитать силу его отрыва.<\/p>"]], "diagrams": [{"svg": "<svg viewBox=\"0 0 600 300\" role=\"img\" aria-label=\"Три силы на неподвижном предмете, подвешенном в воде: натяжение и Архимедова сила вверх, тяжесть вниз\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"300\" rx=\"16\" fill=\"#eef7fa\"/><rect x=\"50\" y=\"180\" width=\"500\" height=\"90\" fill=\"#c6e8f6\"/><path d=\"M300 45v85\" stroke=\"#31566c\" stroke-width=\"3\"/><rect x=\"265\" y=\"130\" width=\"70\" height=\"100\" rx=\"10\" fill=\"#f5c876\"/><path d=\"M280 170L280 95M286.2325320018546 106.40857330457484L280 95L273.7674679981454 106.40857330457484\" fill=\"none\" stroke=\"#237f62\" stroke-width=\"4\"/><path d=\"M320 170L320 260M313.7674679981454 248.59142669542516L320 260L326.2325320018546 248.59142669542516\" fill=\"none\" stroke=\"#b75d3b\" stroke-width=\"4\"/><text x=\"140\" y=\"110\" text-anchor=\"middle\" font-size=\"16\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Натяжение T вверх<\/text><text x=\"440\" y=\"244\" text-anchor=\"middle\" font-size=\"16\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Тяжесть вниз<\/text><path d=\"M350 215L350 145M356.2325320018546 156.40857330457484L350 145L343.7674679981454 156.40857330457484\" fill=\"none\" stroke=\"#247fb4\" stroke-width=\"4\"/><text x=\"460\" y=\"145\" text-anchor=\"middle\" font-size=\"19\" fill=\"#173449\" font-family=\"Arial,sans-serif\">FА вверх<\/text><text x=\"300\" y=\"30\" text-anchor=\"middle\" font-size=\"21\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Равновесие: T + FА = mg<\/text><\/svg>", "caption": "Предмет неподвижен, не касается дна и стенок. Длины стрелок условны, не численные значения."}], "flow": ["Выбери плотность жидкости", "Определи погружённый объём", "Переведи объём в м³", "Вычисли ρжgVпогр", "При подвесе отдельно проверь равновесие сил"], "activity": "По рисунку назови три силы на подвешенном предмете. Для домашнего опыта нужен подходящий прибор и безопасная маленькая ёмкость; без прибора ограничься схемой.", "tasks": [{"id": "a1", "title": "Вытесненная вода", "q": "Тело вытесняет 200 см³ пресной воды. Найди FА: ρводы = 1000 кг/м³, g = 10 Н/кг.", "type": "number", "answer": 2, "unit": "Н", "hint": "200 см³ = 0,0002 м³.", "solution": "FА = 1000 × 10 × 0,0002 = 2 Н.", "extra": false}, {"id": "a2", "title": "Чья плотность?", "q": "Какую плотность нужно подставить в формулу FА?", "type": "choice", "options": ["Плотность жидкости", "Всегда плотность материала тела", "Всегда плотность воздуха"], "answer": 0, "hint": "Формула связывает выталкивание с вытесненной средой.", "solution": "В воде или растворе подставляют плотность этой жидкости.", "extra": false}, {"id": "a3", "title": "Частичное погружение", "q": "Полный объём модели 500 см³. В воду погружена половина этого объёма. Найди FА: ρводы = 1000 кг/м³, g = 10 Н/кг.", "type": "number", "answer": 2.5, "unit": "Н", "hint": "Погружено 250 см³ = 0,00025 м³.", "solution": "FА = 1000 × 10 × 0,00025 = 2,5 Н.", "extra": false}, {"id": "a4", "title": "Показания динамометра", "q": "Неподвижный предмет даёт 4 Н в воздухе и 2,5 Н в воде. Сосуда не касается; выталкиванием воздуха пренебречь. Найди FА.", "type": "number", "answer": 1.5, "unit": "Н", "hint": "Вычти показание в воде из показания в воздухе.", "solution": "FА ≈ 4 − 2,5 = 1,5 Н.", "extra": false}]}, {"title": "Плавание тел и воздухоплавание", "sub": "Поплавок, пластилиновая лодочка и воздушный шар", "parts": [["1. Начальное движение и равновесие", "<p>Для полностью погружённого тела, отпущенного из покоя, в простой модели сравнивают FА и mg: если FА больше — начинает подниматься; меньше — опускаться; равенство допускает равновесие.<\/p><p>При движении появляется сопротивление. Эти правила не означают, что при дальнейшем движении равнодействующая всё время остаётся прежней.<\/p><p>Для тела, спокойно плавающего на поверхности без иных вертикальных сил, <strong>FА = mg<\/strong>. Не «больше», а равно.<\/p>"], ["2. Почему может плавать лодочка?", "<p>Шар из подходящего пластилина может тонуть, а открытая лодочка из того же куска — плавать, если до затопления успевает вытеснить достаточно воды.<\/p><p>Масса куска и плотность материала не обязаны изменяться. Меняется форма конструкции и её средняя плотность с учётом полости.<\/p><p>Расчётный предел нагрузки на границе полного погружения — не безопасная грузоподъёмность настоящей лодки. Нужны запас плавучести, устойчивость и правила эксплуатации.<\/p>"], ["3. Выталкивание действует и в воздухе", "<p>Для воздушного шара FА = ρвнешнего воздуха × g × Vвытесненного воздуха. Сравнивают её с тяжестью всей системы: газа внутри, оболочки, корзины и груза.<\/p><p>Горячий воздух при сопоставимом давлении менее плотный, чем холодный. Но одного этого утверждения недостаточно для подъёма: нужно учитывать общую массу.<\/p><p>Никаких домашних горелок, водорода и запуска воздушных шаров для проверки урока.<\/p>"]], "diagrams": [{"svg": "<svg viewBox=\"0 0 600 300\" role=\"img\" aria-label=\"Полая модель лодки в равновесии: выталкивание равно тяжести при отсутствии иных вертикальных сил\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"300\" rx=\"16\" fill=\"#eef7fa\"/><rect x=\"30\" y=\"160\" width=\"540\" height=\"110\" fill=\"#c6e8f6\"/><path d=\"M190 130H410L370 205H230Z\" fill=\"#f5c876\" stroke=\"#31566c\" stroke-width=\"3\"/><path d=\"M30 160H570\" stroke=\"#247fb4\" stroke-width=\"3\"/><path d=\"M280 165L280 80M286.2325320018546 91.40857330457484L280 80L273.7674679981454 91.40857330457484\" fill=\"none\" stroke=\"#237f62\" stroke-width=\"4\"/><path d=\"M320 165L320 250M313.7674679981454 238.59142669542516L320 250L326.2325320018546 238.59142669542516\" fill=\"none\" stroke=\"#b75d3b\" stroke-width=\"4\"/><text x=\"300\" y=\"35\" text-anchor=\"middle\" font-size=\"22\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Спокойное плавание: FА = mg<\/text><text x=\"135\" y=\"105\" text-anchor=\"middle\" font-size=\"20\" fill=\"#173449\" font-family=\"Arial,sans-serif\">FА<\/text><text x=\"470\" y=\"230\" text-anchor=\"middle\" font-size=\"20\" fill=\"#173449\" font-family=\"Arial,sans-serif\">mg<\/text><text x=\"300\" y=\"290\" text-anchor=\"middle\" font-size=\"17\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Внутренняя полость помогает вытеснить воду<\/text><\/svg>", "caption": "Равенство сил относится к покою без дополнительных вертикальных воздействий."}, {"svg": "<svg viewBox=\"0 0 600 300\" role=\"img\" aria-label=\"Схема воздушного шара: выталкивающая сила зависит от внешнего воздуха, тяжесть учитывает газ, оболочку, корзину и груз\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"300\" rx=\"16\" fill=\"#eef7fa\"/><ellipse cx=\"300\" cy=\"110\" rx=\"85\" ry=\"75\" fill=\"#f5c876\" stroke=\"#31566c\" stroke-width=\"3\"/><path d=\"M260 174L275 220M340 174L325 220\" stroke=\"#31566c\" stroke-width=\"3\"/><rect x=\"270\" y=\"220\" width=\"60\" height=\"35\" rx=\"6\" fill=\"#a7bea9\"/><path d=\"M190 180L190 70M196.23253200185465 81.40857330457484L190 70L183.76746799814535 81.40857330457484\" fill=\"none\" stroke=\"#237f62\" stroke-width=\"4\"/><path d=\"M420 80L420 190M413.7674679981454 178.59142669542516L420 190L426.2325320018546 178.59142669542516\" fill=\"none\" stroke=\"#b75d3b\" stroke-width=\"4\"/><text x=\"130\" y=\"210\" text-anchor=\"middle\" font-size=\"18\" fill=\"#173449\" font-family=\"Arial,sans-serif\">FА вверх<\/text><text x=\"480\" y=\"230\" text-anchor=\"middle\" font-size=\"16\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Тяжесть всей<\/text><text x=\"480\" y=\"254\" text-anchor=\"middle\" font-size=\"16\" fill=\"#173449\" font-family=\"Arial,sans-serif\">системы вниз<\/text><text x=\"300\" y=\"290\" text-anchor=\"middle\" font-size=\"17\" fill=\"#173449\" font-family=\"Arial,sans-serif\">В FА берём плотность окружающего воздуха<\/text><\/svg>", "caption": "Длины стрелок не задают итог движения: для вывода нужны объём, внешняя плотность и общая масса."}], "flow": ["Уточни состояние: покой или начальное движение", "Запиши все вертикальные силы", "Для спокойного плавания без иных сил используй FА = mg", "Для полного погружения сравни FА и mg", "Для шара в воздухе учти массу всей системы"], "activity": "Нарисуй поплавок и две равные противоположные стрелки при спокойном плавании. Не экспериментируй с настоящими плавсредствами, огнём, животными и глубокими водоёмами.", "tasks": [{"id": "f1", "title": "Спокойный поплавок", "q": "Поплавок 60 г спокойно плавает, иных вертикальных сил нет. Найди FА при g = 10 Н/кг.", "type": "number", "answer": 0.6, "unit": "Н", "hint": "60 г = 0,06 кг; при равновесии FА = mg.", "solution": "FА = 0,06 × 10 = 0,6 Н.", "extra": false}, {"id": "f2", "title": "Полностью погружённый образец", "q": "Однородный сплошной образец плотностью 700 кг/м³ полностью погрузили в воду 1000 кг/м³ и отпустили из покоя. Сосуда не касается; в начале учитываем тяжесть и выталкивание. Что начнёт делать образец?", "type": "choice", "options": ["Подниматься", "Опускаться", "Обязательно останется на месте"], "answer": 0, "hint": "Сравни ρтелаgV и ρводыgV при одном объёме.", "solution": "При полной погружённости FА больше тяжести, поэтому начальное движение вверх.", "extra": false}, {"id": "f3", "title": "Средняя плотность модели", "q": "Полая герметичная модель вместе с содержимым имеет массу 0,4 кг и внешний объём 0,001 м³. Найди среднюю плотность всей модели.", "type": "number", "answer": 400, "unit": "кг/м³", "hint": "Раздели общую массу на внешний объём.", "solution": "ρср = 0,4 ÷ 0,001 = 400 кг/м³. Это средняя плотность модели, не плотность материала её стенок.", "extra": false}, {"id": "f4", "title": "Выталкивание в воздухе", "q": "Шар вытесняет 2 м³ воздуха. Плотность окружающего воздуха по условию 1,2 кг/м³. Найди FА при g = 10 Н/кг.", "type": "number", "answer": 24, "unit": "Н", "hint": "Умножь внешнюю плотность, g и вытесненный объём.", "solution": "FА = 1,2 × 10 × 2 = 24 Н. Чтобы решить, поднимется ли шар, нужно знать общую массу системы.", "extra": false}]}],KEY='fizika7-module5-v1',app=document.getElementById('app'),ALL=DATA.flatMap(l=>l.tasks);let failed=false;
function load(){try{let p=JSON.parse(localStorage.getItem(KEY)),ids=new Set(ALL.map(t=>t.id));return{done:p&&Array.isArray(p.done)?[...new Set(p.done.filter(id=>ids.has(id)))]:[],help:p&&Array.isArray(p.help)?p.help.filter(id=>ids.has(id)):[]}}catch(e){return{done:[],help:[]}}}
let state=load();function save(){try{localStorage.setItem(KEY,JSON.stringify(state));failed=false}catch(e){failed=true}}function notice(){return failed?'<p class="feedback hint" role="status">Прогресс не удалось сохранить. Задания доступны.</p>':''}function nav(){return '<nav class="nav" aria-label="Разделы"><a class="link" href="./start.html">Общее меню</a><a class="link" href="./archimedes.html">12 задач Архимеда</a><a class="link" href="./module4.html">Модуль 4: давление</a></nav>'}
function home(){let basic=ALL.filter(t=>!t.extra&&state.done.includes(t.id)).length;app.innerHTML=`<section class="card"><span class="tag">Модуль 5 · Версия 1.0</span><h2>Атмосфера, выталкивание и плавание</h2><p>Три урока, 11 основных заданий и одна дополнительная приближённая оценка высоты.</p><div class="bar" role="progressbar" aria-label="Основные задачи" aria-valuemin="0" aria-valuemax="11" aria-valuenow="${basic}"><div style="width:${basic/11*100}%"></div></div><p class="muted">Основные: ${basic} из 11. Всего: ${state.done.length} из 12. Это не школьная оценка.</p><div id="lesson-list"></div>${notice()}</section><section class="card"><h2>Тренажёр Архимеда остаётся отдельно</h2><p>Здесь теория и короткая практика. Для дополнительного закрепления используй уже работающий тренажёр по ссылке ниже. Прогресс этого модуля и тренажёра независим.</p><a class="link" href="./archimedes.html">Открыть 12 задач по закону Архимеда</a></section>${nav()}<details class="card" style="margin-top:20px"><summary>Источники и ограничения</summary><p class="muted"><a href="https://openstax.org/books/university-physics-volume-1/pages/14-2-measuring-pressure" target="_blank" rel="noopener noreferrer">OpenStax: измерение давления</a>; <a href="https://openstax.org/books/university-physics-volume-1/pages/14-4-archimedes-principle-and-buoyancy" target="_blank" rel="noopener noreferrer">плавучесть</a>. Порядок тем сверяют с учителем. Рисунки и числа учебные.</p><p class="muted">Прогресс в этом браузере; может исчезнуть при очистке данных и автоматически не переносится между устройствами. Опасные домашние опыты не нужны.</p></details>`;let list=document.getElementById('lesson-list');DATA.forEach((l,i)=>{let b=document.createElement('button');b.textContent=(i+1)+'. '+l.title+' — '+l.tasks.filter(t=>state.done.includes(t.id)).length+'/4';b.onclick=()=>lesson(i);list.appendChild(b)});window.scrollTo(0,0)}
function lesson(i){let l=DATA[i];app.innerHTML=`<button id="back">← К урокам модуля</button><section class="card" style="margin-top:18px"><span class="tag">Урок ${i+1} из 3</span><h2>${l.title}</h2><p class="muted">${l.sub}</p>${l.parts.map(p=>'<h3>'+p[0]+'</h3>'+p[1]).join('')}</section>${l.diagrams.map(d=>'<section class="card"><h2>Посмотри на рисунок</h2><figure>'+d.svg+'<figcaption>'+d.caption+'</figcaption></figure></section>').join('')}<section class="card"><h2>Пройди по шагам</h2><ol class="flow">${l.flow.map(s=>'<li>'+s+'</li>').join('')}</ol></section><section class="card"><h2>Самостоятельные задачи</h2><div id="tasks"></div></section><section class="card"><h2>Попробуй вне экрана</h2><p>${l.activity}</p></section>${nav()}`;document.getElementById('back').onclick=home;let list=document.getElementById('tasks');l.tasks.forEach((t,k)=>{let b=document.createElement('button');b.textContent=(k+1)+'. '+t.title+(t.extra?' (необязательно)':'')+(state.done.includes(t.id)?(state.help.includes(t.id)?' — с помощью':' — выполнено'):'');b.onclick=()=>task(i,k);list.appendChild(b)});window.scrollTo(0,0)}
function parse(value){let s=value.trim().replace(',','.');return /^\d+(?:\.\d+)?$/.test(s)?Number(s):null}
function task(li,ti){let l=DATA[li],t=l.tasks[ti],helped=false,solved=false;app.innerHTML=`<button id="lesson-back">← К объяснению урока</button><section class="card" style="margin-top:18px"><span class="tag">Задача ${ti+1} из 4${t.extra?' · дополнительная':''}</span><h2>${t.title}</h2><p>${t.q}</p>${t.type==='number'?'<form id="answer-form" novalidate><label for="answer">Ответ, '+t.unit+'</label><input id="answer" type="text" inputmode="decimal" autocomplete="off" aria-describedby="note"><p id="note" class="muted">Только число. Запятая и точка равноправны.</p><button id="check" class="primary" type="submit">Проверить</button></form>':'<div id="choices"></div>'}<button id="hint">Подсказка</button><div id="feedback" role="status" aria-live="polite" hidden></div><div id="hint-text" class="feedback hint" role="status" hidden></div><details id="solution" hidden><summary>Открыть разбор</summary><p>${t.solution}</p></details><button id="next" class="primary" hidden>${ti<3?'Следующая задача →':li<2?'Следующий урок →':'К меню модуля'}</button>${t.extra?'<button id="skip">Пропустить дополнительную задачу</button>':''}<div id="storage-status"></div></section>`;document.getElementById('lesson-back').onclick=()=>lesson(li);function advance(){if(ti<3)task(li,ti+1);else if(li<2)lesson(li+1);else home()}if(t.extra)document.getElementById('skip').onclick=advance;let fb=document.getElementById('feedback');function message(s,ok){fb.hidden=false;fb.className='feedback '+(ok?'good':'hint');fb.textContent=s}function verify(value){if(solved)return;if(value===null||!Number.isFinite(value)){message('Введи число, например 20 или 0,6.',false);return}if(Math.abs(value-t.answer)>1e-8){helped=true;message('Пока не совпало. Проверь условие, формулу и единицы. Можно открыть подсказку.',false);return}solved=true;if(!state.done.includes(t.id))state.done.push(t.id);if(helped&&!state.help.includes(t.id))state.help.push(t.id);save();message('Верно! '+t.solution,true);if(t.type==='number'){document.getElementById('answer').disabled=true;document.getElementById('check').disabled=true}else document.getElementById('choices').querySelectorAll('button').forEach(b=>b.disabled=true);document.getElementById('hint').hidden=true;document.getElementById('next').hidden=false;if(t.extra)document.getElementById('skip').hidden=true;document.getElementById('storage-status').innerHTML=notice()}
if(t.type==='number')document.getElementById('answer-form').onsubmit=e=>{e.preventDefault();verify(parse(document.getElementById('answer').value))};else{let box=document.getElementById('choices');t.options.forEach((s,i)=>{let b=document.createElement('button');b.textContent=s;b.onclick=()=>verify(i);box.appendChild(b)})}document.getElementById('hint').onclick=function(){helped=true;let box=document.getElementById('hint-text');box.hidden=false;box.textContent=t.hint;document.getElementById('solution').hidden=false;this.hidden=true};document.getElementById('solution').ontoggle=function(){if(this.open)helped=true};document.getElementById('next').onclick=advance;window.scrollTo(0,0)}
try{home()}catch(e){app.innerHTML='<section class="card"><h2>Не удалось открыть модуль</h2><pre id="error"></pre></section>';document.getElementById('error').textContent=String(e.message||e)}
})();
</script></body></html>
