<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142638"><title>Гидростатическое давление</title><style>*{box-sizing:border-box}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}body{margin:0;background:#eef3f7;color:#172c3e;font:18px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow-wrap:anywhere}.wrap{max-width:900px;margin:auto}header{padding:32px 20px;background:linear-gradient(130deg,#142638,#21564f);color:white}header p{color:#dce9f1}h1{font-size:clamp(29px,7vw,43px);line-height:1.25}h2{font-size:26px;line-height:1.35;margin-top:0}h3{font-size:21px}main{padding:24px 15px}.card{background:white;border:1px solid #dce5ed;border-radius:19px;padding:24px;margin-bottom:20px}p{margin:0 0 16px}.muted,figcaption{font-size:15px;color:#526879}.tag{display:inline-block;background:#e5f6ef;color:#176344;border-radius:22px;padding:5px 12px;font-size:14px;margin-bottom:14px}button,.link{display:block;width:100%;padding:14px;margin-top:12px;min-height:50px;border:2px solid #dce5ed;border-radius:13px;color:#172c3e;background:#f7fafc;text-decoration:none;text-align:left;font:inherit;line-height:1.5;cursor:pointer;touch-action:manipulation}.primary{background:#237f62;border-color:#237f62;color:white;text-align:center}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #237f62;outline-offset:3px}button:disabled,input:disabled{opacity:.7;cursor:default}input:not([type="range"]),select{width:100%;padding:14px;border:2px solid #bdced9;border-radius:12px;font:inherit;font-size:20px}input[type="range"]{width:100%;min-height:44px;accent-color:#237f62}.feedback{padding:16px;border-radius:12px;margin-top:16px}.good{background:#e5f6ef;color:#15583e}.hint{background:#fff3d8;color:#704d10}figure{margin:0}svg{display:block;width:100%;height:auto;max-width:650px;margin:auto}figcaption{margin-top:10px}.flow{padding-left:25px}.flow li{padding:10px;margin:12px 0;background:#eef7fa;border-radius:10px}.bar{height:10px;background:#e5edf2;border-radius:10px;overflow:hidden;margin:16px 0}.bar div{height:100%;background:#237f62}footer{padding:0 20px 28px;text-align:center;font-size:14px;color:#526879}a{color:#176344}summary{cursor:pointer}.nav{display:flex;gap:10px;flex-wrap:wrap}.nav a{flex:1;min-width:180px}label{display:block;margin:14px 0 6px}@media(max-width:480px){.card{padding:18px}body{font-size:17px}}</style></head><body><header><div class="wrap"><p>ФИЗИКА · 7 КЛАСС</p><h1>Гидростатическое давление</h1><p>Глубина, плотность и давление покоящейся жидкости</p></div></header><main id="app" class="wrap"><section class="card"><h2>Загрузка…</h2></section></main><footer>Гидростатика · Тренажёр 1.0</footer><noscript>Для заданий нужен JavaScript.</noscript><script>
(function(){'use strict';
const TASKS=[{"id": "h1", "title": "Давление на 2 метрах", "q": "Найди добавочное давление пресной воды на глубине 2 м. ρ = 1000 кг/м³, g = 10 Н/кг.", "type": "number", "answer": 20000, "unit": "Па", "hints": ["Используй Δp = ρgh.", "Умножь 1000 × 10 × 2."], "solution": "Δp = 1000 × 10 × 2 = 20 000 Па.", "level": "А · Формула и единицы"}, {"id": "h2", "title": "Глубина в сантиметрах", "q": "Глубина 50 см. Найди добавочное давление воды: ρ = 1000 кг/м³, g = 10 Н/кг.", "type": "number", "answer": 5000, "unit": "Па", "hints": ["50 см = 0,5 м.", "Подставь 0,5 м, а не число 50."], "solution": "Δp = 1000 × 10 × 0,5 = 5000 Па.", "level": "А · Формула и единицы"}, {"id": "h3", "title": "Другая плотность", "q": "Жидкость по условию имеет плотность 800 кг/м³. Найди добавочное давление на глубине 3 м при g = 10 Н/кг. Ответ в кПа.", "type": "number", "answer": 24, "unit": "кПа", "hints": ["Сначала получи давление в Па.", "800 × 10 × 3 = 24 000 Па. Переведи в кПа."], "solution": "Δp = 24 000 Па = 24 кПа. Значение плотности задано, а не универсально для всех масел.", "level": "А · Формула и единицы"}, {"id": "h4", "title": "Найди глубину", "q": "Добавочное давление воды 40 000 Па. Найди глубину: ρ = 1000 кг/м³, g = 10 Н/кг.", "type": "number", "answer": 4, "unit": "м", "hints": ["Вырази h = Δp/(ρg).", "Раздели 40 000 на 10 000."], "solution": "h = 40 000 ÷ (1000 × 10) = 4 м.", "level": "А · Формула и единицы"}, {"id": "h5", "title": "Полное давление", "q": "Давление над водой 100 кПа. Найди полное давление на глубине 3 м. ρ = 1000 кг/м³, g = 10 Н/кг.", "type": "number", "answer": 130, "unit": "кПа", "hints": ["Прибавка воды на 3 м равна 30 кПа.", "К прибавке добавь давление поверхности."], "solution": "p = 100 + 30 = 130 кПа.", "level": "Б · Полное давление и сравнение"}, {"id": "h6", "title": "Глубина по полному давлению", "q": "Полное давление в воде 160 кПа, давление над поверхностью 100 кПа. Найди глубину: ρ = 1000 кг/м³, g = 10 Н/кг.", "type": "number", "answer": 6, "unit": "м", "hints": ["Сначала Δp = 160 − 100 = 60 кПа.", "60 кПа = 60 000 Па. Раздели на 1000 × 10."], "solution": "h = (160 000 − 100 000) ÷ 10 000 = 6 м.", "level": "Б · Полное давление и сравнение"}, {"id": "h7", "title": "Форма сосуда", "q": "В двух сосудах разной формы одна покоящаяся жидкость. Сравни давление в точках одинаковой глубины, если давление над свободными поверхностями одинаково.", "type": "choice", "options": ["Давления одинаковы", "В широком сосуде обязательно больше", "Зависит только от общего объёма воды"], "answer": 0, "hints": ["Сравни p₀, плотность и глубину в формуле.", "Все величины p = p₀ + ρgh в этих точках одинаковы."], "solution": "При указанных условиях давления одинаковы. Общая масса жидкости может различаться.", "level": "Б · Полное давление и сравнение"}, {"id": "h8", "title": "Глубина выросла вдвое", "q": "Для одной жидкости при неизменном g глубину увеличили вдвое. Как изменилось добавочное давление столба жидкости?", "type": "choice", "options": ["Увеличилось вдвое", "Уменьшилось вдвое", "Полное давление обязательно увеличилось ровно вдвое"], "answer": 0, "hints": ["Речь о Δp = ρgh, а не о p₀ + ρgh.", "При постоянных ρ и g прибавка пропорциональна h."], "solution": "Добавочное давление удвоилось. Полное не обязано удваиваться, потому что p₀ остаётся слагаемым.", "level": "Б · Полное давление и сравнение"}, {"id": "h9", "title": "Сила на пластинку", "q": "На маленькую горизонтальную пластинку действуют давления 130 кПа снаружи и 100 кПа изнутри. Площадь 20 см²; давление по каждой стороне равномерно. Найди величину результирующей силы давления.", "type": "number", "answer": 60, "unit": "Н", "hints": ["Перепад 30 кПа = 30 000 Па. Площадь 20 см² = 0,002 м².", "Используй F = |pснаружи − pизнутри|S."], "solution": "F = 30 000 × 0,002 = 60 Н, в сторону меньшего давления.", "level": "В · Дополнительные задачи"}, {"id": "h10", "title": "Разность давлений в воде", "q": "В одной покоящейся пресной воде сравнивают глубины 1 и 4 м. На сколько давление глубже больше? ρ = 1000 кг/м³, g = 10 Н/кг. Ответ в кПа.", "type": "number", "answer": 30, "unit": "кПа", "hints": ["Разность глубин 4 − 1 = 3 м.", "Общее давление поверхности при вычитании сократится."], "solution": "Разность давлений = 1000 × 10 × 3 = 30 000 Па = 30 кПа.", "level": "В · Дополнительные задачи"}, {"id": "h11", "title": "Определи плотность", "q": "Добавочное давление покоящейся жидкости на глубине 2 м равно 18 000 Па. Найди плотность при g = 10 Н/кг.", "type": "number", "answer": 900, "unit": "кг/м³", "hints": ["ρ = Δp/(gh).", "Раздели 18 000 на 10 × 2."], "solution": "ρ = 18 000 ÷ 20 = 900 кг/м³. Само значение не доказывает химический состав жидкости.", "level": "В · Дополнительные задачи"}, {"id": "h12", "title": "Давление и сила на дно", "q": "Два открытых сосуда содержат одну жидкость до одинаковой высоты; давление над поверхностью одинаково. Площадь горизонтального дна второго вдвое больше. Как сравнить давление и силу жидкости на внутреннюю сторону дна?", "type": "choice", "options": ["Давления равны, сила на второе дно вдвое больше", "И давление, и сила на втором дне вдвое больше", "Давления и силы обязательно одинаковы"], "answer": 0, "hints": ["p одинаково по p₀, ρ и h. Но сила на площадь F = pS.", "Здесь спрашивается сила с одной внутренней стороны, а не результирующая по двум сторонам."], "solution": "При равных давлениях сила на внутреннюю сторону вдвое большей площади вдвое больше. Полная нагрузка на дно с двух сторон требует учёта внешнего давления.", "level": "В · Дополнительные задачи"}],THEORY="<section class=\"card\"><h2>Что называем гидростатическим давлением?<\/h2><p>Гидростатическое давление — давление в покоящейся жидкости. Для жидкости постоянной плотности полное давление на глубине h: <strong>p = p₀ + ρgh<\/strong>.<\/p><p>p₀ — давление над свободной поверхностью. Прибавку от столба жидкости будем отдельно обозначать <strong>Δp = ρgh<\/strong>. Она совпадает с избыточным относительно атмосферы давлением только если поверхность открыта в ту же атмосферу.<\/p><ul><li>ρ — плотность жидкости в кг/м³.<\/li><li>g — заданный коэффициент; здесь обычно 10 Н/кг.<\/li><li>h — вертикальная глубина от свободной поверхности в метрах, не расстояние вдоль наклонной стенки.<\/li><li>p и Δp — давление в паскалях. 1 кПа = 1000 Па.<\/li><\/ul><p>В пресной воде при ρ = 1000 кг/м³ и g = 10 Н/кг каждый метр добавляет 10 кПа. Это расчётное приближение условий задач, не инструкция для погружений.<\/p><\/section><section class=\"card\"><h2>Давление не равно силе<\/h2><p>Давление — скалярная величина. Сила давления на небольшую поверхность направлена перпендикулярно ей. При равномерном давлении F = pS.<\/p><p>Если давление действует с двух сторон пластинки, результирующая сила при равномерных давлениях определяется их разностью: F = |p₁ − p₂|S. Для большой вертикальной стенки давление меняется по высоте — подстановка одного значения глубины без обоснования неверна.<\/p><p>В одинаковой жидкости на одной глубине при одинаковом p₀ давление не зависит от формы сосуда. Это не означает одинаковую массу воды или одинаковую силу на дно разных площадей.<\/p><\/section>",DIAGRAMS=[["<svg viewBox=\"0 0 600 300\" role=\"img\" aria-label=\"Две глубины в воде: один метр добавляет 10 кПа, три метра 30 кПа при g равном 10\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"300\" rx=\"16\" fill=\"#eef7fa\"/><rect x=\"60\" y=\"75\" width=\"480\" height=\"175\" fill=\"#bee4f4\"/><path d=\"M60 75H540\" stroke=\"#277eb4\" stroke-width=\"4\"/><circle cx=\"190\" cy=\"130\" r=\"7\" fill=\"#237f62\"/><circle cx=\"190\" cy=\"210\" r=\"7\" fill=\"#237f62\"/><text x=\"300\" y=\"35\" text-anchor=\"middle\" font-size=\"18\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Пресная вода: ρ = 1000 кг/м³; g = 10 Н/кг<\/text><text x=\"380\" y=\"137\" text-anchor=\"middle\" font-size=\"20\" fill=\"#173449\" font-family=\"Arial,sans-serif\">h = 1 м → Δp = 10 кПа<\/text><text x=\"380\" y=\"217\" text-anchor=\"middle\" font-size=\"20\" fill=\"#173449\" font-family=\"Arial,sans-serif\">h = 3 м → Δp = 30 кПа<\/text><text x=\"300\" y=\"285\" text-anchor=\"middle\" font-size=\"18\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Δp — прибавка к давлению на поверхности<\/text><\/svg>", "Подписи относятся к добавочному давлению столба воды, не к полному."], ["<svg viewBox=\"0 0 600 300\" role=\"img\" aria-label=\"Полное давление складывается из давления поверхности 100 кПа и добавки воды 20 кПа\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"300\" rx=\"16\" fill=\"#eef7fa\"/><rect x=\"50\" y=\"90\" width=\"220\" height=\"95\" rx=\"14\" fill=\"#f8dfad\"/><rect x=\"330\" y=\"90\" width=\"220\" height=\"95\" rx=\"14\" fill=\"#bee4f4\"/><text x=\"160\" y=\"125\" text-anchor=\"middle\" font-size=\"21\" fill=\"#173449\" font-family=\"Arial,sans-serif\">p₀ = 100 кПа<\/text><text x=\"160\" y=\"159\" text-anchor=\"middle\" font-size=\"17\" fill=\"#173449\" font-family=\"Arial,sans-serif\">На поверхности<\/text><text x=\"300\" y=\"145\" text-anchor=\"middle\" font-size=\"32\" fill=\"#173449\" font-family=\"Arial,sans-serif\">+<\/text><text x=\"440\" y=\"125\" text-anchor=\"middle\" font-size=\"21\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Δp = 20 кПа<\/text><text x=\"440\" y=\"159\" text-anchor=\"middle\" font-size=\"17\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Добавка воды<\/text><text x=\"300\" y=\"245\" text-anchor=\"middle\" font-size=\"25\" fill=\"#173449\" font-family=\"Arial,sans-serif\">pполное = 120 кПа<\/text><\/svg>", "Условный численный пример: давление поверхности задано 100 кПа."], ["<svg viewBox=\"0 0 600 300\" role=\"img\" aria-label=\"Пластинка между давлениями 130 и 100 кПа; результирующую силу определяет перепад 30 кПа\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"300\" rx=\"16\" fill=\"#eef7fa\"/><rect x=\"50\" y=\"75\" width=\"220\" height=\"155\" fill=\"#bee4f4\"/><rect x=\"278\" y=\"70\" width=\"34\" height=\"170\" rx=\"8\" fill=\"#839ba8\"/><rect x=\"320\" y=\"75\" width=\"230\" height=\"155\" fill=\"#f8dfad\"/><text x=\"160\" y=\"130\" text-anchor=\"middle\" font-size=\"18\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Снаружи<\/text><text x=\"160\" y=\"164\" text-anchor=\"middle\" font-size=\"24\" fill=\"#173449\" font-family=\"Arial,sans-serif\">130 кПа<\/text><text x=\"435\" y=\"130\" text-anchor=\"middle\" font-size=\"18\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Изнутри<\/text><text x=\"435\" y=\"164\" text-anchor=\"middle\" font-size=\"24\" fill=\"#173449\" font-family=\"Arial,sans-serif\">100 кПа<\/text><text x=\"300\" y=\"35\" text-anchor=\"middle\" font-size=\"20\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Нагрузка зависит от разности давлений<\/text><text x=\"300\" y=\"280\" text-anchor=\"middle\" font-size=\"22\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Δp = 130 − 100 = 30 кПа<\/text><\/svg>", "Схема перепада давлений. Для расчёта силы требуется площадь и распределение давления по ней."]],FLOW=["Уточни, нужно p, Δp, h или сила", "Запиши ρ, g, вертикальную глубину и p₀", "Приведи единицы к СИ", "Для прибавки используй Δp = ρgh", "Для полного давления прибавь p₀", "Для силы отдельно учти площадь и давление с двух сторон"],KEY='fizika7-hydrostatic-v1',app=document.getElementById('app');let failed=false;
function load(){try{let p=JSON.parse(localStorage.getItem(KEY)),ids=new Set(TASKS.map(t=>t.id));return{done:p&&Array.isArray(p.done)?[...new Set(p.done.filter(id=>ids.has(id)))]:[],help:p&&Array.isArray(p.help)?p.help.filter(id=>ids.has(id)):[]}}catch(e){return{done:[],help:[]}}}
let state=load();function save(){try{localStorage.setItem(KEY,JSON.stringify(state));failed=false}catch(e){failed=true}}function notice(){return failed?'<p class="feedback hint" role="status">Прогресс не удалось сохранить в браузере. Задания доступны.</p>':''}function nav(){return '<nav class="nav" aria-label="Разделы"><a class="link" href="./start.html">Общее меню</a><a class="link" href="./module4.html">Модуль 4: давление</a><a class="link" href="./archimedes.html">Закон Архимеда</a></nav>'}
function home(){let basic=TASKS.slice(0,8).filter(t=>state.done.includes(t.id)).length;app.innerHTML=`<section class="card"><span class="tag">Гидростатика · Версия 1.0</span><h2>12 задач и наглядная модель</h2><p>Восемь основных и четыре дополнительных задания. Различаем давление столба жидкости, полное давление и перепад давлений.</p><div class="bar" role="progressbar" aria-label="Основные задачи" aria-valuemin="0" aria-valuemax="8" aria-valuenow="${basic}"><div style="width:${basic/8*100}%"></div></div><p class="muted">Основные: ${basic} из 8. Всего: ${state.done.length} из 12. Это не школьная оценка.</p><button id="memo" class="primary">Объяснение, рисунки и схема</button><button id="model">Модель: меняй глубину и плотность</button><button id="continue">Начать / продолжить задачи</button>${notice()}</section><div id="groups"></div>${nav()}<details class="card" style="margin-top:20px"><summary>Источники и ограничения</summary><p class="muted">Сверка: <a href="https://openstax.org/books/university-physics-volume-1/pages/14-1-fluids-density-and-pressure" target="_blank" rel="noopener noreferrer">OpenStax: жидкости, плотность и давление</a>; <a href="https://openstax.org/books/college-physics-2e/pages/11-6-gauge-pressure-absolute-pressure-and-pressure-measurement" target="_blank" rel="noopener noreferrer">полное и избыточное давление</a>.</p><p class="muted">Модель рассчитана для покоящейся жидкости постоянной плотности. Не предназначена для дайвинга, расчёта прочности сосудов, водолазных работ и других реальных инженерных или медицинских решений. Не проводи опыты с нагнетанием давления или погружением на глубину.</p><p class="muted">Прогресс только в этом браузере; очистка данных может удалить его. Между устройствами автоматически не переносится.</p></details>`;let groups=document.getElementById('groups');[...new Set(TASKS.map(t=>t.level))].forEach(level=>{let section=document.createElement('section');section.className='card';let title=document.createElement('h2');title.textContent=level;section.appendChild(title);TASKS.forEach((t,i)=>{if(t.level!==level)return;let b=document.createElement('button');b.textContent=(i+1)+'. '+t.title+(state.done.includes(t.id)?(state.help.includes(t.id)?' — с помощью':' — выполнено'):'');b.onclick=()=>task(i);section.appendChild(b)});groups.appendChild(section)});document.getElementById('memo').onclick=memo;document.getElementById('model').onclick=model;document.getElementById('continue').onclick=()=>{let i=TASKS.findIndex(t=>!state.done.includes(t.id));task(i<0?0:i)};window.scrollTo(0,0)}
function memo(){app.innerHTML='<button id="back">← К задачам</button>'+THEORY+DIAGRAMS.map(d=>'<section class="card"><h2>Рассмотри схему</h2><figure>'+d[0]+'<figcaption>'+d[1]+'</figcaption></figure></section>').join('')+'<section class="card"><h2>Схема решения</h2><ol class="flow">'+FLOW.map(s=>'<li>'+s+'</li>').join('')+'</ol><button id="first" class="primary">Первая задача</button></section>'+nav();document.getElementById('back').onclick=home;document.getElementById('first').onclick=()=>task(0);window.scrollTo(0,0)}
function model(){app.innerHTML=`<button id="back">← К задачам</button><section class="card" style="margin-top:18px"><span class="tag">Учебная модель, не прибор</span><h2>Давление на выбранной глубине</h2><p>Жидкость покоится, её плотность постоянна, g = 10 Н/кг. Давление над поверхностью в этой модели p₀ = 100 кПа.</p><label for="density">Плотность жидкости</label><select id="density"><option value="1000">Пресная вода: 1000 кг/м³</option><option value="800">Условная жидкость: 800 кг/м³</option><option value="1200">Условный раствор: 1200 кг/м³</option></select><label for="depth">Глубина: <span id="depth-label">2</span> м</label><input id="depth" type="range" min="0" max="10" step="0.5" value="2"><figure><div id="model-svg"></div><figcaption>Чёрная точка — выбранная глубина. Синяя линия — свободная поверхность. Картинка условная.</figcaption></figure><div id="calculation" class="feedback good" role="status" aria-live="polite"></div><p class="muted">Поменяй один параметр и объясни результат. При h = 0 прибавка столба жидкости нулевая, но полное давление здесь 100 кПа. Плотности условных жидкостей заданы для модели и не описывают все реальные растворы.</p></section>${nav()}`;document.getElementById('back').onclick=home;const depth=document.getElementById('depth'),density=document.getElementById('density');function draw(){let h=Number(depth.value),rho=Number(density.value),dp=rho*10*h,full=100000+dp,y=65+h*17;document.getElementById('depth-label').textContent=String(h).replace('.',',');document.getElementById('model-svg').innerHTML=`<svg viewBox="0 0 600 290" role="img" aria-label="Точка на глубине ${h} метра в покоящейся жидкости" xmlns="http://www.w3.org/2000/svg"><rect width="600" height="290" rx="15" fill="#eef7fa"/><rect x="60" y="65" width="480" height="180" fill="#bee4f4"/><path d="M60 65H540" stroke="#277eb4" stroke-width="4"/><path d="M180 65V${y}" stroke="#173449" stroke-dasharray="5 5" stroke-width="2"/><circle cx="180" cy="${y}" r="7" fill="#173449"/><text x="300" y="35" text-anchor="middle" font-size="19" font-family="Arial" fill="#173449">Давление поверхности: 100 кПа</text><text x="360" y="145" text-anchor="middle" font-size="21" font-family="Arial" fill="#173449">h = ${String(h).replace('.',',')} м</text><text x="300" y="278" text-anchor="middle" font-size="18" font-family="Arial" fill="#173449">Максимальная глубина шкалы модели: 10 м</text></svg>`;document.getElementById('calculation').textContent='Δp = '+rho+' × 10 × '+h+' = '+dp+' Па = '+(dp/1000)+' кПа. Полное: 100 + '+(dp/1000)+' = '+(full/1000)+' кПа.'}depth.oninput=draw;density.onchange=draw;draw();window.scrollTo(0,0)}
function parse(value){let s=value.trim().replace(',','.');return /^\d+(?:\.\d+)?$/.test(s)?Number(s):null}
function task(i){let t=TASKS[i],solved=false,helped=false,h=0;app.innerHTML=`<button id="back">← К задачам</button><section class="card" style="margin-top:18px"><span class="tag">Задача ${i+1} из 12 · ${t.level}</span><h2>${t.title}</h2><p>${t.q}</p>${t.type==='number'?'<form id="answer-form" novalidate><label for="answer">Ответ, '+t.unit+'</label><input id="answer" type="text" inputmode="decimal" autocomplete="off" aria-describedby="note"><p id="note" class="muted">Только число. Запятая и точка принимаются одинаково.</p><button id="check" class="primary" type="submit">Проверить</button></form>':'<div id="choices"></div>'}<button id="hint">Подсказка</button><div id="feedback" role="status" aria-live="polite" hidden></div><div id="hint-text" class="feedback hint" role="status" hidden></div><details id="solution" hidden><summary>Открыть разбор</summary><p>${t.solution}</p></details><button id="next" class="primary" hidden>${i<TASKS.length-1?'Следующая задача →':'Завершить тренажёр'}</button><button id="memo">Вернуться к объяснению</button><div id="storage-status"></div></section>`;document.getElementById('back').onclick=home;document.getElementById('memo').onclick=memo;let fb=document.getElementById('feedback');function message(s,ok){fb.hidden=false;fb.className='feedback '+(ok?'good':'hint');fb.textContent=s}function verify(value){if(solved)return;if(value===null||!Number.isFinite(value)){message('Введи число, например 20 или 0,5.',false);return}if(Math.abs(value-t.answer)>1e-8){helped=true;message('Пока не совпало. Проверь, какое давление требуется, и согласуй единицы.',false);return}solved=true;if(!state.done.includes(t.id))state.done.push(t.id);if(helped&&!state.help.includes(t.id))state.help.push(t.id);save();message('Верно! '+t.solution,true);if(t.type==='number'){document.getElementById('answer').disabled=true;document.getElementById('check').disabled=true}else document.getElementById('choices').querySelectorAll('button').forEach(b=>b.disabled=true);document.getElementById('hint').hidden=true;document.getElementById('next').hidden=false;document.getElementById('storage-status').innerHTML=notice()}
if(t.type==='number')document.getElementById('answer-form').onsubmit=e=>{e.preventDefault();verify(parse(document.getElementById('answer').value))};else{let box=document.getElementById('choices');t.options.forEach((s,k)=>{let b=document.createElement('button');b.textContent=s;b.onclick=()=>verify(k);box.appendChild(b)})}document.getElementById('hint').onclick=function(){helped=true;let box=document.getElementById('hint-text');box.hidden=false;box.textContent=t.hints[Math.min(h,t.hints.length-1)];h++;this.textContent='Ещё подсказка';if(h>=t.hints.length){this.disabled=true;this.textContent='Подсказки открыты';document.getElementById('solution').hidden=false}};document.getElementById('solution').ontoggle=function(){if(this.open)helped=true};document.getElementById('next').onclick=()=>i<TASKS.length-1?task(i+1):home();window.scrollTo(0,0)}
try{home()}catch(e){app.innerHTML='<section class="card"><h2>Не удалось открыть тренажёр</h2><pre id="error"></pre></section>';document.getElementById('error').textContent=String(e.message||e)}
})();
</script></body></html>
