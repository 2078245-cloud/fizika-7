<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142638"><title>Гидравлический пресс</title><style>*{box-sizing:border-box}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}body{margin:0;background:#eef3f7;color:#172c3e;font:18px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow-wrap:anywhere}.wrap{max-width:900px;margin:auto}header{padding:32px 20px;background:linear-gradient(130deg,#142638,#21564f);color:white}header p{color:#dce9f1}h1{font-size:clamp(29px,7vw,43px);line-height:1.25}h2{font-size:26px;line-height:1.35;margin-top:0}h3{font-size:21px}main{padding:24px 15px}.card{background:white;border:1px solid #dce5ed;border-radius:19px;padding:24px;margin-bottom:20px}p{margin:0 0 16px}.muted,figcaption{font-size:15px;color:#526879}.tag{display:inline-block;background:#e5f6ef;color:#176344;border-radius:22px;padding:5px 12px;font-size:14px;margin-bottom:14px}button,.link{display:block;width:100%;padding:14px;margin-top:12px;min-height:50px;border:2px solid #dce5ed;border-radius:13px;color:#172c3e;background:#f7fafc;text-decoration:none;text-align:left;font:inherit;line-height:1.5;cursor:pointer;touch-action:manipulation}.primary{background:#237f62;border-color:#237f62;color:white;text-align:center}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #237f62;outline-offset:3px}button:disabled,input:disabled{opacity:.7;cursor:default}input:not([type="range"]),select{width:100%;padding:14px;border:2px solid #bdced9;border-radius:12px;font:inherit;font-size:20px}input[type="range"]{width:100%;min-height:44px;accent-color:#237f62}label{display:block;margin:14px 0 6px}.feedback{padding:16px;border-radius:12px;margin-top:16px}.good{background:#e5f6ef;color:#15583e}.hint{background:#fff3d8;color:#704d10}figure{margin:0}svg{display:block;width:100%;height:auto;max-width:650px;margin:auto}figcaption{margin-top:10px}.flow{padding-left:25px}.flow li{padding:10px;margin:12px 0;background:#eef7fa;border-radius:10px}.bar{height:10px;background:#e5edf2;border-radius:10px;overflow:hidden;margin:16px 0}.bar div{height:100%;background:#237f62}footer{padding:0 20px 28px;text-align:center;font-size:14px;color:#526879}a{color:#176344}summary{cursor:pointer}.nav{display:flex;gap:10px;flex-wrap:wrap}.nav a{flex:1;min-width:180px}@media(max-width:480px){.card{padding:18px}body{font-size:17px}}</style></head><body><header><div class="wrap"><p>ФИЗИКА · 7 КЛАСС</p><h1>Гидравлический пресс</h1><p>Сила, площадь, ход поршней и работа</p></div></header><main id="app" class="wrap"><section class="card"><h2>Загрузка…</h2></section></main><footer>Гидравлический пресс · Тренажёр 1.0</footer><noscript>Для заданий нужен JavaScript.</noscript><script>
(function(){'use strict';
const TASKS=[{"id": "p1", "title": "Отношение площадей", "q": "Площади поршней S₁ = 2 см² и S₂ = 20 см². Во сколько раз площадь второго больше?", "type": "number", "answer": 10, "unit": "раз", "hints": ["Сравни площади делением.", "Раздели 20 на 2."], "solution": "S₂/S₁ = 20/2 = 10.", "level": "А · Площадь и сила"}, {"id": "p2", "title": "Сила большого поршня", "q": "Идеальный пресс: S₁ = 2 см², S₂ = 20 см², F₁ = 30 Н. Найди F₂.", "type": "number", "answer": 300, "unit": "Н", "hints": ["Отношение площадей 10.", "F₂ = F₁ × S₂/S₁."], "solution": "F₂ = 30 × 20/2 = 300 Н.", "level": "А · Площадь и сила"}, {"id": "p3", "title": "Какая нужна входная сила?", "q": "Идеальный пресс даёт F₂ = 1000 Н, отношение площадей S₂/S₁ = 10. Найди F₁.", "type": "number", "answer": 100, "unit": "Н", "hints": ["Выходная сила в 10 раз больше входной.", "Раздели 1000 на 10."], "solution": "F₁ = 1000/10 = 100 Н.", "level": "А · Площадь и сила"}, {"id": "p4", "title": "Площадь малого поршня", "q": "В идеальной схеме F₁ = 50 Н, F₂ = 1000 Н, S₂ = 40 см². Найди S₁.", "type": "number", "answer": 2, "unit": "см²", "hints": ["Вырази S₁ = S₂F₁/F₂.", "40 × 50 / 1000."], "solution": "S₁ = 40 × 50/1000 = 2 см².", "level": "А · Площадь и сила"}, {"id": "p5", "title": "Переданное давление", "q": "На малый поршень площадью 2 см² действует дополнительная сила 20 Н. Найди созданную прибавку давления в идеальной модели.", "type": "number", "answer": 100000, "unit": "Па", "hints": ["S₁ = 0,0002 м².", "Δp = F₁/S₁."], "solution": "Δp = 20/0,0002 = 100 000 Па. Это созданная прибавка давления, не обязательно полное давление жидкости.", "level": "Б · Давление и перемещение"}, {"id": "p6", "title": "Выходной ход", "q": "S₂/S₁ = 5. Малый поршень переместился на 10 см. Найди ход большого. Жидкость несжимаема, утечек нет.", "type": "number", "answer": 2, "unit": "см", "hints": ["Одинаковый перемещённый объём: S₁s₁ = S₂s₂.", "Ход большого в 5 раз меньше."], "solution": "s₂ = 10/5 = 2 см.", "level": "Б · Давление и перемещение"}, {"id": "p7", "title": "Входной ход", "q": "S₂/S₁ = 4. Большой поршень нужно переместить на 3 см. Найди суммарный ход малого. Несжимаемая жидкость, утечек нет.", "type": "number", "answer": 12, "unit": "см", "hints": ["Малый поршень должен пройти больший путь.", "s₁ = s₂ × S₂/S₁."], "solution": "s₁ = 3 × 4 = 12 см.", "level": "Б · Давление и перемещение"}, {"id": "p8", "title": "Затраченная работа", "q": "В идеальной схеме постоянная входная сила 40 Н действует вдоль перемещения малого поршня на 20 см. Найди работу A₁ = F₁s₁.", "type": "number", "answer": 8, "unit": "Дж", "hints": ["20 см = 0,2 м.", "Умножь 40 Н на 0,2 м."], "solution": "A₁ = 40 × 0,2 = 8 Дж.", "level": "Б · Давление и перемещение"}, {"id": "p9", "title": "Что одинаково?", "q": "Два поршня на одной высоте в идеальной гидравлической схеме имеют разные площади. Пренебрегаем трением и весом поршней. Что одинаково для переданного воздействия?", "type": "choice", "options": ["Давление F₁/S₁ и F₂/S₂", "Силы обязательно одинаковы", "Ходы обязательно одинаковы"], "answer": 0, "hints": ["По закону Паскаля передаётся изменение давления.", "Одинаковая сила на разных площадях дала бы разное давление."], "solution": "F₁/S₁ = F₂/S₂. Силы различаются пропорционально площадям.", "level": "В · Понимание и работа"}, {"id": "p10", "title": "Создаёт ли пресс энергию?", "q": "В идеальном прессе выходная сила в 10 раз больше входной. Что с работой при согласованных перемещениях?", "type": "choice", "options": ["Выходная работа тоже обязательно в 10 раз больше", "Работы равны: выходной путь в 10 раз меньше"], "answer": 1, "hints": ["Сравни не только силы, но и ходы.", "A = Fs; один множитель растёт, другой уменьшается."], "solution": "A₂ = A₁: идеальная схема не создаёт энергию.", "level": "В · Понимание и работа"}, {"id": "p11", "title": "Перемещённый объём", "q": "Площадь малого поршня 3 см², его ход 4 см. Найди объём вытесненной жидкости.", "type": "number", "answer": 12, "unit": "см³", "hints": ["Объём перемещения равен площади, умноженной на ход.", "Единицы см² × см дают см³."], "solution": "ΔV = 3 × 4 = 12 см³.", "level": "В · Понимание и работа"}, {"id": "p12", "title": "Реальный КПД — дополнительно", "q": "Для реального устройства полезная работа 900 Дж, затраченная 1000 Дж. Найди КПД по формуле η = Aпол/Aзатр × 100%.", "type": "number", "answer": 90, "unit": "%", "hints": ["Делим полезную работу на затраченную.", "900/1000 = 0,9. Переведи долю в проценты."], "solution": "η = 900/1000 × 100% = 90%. Разница энергии перешла в другие формы, а не исчезла.", "level": "В · Понимание и работа"}],THEORY="<section class=\"card\"><h2>Как работает гидравлический пресс?<\/h2><p>Малый и большой цилиндры соединены жидкостью. Воздействие на малый поршень создаёт прибавку давления, передаваемую жидкостью. На большей площади это давление создаёт большую силу.<\/p><p><strong>F₁/S₁ = F₂/S₂; F₂ = F₁ × S₂/S₁.<\/strong><\/p><p>F — сила в Н, S — площадь. В отношении S₂/S₁ площади можно оставить в одинаковых единицах. Для давления в Па площадь нужна в м²: 1 см² = 0,0001 м².<\/p><p>Давление — не сила. Большой поршень не обязан иметь большее давление, чтобы создавать большую силу.<\/p><\/section><section class=\"card\"><h2>Условия модели<\/h2><p>Жидкость несжимаема, утечек нет; пренебрегаем трением, инерцией и весом поршней. Внешнее давление на поршни одинаково. Для формулы сил рассматриваем поршни на одной высоте либо пренебрегаем гидростатическим перепадом.<\/p><p>В модели перемещения ниже гидростатическим перепадом при изменении высот также пренебрегаем. Это учебное приближение, не расчёт конструкции реального пресса.<\/p><\/section><section class=\"card\"><h2>Что происходит с ходом и работой?<\/h2><p>Перемещённые объёмы жидкости равны: <strong>S₁s₁ = S₂s₂<\/strong>. Малое s обозначает ход, а большая S — площадь. Поэтому s₂ = s₁ × S₁/S₂.<\/p><p>Если сила выросла в 10 раз, выходной путь в идеальной схеме уменьшился в 10 раз. При постоянных силах A = Fs, и <strong>A₁ = A₂<\/strong>. Реальное устройство имеет потери.<\/p><p>Пример: F₁ = 20 Н, s₁ = 10 см, S₂/S₁ = 10. Тогда F₂ = 200 Н, s₂ = 1 см. Работы: 20 × 0,10 = 2 Дж и 200 × 0,01 = 2 Дж.<\/p><\/section>",DIAGRAMS=[["<svg viewBox=\"0 0 600 300\" role=\"img\" aria-label=\"Два соединённых жидкостью цилиндра: сила на малом поршне создаёт давление и силу на большом\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"300\" rx=\"16\" fill=\"#eef7fa\"/><path d=\"M70 95V240H530V95M150 95V190H330V95\" fill=\"none\" stroke=\"#31566c\" stroke-width=\"5\"/><path d=\"M74 130H146V194H334V130H526V236H74Z\" fill=\"#b8e1f2\"/><path d=\"M72 128H148M332 128H528\" stroke=\"#8298a5\" stroke-width=\"10\"/><path d=\"M110 55L110 112M103.76746799814536 100.59142669542516L110 112L116.23253200185464 100.59142669542516\" stroke=\"#237f62\" stroke-width=\"4\" fill=\"none\"/><path d=\"M430 112L430 55M436.2325320018546 66.40857330457484L430 55L423.7674679981454 66.40857330457484\" stroke=\"#237f62\" stroke-width=\"4\" fill=\"none\"/><text x=\"110\" y=\"30\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">F₁ вниз<\/text><text x=\"430\" y=\"30\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">F₂ вверх<\/text><text x=\"110\" y=\"168\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"19\" fill=\"#173449\">S₁<\/text><text x=\"430\" y=\"168\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"19\" fill=\"#173449\">S₂<\/text><text x=\"300\" y=\"280\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"19\" fill=\"#173449\">Передаётся давление, а не одинаковая сила<\/text><\/svg>", "Схема условна. Действительные площади в задачах задаются числами, не шириной рисунка."], ["<svg viewBox=\"0 0 600 300\" role=\"img\" aria-label=\"Учебный пример: при десятикратном отношении площадей сила на большом поршне в десять раз больше\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"300\" rx=\"16\" fill=\"#eef7fa\"/><rect x=\"35\" y=\"75\" width=\"240\" height=\"110\" rx=\"14\" fill=\"#d1eadd\"/><rect x=\"325\" y=\"75\" width=\"240\" height=\"110\" rx=\"14\" fill=\"#b8e1f2\"/><text x=\"155\" y=\"112\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">S₁ = 2 см²<\/text><text x=\"155\" y=\"153\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"23\" fill=\"#173449\">F₁ = 20 Н<\/text><text x=\"445\" y=\"112\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">S₂ = 20 см²<\/text><text x=\"445\" y=\"153\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"23\" fill=\"#173449\">F₂ = 200 Н<\/text><text x=\"300\" y=\"237\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"23\" fill=\"#173449\">Площадь ×10 → сила ×10<\/text><text x=\"300\" y=\"275\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"17\" fill=\"#173449\">Давление p₁ = p₂ при условиях модели<\/text><\/svg>", "Десятикратное отношение площадей даёт десятикратное отношение сил в идеальной модели."], ["<svg viewBox=\"0 0 600 300\" role=\"img\" aria-label=\"При отношении площадей 10 малый поршень проходит 10 сантиметров, а большой один сантиметр\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"300\" rx=\"16\" fill=\"#eef7fa\"/><rect x=\"35\" y=\"75\" width=\"240\" height=\"110\" rx=\"14\" fill=\"#f8dfad\"/><rect x=\"325\" y=\"75\" width=\"240\" height=\"110\" rx=\"14\" fill=\"#d1eadd\"/><text x=\"155\" y=\"110\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">Малый поршень<\/text><text x=\"155\" y=\"153\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"23\" fill=\"#173449\">Ход: 10 см<\/text><text x=\"445\" y=\"110\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">Большой поршень<\/text><text x=\"445\" y=\"153\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"23\" fill=\"#173449\">Ход: 1 см<\/text><text x=\"300\" y=\"235\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"19\" fill=\"#173449\">При S₂/S₁ = 10 ход уменьшается в 10 раз<\/text><text x=\"300\" y=\"275\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">S₁s₁ = S₂s₂: объём жидкости сохраняется<\/text><\/svg>", "Меньшая сила оплачивается большим путём, а не созданием энергии."]],FLOW=["Проверь условия идеальной модели", "Запиши площади в одинаковых единицах", "Вычисли отношение S₂/S₁", "Для силы умножь F₁ на отношение площадей", "Для выходного хода раздели s₁ на то же отношение", "Для работы переведи ход в метры и сравни Fs"],KEY='fizika7-hydraulic-v1',app=document.getElementById('app');let failed=false;
function load(){try{let p=JSON.parse(localStorage.getItem(KEY)),ids=new Set(TASKS.map(t=>t.id));return{done:p&&Array.isArray(p.done)?[...new Set(p.done.filter(id=>ids.has(id)))]:[],help:p&&Array.isArray(p.help)?p.help.filter(id=>ids.has(id)):[]}}catch(e){return{done:[],help:[]}}}
let state=load();function save(){try{localStorage.setItem(KEY,JSON.stringify(state));failed=false}catch(e){failed=true}}function notice(){return failed?'<p class="feedback hint" role="status">Прогресс не удалось сохранить в браузере. Задачи доступны.</p>':''}function nav(){return '<nav class="nav" aria-label="Разделы"><a class="link" href="./start.html">Общее меню</a><a class="link" href="./module4.html">Модуль 4: давление</a><a class="link" href="./hydrostatic.html">Гидростатическое давление</a></nav>'}
function home(){app.innerHTML=`<section class="card"><span class="tag">Гидравлический пресс · Версия 1.0</span><h2>Силы, площади, ход и работа</h2><p>12 учебных задач и модель идеального пресса. Последние четыре задания — дополнительные; КПД разбирается с готовой формулой.</p><div class="bar" role="progressbar" aria-label="Выполненные задачи" aria-valuemin="0" aria-valuemax="12" aria-valuenow="${state.done.length}"><div style="width:${state.done.length/12*100}%"></div></div><p class="muted">Выполнено ${state.done.length} из 12. Это не школьная оценка.</p><button id="memo" class="primary">Объяснение, рисунки и блок-схема</button><button id="model">Модель пресса: меняй параметры</button><button id="continue">Начать / продолжить задачи</button>${notice()}</section><div id="groups"></div>${nav()}<details class="card" style="margin-top:20px"><summary>Источники и ограничения</summary><p class="muted">Сверка: <a href="https://openstax.org/books/university-physics-volume-1/pages/14-3-pascals-principle-and-hydraulics" target="_blank" rel="noopener noreferrer">OpenStax: принцип Паскаля и гидравлика</a>; <a href="https://openstax.org/books/college-physics-2e/pages/11-problems-exercises" target="_blank" rel="noopener noreferrer">работа и ход поршней</a>.</p><p class="muted">Модель не предназначена для расчёта прочности и эксплуатации реальных прессов, тормозов и домкратов. Не собирай систему под давлением и не поднимай тяжёлые грузы. Прогресс только в этом браузере и может исчезнуть при очистке данных.</p></details>`;let groups=document.getElementById('groups');[...new Set(TASKS.map(t=>t.level))].forEach(level=>{let section=document.createElement('section');section.className='card';let h=document.createElement('h2');h.textContent=level;section.appendChild(h);TASKS.forEach((t,i)=>{if(t.level!==level)return;let b=document.createElement('button');b.textContent=(i+1)+'. '+t.title+(state.done.includes(t.id)?(state.help.includes(t.id)?' — с помощью':' — выполнено'):'');b.onclick=()=>task(i);section.appendChild(b)});groups.appendChild(section)});document.getElementById('memo').onclick=memo;document.getElementById('model').onclick=model;document.getElementById('continue').onclick=()=>{let i=TASKS.findIndex(t=>!state.done.includes(t.id));task(i<0?0:i)};window.scrollTo(0,0)}
function memo(){app.innerHTML='<button id="back">← К задачам</button>'+THEORY+DIAGRAMS.map(d=>'<section class="card"><h2>Рассмотри рисунок</h2><figure>'+d[0]+'<figcaption>'+d[1]+'</figcaption></figure></section>').join('')+'<section class="card"><h2>Схема решения</h2><ol class="flow">'+FLOW.map(s=>'<li>'+s+'</li>').join('')+'</ol><button id="first" class="primary">Первая задача</button></section>'+nav();document.getElementById('back').onclick=home;document.getElementById('first').onclick=()=>task(0);window.scrollTo(0,0)}
function model(){app.innerHTML=`<button id="back">← К задачам</button><section class="card" style="margin-top:18px"><span class="tag">Идеальная учебная модель</span><h2>Выигрыш в силе — уменьшение хода</h2><p>Несжимаемая жидкость, без утечек, трения и инерции. Весом поршней и разностью гидростатических давлений пренебрегаем; внешнее давление одинаково.</p><label for="s1">Площадь малого поршня S₁, см²</label><select id="s1"><option value="1">1</option><option value="2" selected>2</option><option value="5">5</option><option value="10">10</option></select><label for="s2">Площадь большого поршня S₂, см²</label><select id="s2"><option value="10">10</option><option value="20" selected>20</option><option value="50">50</option><option value="100">100</option></select><label for="force">Входная сила F₁: <span id="force-label">20</span> Н</label><input id="force" type="range" min="10" max="100" step="10" value="20"><label for="stroke">Ход малого поршня s₁: <span id="stroke-label">10</span> см</label><input id="stroke" type="range" min="1" max="20" step="1" value="10"><figure><div id="model-svg"></div><figcaption>Ширина цилиндров условная. Читай численные площади; положение поршней не изображает реальный ход.</figcaption></figure><div id="calculation" class="feedback good" role="status" aria-live="polite"></div><p class="muted">Модель рассчитывает согласованные входное и выходное воздействия при квазистатическом движении. Она не предсказывает разгон, прочность и реальную грузоподъёмность устройства.</p></section>${nav()}`;document.getElementById('back').onclick=home;const a=document.getElementById('s1'),b=document.getElementById('s2'),f=document.getElementById('force'),s=document.getElementById('stroke');function fmt(n){return String(Math.round(n*1000000)/1000000).replace('.',',')}function draw(){let S1=Number(a.value),S2=Number(b.value),F1=Number(f.value),d1=Number(s.value),ratio=S2/S1,F2=F1*ratio,d2=d1/ratio,dp=F1/(S1*.0001),A1=F1*d1/100,A2=F2*d2/100,V=S1*d1;document.getElementById('force-label').textContent=fmt(F1);document.getElementById('stroke-label').textContent=fmt(d1);document.getElementById('model-svg').innerHTML=`<svg viewBox="0 0 600 300" role="img" aria-label="Схема двух поршней: площади ${S1} и ${S2} квадратных сантиметров" xmlns="http://www.w3.org/2000/svg"><rect width="600" height="300" rx="16" fill="#eef7fa"/><path d="M70 90V240H530V90M150 90V190H330V90" fill="none" stroke="#31566c" stroke-width="5"/><path d="M74 130H146V194H334V130H526V236H74Z" fill="#b8e1f2"/><path d="M72 128H148M332 128H528" stroke="#8298a5" stroke-width="10"/><text x="110" y="52" text-anchor="middle" font-size="20" font-family="Arial" fill="#173449">F₁ = ${fmt(F1)} Н ↓</text><text x="430" y="52" text-anchor="middle" font-size="20" font-family="Arial" fill="#173449">F₂ = ${fmt(F2)} Н ↑</text><text x="110" y="90" text-anchor="middle" font-size="18" font-family="Arial" fill="#173449">S₁ = ${S1} см²</text><text x="430" y="90" text-anchor="middle" font-size="18" font-family="Arial" fill="#173449">S₂ = ${S2} см²</text><text x="300" y="280" text-anchor="middle" font-size="19" font-family="Arial" fill="#173449">Силы ×${fmt(ratio)}, ход ÷${fmt(ratio)}</text></svg>`;document.getElementById('calculation').textContent='Отношение площадей: '+fmt(ratio)+'. F₂ = '+fmt(F2)+' Н. Ход большого s₂ = '+fmt(d2)+' см. Прибавка давления: '+fmt(dp)+' Па. Перемещённый объём: '+fmt(V)+' см³. Входная работа: '+fmt(A1)+' Дж; выходная работа: '+fmt(A2)+' Дж.'}a.onchange=draw;b.onchange=draw;f.oninput=draw;s.oninput=draw;draw();window.scrollTo(0,0)}
function parse(value){let s=value.trim().replace(',','.');return /^\d+(?:\.\d+)?$/.test(s)?Number(s):null}
function task(i){let t=TASKS[i],solved=false,helped=false,h=0;app.innerHTML=`<button id="back">← К списку задач</button><section class="card" style="margin-top:18px"><span class="tag">Задача ${i+1} из 12 · ${t.level}</span><h2>${t.title}</h2><p>${t.q}</p><p class="muted">Если не сказано другое: идеальная схема, без утечек, трения, инерции и значимого гидростатического перепада; внешнее давление одинаково.</p>${t.type==='number'?'<form id="answer-form" novalidate><label for="answer">Ответ, '+t.unit+'</label><input id="answer" type="text" inputmode="decimal" autocomplete="off" aria-describedby="note"><p id="note" class="muted">Только число. Запятая и точка принимаются одинаково.</p><button id="check" class="primary" type="submit">Проверить</button></form>':'<div id="choices"></div>'}<button id="hint">Подсказка</button><div id="feedback" role="status" aria-live="polite" hidden></div><div id="hint-text" class="feedback hint" role="status" hidden></div><details id="solution" hidden><summary>Открыть разбор</summary><p>${t.solution}</p></details><button id="next" class="primary" hidden>${i<TASKS.length-1?'Следующая задача →':'Завершить тренажёр'}</button><button id="memo">Вернуться к объяснению</button><div id="storage-status"></div></section>`;document.getElementById('back').onclick=home;document.getElementById('memo').onclick=memo;let fb=document.getElementById('feedback');function message(s,ok){fb.hidden=false;fb.className='feedback '+(ok?'good':'hint');fb.textContent=s}function verify(value){if(solved)return;if(value===null||!Number.isFinite(value)){message('Введи число, например 20 или 0,5.',false);return}if(Math.abs(value-t.answer)>1e-8){helped=true;message('Пока не совпало. Проверь отношение площадей, единицы и то, что требуется найти.',false);return}solved=true;if(!state.done.includes(t.id))state.done.push(t.id);if(helped&&!state.help.includes(t.id))state.help.push(t.id);save();message('Верно! '+t.solution,true);if(t.type==='number'){document.getElementById('answer').disabled=true;document.getElementById('check').disabled=true}else document.getElementById('choices').querySelectorAll('button').forEach(b=>b.disabled=true);document.getElementById('hint').hidden=true;document.getElementById('next').hidden=false;document.getElementById('storage-status').innerHTML=notice()}
if(t.type==='number')document.getElementById('answer-form').onsubmit=e=>{e.preventDefault();verify(parse(document.getElementById('answer').value))};else{let box=document.getElementById('choices');t.options.forEach((s,k)=>{let b=document.createElement('button');b.textContent=s;b.onclick=()=>verify(k);box.appendChild(b)})}document.getElementById('hint').onclick=function(){helped=true;let box=document.getElementById('hint-text');box.hidden=false;box.textContent=t.hints[Math.min(h,t.hints.length-1)];h++;this.textContent='Ещё подсказка';if(h>=t.hints.length){this.disabled=true;this.textContent='Подсказки открыты';document.getElementById('solution').hidden=false}};document.getElementById('solution').ontoggle=function(){if(this.open)helped=true};document.getElementById('next').onclick=()=>i<TASKS.length-1?task(i+1):home();window.scrollTo(0,0)}
try{home()}catch(e){app.innerHTML='<section class="card"><h2>Не удалось открыть тренажёр</h2><pre id="error"></pre></section>';document.getElementById('error').textContent=String(e.message||e)}
})();
</script></body></html>
