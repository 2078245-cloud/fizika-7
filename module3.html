<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142638"><title>Силы и взаимодействие тел</title><style>*{box-sizing:border-box}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}body{margin:0;background:#eef3f7;color:#172c3e;font:18px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow-wrap:anywhere}.wrap{max-width:900px;margin:auto}header{background:linear-gradient(130deg,#142638,#21564f);color:white;padding:32px 20px}header p{color:#dce9f1}h1{font-size:clamp(29px,7vw,43px);line-height:1.25}h2{font-size:26px;line-height:1.35;margin-top:0}h3{font-size:21px}main{padding:24px 15px}.card{background:white;border:1px solid #dce5ed;border-radius:19px;padding:24px;margin-bottom:20px}p{margin:0 0 16px}.muted,figcaption{font-size:15px;color:#526879}.tag{display:inline-block;background:#e5f6ef;color:#176344;border-radius:22px;padding:5px 12px;font-size:14px;margin-bottom:14px}button,.link{display:block;width:100%;padding:14px;margin-top:12px;min-height:50px;border:2px solid #dce5ed;border-radius:13px;color:#172c3e;background:#f7fafc;text-decoration:none;text-align:left;font:inherit;line-height:1.5;cursor:pointer;touch-action:manipulation}.primary{background:#237f62;border-color:#237f62;color:white;text-align:center}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #237f62;outline-offset:3px}button:disabled,input:disabled{opacity:.7;cursor:default}input{width:100%;padding:14px;border:2px solid #bdced9;border-radius:12px;font:inherit;font-size:21px}.feedback{padding:16px;border-radius:12px;margin-top:16px}.good{background:#e5f6ef;color:#15583e}.hint{background:#fff3d8;color:#704d10}figure{margin:0}svg{display:block;width:100%;height:auto;max-width:650px;margin:auto}figcaption{margin-top:10px}.flow{padding-left:25px}.flow li{padding:10px;margin:12px 0;background:#eef7fa;border-radius:10px}.bar{height:10px;background:#e5edf2;border-radius:10px;overflow:hidden;margin:16px 0}.bar div{height:100%;background:#237f62}footer{padding:0 20px 28px;text-align:center;font-size:14px;color:#526879}a{color:#176344}summary{cursor:pointer}.nav{display:flex;gap:10px;flex-wrap:wrap}.nav a{flex:1;min-width:180px}@media(max-width:480px){.card{padding:18px}body{font-size:17px}}</style></head><body><header><div class="wrap"><p>ФИЗИКА · 7 КЛАСС</p><h1>Силы и взаимодействие тел</h1><p>Тяжесть, упругость, вес, равнодействующая и трение</p></div></header><main id="app" class="wrap"><section class="card"><h2>Загрузка…</h2></section></main><noscript>Для задач нужен JavaScript.</noscript><footer>Модуль 3 · Версия 1.0</footer><script>
(function(){'use strict';
const LESSONS=[{"id": "gravity", "title": "Сила и тяготение", "intro": "Рюкзак в походе и коробка со снастями", "parts": [["1. Что описывает сила?", "<p>Сила — мера взаимодействия тел. Взаимодействие может изменить скорость по величине или направлению, а также форму тела.<\/p><p>Для силы важны величина, направление и точка приложения. На рисунке силу показывают стрелкой. Единица силы — ньютон, Н.<\/p>"], ["2. Сила тяжести", "<p>Земля притягивает тела. Вблизи поверхности Земли силу тяжести рассчитывают: <strong>Fтяж = m × g<\/strong>.<\/p><p>m — масса в килограммах, g — коэффициент. В задачах этого модуля принимаем g = 10 Н/кг, если не сказано другое. Это школьное приближение.<\/p><p>Для рюкзака 2 кг получаем 2 × 10 = 20 Н. 2 кг — масса, а 20 Н — сила. Тяжесть действует и на неподвижный предмет.<\/p>"], ["3. Не забывай единицы", "<p>Перед подстановкой переведи граммы в килограммы: 300 г = 0,3 кг. Тогда Fтяж = 0,3 × 10 = 3 Н.<\/p><p>Игровые характеристики не заменяют условия задачи. Все числа в наших сюжетах — учебные.<\/p>"]], "diagrams": [{"svg": "<svg viewBox=\"0 0 600 300\" role=\"img\" aria-label=\"На рюкзак массой два килограмма действует сила тяжести вниз 20 ньютонов при g равном 10 Н/кг\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"300\" rx=\"16\" fill=\"#eef7fa\"/><rect x=\"220\" y=\"95\" width=\"160\" height=\"70\" rx=\"12\" fill=\"#f5c876\"/><text x=\"300\" y=\"75\" text-anchor=\"middle\" font-size=\"23\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Рюкзак: m = 2 кг<\/text><path d=\"M300 130L300 240M292.80861692093697 226.8362615716444L300 240L307.19138307906303 226.8362615716444\" fill=\"none\" stroke=\"#ba5a34\" stroke-width=\"4\"/><text x=\"440\" y=\"205\" text-anchor=\"middle\" font-size=\"22\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Fтяж = 20 Н<\/text><text x=\"300\" y=\"280\" text-anchor=\"middle\" font-size=\"16\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Показана только сила тяжести<\/text><\/svg>", "caption": "Это схема одной силы. Она не означает, что на поддерживаемый рюкзак не действуют другие силы."}], "flow": ["Назови тело, на которое действует тяжесть", "Запиши массу в кг", "Возьми заданное g", "Умножь m на g", "Запиши ответ в ньютонах"], "activity": "Нарисуй коробку с безопасными принадлежностями. Покажи стрелкой тяжесть вниз. Крючки, свинцовые грузила и реальные тяжёлые предметы не нужны.", "tasks": [{"id": "g1", "title": "Рюкзак", "q": "Масса рюкзака 3 кг. Найди силу тяжести при g = 10 Н/кг.", "type": "number", "answer": 30, "unit": "Н", "hint": "Умножь 3 кг на 10 Н/кг.", "solution": "Fтяж = 3 × 10 = 30 Н.", "extra": false}, {"id": "g2", "title": "Маленькая модель", "q": "Масса модели 300 г. Найди тяжесть при g = 10 Н/кг.", "type": "number", "answer": 3, "unit": "Н", "hint": "300 г = 0,3 кг. Теперь умножь на 10.", "solution": "Fтяж = 0,3 × 10 = 3 Н.", "extra": false}, {"id": "g3", "title": "Коробка", "q": "Масса коробки 250 г. Найди тяжесть при g = 10 Н/кг.", "type": "number", "answer": 2.5, "unit": "Н", "hint": "250 г = 0,25 кг.", "solution": "Fтяж = 0,25 × 10 = 2,5 Н.", "extra": false}, {"id": "g4", "title": "Сила или масса?", "q": "Какая запись выражает силу?", "type": "choice", "options": ["20 Н", "20 кг", "20 секунд"], "answer": 0, "hint": "Ньютон — единица силы, килограмм — массы.", "solution": "20 Н — сила.", "extra": false}]}, {"id": "elastic", "title": "Упругость, деформация и вес", "intro": "Пластилин, пружина и LEGO-модель на столе", "parts": [["1. Упругая и пластическая деформация", "<p>Деформация — изменение формы или размеров. При упругой деформации тело возвращается к исходной форме после снятия нагрузки. Пластическая сохраняется.<\/p><p>Пластилин удобен для наблюдения пластической деформации. Пружину можно использовать как пример упругой, но лишь в допустимых пределах нагрузки.<\/p>"], ["2. Длина и удлинение — разные величины", "<p>Удлинение: Δl = l − l₀. Если пружина была 10 см, а стала 12 см, удлинение 2 см, не 12.<\/p><p>Для подходящей пружины в пределах пропорциональности действует закон Гука: <strong>Fупр = k × Δl<\/strong>. k — жёсткость в Н/м, Δl — удлинение в метрах.<\/p><p>Пример: k = 100 Н/м, Δl = 0,01 м. Сила упругости 1 Н. За пределом пропорциональности формула уже не обязана работать, даже если пружина ещё возвращается к исходной длине.<\/p><p class=\"muted\">Расчёт по закону Гука помечен как расширение: его обязательность нужно сверить с вашим школьным учебником.<\/p>"], ["3. Вес и тяжесть: к чему приложена сила?", "<p>Сила тяжести — действие Земли на тело. Вес — сила, с которой тело действует на опору или подвес.<\/p><p>У спокойно лежащего на горизонтальном столе предмета без других вертикальных воздействий P = mg. Численные значения совпадают, но силы приложены к разным телам: тяжесть — к предмету, вес — к столу.<\/p><p>При свободном падении без сопротивления воздуха вес может быть нулевым, но сила тяжести не исчезает. Это мысленная ситуация, не задание бросать предметы или прыгать.<\/p>"]], "diagrams": [{"svg": "<svg viewBox=\"0 0 600 300\" role=\"img\" aria-label=\"Ненагруженная и нагруженная пружины: удлинение равно разности длин\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"300\" rx=\"16\" fill=\"#eef7fa\"/><path d=\"M55 50H240M355 50H540\" stroke=\"#31566c\" stroke-width=\"7\"/><path d=\"M145 50v20l-18 10 36 10-36 10 36 10-36 10 18 10v20\" fill=\"none\" stroke=\"#237f62\" stroke-width=\"4\"/><path d=\"M445 50v20l-18 18 36 18-36 18 36 18-36 18 18 18v22\" fill=\"none\" stroke=\"#237f62\" stroke-width=\"4\"/><rect x=\"412\" y=\"201\" width=\"66\" height=\"40\" rx=\"7\" fill=\"#f5c876\"/><text x=\"150\" y=\"190\" text-anchor=\"middle\" font-size=\"18\" fill=\"#173449\" font-family=\"Arial,sans-serif\">l₀ = 10 см<\/text><text x=\"450\" y=\"270\" text-anchor=\"middle\" font-size=\"18\" fill=\"#173449\" font-family=\"Arial,sans-serif\">l = 12 см<\/text><text x=\"300\" y=\"28\" text-anchor=\"middle\" font-size=\"21\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Удлинение: Δl = 12 − 10 = 2 см<\/text><\/svg>", "caption": "Сравниваются две длины одной пружины. Не измеряй их по экрану: используй подписи."}, {"svg": "<svg viewBox=\"0 0 600 300\" role=\"img\" aria-label=\"Разные схемы: сила тяжести приложена к предмету, вес к столу. Это не полный набор сил на одном теле\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"300\" rx=\"16\" fill=\"#eef7fa\"/><path d=\"M35 170h230M335 170h230\" stroke=\"#31566c\" stroke-width=\"8\"/><rect x=\"100\" y=\"105\" width=\"100\" height=\"60\" rx=\"8\" fill=\"#f5c876\"/><rect x=\"400\" y=\"105\" width=\"100\" height=\"60\" rx=\"8\" fill=\"#f5c876\"/><path d=\"M150 135L150 235M142.80861692093694 221.8362615716444L150 235L157.19138307906303 221.8362615716444\" fill=\"none\" stroke=\"#ba5a34\" stroke-width=\"4\"/><path d=\"M450 170L450 265M442.80861692093697 251.8362615716444L450 265L457.19138307906303 251.8362615716444\" fill=\"none\" stroke=\"#237f62\" stroke-width=\"4\"/><text x=\"150\" y=\"42\" text-anchor=\"middle\" font-size=\"18\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Действие Земли<\/text><text x=\"150\" y=\"70\" text-anchor=\"middle\" font-size=\"18\" fill=\"#173449\" font-family=\"Arial,sans-serif\">на предмет<\/text><text x=\"450\" y=\"42\" text-anchor=\"middle\" font-size=\"18\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Действие предмета<\/text><text x=\"450\" y=\"70\" text-anchor=\"middle\" font-size=\"18\" fill=\"#173449\" font-family=\"Arial,sans-serif\">на стол<\/text><text x=\"150\" y=\"280\" text-anchor=\"middle\" font-size=\"17\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Сила тяжести<\/text><text x=\"450\" y=\"290\" text-anchor=\"middle\" font-size=\"17\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Вес<\/text><\/svg>", "caption": "Две отдельные схемы взаимодействий, не общий рисунок всех сил. Опора также действует на предмет, но эта сила здесь не показана."}], "flow": ["Назови, кто на кого действует", "Различи материал и вид деформации", "Для пружины найди Δl = l − l₀", "Для веса проверь условия равновесия", "Не путай кг и Н"], "activity": "Сомни небольшой кусочек пластилина и опиши, сохранилась ли форма. Не растягивай резинки у лица и не нагружай неизвестные пружины.", "tasks": [{"id": "e1", "title": "Удлинение", "q": "Пружина имела длину 12 см, а после нагрузки — 15 см. Найди удлинение.", "type": "number", "answer": 3, "unit": "см", "hint": "Вычти начальную длину из конечной.", "solution": "Δl = 15 − 12 = 3 см.", "extra": false}, {"id": "e2", "title": "Закон Гука — расширение", "q": "Пружина подчиняется закону Гука: k = 100 Н/м, удлинение 2 см. Найди силу упругости.", "type": "number", "answer": 2, "unit": "Н", "hint": "Переведи 2 см в 0,02 м. Умножь k на удлинение.", "solution": "Fупр = 100 × 0,02 = 2 Н.", "extra": true}, {"id": "e3", "title": "Куда приложен вес?", "q": "Предмет спокойно лежит на столе. К чему приложен его вес?", "type": "choice", "options": ["К столу: это действие предмета на опору", "К самому предмету: это действие Земли"], "answer": 0, "hint": "В определении веса речь идёт о действии тела на опору.", "solution": "Вес приложен к столу. Сила тяжести приложена к предмету.", "extra": false}, {"id": "e4", "title": "Невесомость", "q": "В идеальном свободном падении вес стал нулевым. Что с силой тяжести?", "type": "choice", "options": ["Она тоже обязательно исчезла", "Она продолжает действовать"], "answer": 1, "hint": "Невесомость не означает отсутствие притяжения Земли.", "solution": "Тяжесть продолжает действовать, а давление на опору или натяжение подвеса могут отсутствовать.", "extra": false}]}, {"id": "resultant", "title": "Равнодействующая и трение", "intro": "LEGO-тележка и условная буксировка", "parts": [["1. Силы вдоль одной прямой", "<p>Силы в одну сторону складываем. Противоположные — вычитаем: из большей величины меньшую. Направление результата совпадает с большей силой.<\/p><p>Например, 8 Н вправо и 5 Н влево дают 3 Н вправо. Одного числа без направления для полного описания недостаточно.<\/p>"], ["2. Нулевая равнодействующая не означает отсутствие сил", "<p>При равномерном прямолинейном движении равнодействующая сил равна нулю. Тяга может быть уравновешена сопротивлением.<\/p><p>Нулевой результат не означает, что тело обязательно стоит. Оно может двигаться с постоянной скоростью по прямой. Вращение и сложные схемы здесь не рассматриваем.<\/p>"], ["3. Что делает трение?", "<p>Трение покоя препятствует началу относительного скольжения. Трение скольжения действует при скольжении поверхностей друг относительно друга.<\/p><p>Не говори, что трение всегда направлено против движения всего предмета: при ходьбе трение со стороны земли может помогать двигаться вперёд. В простой задаче о скользящем бруске оно направлено против скольжения.<\/p><p>Для сухих твёрдых поверхностей простейшая модель связывает трение с прижимающей силой. Нельзя без проверки переносить эту модель на липкие материалы, мягкий грунт или пластилин.<\/p><p>Колёса часто уменьшают сопротивление по сравнению со скольжением, но не убирают его полностью.<\/p>"]], "diagrams": [{"svg": "<svg viewBox=\"0 0 600 300\" role=\"img\" aria-label=\"Две горизонтальные силы 8 ньютонов вправо и 5 влево, результирующая 3 ньютона вправо\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"300\" rx=\"16\" fill=\"#eef7fa\"/><rect x=\"245\" y=\"110\" width=\"110\" height=\"70\" rx=\"10\" fill=\"#a9dbf0\"/><path d=\"M300 135L500 135M486.8362615716444 142.19138307906306L500 135L486.8362615716444 127.80861692093696\" fill=\"none\" stroke=\"#237f62\" stroke-width=\"4\"/><path d=\"M300 155L175 155M188.1637384283556 147.80861692093694L175 155L188.1637384283556 162.19138307906303\" fill=\"none\" stroke=\"#ba5a34\" stroke-width=\"4\"/><text x=\"445\" y=\"100\" text-anchor=\"middle\" font-size=\"18\" fill=\"#173449\" font-family=\"Arial,sans-serif\">8 Н вправо<\/text><text x=\"155\" y=\"205\" text-anchor=\"middle\" font-size=\"18\" fill=\"#173449\" font-family=\"Arial,sans-serif\">5 Н влево<\/text><path d=\"M235 250L365 250M351.8362615716444 257.19138307906303L365 250L351.8362615716444 242.80861692093694\" fill=\"none\" stroke=\"#237f62\" stroke-width=\"4\"/><text x=\"300\" y=\"285\" text-anchor=\"middle\" font-size=\"20\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Результат: 3 Н вправо<\/text><\/svg>", "caption": "Для этой задачи силы лежат вдоль одной прямой. Стрелки на одном теле направлены противоположно."}, {"svg": "<svg viewBox=\"0 0 600 300\" role=\"img\" aria-label=\"Равномерно движущаяся тележка: тяга и сопротивление уравновешены. Показаны только горизонтальные силы\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"300\" rx=\"16\" fill=\"#eef7fa\"/><path d=\"M40 180H560\" stroke=\"#31566c\" stroke-width=\"5\"/><rect x=\"220\" y=\"105\" width=\"160\" height=\"70\" rx=\"12\" fill=\"#f5c876\"/><path d=\"M300 130L490 130M476.8362615716444 137.19138307906306L490 130L476.8362615716444 122.80861692093696\" fill=\"none\" stroke=\"#237f62\" stroke-width=\"4\"/><path d=\"M300 160L110 160M123.16373842835559 152.80861692093694L110 160L123.16373842835559 167.19138307906303\" fill=\"none\" stroke=\"#ba5a34\" stroke-width=\"4\"/><text x=\"460\" y=\"90\" text-anchor=\"middle\" font-size=\"18\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Тяга: 7 Н<\/text><text x=\"135\" y=\"220\" text-anchor=\"middle\" font-size=\"18\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Сопротивление: 7 Н<\/text><text x=\"300\" y=\"265\" text-anchor=\"middle\" font-size=\"20\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Равномерно и прямолинейно: R = 0<\/text><\/svg>", "caption": "Схема только горизонтальных сил. Вертикальные силы здесь не показаны."}], "flow": ["Выбери одно тело", "Укажи направления сил", "Для одинаковых направлений сложи", "Для противоположных — вычти", "Назови направление результата", "При R = 0 не делай вывод, что движение невозможно"], "activity": "Рассмотри лёгкую LEGO-тележку на ровном столе. Объясни словами, какие взаимодействия могут тормозить её. Не устраивай заездов на улице и не используй настоящие лебёдки.", "tasks": [{"id": "r1", "title": "Противоположные силы", "q": "На модель действуют 8 Н вправо и 5 Н влево. Найди величину равнодействующей. Направление затем назови вслух.", "type": "number", "answer": 3, "unit": "Н", "hint": "Силы противоположны: вычти меньшую из большей.", "solution": "R = 8 − 5 = 3 Н вправо.", "extra": false}, {"id": "r2", "title": "Тянут вместе", "q": "Две силы 4 Н и 6 Н направлены вдоль одной прямой вправо. Найди величину равнодействующей.", "type": "number", "answer": 10, "unit": "Н", "hint": "Одинаково направленные силы складывают.", "solution": "R = 4 + 6 = 10 Н вправо.", "extra": false}, {"id": "r3", "title": "Равномерная тяга", "q": "Тележку тянут горизонтально с силой 7 Н. Она движется равномерно и прямолинейно. Других горизонтальных сил, кроме тяги и сопротивления, нет. Найди силу сопротивления.", "type": "number", "answer": 7, "unit": "Н", "hint": "Для такого движения горизонтальные силы уравновешены.", "solution": "Сопротивление равно 7 Н и направлено против движения.", "extra": false}, {"id": "r4", "title": "Можно ли двигаться?", "q": "Равнодействующая сил равна нулю. Какое утверждение верно?", "type": "choice", "options": ["Тело обязательно неподвижно", "Тело может покоиться или двигаться равномерно по прямой"], "answer": 1, "hint": "Уравновешенные силы не обязаны останавливать тело.", "solution": "Возможны и покой, и равномерное прямолинейное движение.", "extra": false}]}],KEY='fizika7-module3-v1',app=document.getElementById('app');
const ALL=LESSONS.flatMap(l=>l.tasks);let failed=false;
function load(){try{let p=JSON.parse(localStorage.getItem(KEY));let ids=new Set(ALL.map(t=>t.id));return{done:p&&Array.isArray(p.done)?[...new Set(p.done.filter(id=>ids.has(id)))]:[],help:p&&Array.isArray(p.help)?p.help.filter(id=>ids.has(id)):[]}}catch(e){return{done:[],help:[]}}}
let state=load();function save(){try{localStorage.setItem(KEY,JSON.stringify(state));failed=false}catch(e){failed=true}}
function notice(){return failed?'<p class="feedback hint" role="status">Не удалось сохранить прогресс в браузере. Задания остаются доступны.</p>':''}
function nav(){return '<nav class="nav" aria-label="Разделы"><a class="link" href="./start.html">Общее меню</a><a class="link" href="./module2.html">Модуль 2</a><a class="link" href="./index.html">Вводные занятия и модуль 1</a></nav>'}
function home(){let basicDone=ALL.filter(t=>!t.extra&&state.done.includes(t.id)).length;app.innerHTML=`<section class="card"><span class="tag">Модуль 3 · Версия 1.0</span><h2>Силы и взаимодействие тел</h2><p>Три урока, 11 основных заданий и одно задание расширения. В расчётах принимаем g = 10 Н/кг, если не сказано иное.</p><div class="bar" role="progressbar" aria-label="Основные задания" aria-valuemin="0" aria-valuemax="11" aria-valuenow="${basicDone}"><div style="width:${basicDone/11*100}%"></div></div><p class="muted">Основные задания: ${basicDone} из 11. Всего выполнено ${state.done.length} из 12. Это не школьная оценка.</p><div id="lesson-list"></div>${notice()}</section><section class="card"><h2>Сначала смысл, потом вычисление</h2><p>Перед формулой назови, кто на кого действует. Стрелки сил должны относиться к выбранному телу. Не складывай силы, приложенные к разным телам.</p><p class="muted">Рисунки условные и могут показывать только выбранные силы. Не используй настоящие лебёдки, тяжёлые грузы и натянутые у лица резинки.</p></section>${nav()}<details class="card" style="margin-top:20px"><summary>Источники и сохранение</summary><p class="muted">Темы исходного курса 7 класса. <a href="https://www.bbc.co.uk/bitesize/articles/zv4jdp3" target="_blank" rel="noopener noreferrer">Пружины и закон Гука</a>; <a href="https://www.bbc.co.uk/bitesize/articles/zhnfp4j" target="_blank" rel="noopener noreferrer">Схемы сил</a>. В этом русскоязычном курсе вес и сила тяжести различаются по телу приложения; английское weight нередко обозначает гравитационную силу.</p><p class="muted">Прогресс только в этом браузере; очистка данных может удалить его. Между устройствами автоматически не переносится. Обязательность формул и задач расширения сверяется с учителем.</p></details>`;let list=document.getElementById('lesson-list');LESSONS.forEach((l,i)=>{let b=document.createElement('button');b.textContent=(i+1)+'. '+l.title+' — '+l.tasks.filter(t=>state.done.includes(t.id)).length+'/'+l.tasks.length;b.onclick=()=>lesson(i);list.appendChild(b)});window.scrollTo(0,0)}
function lesson(i){let l=LESSONS[i];app.innerHTML=`<button id="back">← К урокам модуля</button><section class="card" style="margin-top:18px"><span class="tag">Урок ${i+1} из 3</span><h2>${l.title}</h2><p class="muted">${l.intro}</p>${l.parts.map(p=>'<h3>'+p[0]+'</h3>'+p[1]).join('')}</section>${l.diagrams.map(d=>'<section class="card"><h2>Посмотри на схему</h2><figure>'+d.svg+'<figcaption>'+d.caption+'</figcaption></figure></section>').join('')}<section class="card"><h2>Пройди по шагам</h2><ol class="flow">${l.flow.map(s=>'<li>'+s+'</li>').join('')}</ol></section><section class="card"><h2>Самостоятельные задачи</h2><div id="tasks"></div></section><section class="card"><h2>Попробуй вне экрана</h2><p>${l.activity}</p></section>${nav()}`;document.getElementById('back').onclick=home;let list=document.getElementById('tasks');l.tasks.forEach((t,k)=>{let b=document.createElement('button');b.textContent=(k+1)+'. '+t.title+(t.extra?' (необязательно)':'')+(state.done.includes(t.id)?(state.help.includes(t.id)?' — с помощью':' — выполнено'):'');b.onclick=()=>task(i,k);list.appendChild(b)});window.scrollTo(0,0)}
function parse(value){let s=value.trim().replace(',','.');return /^\d+(?:\.\d+)?$/.test(s)?Number(s):null}
function task(li,ti){let l=LESSONS[li],t=l.tasks[ti],solved=false,helped=false;app.innerHTML=`<button id="lesson-back">← К объяснению урока</button><section class="card" style="margin-top:18px"><span class="tag">Задача ${ti+1} из ${l.tasks.length}${t.extra?' · расширение':''}</span><h2>${t.title}</h2><p>${t.q}</p>${t.type==='number'?'<form id="answer-form" novalidate><label for="answer">Ответ, '+t.unit+'</label><input id="answer" type="text" inputmode="decimal" autocomplete="off" aria-describedby="note"><p class="muted" id="note">Только число. Запятая и точка принимаются одинаково.</p><button id="check" type="submit" class="primary">Проверить</button></form>':'<div id="choices"></div>'}<button id="hint">Подсказка</button><div id="feedback" role="status" aria-live="polite" hidden></div><div id="hint-text" role="status" class="feedback hint" hidden></div><details id="solution" hidden><summary>Открыть разбор</summary><p>${t.solution}</p></details><button id="next" class="primary" hidden>${ti<l.tasks.length-1?'Следующая задача →':li<LESSONS.length-1?'Следующий урок →':'К меню модуля'}</button>${t.extra?'<button id="skip">Пропустить необязательное задание</button>':''}<div id="storage-status"></div></section>`;document.getElementById('lesson-back').onclick=()=>lesson(li);function advance(){if(ti<l.tasks.length-1)task(li,ti+1);else if(li<LESSONS.length-1)lesson(li+1);else home()}if(t.extra)document.getElementById('skip').onclick=advance;let fb=document.getElementById('feedback');function message(s,ok){fb.hidden=false;fb.className='feedback '+(ok?'good':'hint');fb.textContent=s}function verify(value){if(solved)return;if(value===null||!Number.isFinite(value)){message('Введи число, например 3 или 2,5.',false);return}if(Math.abs(value-t.answer)>1e-8){helped=true;message('Пока не совпало. Вернись к схеме или открой подсказку.',false);return}solved=true;if(!state.done.includes(t.id))state.done.push(t.id);if(helped&&!state.help.includes(t.id))state.help.push(t.id);save();message('Верно! '+t.solution,true);if(t.type==='number'){document.getElementById('answer').disabled=true;document.getElementById('check').disabled=true}else document.getElementById('choices').querySelectorAll('button').forEach(b=>b.disabled=true);document.getElementById('hint').hidden=true;document.getElementById('next').hidden=false;if(t.extra)document.getElementById('skip').hidden=true;document.getElementById('storage-status').innerHTML=notice()}
if(t.type==='number')document.getElementById('answer-form').onsubmit=e=>{e.preventDefault();verify(parse(document.getElementById('answer').value))};else{let box=document.getElementById('choices');t.options.forEach((s,i)=>{let b=document.createElement('button');b.textContent=s;b.onclick=()=>verify(i);box.appendChild(b)})}document.getElementById('hint').onclick=function(){helped=true;let box=document.getElementById('hint-text');box.hidden=false;box.textContent=t.hint;document.getElementById('solution').hidden=false;this.hidden=true};document.getElementById('solution').ontoggle=function(){if(this.open)helped=true};document.getElementById('next').onclick=advance;window.scrollTo(0,0)}
try{home()}catch(e){app.innerHTML='<section class="card"><h2>Не удалось открыть модуль</h2><pre id="error"></pre></section>';document.getElementById('error').textContent=String(e.message||e)}
})();
</script></body></html>
