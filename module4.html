<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142638"><title>Давление твёрдых тел, жидкостей и газов</title><style>*{box-sizing:border-box}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}body{margin:0;background:#eef3f7;color:#172c3e;font:18px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow-wrap:anywhere}.wrap{max-width:900px;margin:auto}header{padding:32px 20px;background:linear-gradient(130deg,#142638,#21564f);color:white}header p{color:#dce9f1}h1{font-size:clamp(29px,7vw,43px);line-height:1.25}h2{font-size:26px;line-height:1.35;margin-top:0}h3{font-size:21px}main{padding:24px 15px}.card{background:white;border:1px solid #dce5ed;border-radius:19px;padding:24px;margin-bottom:20px}p{margin:0 0 16px}.muted,figcaption{font-size:15px;color:#526879}.tag{display:inline-block;background:#e5f6ef;color:#176344;border-radius:22px;padding:5px 12px;font-size:14px;margin-bottom:14px}button,.link{display:block;width:100%;padding:14px;margin-top:12px;min-height:50px;border:2px solid #dce5ed;border-radius:13px;color:#172c3e;background:#f7fafc;text-decoration:none;text-align:left;font:inherit;line-height:1.5;cursor:pointer;touch-action:manipulation}.primary{background:#237f62;border-color:#237f62;color:white;text-align:center}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #237f62;outline-offset:3px}button:disabled,input:disabled{opacity:.7;cursor:default}input{width:100%;padding:14px;border:2px solid #bdced9;border-radius:12px;font:inherit;font-size:21px}.feedback{padding:16px;border-radius:12px;margin-top:16px}.good{background:#e5f6ef;color:#15583e}.hint{background:#fff3d8;color:#704d10}figure{margin:0}svg{display:block;width:100%;height:auto;max-width:650px;margin:auto}figcaption{margin-top:10px}.flow{padding-left:25px}.flow li{padding:10px;margin:12px 0;background:#eef7fa;border-radius:10px}.bar{height:10px;background:#e5edf2;border-radius:10px;overflow:hidden;margin:16px 0}.bar div{height:100%;background:#237f62}footer{padding:0 20px 28px;text-align:center;font-size:14px;color:#526879}a{color:#176344}summary{cursor:pointer}.nav{display:flex;gap:10px;flex-wrap:wrap}.nav a{flex:1;min-width:180px}@media(max-width:480px){.card{padding:18px}body{font-size:17px}}</style></head><body><header><div class="wrap"><p>ФИЗИКА · 7 КЛАСС</p><h1>Давление твёрдых тел, жидкостей и газов</h1><p>От снегоступов до гидравлического подъёмника</p></div></header><main id="app" class="wrap"><section class="card"><h2>Загрузка…</h2></section></main><footer>Модуль 4 · Версия 1.0</footer><noscript>Для заданий нужен JavaScript.</noscript><script>
(function(){'use strict';
const DATA=[{"title": "Давление твёрдых тел", "sub": "Гусеницы, снегоступы и LEGO-опоры", "parts": [["1. Почему широкая опора помогает?", "<p>Одна и та же сила может распределяться по разной площади. Давление показывает силу, приходящуюся на единицу площади: <strong>p = F ÷ S<\/strong>.<\/p><p>F — сила, перпендикулярная поверхности, S — площадь опоры. Давление в СИ измеряют в паскалях: 1 Па = 1 Н/м².<\/p><p>При той же силе увеличение площади уменьшает среднее давление. Это объясняет одну из причин применения снегоступов и широких гусениц. Реальная проходимость зависит также от грунта, сцепления и конструкции.<\/p>"], ["2. Подготовь данные", "<p>Если дана масса спокойно стоящей на горизонтальной опоре модели без дополнительных вертикальных воздействий, сила давления равна mg. При m = 2 кг и g = 10 Н/кг получаем F = 20 Н.<\/p><p>При площади 0,01 м²: p = 20 ÷ 0,01 = 2000 Па. Для нескольких опор складывают их площади; в задаче с двумя гусеницами учитывают обе.<\/p>"], ["3. Квадратные единицы", "<p>1 м = 100 см, поэтому 1 м² = 100 × 100 = 10 000 см². Для перевода см² в м² делят на 10 000, а не на 100.<\/p><p>Например, 20 см² = 0,002 м². 1 кПа = 1000 Па.<\/p>"]], "diagrams": [{"svg": "<svg viewBox=\"0 0 600 300\" role=\"img\" aria-label=\"Две опоры с одинаковой силой и разной площадью: широкая опора уменьшает среднее давление\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"300\" rx=\"16\" fill=\"#eef7fa\"/><path d=\"M30 205H570\" stroke=\"#31566c\" stroke-width=\"5\"/><rect x=\"85\" y=\"150\" width=\"110\" height=\"50\" rx=\"8\" fill=\"#f5c876\"/><rect x=\"345\" y=\"150\" width=\"210\" height=\"50\" rx=\"8\" fill=\"#a9dbf0\"/><path d=\"M140 80L140 145M133.76746799814535 133.59142669542516L140 145L146.23253200185465 133.59142669542516\" stroke=\"#237f62\" fill=\"none\" stroke-width=\"4\"/><path d=\"M450 80L450 145M443.7674679981454 133.59142669542516L450 145L456.2325320018546 133.59142669542516\" stroke=\"#237f62\" fill=\"none\" stroke-width=\"4\"/><text x=\"140\" y=\"55\" text-anchor=\"middle\" font-size=\"18\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Одинаковая сила<\/text><text x=\"450\" y=\"55\" text-anchor=\"middle\" font-size=\"18\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Одинаковая сила<\/text><text x=\"140\" y=\"250\" text-anchor=\"middle\" font-size=\"17\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Меньше площадь<\/text><text x=\"450\" y=\"250\" text-anchor=\"middle\" font-size=\"17\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Больше площадь<\/text><text x=\"300\" y=\"285\" text-anchor=\"middle\" font-size=\"16\" fill=\"#173449\" font-family=\"Arial,sans-serif\">При той же силе: больше площадь → меньше давление<\/text><\/svg>", "caption": "Показана идея распределения одинаковой силы. Размер рисунка не задаёт реальную площадь."}, {"svg": "<svg viewBox=\"0 0 600 300\" role=\"img\" aria-label=\"Схема перевода квадратного метра в квадратные сантиметры: сетка только условная, не 10000 отдельных клеток\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"300\" rx=\"16\" fill=\"#eef7fa\"/><rect x=\"190\" y=\"45\" width=\"220\" height=\"180\" fill=\"#d1ece0\" stroke=\"#237f62\" stroke-width=\"3\"/><path d=\"M212 45V225\" stroke=\"#9acdb8\"/><path d=\"M190 63H410\" stroke=\"#9acdb8\"/><path d=\"M234 45V225\" stroke=\"#9acdb8\"/><path d=\"M190 81H410\" stroke=\"#9acdb8\"/><path d=\"M256 45V225\" stroke=\"#9acdb8\"/><path d=\"M190 99H410\" stroke=\"#9acdb8\"/><path d=\"M278 45V225\" stroke=\"#9acdb8\"/><path d=\"M190 117H410\" stroke=\"#9acdb8\"/><path d=\"M300 45V225\" stroke=\"#9acdb8\"/><path d=\"M190 135H410\" stroke=\"#9acdb8\"/><path d=\"M322 45V225\" stroke=\"#9acdb8\"/><path d=\"M190 153H410\" stroke=\"#9acdb8\"/><path d=\"M344 45V225\" stroke=\"#9acdb8\"/><path d=\"M190 171H410\" stroke=\"#9acdb8\"/><path d=\"M366 45V225\" stroke=\"#9acdb8\"/><path d=\"M190 189H410\" stroke=\"#9acdb8\"/><path d=\"M388 45V225\" stroke=\"#9acdb8\"/><path d=\"M190 207H410\" stroke=\"#9acdb8\"/><text x=\"300\" y=\"28\" text-anchor=\"middle\" font-size=\"23\" fill=\"#173449\" font-family=\"Arial,sans-serif\">1 м² = 10 000 см²<\/text><text x=\"300\" y=\"268\" text-anchor=\"middle\" font-size=\"20\" fill=\"#173449\" font-family=\"Arial,sans-serif\">100 см × 100 см = 10 000 см²<\/text><\/svg>", "caption": "Сетка условная: она не содержит 10 000 нарисованных клеток."}], "flow": ["Определи силу давления F", "Сложи площади всех опор", "Переведи площадь в м²", "Вычисли p = F/S", "Запиши Па или требуемые кПа"], "activity": "На подносе осторожно поставь лёгкий брусок широкой и узкой гранью на одинаково подготовленный пластилин. Сравни следы. Это качественное наблюдение, не точный измеритель давления. Острые предметы не нужны.", "tasks": [{"id": "p1", "title": "Сила и площадь", "q": "Сила давления 12 Н, площадь опоры 0,003 м². Найди среднее давление.", "type": "number", "answer": 4000, "unit": "Па", "hint": "Раздели силу на площадь: 12 ÷ 0,003.", "solution": "p = 12 ÷ 0,003 = 4000 Па."}, {"id": "p2", "title": "Модель на опоре", "q": "Модель массой 2 кг спокойно стоит на горизонтальной опоре площадью 0,01 м². Других вертикальных воздействий нет. Найди давление при g = 10 Н/кг.", "type": "number", "answer": 2000, "unit": "Па", "hint": "Сначала F = mg = 20 Н, потом F/S.", "solution": "F = 2 × 10 = 20 Н; p = 20 ÷ 0,01 = 2000 Па."}, {"id": "p3", "title": "Перевод площади", "q": "Вырази 20 см² в м².", "type": "number", "answer": 0.002, "unit": "м²", "hint": "В одном м² — 10 000 см².", "solution": "20 ÷ 10 000 = 0,002 м²."}, {"id": "p4", "title": "Увеличили площадь", "q": "При той же силе площадь опоры увеличили вдвое. Что стало со средним давлением?", "type": "choice", "options": ["Уменьшилось вдвое", "Увеличилось вдвое", "Не изменилось"], "answer": 0, "hint": "Площадь стоит в знаменателе p = F/S.", "solution": "При той же силе и вдвое большей площади давление вдвое меньше."}]}, {"title": "Давление жидкостей и газов", "sub": "Вода в озере и воздух в походном коврике", "parts": [["1. Почему возникает давление?", "<p>Частицы газа движутся и ударяются о стенки. Жидкость также оказывает давление на стенки и на погружённые тела. В покоящейся жидкости сила давления на маленькую поверхность направлена перпендикулярно ей.<\/p><p>Закон Паскаля: изменение внешнего давления на заключённую жидкость или газ передаётся во все направления. Это не означает одинакового полного давления на разных глубинах.<\/p>"], ["2. Глубина и плотность", "<p>Для покоящейся жидкости постоянной плотности добавочное давление её столба: <strong>p = ρ × g × h<\/strong>.<\/p><p>ρ — плотность жидкости в кг/м³, g — заданный коэффициент, h — глубина в метрах. Здесь используем пресную воду ρ = 1000 кг/м³ и g = 10 Н/кг.<\/p><p>На глубине 2 м: 1000 × 10 × 2 = 20 000 Па = 20 кПа. Это давление сверх давления на поверхности.<\/p>"], ["3. Добавочное, полное и перепад", "<p>Полное давление: pполное = pповерхности + ρgh. Если на поверхности 100 кПа, а столб воды добавил 20 кПа, полное давление 120 кПа.<\/p><p>Результирующая нагрузка на стенку с давлением с обеих сторон зависит от разности давлений. Нельзя путать давление одной стороны с перепадом.<\/p><p>При одной жидкости, одинаковой глубине и одинаковом давлении над поверхностью давление не зависит от формы сосуда. Масса всей жидкости в сосудах при этом может различаться.<\/p>"]], "diagrams": [{"svg": "<svg viewBox=\"0 0 600 300\" role=\"img\" aria-label=\"Давление воды увеличивается с глубиной: на одном метре 10 кПа сверх давления поверхности, на двух 20 кПа\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"300\" rx=\"16\" fill=\"#eef7fa\"/><rect x=\"60\" y=\"70\" width=\"480\" height=\"190\" fill=\"#a9dbf0\"/><path d=\"M60 70H540\" stroke=\"#237cad\" stroke-width=\"4\"/><circle cx=\"180\" cy=\"130\" r=\"7\" fill=\"#173449\"/><circle cx=\"180\" cy=\"200\" r=\"7\" fill=\"#173449\"/><text x=\"300\" y=\"35\" text-anchor=\"middle\" font-size=\"20\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Добавочное давление пресной воды<\/text><text x=\"370\" y=\"137\" text-anchor=\"middle\" font-size=\"22\" fill=\"#173449\" font-family=\"Arial,sans-serif\">1 м → 10 кПа<\/text><text x=\"370\" y=\"207\" text-anchor=\"middle\" font-size=\"22\" fill=\"#173449\" font-family=\"Arial,sans-serif\">2 м → 20 кПа<\/text><text x=\"300\" y=\"288\" text-anchor=\"middle\" font-size=\"18\" fill=\"#173449\" font-family=\"Arial,sans-serif\">ρ = 1000 кг/м³; g = 10 Н/кг<\/text><\/svg>", "caption": "Схема относится к воде постоянной плотности. Подписи обозначают добавочное давление, не полное."}], "flow": ["Уточни: добавочное или полное давление?", "Выпиши ρ, g и h", "Переведи глубину в метры", "Вычисли ρgh", "Если требуется полное, прибавь давление поверхности"], "activity": "Нарисуй ведро с водой и две точки на разных глубинах. Сравни добавочное давление словами. Не прокалывай бутылки, не нагнетай давление и не ныряй для проверки.", "tasks": [{"id": "w1", "title": "На глубине 2 м", "q": "Найди добавочное давление воды на глубине 2 м. ρ = 1000 кг/м³, g = 10 Н/кг.", "type": "number", "answer": 20000, "unit": "Па", "hint": "Перемножь 1000, 10 и 2.", "solution": "p = 1000 × 10 × 2 = 20 000 Па."}, {"id": "w2", "title": "Глубже", "q": "Найди добавочное давление воды на глубине 3 м в кПа. ρ = 1000 кг/м³, g = 10 Н/кг.", "type": "number", "answer": 30, "unit": "кПа", "hint": "Сначала получи Па, затем раздели на 1000.", "solution": "p = 30 000 Па = 30 кПа."}, {"id": "w3", "title": "Закон Паскаля", "q": "Как передаётся изменение внешнего давления в заключённой жидкости?", "type": "choice", "options": ["Только вниз", "Во все направления", "Только вверх"], "answer": 1, "hint": "Отличай передачу изменения давления от роста давления с глубиной.", "solution": "Изменение внешнего давления передаётся во все направления."}, {"id": "w4", "title": "Полное давление", "q": "На поверхности воды давление 100 кПа. Найди полное давление на глубине 1 м. ρ = 1000 кг/м³, g = 10 Н/кг.", "type": "number", "answer": 110, "unit": "кПа", "hint": "Столб воды добавляет 10 кПа. Прибавь давление поверхности.", "solution": "pполное = 100 + 10 = 110 кПа."}]}, {"title": "Сообщающиеся сосуды и гидравлика", "sub": "Запасы воды на базе и условный подъёмник", "parts": [["1. Где установится уровень?", "<p>В открытых сообщающихся сосудах с одной покоящейся жидкостью свободные поверхности устанавливаются на одном уровне, если давление над ними одинаково и капиллярными эффектами можно пренебречь.<\/p><p>Ширина и форма могут быть разными. Если жидкости разные или над ними разное давление, правило одинаковых уровней применять автоматически нельзя.<\/p>"], ["2. Одинаковое давление — не одинаковая сила", "<p>В идеализированной гидравлической системе поршни на одной высоте, трением и весом поршней пренебрегаем: <strong>F₁/S₁ = F₂/S₂<\/strong>.<\/p><p>Если площадь второго поршня в пять раз больше, сила на нём может быть в пять раз больше при том же передаваемом давлении.<\/p><p>Пример: F₁ = 5 Н, S₁ = 2 см², S₂ = 10 см². Отношение площадей 10/2 = 5. Значит, F₂ = 25 Н. В отношении площадей одинаковые единицы сокращаются.<\/p>"], ["3. Энергия не создаётся", "<p>Без потерь объём вытесненной жидкости одинаков: S₁s₁ = S₂s₂. Больший поршень перемещается на меньший путь.<\/p><p>Если площадь больше в пять раз, путь в пять раз меньше. Реальные устройства имеют трение и другие потери. Поршень в Minecraft — игровая механика, а не подтверждение закона Паскаля.<\/p>"]], "diagrams": [{"svg": "<svg viewBox=\"0 0 600 300\" role=\"img\" aria-label=\"Сообщающиеся сосуды разной ширины с одной покоящейся жидкостью и равным давлением над поверхностями\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"300\" rx=\"16\" fill=\"#eef7fa\"/><path d=\"M80 60V230H480V60M140 60V180H350V60\" fill=\"none\" stroke=\"#31566c\" stroke-width=\"5\"/><path d=\"M83 120H137V183H353V120H477V227H83Z\" fill=\"#a9dbf0\"/><path d=\"M55 120H520\" stroke=\"#237f62\" stroke-dasharray=\"8 6\" stroke-width=\"3\"/><text x=\"300\" y=\"35\" text-anchor=\"middle\" font-size=\"18\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Одна жидкость, одинаковое давление сверху<\/text><text x=\"300\" y=\"280\" text-anchor=\"middle\" font-size=\"22\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Поверхности на одном уровне<\/text><\/svg>", "caption": "Одна покоящаяся жидкость, одинаковое внешнее давление. Уровни равны при оговорённых условиях."}, {"svg": "<svg viewBox=\"0 0 600 300\" role=\"img\" aria-label=\"Идеальная гидравлическая схема: площадь большого поршня в пять раз больше малого, поршни на одной высоте\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"300\" rx=\"16\" fill=\"#eef7fa\"/><path d=\"M70 90V240H530V90M150 90V190H330V90\" fill=\"none\" stroke=\"#31566c\" stroke-width=\"5\"/><path d=\"M74 130H146V194H334V130H526V236H74Z\" fill=\"#a9dbf0\"/><path d=\"M72 128H148M332 128H528\" stroke=\"#8299a6\" stroke-width=\"10\"/><path d=\"M110 55L110 115M103.76746799814536 103.59142669542516L110 115L116.23253200185464 103.59142669542516\" stroke=\"#237f62\" fill=\"none\" stroke-width=\"4\"/><path d=\"M430 115L430 55M436.2325320018546 66.40857330457484L430 55L423.7674679981454 66.40857330457484\" stroke=\"#237f62\" fill=\"none\" stroke-width=\"4\"/><text x=\"110\" y=\"30\" text-anchor=\"middle\" font-size=\"18\" fill=\"#173449\" font-family=\"Arial,sans-serif\">S₁ = 2 см²<\/text><text x=\"430\" y=\"30\" text-anchor=\"middle\" font-size=\"18\" fill=\"#173449\" font-family=\"Arial,sans-serif\">S₂ = 10 см²<\/text><text x=\"300\" y=\"280\" text-anchor=\"middle\" font-size=\"20\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Одинаковое давление, разные силы<\/text><\/svg>", "caption": "Размеры условны. Площади заданы подписями, а не измерением ширины картинки. Поршни показаны на одном уровне."}], "flow": ["Проверь условия идеальной схемы", "Запиши площади в одинаковых единицах", "Найди отношение площадей", "Для силы умножь на это отношение", "Для пути используй обратное отношение"], "activity": "Нарисуй соединённые сосуды и проведи горизонтальную линию уровня. Для гидравлики достаточно схемы: иглы, нагнетание давления и автомобильный домкрат не нужны.", "tasks": [{"id": "h1", "title": "Уровни воды", "q": "Открытые сообщающиеся сосуды разной ширины содержат одну покоящуюся жидкость. Давление сверху одинаково, капиллярными эффектами пренебрегаем. Где поверхности?", "type": "choice", "options": ["На одном уровне", "В широком сосуде обязательно выше", "В узком сосуде обязательно выше"], "answer": 0, "hint": "В этих условиях ширина не задаёт разность уровней.", "solution": "Свободные поверхности находятся на одном уровне."}, {"id": "h2", "title": "Выигрыш в силе", "q": "В идеальной схеме F₁ = 5 Н, S₁ = 2 см², S₂ = 10 см². Поршни на одной высоте. Найди F₂.", "type": "number", "answer": 25, "unit": "Н", "hint": "Отношение площадей 10 ÷ 2 = 5.", "solution": "F₂ = 5 × (10 ÷ 2) = 25 Н."}, {"id": "h3", "title": "Площадь малого поршня", "q": "Идеальная схема на одной высоте: F₁ = 200 Н, F₂ = 6000 Н, S₂ = 30 см². Найди S₁.", "type": "number", "answer": 1, "unit": "см²", "hint": "Сила увеличена в 30 раз. Площадь малого поршня в 30 раз меньше.", "solution": "S₁ = 30 × 200 ÷ 6000 = 1 см²."}, {"id": "h4", "title": "Путь большого поршня", "q": "В идеальной системе площадь большого поршня в 5 раз больше малого. Малый переместился на 5 см. На сколько переместился большой?", "type": "number", "answer": 1, "unit": "см", "hint": "Выигрыш в силе сопровождается уменьшением пути. Раздели 5 см на 5.", "solution": "Из S₁s₁ = S₂s₂ получаем s₂ = 5 ÷ 5 = 1 см."}]}],KEY='fizika7-module4-v1',app=document.getElementById('app'),ALL=DATA.flatMap(l=>l.tasks);let failed=false;
function load(){try{const p=JSON.parse(localStorage.getItem(KEY)),ids=new Set(ALL.map(t=>t.id));return{done:p&&Array.isArray(p.done)?[...new Set(p.done.filter(id=>ids.has(id)))]:[],help:p&&Array.isArray(p.help)?p.help.filter(id=>ids.has(id)):[]}}catch(e){return{done:[],help:[]}}}
let state=load();function save(){try{localStorage.setItem(KEY,JSON.stringify(state));failed=false}catch(e){failed=true}}function notice(){return failed?'<p class="feedback hint" role="status">Прогресс не удалось сохранить в браузере. Задания доступны.</p>':''}function nav(){return '<nav class="nav" aria-label="Разделы"><a class="link" href="./start.html">Общее меню</a><a class="link" href="./module3.html">Модуль 3: силы</a><a class="link" href="./volume.html">Тренажёр объёма</a></nav>'}
function home(){app.innerHTML=`<section class="card"><span class="tag">Модуль 4 · Версия 1.0</span><h2>Три урока и 12 задач</h2><p>Давление опор, жидкостей и газов, сообщающиеся сосуды и идеальная гидравлическая схема. Это обучение: подсказки разрешены.</p><div class="bar" role="progressbar" aria-label="Выполненные задания" aria-valuemin="0" aria-valuemax="12" aria-valuenow="${state.done.length}"><div style="width:${state.done.length/12*100}%"></div></div><p class="muted">Выполнено ${state.done.length} из 12. Это не школьная оценка.</p><div id="lesson-list"></div>${notice()}</section><section class="card"><h2>Ориентир перед началом</h2><p>Сила F измеряется в ньютонах, площадь S — в м², давление p — в паскалях. Не смешивай давление и силу.</p><p class="muted">Все численные сюжеты — учебные условия. Никаких опытов с давлением, прокалыванием ёмкостей, погружением на глубину или настоящими домкратами.</p></section>${nav()}<details class="card" style="margin-top:20px"><summary>Источники и ограничения</summary><p class="muted">Сверка: <a href="https://openstax.org/books/university-physics-volume-1/pages/14-3-pascals-principle-and-hydraulics" target="_blank" rel="noopener noreferrer">OpenStax: принцип Паскаля и гидравлика</a>. Порядок школьных тем уточняют у учителя. Прогресс только в этом браузере; автоматически между устройствами не переносится и может исчезнуть после очистки данных.</p></details>`;let list=document.getElementById('lesson-list');DATA.forEach((l,i)=>{let b=document.createElement('button');b.textContent=(i+1)+'. '+l.title+' — '+l.tasks.filter(t=>state.done.includes(t.id)).length+'/4';b.onclick=()=>lesson(i);list.appendChild(b)});window.scrollTo(0,0)}
function lesson(i){let l=DATA[i];app.innerHTML=`<button id="back">← К урокам модуля</button><section class="card" style="margin-top:18px"><span class="tag">Урок ${i+1} из 3</span><h2>${l.title}</h2><p class="muted">${l.sub}</p>${l.parts.map(p=>'<h3>'+p[0]+'</h3>'+p[1]).join('')}</section>${l.diagrams.map(d=>'<section class="card"><h2>Посмотри на рисунок</h2><figure>'+d.svg+'<figcaption>'+d.caption+'</figcaption></figure></section>').join('')}<section class="card"><h2>Пройди по шагам</h2><ol class="flow">${l.flow.map(s=>'<li>'+s+'</li>').join('')}</ol></section><section class="card"><h2>Самостоятельные задачи</h2><div id="tasks"></div></section><section class="card"><h2>Попробуй вне экрана</h2><p>${l.activity}</p></section>${nav()}`;document.getElementById('back').onclick=home;let list=document.getElementById('tasks');l.tasks.forEach((t,k)=>{let b=document.createElement('button');b.textContent=(k+1)+'. '+t.title+(state.done.includes(t.id)?(state.help.includes(t.id)?' — с помощью':' — выполнено'):'');b.onclick=()=>task(i,k);list.appendChild(b)});window.scrollTo(0,0)}
function parse(value){let s=value.trim().replace(',','.');return /^\d+(?:\.\d+)?$/.test(s)?Number(s):null}
function task(li,ti){let l=DATA[li],t=l.tasks[ti],helped=false,solved=false;app.innerHTML=`<button id="lesson-back">← К объяснению урока</button><section class="card" style="margin-top:18px"><span class="tag">Задача ${ti+1} из 4</span><h2>${t.title}</h2><p>${t.q}</p>${t.type==='number'?'<form id="answer-form" novalidate><label for="answer">Ответ, '+t.unit+'</label><input id="answer" type="text" inputmode="decimal" autocomplete="off" aria-describedby="note"><p id="note" class="muted">Введи только число. Запятая и точка принимаются одинаково.</p><button id="check" class="primary" type="submit">Проверить</button></form>':'<div id="choices"></div>'}<button id="hint">Подсказка</button><div id="feedback" role="status" aria-live="polite" hidden></div><div id="hint-text" class="feedback hint" role="status" hidden></div><details id="solution" hidden><summary>Открыть разбор</summary><p>${t.solution}</p></details><button id="next" class="primary" hidden>${ti<3?'Следующая задача →':li<2?'Следующий урок →':'К меню модуля'}</button><div id="storage-status"></div></section>`;document.getElementById('lesson-back').onclick=()=>lesson(li);let fb=document.getElementById('feedback');function message(s,ok){fb.hidden=false;fb.className='feedback '+(ok?'good':'hint');fb.textContent=s}function verify(value){if(solved)return;if(value===null||!Number.isFinite(value)){message('Введи число: например 20 или 0,002.',false);return}if(Math.abs(value-t.answer)>1e-8){helped=true;message('Пока не совпало. Проверь единицы и выбранную формулу. Можно открыть подсказку.',false);return}solved=true;if(!state.done.includes(t.id))state.done.push(t.id);if(helped&&!state.help.includes(t.id))state.help.push(t.id);save();message('Верно! '+t.solution,true);if(t.type==='number'){document.getElementById('answer').disabled=true;document.getElementById('check').disabled=true}else document.getElementById('choices').querySelectorAll('button').forEach(b=>b.disabled=true);document.getElementById('hint').hidden=true;document.getElementById('next').hidden=false;document.getElementById('storage-status').innerHTML=notice()}
if(t.type==='number')document.getElementById('answer-form').onsubmit=e=>{e.preventDefault();verify(parse(document.getElementById('answer').value))};else{let box=document.getElementById('choices');t.options.forEach((s,i)=>{let b=document.createElement('button');b.textContent=s;b.onclick=()=>verify(i);box.appendChild(b)})}document.getElementById('hint').onclick=function(){helped=true;let box=document.getElementById('hint-text');box.hidden=false;box.textContent=t.hint;document.getElementById('solution').hidden=false;this.hidden=true};document.getElementById('solution').ontoggle=function(){if(this.open)helped=true};document.getElementById('next').onclick=()=>{if(ti<3)task(li,ti+1);else if(li<2)lesson(li+1);else home()};window.scrollTo(0,0)}
try{home()}catch(e){app.innerHTML='<section class="card"><h2>Не удалось открыть модуль</h2><pre id="error"></pre></section>';document.getElementById('error').textContent=String(e.message||e)}
})();
</script></body></html>
