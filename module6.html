<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142638"><title>Работа, мощность, механизмы и энергия</title><style>*{box-sizing:border-box}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}body{margin:0;background:#eef3f7;color:#172c3e;font:18px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow-wrap:anywhere}.wrap{max-width:900px;margin:auto}header{padding:32px 20px;background:linear-gradient(130deg,#142638,#21564f);color:white}header p{color:#dce9f1}h1{font-size:clamp(29px,7vw,43px);line-height:1.25}h2{font-size:26px;line-height:1.35;margin-top:0}h3{font-size:21px}main{padding:24px 15px}.card{background:white;border:1px solid #dce5ed;border-radius:19px;padding:24px;margin-bottom:20px}p{margin:0 0 16px}.muted,figcaption{font-size:15px;color:#526879}.tag{display:inline-block;background:#e5f6ef;color:#176344;border-radius:22px;padding:5px 12px;font-size:14px;margin-bottom:14px}button,.link{display:block;width:100%;padding:14px;margin-top:12px;min-height:50px;border:2px solid #dce5ed;border-radius:13px;color:#172c3e;background:#f7fafc;text-decoration:none;text-align:left;font:inherit;line-height:1.5;cursor:pointer;touch-action:manipulation}.primary{background:#237f62;border-color:#237f62;color:white;text-align:center}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #237f62;outline-offset:3px}button:disabled,input:disabled{opacity:.7;cursor:default}input:not([type="range"]){width:100%;padding:14px;border:2px solid #bdced9;border-radius:12px;font:inherit;font-size:21px}input[type="range"]{width:100%;min-height:44px;accent-color:#237f62}label{display:block;margin:14px 0 6px}.feedback{padding:16px;border-radius:12px;margin-top:16px}.good{background:#e5f6ef;color:#15583e}.hint{background:#fff3d8;color:#704d10}figure{margin:0}svg{display:block;width:100%;height:auto;max-width:650px;margin:auto}figcaption{margin-top:10px}.flow{padding-left:25px}.flow li{padding:10px;margin:12px 0;background:#eef7fa;border-radius:10px}.bar{height:10px;background:#e5edf2;border-radius:10px;overflow:hidden;margin:16px 0}.bar div{height:100%;background:#237f62}footer{padding:0 20px 28px;text-align:center;font-size:14px;color:#526879}a{color:#176344}summary{cursor:pointer}.nav{display:flex;gap:10px;flex-wrap:wrap}.nav a{flex:1;min-width:180px}@media(max-width:480px){.card{padding:18px}body{font-size:17px}}</style></head><body><header><div class="wrap"><p>ФИЗИКА · 7 КЛАСС</p><h1>Работа, мощность, механизмы и энергия</h1><p>Модуль 6: свяжем изученные темы в одну картину</p></div></header><main id="app" class="wrap"><section class="card"><h2>Загрузка…</h2></section></main><footer>Модуль 6 · Версия 1.0</footer><noscript>Для заданий нужен JavaScript.</noscript><script>
(function(){'use strict';
const DATA=[{"title": "Механическая работа и мощность", "sub": "Перевозка груза на базе и подъём рюкзака", "parts": [["1. Работа силы", "<p>В физике работа силы связана с перемещением. Для постоянной силы вдоль движения <strong>A = Fs<\/strong>. F — сила в Н, s — перемещение в м, A — работа в джоулях, Дж.<\/p><p>Пример: тянем модель силой 10 Н на 3 м вдоль силы. Работа этой силы 30 Дж. При силе против движения работа отрицательна; при перпендикулярной силе — нулевая. Здесь тренируем преимущественно сонаправленный случай.<\/p><p>Если предмет неподвижен, поддерживающая сила не совершает над ним механическую работу: перемещения нет. Усталость мышц возможна, но она не равна работе над неподвижным предметом.<\/p>"], ["2. Полезная работа подъёма", "<p>При равномерном подъёме груза полезная работа <strong>Aпол = mgh<\/strong>. Высоту h отсчитывают вертикально, а массу m берут в кг. В задачах используем g = 10 Н/кг, если не сказано другое.<\/p><p>Для 2 кг и высоты 1 м получаем 20 Дж. Затраченная устройством работа может быть больше полезной из-за потерь.<\/p>"], ["3. Мощность", "<p>Мощность показывает, как быстро выполняется работа: <strong>N = A/t<\/strong>. Время в секундах, мощность в ваттах. 1 Вт = 1 Дж/с.<\/p><p>100 Дж за 10 с — 10 Вт. Те же 100 Дж за 5 с — 20 Вт. Большая мощность не обязательно означает большую работу: нужно учитывать время.<\/p><p>Для силы, направленной вдоль скорости, мгновенная мощность N = Fv. Эту дополнительную связь не нужно применять, если проще известны работа и время.<\/p>"]], "diagrams": [{"svg": "<svg viewBox=\"0 0 600 300\" role=\"img\" aria-label=\"Работа постоянной силы тяги вдоль перемещения, две позиции груза\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"300\" rx=\"16\" fill=\"#eef7fa\"/><path d=\"M40 230H560\" stroke=\"#31566c\" stroke-width=\"5\"/><rect x=\"95\" y=\"140\" width=\"100\" height=\"85\" rx=\"10\" fill=\"#f5c876\"/><rect x=\"400\" y=\"140\" width=\"100\" height=\"85\" rx=\"10\" fill=\"#d5e8db\"/><path d=\"M190 170H320m-15-12 15 12-15 12M145 260H450m-15-10 15 10-15 10\" fill=\"none\" stroke=\"#237f62\" stroke-width=\"4\"/><text x=\"300\" y=\"55\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"23\" fill=\"#173449\">Работа силы тяги: A = F × s<\/text><text x=\"270\" y=\"145\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"22\" fill=\"#173449\">F<\/text><text x=\"300\" y=\"285\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">Перемещение s<\/text><\/svg>", "caption": "Рассчитывается работа названной силы, а не автоматически сумма работ всех сил."}, {"svg": "<svg viewBox=\"0 0 600 300\" role=\"img\" aria-label=\"Одна работа 100 Дж за разное время: 10 секунд дают 10 Вт, пять секунд 20 Вт\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"300\" rx=\"16\" fill=\"#eef7fa\"/><rect x=\"35\" y=\"75\" width=\"240\" height=\"130\" rx=\"14\" fill=\"#d5e8db\"/><rect x=\"325\" y=\"75\" width=\"240\" height=\"130\" rx=\"14\" fill=\"#b8e1f2\"/><text x=\"155\" y=\"115\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">A = 100 Дж<\/text><text x=\"155\" y=\"150\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">t = 10 с<\/text><text x=\"155\" y=\"185\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"23\" fill=\"#173449\">N = 10 Вт<\/text><text x=\"445\" y=\"115\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">A = 100 Дж<\/text><text x=\"445\" y=\"150\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">t = 5 с<\/text><text x=\"445\" y=\"185\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"23\" fill=\"#173449\">N = 20 Вт<\/text><text x=\"300\" y=\"260\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">Та же работа за меньшее время → больше мощность<\/text><\/svg>", "caption": "Сравнивается одинаковая работа за разное время."}], "flow": ["Назови, работу какой силы считаешь", "Проверь направление силы и перемещения", "Приведи Н, м и с к согласованным единицам", "Для работы используй A = Fs или Aпол = mgh", "Для средней мощности раздели работу на время"], "activity": "По рисунку сравни два подъёма одной коробки на одну высоту за разное время. Реальные тяжёлые предметы поднимать не нужно.", "links": [["mechanisms.html", "Рычаги и блоки"], ["hydraulic.html", "Гидравлический пресс"]], "tasks": [{"id": "w1", "title": "Работа тяги", "q": "Постоянная сила 15 Н направлена вдоль перемещения 2 м. Найди работу этой силы.", "type": "number", "answer": 30, "unit": "Дж", "hint": "Умножь F на s.", "solution": "A = 15 × 2 = 30 Дж.", "extra": false}, {"id": "w2", "title": "Подняли рюкзак", "q": "Рюкзак 2 кг равномерно подняли на 1,5 м. Найди полезную работу при g = 10 Н/кг.", "type": "number", "answer": 30, "unit": "Дж", "hint": "Aпол = mgh.", "solution": "Aпол = 2 × 10 × 1,5 = 30 Дж.", "extra": false}, {"id": "w3", "title": "Мощность механизма", "q": "Механизм совершил 120 Дж полезной работы за 6 с. Найди среднюю полезную мощность.", "type": "number", "answer": 20, "unit": "Вт", "hint": "Раздели работу на время.", "solution": "N = 120/6 = 20 Вт.", "extra": false}, {"id": "w4", "title": "Держим неподвижно", "q": "Рюкзак неподвижно удерживают над полом. Какова механическая работа поддерживающей силы над рюкзаком за этот интервал?", "type": "choice", "options": ["Нулевая, потому что перемещения нет", "Обязательно большая, потому что человек устал"], "answer": 0, "hint": "Отдели работу над рюкзаком от физиологических затрат организма.", "solution": "Перемещение рюкзака нулевое, поэтому работа поддерживающей силы над ним равна нулю.", "extra": false}]}, {"title": "Простые механизмы и КПД", "sub": "LEGO-кран, блок и погрузка по наклонной плоскости", "parts": [["1. Рычаг и блок", "<p>Для лёгкого горизонтального рычага и вертикальных сил по разные стороны оси: F₁l₁ = F₂l₂. Плечо — перпендикулярное расстояние от оси до линии действия силы.<\/p><p>Идеальный неподвижный блок меняет направление силы, но не даёт выигрыша: F = mg, s = h. Для показанной в отдельном тренажёре схемы подвижного блока с двумя вертикальными несущими ветвями F = mg/2, s = 2h. Массой блока и трением пренебрегаем, подъём равномерный.<\/p>"], ["2. Наклонная плоскость", "<p>При равномерном подъёме по наклонной плоскости полезная работа Aпол = mgh. Если сила тяги постоянна и направлена вдоль плоскости, затраченная работа Aзатр = Fl.<\/p><p>h — вертикальная высота, l — путь по плоскости. Они не одинаковы. Простой механизм может уменьшать силу, увеличивая путь, но не создаёт энергию.<\/p>"], ["3. Коэффициент полезного действия", "<p><strong>η = Aпол/Aзатр × 100%<\/strong>. Буква η читается «эта».<\/p><p>Если полезная работа 80 Дж, а затраченная 100 Дж, КПД 80%. Разница перешла во внутреннюю энергию и другие учитываемые формы, а не исчезла.<\/p><p>Для пассивного механизма без расходования ранее запасённой энергии полезная работа не может превышать затраченную. Если в опыте получилось больше 100%, проверь данные, границы системы и расчёт, не подгоняя измерения.<\/p>"]], "diagrams": [{"svg": "<svg viewBox=\"0 0 600 300\" role=\"img\" aria-label=\"Горизонтальный рычаг с вертикальными силами по сторонам опоры\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"300\" rx=\"16\" fill=\"#eef7fa\"/><path d=\"M65 150H535\" stroke=\"#31566c\" stroke-width=\"9\"/><path d=\"M300 157L268 208H332Z\" fill=\"#839ba8\"/><path d=\"M170 60v75m-9-12 9 12 9-12M450 60v75m-9-12 9 12 9-12\" stroke=\"#237f62\" fill=\"none\" stroke-width=\"4\"/><text x=\"170\" y=\"40\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">F₁<\/text><text x=\"450\" y=\"40\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">F₂<\/text><text x=\"235\" y=\"240\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">l₁<\/text><text x=\"375\" y=\"240\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">l₂<\/text><text x=\"300\" y=\"285\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"21\" fill=\"#173449\">Условие равновесия: F₁l₁ = F₂l₂<\/text><\/svg>", "caption": "Вес рычага пренебрежимо мал или его момент скомпенсирован. Реакция опоры здесь не показана."}, {"svg": "<svg viewBox=\"0 0 600 300\" role=\"img\" aria-label=\"Наклонная плоскость: вертикальная высота h отличается от длины пути l по плоскости\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"300\" rx=\"16\" fill=\"#eef7fa\"/><path d=\"M90 230H500V80Z\" fill=\"#d5e8db\"/><path d=\"M90 230L500 80\" stroke=\"#31566c\" stroke-width=\"5\"/><rect x=\"295\" y=\"119\" width=\"34\" height=\"34\" fill=\"#f5c876\"/><path d=\"M530 80V230\" stroke=\"#237f62\" stroke-dasharray=\"6 5\" stroke-width=\"3\"/><text x=\"300\" y=\"60\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">Наклонная плоскость<\/text><text x=\"555\" y=\"165\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"24\" fill=\"#173449\">h<\/text><text x=\"300\" y=\"245\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"19\" fill=\"#173449\">l — путь вдоль плоскости<\/text><text x=\"300\" y=\"285\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"22\" fill=\"#173449\">Aпол = mgh; Aзатр = Fl<\/text><\/svg>", "caption": "Длины условные. Высота и путь должны быть заданы или измерены отдельно."}], "flow": ["Определи цель: поднять груз или изменить силу", "Выбери конкретную схему механизма", "Различи полезную и затраченную работу", "Согласуй выигрыш в силе с увеличением пути", "Для КПД раздели полезную работу на затраченную"], "activity": "Нарисуй короткий крутой и длинный пологий подъёмы на одну высоту. Объясни, почему без потерь полезная работа для одного груза одинакова. Не используй настоящие лебёдки и тяжёлые грузы.", "links": [["mechanisms.html", "Открыть модели рычага и блоков"], ["hydraulic.html", "Открыть модель пресса"]], "tasks": [{"id": "m1", "title": "Равновесие рычага", "q": "Лёгкий горизонтальный рычаг: слева вертикальная сила 12 Н на плече 5 см; справа сила вниз на плече 15 см. Найди правую силу для равновесия.", "type": "number", "answer": 4, "unit": "Н", "hint": "F₂ = F₁l₁/l₂.", "solution": "F₂ = 12 × 5/15 = 4 Н.", "extra": false}, {"id": "m2", "title": "Подвижный блок", "q": "Идеальный подвижный блок на двух вертикальных несущих ветвях равномерно поднимает 4 кг. Массой блока пренебречь. Найди силу свободного конца при g = 10 Н/кг.", "type": "number", "answer": 20, "unit": "Н", "hint": "Тяжесть 40 Н распределена на две ветви.", "solution": "F = 4 × 10/2 = 20 Н.", "extra": false}, {"id": "m3", "title": "КПД", "q": "Полезная работа 80 Дж, затраченная 100 Дж. Найди КПД.", "type": "number", "answer": 80, "unit": "%", "hint": "η = Aпол/Aзатр × 100%.", "solution": "η = 80/100 × 100% = 80%.", "extra": false}, {"id": "m4", "title": "Выигрыш в работе?", "q": "Идеальный простой механизм уменьшил необходимую силу. Даёт ли он выигрыш в механической работе?", "type": "choice", "options": ["Нет: меньшая сила сопровождается большим путём", "Да: создаёт дополнительную энергию"], "answer": 0, "hint": "Сравни произведение силы на соответствующий путь.", "solution": "Идеальный механизм не даёт выигрыша в работе.", "extra": false}]}, {"title": "Энергия и её сохранение", "sub": "Поднятый груз, спуск и превращение энергии", "parts": [["1. Положение и движение", "<p>Потенциальная энергия взаимодействия груза и Земли относительно выбранного уровня: Eп = mgh. Высота должна иметь явно выбранное начало отсчёта.<\/p><p>Кинетическая энергия поступательного движения: Eк = mv²/2. Формула и задачи на неё относятся к расчётному расширению; обязательность сверяют с учителем. Вращение здесь не учитывается.<\/p><p>Механическая энергия Eмех = Eп + Eк. В нашей задаче без трения, сопротивления и иных передач энергии её сумма сохраняется.<\/p>"], ["2. Общая энергия и механическая — не одно и то же", "<p>В изолированной системе общая энергия сохраняется. При трении механическая энергия может переходить во внутреннюю энергию взаимодействующих тел.<\/p><p>Если в учебной модели других передач нет, можно записать Eп + Eк + ΔU = Eнач. Здесь ΔU — увеличение внутренней энергии относительно начала; её постоянная начальная часть опущена.<\/p><p>Не говори «энергия всегда уменьшается» или «механическая всегда сохраняется». Назови систему, виды энергии и условия.<\/p>"], ["3. Проверь понимание на модели", "<p>В уже опубликованной модели спуска можно менять массу, высоту и положение груза. При включении условного рассеяния часть уменьшения Eп становится ΔU.<\/p><p>Ползунок задаёт положение, а не время. Эта модель не предназначена для оценки безопасности реальных горок, прыжков и транспорта.<\/p>"]], "diagrams": [{"svg": "<svg viewBox=\"0 0 600 300\" role=\"img\" aria-label=\"Связь уменьшения потенциальной и увеличения кинетической энергии без трения; при трении нужен дополнительный энергетический баланс\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"300\" rx=\"16\" fill=\"#eef7fa\"/><rect x=\"35\" y=\"85\" width=\"240\" height=\"100\" rx=\"12\" fill=\"#d5e8db\"/><rect x=\"325\" y=\"85\" width=\"240\" height=\"100\" rx=\"12\" fill=\"#b8e1f2\"/><text x=\"155\" y=\"125\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">Eп уменьшается<\/text><text x=\"155\" y=\"160\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">Высота падает<\/text><text x=\"445\" y=\"125\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">Eк увеличивается<\/text><text x=\"445\" y=\"160\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">Скорость растёт<\/text><text x=\"300\" y=\"245\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"22\" fill=\"#173449\">Без трения: Eп + Eк = const<\/text><text x=\"300\" y=\"285\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"17\" fill=\"#173449\">С трением учитываем внутреннюю энергию<\/text><\/svg>", "caption": "Для трения требуется учитывать дополнительные виды энергии и возможный обмен с окружением."}], "flow": ["Выбери систему и уровень высоты", "Запиши начальную энергию", "Проверь трение и обмен с окружением", "Составь нужный баланс энергий", "Реши и проверь, что энергия не возникла из ничего"], "activity": "Объясни на рисунке, почему у скользящего вниз груза может одновременно уменьшаться высота и расти скорость. Реальный бросок или разгон модели не нужен.", "links": [["energy.html", "Открыть модель сохранения энергии"]], "tasks": [{"id": "e1", "title": "Потенциальная энергия", "q": "Груз 3 кг расположен на высоте 2 м над выбранным нулевым уровнем. Найди Eп при g = 10 Н/кг.", "type": "number", "answer": 60, "unit": "Дж", "hint": "Eп = mgh.", "solution": "Eп = 3 × 10 × 2 = 60 Дж.", "extra": false}, {"id": "e2", "title": "Сумма энергий", "q": "В выбранном положении Eп = 40 Дж, Eк = 10 Дж. Найди механическую энергию.", "type": "number", "answer": 50, "unit": "Дж", "hint": "Сложи потенциальную и кинетическую части.", "solution": "Eмех = 40 + 10 = 50 Дж.", "extra": false}, {"id": "e3", "title": "Трение и баланс", "q": "В изолированной учебной модели механическая энергия уменьшилась со 100 до 70 Дж. Вся убыль перешла во внутреннюю энергию. Найди ΔU.", "type": "number", "answer": 30, "unit": "Дж", "hint": "Из начальной механической энергии вычти конечную.", "solution": "ΔU = 100 − 70 = 30 Дж. Общая энергия системы не исчезла.", "extra": false}, {"id": "e4", "title": "Кинетическая энергия — расширение", "q": "Используй Eк = mv²/2. Масса скользящего без вращения груза 1 кг, скорость 4 м/с. Найди Eк.", "type": "number", "answer": 8, "unit": "Дж", "hint": "v² = 16. Затем 1 × 16/2.", "solution": "Eк = 8 Дж.", "extra": true}]}],KEY='fizika7-module6-v1',app=document.getElementById('app'),ALL=DATA.flatMap(l=>l.tasks);let failed=false;
function load(){try{let p=JSON.parse(localStorage.getItem(KEY)),ids=new Set(ALL.map(t=>t.id));return{done:p&&Array.isArray(p.done)?[...new Set(p.done.filter(id=>ids.has(id)))]:[],help:p&&Array.isArray(p.help)?p.help.filter(id=>ids.has(id)):[]}}catch(e){return{done:[],help:[]}}}
let state=load();function save(){try{localStorage.setItem(KEY,JSON.stringify(state));failed=false}catch(e){failed=true}}function notice(){return failed?'<p class="feedback hint" role="status">Прогресс не удалось сохранить в браузере. Задания доступны.</p>':''}function nav(){return '<nav class="nav" aria-label="Разделы"><a class="link" href="./start.html">Общее меню</a><a class="link" href="./mechanisms.html">Блоки и рычаги</a><a class="link" href="./energy.html">Сохранение энергии</a></nav>'}
function home(){let basic=ALL.filter(t=>!t.extra&&state.done.includes(t.id)).length;app.innerHTML=`<section class="card"><span class="tag">Модуль 6 · Версия 1.0</span><h2>Работа, мощность, механизмы и энергия</h2><p>Три последовательных урока, 11 основных заданий и одна дополнительная задача на кинетическую энергию.</p><div class="bar" role="progressbar" aria-label="Основные задания" aria-valuemin="0" aria-valuemax="11" aria-valuenow="${basic}"><div style="width:${basic/11*100}%"></div></div><p class="muted">Основные: ${basic} из 11. Всего: ${state.done.length} из 12. Это не школьная оценка.</p><div id="lesson-list"></div><button id="model">Модель: работа и мощность</button>${notice()}</section><section class="card"><h2>Работающие тренажёры остаются отдельно</h2><p>Этот модуль связывает темы в последовательный маршрут. Модели рычага, блоков, пресса и сохранения энергии доступны по ссылкам из уроков. Их прогресс не сбрасывается.</p></section>${nav()}<details class="card" style="margin-top:20px"><summary>Источники и ограничения</summary><p class="muted">Темы исходного курса 7 класса. Сверка: <a href="https://openstax.org/books/physics/pages/9-1-work-power-and-the-work-energy-theorem" target="_blank" rel="noopener noreferrer">OpenStax: работа и мощность</a>; <a href="https://openstax.org/books/physics/pages/9-3-simple-machines" target="_blank" rel="noopener noreferrer">простые механизмы</a>; <a href="https://openstax.org/books/university-physics-volume-1/pages/8-3-conservation-of-energy" target="_blank" rel="noopener noreferrer">энергия</a>. Требования вашего класса сверяют с учителем.</p><p class="muted">Прогресс только в этом браузере; автоматически между устройствами не переносится и может исчезнуть при очистке данных. Никаких опытов с тяжёлыми грузами, опасными механизмами и настоящим транспортом.</p></details>`;let list=document.getElementById('lesson-list');DATA.forEach((l,i)=>{let b=document.createElement('button');b.textContent=(i+1)+'. '+l.title+' — '+l.tasks.filter(t=>state.done.includes(t.id)).length+'/4';b.onclick=()=>lesson(i);list.appendChild(b)});document.getElementById('model').onclick=model;window.scrollTo(0,0)}
function lesson(i){let l=DATA[i];app.innerHTML=`<button id="back">← К урокам модуля</button><section class="card" style="margin-top:18px"><span class="tag">Урок ${i+1} из 3</span><h2>${l.title}</h2><p class="muted">${l.sub}</p>${l.parts.map(p=>'<h3>'+p[0]+'</h3>'+p[1]).join('')}</section>${l.diagrams.map(d=>'<section class="card"><h2>Рассмотри рисунок</h2><figure>'+d.svg+'<figcaption>'+d.caption+'</figcaption></figure></section>').join('')}<section class="card"><h2>Схема решения</h2><ol class="flow">${l.flow.map(s=>'<li>'+s+'</li>').join('')}</ol></section><section class="card"><h2>Задачи</h2><div id="tasks"></div></section><section class="card"><h2>Модели для закрепления</h2>${l.links.map(a=>'<a class="link" href="./'+a[0]+'">'+a[1]+'</a>').join('')}</section><section class="card"><h2>Попробуй вне экрана</h2><p>${l.activity}</p></section>${nav()}`;document.getElementById('back').onclick=home;let list=document.getElementById('tasks');l.tasks.forEach((t,k)=>{let b=document.createElement('button');b.textContent=(k+1)+'. '+t.title+(t.extra?' (необязательно)':'')+(state.done.includes(t.id)?(state.help.includes(t.id)?' — с помощью':' — выполнено'):'');b.onclick=()=>task(i,k);list.appendChild(b)});window.scrollTo(0,0)}
function model(){app.innerHTML=`<button id="back">← К урокам</button><section class="card" style="margin-top:18px"><span class="tag">Учебная модель</span><h2>Одна работа — разная мощность</h2><p>Постоянная сила направлена вдоль прямолинейного перемещения. Здесь вычисляется работа именно этой силы и её средняя мощность; сопротивление и работа других сил не заданы.</p><label for="force">Сила: <span id="force-label">20</span> Н</label><input id="force" type="range" min="5" max="100" step="5" value="20"><label for="distance">Перемещение: <span id="distance-label">5</span> м</label><input id="distance" type="range" min="1" max="10" step="1" value="5"><label for="time">Время: <span id="time-label">10</span> с</label><input id="time" type="range" min="1" max="20" step="1" value="10"><div id="result" class="feedback good" role="status" aria-live="polite"></div><p class="muted">Сначала меняй только время. Объясни, почему работа при тех же силе и перемещении не меняется, а средняя мощность меняется.</p></section>${nav()}`;document.getElementById('back').onclick=home;let ids=['force','distance','time'];function draw(){let F=Number(document.getElementById('force').value),s=Number(document.getElementById('distance').value),t=Number(document.getElementById('time').value),A=F*s,N=A/t;[F,s,t].forEach((v,i)=>document.getElementById(ids[i]+'-label').textContent=String(v));document.getElementById('result').textContent='Работа A = '+F+' × '+s+' = '+A+' Дж. Средняя мощность N = '+A+' / '+t+' = '+String(Math.round(N*1000)/1000).replace('.',',')+' Вт.'}ids.forEach(id=>document.getElementById(id).oninput=draw);draw();window.scrollTo(0,0)}
function parse(value){let s=value.trim().replace(',','.');return /^\d+(?:\.\d+)?$/.test(s)?Number(s):null}
function task(li,ti){let l=DATA[li],t=l.tasks[ti],solved=false,helped=false;app.innerHTML=`<button id="lesson-back">← К объяснению урока</button><section class="card" style="margin-top:18px"><span class="tag">Задача ${ti+1} из 4${t.extra?' · расширение':''}</span><h2>${t.title}</h2><p>${t.q}</p>${t.type==='number'?'<form id="answer-form" novalidate><label for="answer">Ответ, '+t.unit+'</label><input id="answer" type="text" inputmode="decimal" autocomplete="off" aria-describedby="note"><p id="note" class="muted">Только число. Запятая и точка принимаются одинаково.</p><button id="check" class="primary" type="submit">Проверить</button></form>':'<div id="choices"></div>'}<button id="hint">Подсказка</button><div id="feedback" role="status" aria-live="polite" hidden></div><div id="hint-text" class="feedback hint" role="status" hidden></div><details id="solution" hidden><summary>Открыть разбор</summary><p>${t.solution}</p></details><button id="next" class="primary" hidden>${ti<3?'Следующая задача →':li<2?'Следующий урок →':'К меню модуля'}</button>${t.extra?'<button id="skip">Пропустить дополнительную задачу</button>':''}<div id="storage-status"></div></section>`;document.getElementById('lesson-back').onclick=()=>lesson(li);function advance(){if(ti<3)task(li,ti+1);else if(li<2)lesson(li+1);else home()}if(t.extra)document.getElementById('skip').onclick=advance;let fb=document.getElementById('feedback');function message(s,ok){fb.hidden=false;fb.className='feedback '+(ok?'good':'hint');fb.textContent=s}function verify(value){if(solved)return;if(value===null||!Number.isFinite(value)){message('Введи число, например 20 или 0,5.',false);return}if(Math.abs(value-t.answer)>1e-8){helped=true;message('Пока не совпало. Проверь величину, формулу и единицы. Можно открыть подсказку.',false);return}solved=true;if(!state.done.includes(t.id))state.done.push(t.id);if(helped&&!state.help.includes(t.id))state.help.push(t.id);save();message('Верно! '+t.solution,true);if(t.type==='number'){document.getElementById('answer').disabled=true;document.getElementById('check').disabled=true}else document.getElementById('choices').querySelectorAll('button').forEach(b=>b.disabled=true);document.getElementById('hint').hidden=true;document.getElementById('next').hidden=false;if(t.extra)document.getElementById('skip').hidden=true;document.getElementById('storage-status').innerHTML=notice()}
if(t.type==='number')document.getElementById('answer-form').onsubmit=e=>{e.preventDefault();verify(parse(document.getElementById('answer').value))};else{let box=document.getElementById('choices');t.options.forEach((s,k)=>{let b=document.createElement('button');b.textContent=s;b.onclick=()=>verify(k);box.appendChild(b)})}document.getElementById('hint').onclick=function(){helped=true;let box=document.getElementById('hint-text');box.hidden=false;box.textContent=t.hint;document.getElementById('solution').hidden=false;this.hidden=true};document.getElementById('solution').ontoggle=function(){if(this.open)helped=true};document.getElementById('next').onclick=advance;window.scrollTo(0,0)}
try{home()}catch(e){app.innerHTML='<section class="card"><h2>Не удалось открыть модуль</h2><pre id="error"></pre></section>';document.getElementById('error').textContent=String(e.message||e)}
})();
</script></body></html>
