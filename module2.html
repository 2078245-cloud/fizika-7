<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142638"><title>Движение, масса и плотность</title><style>*{box-sizing:border-box}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}body{margin:0;background:#eef3f7;color:#172c3e;font:18px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow-wrap:anywhere}.wrap{max-width:900px;margin:auto}header{background:linear-gradient(130deg,#142638,#21564f);color:white;padding:32px 20px}header p{color:#dce9f1}h1{font-size:clamp(29px,7vw,43px);line-height:1.25}h2{font-size:26px;line-height:1.35;margin-top:0}h3{font-size:21px}main{padding:24px 15px}.card{background:white;border:1px solid #dce5ed;border-radius:19px;padding:24px;margin-bottom:20px}p{margin:0 0 16px}.muted,figcaption{font-size:15px;color:#526879}.tag{display:inline-block;background:#e5f6ef;color:#176344;border-radius:22px;padding:5px 12px;font-size:14px;margin-bottom:14px}button,.link{display:block;width:100%;padding:14px;margin-top:12px;min-height:50px;border:2px solid #dce5ed;border-radius:13px;color:#172c3e;background:#f7fafc;text-decoration:none;text-align:left;font:inherit;line-height:1.5;cursor:pointer;touch-action:manipulation}.primary{background:#237f62;border-color:#237f62;color:white;text-align:center}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #237f62;outline-offset:3px}button:disabled,input:disabled{opacity:.7;cursor:default}input{width:100%;padding:14px;border:2px solid #bdced9;border-radius:12px;font:inherit;font-size:21px}.feedback{padding:16px;border-radius:12px;margin-top:16px}.good{background:#e5f6ef;color:#15583e}.hint{background:#fff3d8;color:#704d10}figure{margin:0}svg{display:block;width:100%;height:auto;max-width:650px;margin:auto}figcaption{margin-top:10px}.flow{padding-left:25px}.flow li{padding:10px;margin:12px 0;background:#eef7fa;border-radius:10px}.bar{height:10px;background:#e5edf2;border-radius:10px;overflow:hidden;margin:16px 0}.bar div{height:100%;background:#237f62}footer{padding:0 20px 28px;text-align:center;font-size:14px;color:#526879}a{color:#176344}summary{cursor:pointer}.nav{display:flex;gap:10px;flex-wrap:wrap}.nav a{flex:1;min-width:180px}@media(max-width:480px){.card{padding:18px}body{font-size:17px}}</style></head><body><header><div class="wrap"><p>ФИЗИКА · 7 КЛАСС</p><h1>Движение, масса и плотность</h1><p>Три урока с рисунками, блок-схемами и задачами</p></div></header><main id="app" class="wrap"><section class="card"><h2>Загрузка…</h2></section></main><noscript>Для заданий нужен JavaScript.</noscript><footer>Модуль 2 · Версия 1.0</footer><script>
(function(){'use strict';
const LESSONS=[{"id": "motion", "title": "Движение, путь и скорость", "subtitle": "Minecraft, условная техника и поход", "sections": [["1. Относительно чего движется тело?", "<p>Движение — изменение положения тела относительно другого тела со временем. Рыбак может покоиться относительно лодки и двигаться относительно берега.<\/p><p>Траектория — линия движения. Путь, обозначаемый s, — длина этой линии. Не путай его с расстоянием по прямой между началом и концом.<\/p>"], ["2. Скорость словами, затем формулой", "<p>На учебной карте модель прошла 12 м за 4 с. На каждую секунду в среднем приходится 12 ÷ 4 = 3 м.<\/p><p><strong>v = s ÷ t<\/strong>: скорость равна пути, делённому на время. Буква v — скорость, s — путь, t — время. 3 м/с читается «три метра в секунду».<\/p><p>Если движение равномерное: путь s = v × t; время t = s ÷ v. Единицы нужно согласовывать: для м/с — метры и секунды.<\/p>"], ["3. Единицы и средняя скорость", "<p>В 1 км — 1000 м, в 1 ч — 3600 с. Поэтому км/ч переводят в м/с делением на 3,6. Например, 36 км/ч = 10 м/с.<\/p><p>Это скорость условной машины в задаче, а не характеристика конкретной техники War Thunder.<\/p><p>Средняя скорость за весь маршрут — весь путь, делённый на всё время этого интервала. Привал входит во время, но не добавляет путь. Среднее арифметическое скоростей участков подходит не всегда.<\/p>"]], "diagrams": [{"svg": "<svg viewBox=\"0 0 600 260\" role=\"img\" aria-label=\"Условный маршрут: по 3 метра за каждую секунду\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"260\" rx=\"16\" fill=\"#eef7fa\"/><path d=\"M65 120H535\" stroke=\"#31566c\" stroke-width=\"5\"/><rect x=\"45\" y=\"100\" width=\"40\" height=\"40\" rx=\"5\" fill=\"#279c78\"/><text x=\"65\" y=\"175\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"17\" fill=\"#173449\">0 м<\/text><text x=\"65\" y=\"75\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"17\" fill=\"#173449\">0 с<\/text><rect x=\"160\" y=\"100\" width=\"40\" height=\"40\" rx=\"5\" fill=\"#279c78\"/><text x=\"180\" y=\"175\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"17\" fill=\"#173449\">3 м<\/text><text x=\"180\" y=\"75\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"17\" fill=\"#173449\">1 с<\/text><rect x=\"275\" y=\"100\" width=\"40\" height=\"40\" rx=\"5\" fill=\"#279c78\"/><text x=\"295\" y=\"175\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"17\" fill=\"#173449\">6 м<\/text><text x=\"295\" y=\"75\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"17\" fill=\"#173449\">2 с<\/text><rect x=\"390\" y=\"100\" width=\"40\" height=\"40\" rx=\"5\" fill=\"#279c78\"/><text x=\"410\" y=\"175\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"17\" fill=\"#173449\">9 м<\/text><text x=\"410\" y=\"75\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"17\" fill=\"#173449\">3 с<\/text><rect x=\"505\" y=\"100\" width=\"40\" height=\"40\" rx=\"5\" fill=\"#279c78\"/><text x=\"525\" y=\"175\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"17\" fill=\"#173449\">12 м<\/text><text x=\"525\" y=\"75\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"17\" fill=\"#173449\">4 с<\/text><text x=\"300\" y=\"224\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"19\" fill=\"#173449\">Учебная карта: за 4 с пройдено 12 м<\/text><\/svg>", "caption": "Учебный масштаб: одна ступень маршрута — 3 м. Это не справочник игровой скорости."}, {"svg": "<svg viewBox=\"0 0 600 260\" role=\"img\" aria-label=\"Движение 4 км за час и привал один час\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"260\" rx=\"16\" fill=\"#eef7fa\"/><rect x=\"30\" y=\"85\" width=\"250\" height=\"80\" rx=\"12\" fill=\"#a9dbf0\"/><rect x=\"310\" y=\"85\" width=\"260\" height=\"80\" rx=\"12\" fill=\"#ffe3aa\"/><text x=\"155\" y=\"118\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"19\" fill=\"#173449\">Движение: 1 час<\/text><text x=\"155\" y=\"148\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"19\" fill=\"#173449\">Путь: 4 км<\/text><text x=\"440\" y=\"118\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"19\" fill=\"#173449\">Привал: 1 час<\/text><text x=\"440\" y=\"148\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"19\" fill=\"#173449\">Путь: 0 км<\/text><text x=\"300\" y=\"220\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">Средняя скорость = весь путь ÷ всё время<\/text><\/svg>", "caption": "Привал включён в рассматриваемый интервал. 4 км за 2 часа дают 2 км/ч."}], "flow": ["Назови неизвестное: v, s или t", "Выпиши данные и согласуй единицы", "Выбери: v = s/t; s = vt; t = s/v", "Посчитай и запиши единицу", "Проверь смысл ответа"], "activity": "Нарисуй маршрут до места рыбалки. Укажи участок движения и привал. Без измерений не выдавай предполагаемые числа за фактические.", "tasks": [{"id": "s1", "title": "Скорость на карте", "q": "В учебной карте путь 20 м пройден за 5 с. Найди среднюю скорость.", "answer": 4, "unit": "м/с", "hint": "Раздели весь путь на время.", "solution": "v = 20 ÷ 5 = 4 м/с.", "type": "number"}, {"id": "s2", "title": "Путь модели", "q": "Модель движется равномерно 3 м/с в течение 6 с. Найди путь.", "answer": 18, "unit": "м", "hint": "Каждую секунду она проходит 3 м. Возьми 3 шесть раз.", "solution": "s = 3 × 6 = 18 м.", "type": "number"}, {"id": "s3", "title": "Время маршрута", "q": "Условная машина равномерно проходит 40 м со скоростью 8 м/с. Сколько времени нужно?", "answer": 5, "unit": "с", "hint": "Сколько промежутков по 8 м помещается в 40 м?", "solution": "t = 40 ÷ 8 = 5 с.", "type": "number"}, {"id": "s4", "title": "Поход с привалом", "q": "Группа прошла 6 км за 2 часа, затем отдыхала 1 час. Найди среднюю скорость за все 3 часа.", "answer": 2, "unit": "км/ч", "hint": "Весь путь 6 км, всё время 2 + 1 = 3 часа.", "solution": "vср = 6 ÷ 3 = 2 км/ч.", "type": "number"}, {"id": "s5", "title": "Перевод скорости", "q": "Скорость условной машины 18 км/ч. Вырази её в м/с.", "answer": 5, "unit": "м/с", "hint": "Для перевода км/ч в м/с раздели на 3,6.", "solution": "18 ÷ 3,6 = 5 м/с.", "type": "number"}]}, {"id": "mass", "title": "Инерция, взаимодействие и масса", "subtitle": "LEGO-тележка и грузы стратегии", "sections": [["1. Почему тележка останавливается?", "<p>Катящаяся тележка на полу тормозит из-за взаимодействия с поверхностью и воздухом. Движение не «заканчивается само».<\/p><p>Инерция — сохранение скорости, когда воздействия других тел отсутствуют или скомпенсированы. Изменение скорости или направления связано с взаимодействием.<\/p>"], ["2. Что характеризует масса?", "<p>Масса характеризует инертность тела: при сопоставимом воздействии движение более массивного тела труднее одинаково быстро изменить.<\/p><p>Массу обозначают m. Единица СИ — килограмм, кг. 1 кг = 1000 г; 1 г = 0,001 кг; 1 т = 1000 кг. Например, 500 г = 0,5 кг.<\/p><p>В игре «масса» может быть условной характеристикой. В наших задачах масса явно задана как физическая величина.<\/p>"], ["3. Как взвесить модель?", "<p>Сначала проверь нуль весов и допустимую нагрузку. Если модель лежит в контейнере, из общей массы нужно вычесть массу пустого контейнера.<\/p><p>Например: пустой контейнер 100 г, вместе с моделью 350 г. Масса модели 350 − 100 = 250 г.<\/p><p>Масса и сила — разные величины. Массу записывают в кг, а не в ньютонах. Различие веса и силы тяжести разберём отдельно.<\/p>"]], "diagrams": [{"svg": "<svg viewBox=\"0 0 600 260\" role=\"img\" aria-label=\"Масса пустого контейнера 150 граммов, контейнера с моделью 900 граммов\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"260\" rx=\"16\" fill=\"#eef7fa\"/><rect x=\"70\" y=\"100\" width=\"190\" height=\"100\" rx=\"12\" fill=\"#d3e4eb\"/><rect x=\"95\" y=\"137\" width=\"140\" height=\"40\" rx=\"5\" fill=\"white\"/><text x=\"165\" y=\"165\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"25\" fill=\"#173449\">150 г<\/text><rect x=\"340\" y=\"100\" width=\"190\" height=\"100\" rx=\"12\" fill=\"#d3e4eb\"/><rect x=\"365\" y=\"137\" width=\"140\" height=\"40\" rx=\"5\" fill=\"white\"/><text x=\"435\" y=\"165\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"25\" fill=\"#173449\">900 г<\/text><path d=\"M90 65v30h150V65\" fill=\"none\" stroke=\"#31566c\" stroke-width=\"4\"/><rect x=\"365\" y=\"45\" width=\"140\" height=\"48\" rx=\"5\" fill=\"#279c78\"/><text x=\"165\" y=\"232\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"19\" fill=\"#173449\">Контейнер<\/text><text x=\"435\" y=\"232\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"17\" fill=\"#173449\">Контейнер + модель<\/text><\/svg>", "caption": "Условные показания весов. Масса модели: 900 − 150 = 750 г. Это не реальные измерения ученика."}], "flow": ["Проверь нуль и предел весов", "Взвесь сухой пустой контейнер", "Взвесь контейнер с моделью", "Вычти массу контейнера", "Переведи г в кг, если требуется"], "activity": "Если есть весы, взвесь сухую небольшую LEGO-модель. Не используй мокрые, горячие и чрезмерно тяжёлые предметы. Если весов нет, разбери рисунок словами.", "tasks": [{"id": "m1", "title": "Причина остановки", "q": "Почему тележка, катящаяся по полу, обычно останавливается?", "options": ["Потому что на неё действуют сопротивление и трение", "Потому что всякое движение обязательно прекращается само"], "answer": 0, "hint": "Подумай о взаимодействии колёс, поверхности и воздуха.", "solution": "На движение влияют взаимодействия с поверхностью и воздухом.", "type": "choice"}, {"id": "m2", "title": "Граммы в килограммы", "q": "Масса модели 250 г. Вырази массу в кг.", "answer": 0.25, "unit": "кг", "hint": "В одном килограмме 1000 граммов: раздели на 1000.", "solution": "250 ÷ 1000 = 0,25 кг.", "type": "number"}, {"id": "m3", "title": "Контейнер и модель", "q": "Пустой контейнер 150 г, контейнер с моделью 900 г. Найди массу модели.", "answer": 750, "unit": "г", "hint": "Общая масса включает контейнер. Его массу нужно вычесть.", "solution": "900 − 150 = 750 г.", "type": "number"}, {"id": "m4", "title": "Единица массы", "q": "В какой записи указана масса?", "options": ["2 кг", "2 м/с", "2 секунды"], "answer": 0, "hint": "Килограмм — единица массы; м/с — скорости; секунда — времени.", "solution": "Верно: 2 кг — масса.", "type": "choice"}]}, {"id": "density", "title": "Плотность, масса и объём", "subtitle": "Камень, пластилин и доставка ресурсов", "sections": [["1. Одинаковый объём — разная масса", "<p>Два сплошных образца одинакового объёма могут иметь разные массы. Плотность показывает массу единицы объёма.<\/p><p><strong>ρ = m ÷ V<\/strong>. Буква ρ читается «ро», m — масса, V — объём. Например, 60 г материала занимают 40 см³: ρ = 60 ÷ 40 = 1,5 г/см³.<\/p><p>Это учебный образец, а не универсальная плотность любого пластилина или детали LEGO.<\/p>"], ["2. Как выбрать формулу и единицы?", "<p>Плотность: ρ = m/V. Масса: m = ρV. Объём: V = m/ρ.<\/p><p>Если масса в г, а объём в см³, плотность получается в г/см³. В СИ: кг/м³. 1 г/см³ = 1000 кг/м³; например, 1,5 г/см³ = 1500 кг/м³.<\/p><p>1 мл = 1 см³. 1 л = 0,001 м³; 1 см³ = 0,000001 м³. Новые переводы лучше тренировать отдельно от новой формулы.<\/p>"], ["3. Что важно не перепутать?", "<p>Для маленького непористого, нерастворимого тонущего камня объём находят по подъёму уровня воды: V = V₂ − V₁. Камень полностью погружают без расплескивания и пузырьков.<\/p><p>Сначала взвешивают сухой камень, потом измеряют его объём водой. Совпадение плотности со справочником позволяет предположить материал, но не доказывает состав однозначно.<\/p><p>Различай плотность материала и среднюю плотность полой модели. У щебня есть промежутки между камнями: плотность цельной породы и насыпная плотность — не одно и то же.<\/p>"]], "diagrams": [{"svg": "<svg viewBox=\"0 0 600 260\" role=\"img\" aria-label=\"Два условных сплошных образца по 10 см³ с разной массой\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"260\" rx=\"16\" fill=\"#eef7fa\"/><rect x=\"70\" y=\"70\" width=\"160\" height=\"120\" rx=\"12\" fill=\"#a9dbf0\"/><rect x=\"370\" y=\"70\" width=\"160\" height=\"120\" rx=\"12\" fill=\"#ffd7a2\"/><text x=\"150\" y=\"40\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"19\" fill=\"#173449\">Одинаковый объём<\/text><text x=\"450\" y=\"40\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"19\" fill=\"#173449\">Одинаковый объём<\/text><text x=\"150\" y=\"116\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"23\" fill=\"#173449\">10 см³<\/text><text x=\"150\" y=\"155\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"23\" fill=\"#173449\">10 г<\/text><text x=\"450\" y=\"116\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"23\" fill=\"#173449\">10 см³<\/text><text x=\"450\" y=\"155\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"23\" fill=\"#173449\">20 г<\/text><text x=\"150\" y=\"235\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"19\" fill=\"#173449\">1 г/см³<\/text><text x=\"450\" y=\"235\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"19\" fill=\"#173449\">2 г/см³<\/text><\/svg>", "caption": "Сравнение двух разных условных материалов. Плотность — не «просто тяжесть». Всегда учитывай объём."}, {"svg": "<svg viewBox=\"0 0 600 260\" role=\"img\" aria-label=\"Измерение объёма маленького камня вытеснением воды\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"260\" rx=\"16\" fill=\"#eef7fa\"/><path d=\"M90 60v130h120V60M390 60v130h120V60\" stroke=\"#31566c\" stroke-width=\"3\" fill=\"white\"/><path d=\"M93 130h114v57H93Z\" fill=\"#a9dbf0\"/><path d=\"M393 100h114v87H393Z\" fill=\"#a9dbf0\"/><ellipse cx=\"450\" cy=\"150\" rx=\"30\" ry=\"20\" fill=\"#8396a2\"/><text x=\"150\" y=\"227\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"19\" fill=\"#173449\">До: 50 мл<\/text><text x=\"450\" y=\"227\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"19\" fill=\"#173449\">После: 70 мл<\/text><text x=\"300\" y=\"125\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"35\" fill=\"#173449\">→<\/text><text x=\"300\" y=\"35\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"19\" fill=\"#173449\">Объём камня: 70 − 50 = 20 см³<\/text><\/svg>", "caption": "Подъём уровня воды даёт объём камня, а не его массу."}], "flow": ["Назови неизвестное: ρ, m или V", "Выбери согласованные единицы", "Используй ρ = m/V; m = ρV; V = m/ρ", "Подставь данные и посчитай", "Проверь единицу и смысл"], "activity": "Слепи шар и лепёшку из одного куска пластилина без потери материала. Объясни, почему новая форма сама по себе не означает новую массу. Измерения без приборов не выдумывай.", "tasks": [{"id": "d1", "title": "Найди плотность", "q": "Сплошной образец массой 60 г занимает 40 см³. Найди плотность.", "answer": 1.5, "unit": "г/см³", "hint": "Плотность — масса, делённая на объём.", "solution": "ρ = 60 ÷ 40 = 1,5 г/см³.", "type": "number"}, {"id": "d2", "title": "Масса материала", "q": "Плотность материала 1,2 г/см³, объём 50 см³. Найди массу.", "answer": 60, "unit": "г", "hint": "В каждом см³ содержится 1,2 г. Умножь на 50.", "solution": "m = 1,2 × 50 = 60 г.", "type": "number"}, {"id": "d3", "title": "Какой объём?", "q": "Масса сплошного образца 120 г, плотность 2 г/см³. Найди объём.", "answer": 60, "unit": "см³", "hint": "Раздели массу на плотность.", "solution": "V = 120 ÷ 2 = 60 см³.", "type": "number"}, {"id": "d4", "title": "Плотность в СИ", "q": "Вырази 1,5 г/см³ в кг/м³.", "answer": 1500, "unit": "кг/м³", "hint": "Для этого перевода умножь на 1000.", "solution": "1,5 × 1000 = 1500 кг/м³.", "type": "number"}]}],KEY='fizika7-module2-v1',app=document.getElementById('app');
const ALL=LESSONS.flatMap(l=>l.tasks);let failed=false;
function load(){try{let p=JSON.parse(localStorage.getItem(KEY));let ids=new Set(ALL.map(t=>t.id));return{done:p&&Array.isArray(p.done)?[...new Set(p.done.filter(id=>ids.has(id)))]:[],help:p&&Array.isArray(p.help)?p.help.filter(id=>ids.has(id)):[]}}catch(e){return{done:[],help:[]}}}
let state=load();function save(){try{localStorage.setItem(KEY,JSON.stringify(state));failed=false}catch(e){failed=true}}
function notice(){return failed?'<p class="feedback hint" role="status">Прогресс не удалось сохранить в браузере. Сами задания работают.</p>':''}
function nav(){return '<nav class="nav" aria-label="Разделы сайта"><a class="link" href="./start.html">Общее меню</a><a class="link" href="./index.html">Вводный блок и модуль 1</a><a class="link" href="./volume.html">Тренажёр объёма</a></nav>'}
function home(){app.innerHTML=`<section class="card"><span class="tag">Модуль 2 · Версия 1.0</span><h2>Три урока и 13 задач</h2><p>Начни со скорости, затем переходи к массе и плотности. Это учебный блок, а не контрольная: подсказки разрешены.</p><div class="bar" role="progressbar" aria-label="Выполненные задачи" aria-valuemin="0" aria-valuemax="${ALL.length}" aria-valuenow="${state.done.length}"><div style="width:${state.done.length/ALL.length*100}%"></div></div><p class="muted">Выполнено ${state.done.length} из ${ALL.length}. Верный ответ не заменяет объяснение своими словами.</p><div id="lesson-list"></div>${notice()}</section><section class="card"><h2>Перед началом</h2><p>Для задач нужны сложение, вычитание, умножение и деление. Если действие непонятно, разберись с ним отдельно — это не ошибка в физике.</p><p class="muted">Вводи дроби через запятую или точку: 0,25 и 0.25 принимаются одинаково. Все игровые числа — учебные условия, не характеристики игр.</p></section>${nav()}<details class="card" style="margin-top:20px"><summary>Источники и ограничения</summary><p class="muted">Темы адаптированы из исходного курса физики 7 класса. Скорость: <a href="https://www.bbc.co.uk/bitesize/articles/zcr3tv4" target="_blank" rel="noopener noreferrer">BBC Bitesize</a>. Плотность: <a href="https://www.bbc.co.uk/bitesize/topics/zqcfjfr/watch/z9tfwsg" target="_blank" rel="noopener noreferrer">BBC Bitesize</a>. Порядок школьных тем сверяют с учителем.</p><p class="muted">Прогресс хранится в этом браузере; автоматически между устройствами не переносится. Не используй настоящую технику, тяжёлые грузы или глубокую воду для проверки задач.</p></details>`;const list=document.getElementById('lesson-list');LESSONS.forEach((l,i)=>{let b=document.createElement('button');let n=l.tasks.filter(t=>state.done.includes(t.id)).length;b.textContent=(i+1)+'. '+l.title+' — '+n+'/'+l.tasks.length;b.onclick=()=>openLesson(i);list.appendChild(b)});window.scrollTo(0,0)}
function openLesson(i){const l=LESSONS[i];app.innerHTML=`<button id="back">← К урокам модуля</button><section class="card" style="margin-top:18px"><span class="tag">Урок ${i+1} из 3</span><h2>${l.title}</h2><p class="muted">${l.subtitle}</p>${l.sections.map(s=>'<h3>'+s[0]+'</h3>'+s[1]).join('')}</section>${l.diagrams.map(d=>'<section class="card"><h2>Посмотри на рисунок</h2><figure>'+d.svg+'<figcaption>'+d.caption+'</figcaption></figure></section>').join('')}<section class="card"><h2>Схема решения</h2><ol class="flow">${l.flow.map(s=>'<li>'+s+'</li>').join('')}</ol></section><section class="card"><h2>Самостоятельные задачи</h2><div id="tasks"></div></section><section class="card"><h2>Попробуй вне экрана</h2><p>${l.activity}</p></section>${nav()}`;document.getElementById('back').onclick=home;const list=document.getElementById('tasks');l.tasks.forEach((t,k)=>{const b=document.createElement('button');b.textContent=(k+1)+'. '+t.title+(state.done.includes(t.id)?(state.help.includes(t.id)?' — с помощью':' — выполнено'):'');b.onclick=()=>openTask(i,k);list.appendChild(b)});window.scrollTo(0,0)}
function parse(value){const s=value.trim().replace(',','.');return /^\d+(?:\.\d+)?$/.test(s)?Number(s):null}
function openTask(li,ti){const l=LESSONS[li],t=l.tasks[ti];let helped=false,solved=false;app.innerHTML=`<button id="lesson-back">← К объяснению урока</button><section class="card" style="margin-top:18px"><span class="tag">Задача ${ti+1} из ${l.tasks.length}</span><h2>${t.title}</h2><p>${t.q}</p>${t.type==='number'?'<form id="answer-form" novalidate><label for="answer">Ответ, '+t.unit+'</label><input id="answer" type="text" inputmode="decimal" autocomplete="off" aria-describedby="answer-note"><p class="muted" id="answer-note">Введи только число. Единица уже указана.</p><button id="check" type="submit" class="primary">Проверить</button></form>':'<div id="choices"></div>'}<button id="hint">Подсказка</button><div id="feedback" role="status" aria-live="polite" hidden></div><div id="hint-text" role="status" class="feedback hint" hidden></div><details id="solution" hidden><summary>Открыть полный разбор</summary><p>${t.solution}</p></details><button id="next" class="primary" hidden>${ti<l.tasks.length-1?'Следующая задача →':li<LESSONS.length-1?'Следующий урок →':'К меню модуля'}</button><div id="storage-status"></div></section>`;document.getElementById('lesson-back').onclick=()=>openLesson(li);const fb=document.getElementById('feedback');function message(text,correct){fb.hidden=false;fb.className='feedback '+(correct?'good':'hint');fb.textContent=text}function verify(value){if(solved)return;if(value===null||!Number.isFinite(value)){message('Введи число: например 5 или 0,25.',false);return}if(Math.abs(value-t.answer)>1e-8){helped=true;message('Пока не совпало. Проверь единицы и выбранное действие. Можно открыть подсказку.',false);return}solved=true;if(!state.done.includes(t.id))state.done.push(t.id);if(helped&&!state.help.includes(t.id))state.help.push(t.id);save();message('Верно! '+t.solution,true);if(t.type==='number'){document.getElementById('answer').disabled=true;document.getElementById('check').disabled=true}else{document.getElementById('choices').querySelectorAll('button').forEach(b=>b.disabled=true)}document.getElementById('hint').hidden=true;document.getElementById('next').hidden=false;document.getElementById('storage-status').innerHTML=notice()}
if(t.type==='number'){document.getElementById('answer-form').onsubmit=e=>{e.preventDefault();verify(parse(document.getElementById('answer').value))}}else{let choices=document.getElementById('choices');t.options.forEach((s,i)=>{let b=document.createElement('button');b.textContent=s;b.onclick=()=>verify(i);choices.appendChild(b)})}
document.getElementById('hint').onclick=function(){helped=true;let box=document.getElementById('hint-text');box.hidden=false;box.textContent=t.hint;document.getElementById('solution').hidden=false;this.hidden=true};document.getElementById('solution').ontoggle=function(){if(this.open)helped=true};document.getElementById('next').onclick=()=>{if(ti<l.tasks.length-1)openTask(li,ti+1);else if(li<LESSONS.length-1)openLesson(li+1);else home()};window.scrollTo(0,0)}
try{home()}catch(e){app.innerHTML='<section class="card"><h2>Не удалось открыть модуль</h2><pre id="error"></pre></section>';document.getElementById('error').textContent=String(e.message||e)}
})();
</script></body></html>
