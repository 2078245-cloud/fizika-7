<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142638"><title>Закон сохранения энергии</title><style>*{box-sizing:border-box}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}body{margin:0;background:#eef3f7;color:#172c3e;font:18px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow-wrap:anywhere}.wrap{max-width:900px;margin:auto}header{padding:32px 20px;background:linear-gradient(130deg,#142638,#21564f);color:white}header p{color:#dce9f1}h1{font-size:clamp(29px,7vw,43px);line-height:1.25}h2{font-size:26px;line-height:1.35;margin-top:0}h3{font-size:21px}main{padding:24px 15px}.card{background:white;border:1px solid #dce5ed;border-radius:19px;padding:24px;margin-bottom:20px}p{margin:0 0 16px}.muted,figcaption{font-size:15px;color:#526879}.tag{display:inline-block;background:#e5f6ef;color:#176344;border-radius:22px;padding:5px 12px;font-size:14px;margin-bottom:14px}button,.link{display:block;width:100%;padding:14px;margin-top:12px;min-height:50px;border:2px solid #dce5ed;border-radius:13px;color:#172c3e;background:#f7fafc;text-decoration:none;text-align:left;font:inherit;line-height:1.5;cursor:pointer;touch-action:manipulation}.primary{background:#237f62;border-color:#237f62;color:white;text-align:center}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #237f62;outline-offset:3px}button:disabled,input:disabled{opacity:.7;cursor:default}input:not([type="range"]),select{width:100%;padding:14px;border:2px solid #bdced9;border-radius:12px;font:inherit;font-size:20px}input[type="range"]{width:100%;min-height:44px;accent-color:#237f62}label{display:block;margin:14px 0 6px}.feedback{padding:16px;border-radius:12px;margin-top:16px}.good{background:#e5f6ef;color:#15583e}.hint{background:#fff3d8;color:#704d10}figure{margin:0}svg{display:block;width:100%;height:auto;max-width:650px;margin:auto}figcaption{margin-top:10px}.flow{padding-left:25px}.flow li{padding:10px;margin:12px 0;background:#eef7fa;border-radius:10px}.bar{height:10px;background:#e5edf2;border-radius:10px;overflow:hidden;margin:16px 0}.bar div{height:100%;background:#237f62}.energybar{height:18px;border-radius:8px;background:#e5edf2;overflow:hidden;margin:6px 0 14px}.energybar div{height:100%}footer{padding:0 20px 28px;text-align:center;font-size:14px;color:#526879}a{color:#176344}summary{cursor:pointer}.nav{display:flex;gap:10px;flex-wrap:wrap}.nav a{flex:1;min-width:180px}@media(max-width:480px){.card{padding:18px}body{font-size:17px}}</style></head><body><header><div class="wrap"><p>ФИЗИКА · 7 КЛАСС</p><h1>Закон сохранения энергии</h1><p>От поднятого груза до движения и внутренней энергии</p></div></header><main id="app" class="wrap"><section class="card"><h2>Загрузка…</h2></section></main><footer>Сохранение энергии · Версия 1.0</footer><noscript>Для заданий нужен JavaScript.</noscript><script>
(function(){'use strict';
const TASKS=[{"id": "e1", "title": "Поднятый груз", "q": "Груз массой 2 кг находится на высоте 3 м над выбранным нулевым уровнем. Найди Eп при g = 10 Н/кг.", "type": "number", "answer": 60, "unit": "Дж", "hints": ["Используй Eп = mgh.", "Умножь 2 × 10 × 3."], "solution": "Eп = 2 × 10 × 3 = 60 Дж.", "group": "А · Энергия и превращения"}, {"id": "e2", "title": "Подняли вдвое выше", "q": "Масса и g прежние, а высота над тем же нулевым уровнем стала вдвое больше. Что с Eп?", "type": "choice", "options": ["Стала вдвое больше", "Не изменилась", "Стала в четыре раза больше"], "answer": 0, "hints": ["В Eп = mgh высота входит без квадрата.", "Удвоение одного множителя удваивает произведение."], "solution": "При неизменных m и g потенциальная энергия относительно того же уровня удваивается.", "group": "А · Энергия и превращения"}, {"id": "e3", "title": "Механическая энергия", "q": "В выбранном положении Eп = 30 Дж, Eк = 20 Дж. Найди механическую энергию.", "type": "number", "answer": 50, "unit": "Дж", "hints": ["Механическая энергия — сумма Eп и Eк.", "Сложи 30 и 20."], "solution": "Eмех = 30 + 20 = 50 Дж.", "group": "А · Энергия и превращения"}, {"id": "e4", "title": "Внизу горки", "q": "В начале Eп = 80 Дж, Eк = 0. Трения и сопротивления нет, внешняя энергия не поступает. Внизу выбран Eп = 0. Найди Eк внизу.", "type": "number", "answer": 80, "unit": "Дж", "hints": ["Механическая энергия сохраняется.", "Начальная сумма 80 Дж; внизу потенциальная часть нулевая."], "solution": "Eк = 80 Дж. В этой модели вся начальная Eп стала кинетической.", "group": "А · Энергия и превращения"}, {"id": "e5", "title": "Промежуточное положение", "q": "Без трения механическая энергия системы равна 100 Дж. В некотором положении Eп = 40 Дж. Найди Eк.", "type": "number", "answer": 60, "unit": "Дж", "hints": ["Eп + Eк = 100 Дж.", "Из 100 вычти 40."], "solution": "Eк = 100 − 40 = 60 Дж.", "group": "Б · Баланс и трение"}, {"id": "e6", "title": "Переход во внутреннюю энергию", "q": "В изолированной модели изначально было 120 Дж механической энергии, после движения — 90 Дж. Убыль перешла только во внутреннюю энергию системы. Найди увеличение внутренней энергии.", "type": "number", "answer": 30, "unit": "Дж", "hints": ["Общая энергия не исчезает; механическая часть уменьшилась.", "Найди разность 120 − 90."], "solution": "ΔU = 120 − 90 = 30 Дж.", "group": "Б · Баланс и трение"}, {"id": "e7", "title": "Собери баланс", "q": "В модели Eп = 80 Дж, Eк = 70 Дж, увеличение внутренней энергии относительно начала ΔU = 50 Дж. Найди учитываемую сумму Eп + Eк + ΔU.", "type": "number", "answer": 200, "unit": "Дж", "hints": ["Нужно сложить все три части.", "80 + 70 + 50."], "solution": "Eп + Eк + ΔU = 80 + 70 + 50 = 200 Дж. Это баланс относительно выбранного начального уровня внутренней энергии.", "group": "Б · Баланс и трение"}, {"id": "e8", "title": "Куда делась энергия?", "q": "Груз затормозился из-за трения. Какое утверждение верно?", "type": "choice", "options": ["Кинетическая энергия бесследно уничтожилась", "Часть механической энергии перешла во внутреннюю энергию взаимодействующих тел"], "answer": 1, "hints": ["Включи в систему груз и поверхность.", "Снижение механической энергии не означает нарушения общего закона сохранения."], "solution": "Трение может увеличивать внутреннюю энергию груза и поверхности. Нужно учитывать выбранную систему и возможный обмен с окружением.", "group": "Б · Баланс и трение"}, {"id": "e9", "title": "Кинетическая энергия — расширение", "q": "Для этой задачи используй Eк = mv²/2. Масса скользящей модели 0,5 кг, скорость 4 м/с; вращения нет. Найди Eк.", "type": "number", "answer": 4, "unit": "Дж", "hints": ["Сначала v² = 4 × 4 = 16.", "Умножь 0,5 на 16 и раздели на 2."], "solution": "Eк = 0,5 × 16/2 = 4 Дж.", "group": "В · Расчётное расширение"}, {"id": "e10", "title": "Удвоение скорости — расширение", "q": "Масса прежняя. Скорость увеличили вдвое. Во сколько раз выросла кинетическая энергия Eк = mv²/2?", "type": "number", "answer": 4, "unit": "раз", "hints": ["Скорость входит в квадрате.", "(2v)² = 4v²."], "solution": "Кинетическая энергия увеличилась в 4 раза. Это утверждение об энергии, не универсальное правило полного остановочного пути.", "group": "В · Расчётное расширение"}, {"id": "e11", "title": "Скорость внизу — расширение", "q": "Материальная точка отпущена из покоя с высоты 5 м и скользит без трения и вращения до уровня h = 0. g = 10 Н/кг. Используй v = √(2gH). Найди скорость внизу.", "type": "number", "answer": 10, "unit": "м/с", "hints": ["Под корнем 2 × 10 × 5 = 100.", "Квадратный корень из 100 равен 10."], "solution": "v = √100 = 10 м/с. Это идеальная модель, не задание разгонять настоящую технику.", "group": "В · Расчётное расширение"}, {"id": "e12", "title": "Максимальная высота — расширение", "q": "Груз массой 2 кг начинает вертикальный подъём с Eк = 40 Дж от уровня h = 0. Сопротивления нет, внешняя энергия не поступает. В верхней точке Eк = 0. Найди высоту при g = 10 Н/кг.", "type": "number", "answer": 2, "unit": "м", "hints": ["В верхней точке mgh = 40 Дж.", "h = 40/(2 × 10)."], "solution": "h = 40/20 = 2 м.", "group": "В · Расчётное расширение"}],THEORY="<section class=\"card\"><h2>Главная мысль<\/h2><p>Энергия не возникает из ничего и не исчезает бесследно: она передаётся и превращается. Для изолированной системы общая энергия сохраняется. Для системы, обменивающейся энергией с окружением, нужно учитывать этот обмен.<\/p><p>Важно выбрать систему. Например, для спуска груза с трением можно учитывать груз, направляющую и Землю, а внешним обменом в учебной модели пренебречь.<\/p><\/section><section class=\"card\"><h2>Две формы механической энергии<\/h2><p><strong>Потенциальная энергия: Eп = mgh.<\/strong> Здесь m в кг, h — вертикальная высота в м относительно выбранного нулевого уровня, g задано. Энергия взаимодействия Земли и груза зависит от их положения.<\/p><p><strong>Кинетическая энергия: Eк = mv²/2.<\/strong> Это расчётное расширение: обязательность формулы для вашего класса сверяют с учителем. Здесь рассматриваем поступательное движение без вращения.<\/p><p>Механическая энергия Eмех = Eп + Eк. Единица всех этих энергий — джоуль, Дж.<\/p><\/section><section class=\"card\"><h2>Когда сохраняется именно механическая энергия?<\/h2><p>В рассматриваемом спуске без трения и сопротивления, при отсутствии иных передач энергии, Eп + Eк = const. Уменьшение Eп равно увеличению Eк.<\/p><p>При трении часть механической энергии переходит во внутреннюю. Тогда Eп + Eк не обязана сохраняться. В нашей изолированной модели учитываем Eп + Eк + ΔU = Eнач, где ΔU — увеличение внутренней энергии относительно её начального значения. Остальные постоянные слагаемые опущены.<\/p><p>Нельзя писать «механическая энергия всегда сохраняется». Нельзя и говорить, что энергия трения «исчезла».<\/p><\/section>",DIAGRAMS=[["<svg viewBox=\"0 0 600 300\" role=\"img\" aria-label=\"Груз скользит с горки без вращения: потенциальная энергия переходит в кинетическую без изменения их суммы при отсутствии трения\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"300\" rx=\"16\" fill=\"#eef7fa\"/><path d=\"M75 70L490 240H75Z\" fill=\"#d8e9df\"/><path d=\"M75 70L490 240\" stroke=\"#31566c\" stroke-width=\"5\"/><rect x=\"65\" y=\"40\" width=\"28\" height=\"28\" fill=\"#f5c876\"/><rect x=\"475\" y=\"207\" width=\"28\" height=\"28\" fill=\"#f5c876\"/><text x=\"180\" y=\"40\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">Наверху: Eп больше<\/text><text x=\"390\" y=\"275\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">Внизу: Eк больше<\/text><text x=\"330\" y=\"130\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"20\" fill=\"#173449\">Без трения: Eп + Eк = const<\/text><\/svg>", "Скользящий груз без вращения. Рисунок условный, не фактическая траектория по времени."], ["<svg viewBox=\"0 0 600 300\" role=\"img\" aria-label=\"Выбор нулевого уровня потенциальной энергии: высота отсчитывается вертикально от выбранной линии\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"300\" rx=\"16\" fill=\"#eef7fa\"/><path d=\"M60 235H540\" stroke=\"#31566c\" stroke-width=\"4\"/><rect x=\"275\" y=\"75\" width=\"50\" height=\"50\" rx=\"6\" fill=\"#f5c876\"/><path d=\"M365 100V232\" stroke=\"#237f62\" stroke-dasharray=\"6 5\" stroke-width=\"3\"/><text x=\"430\" y=\"165\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"25\" fill=\"#173449\">h<\/text><text x=\"300\" y=\"275\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"20\" fill=\"#173449\">Нулевой уровень: h = 0; Eп = 0<\/text><text x=\"300\" y=\"35\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">Eп = mgh: высоту выбираем от уровня отсчёта<\/text><\/svg>", "Нулевой уровень выбирают явно. Важны изменения потенциальной энергии при неизменном выборе уровня."], ["<svg viewBox=\"0 0 600 300\" role=\"img\" aria-label=\"Условный баланс: 100 джоулей механической энергии превращаются в 70 джоулей механической и 30 джоулей добавочной внутренней энергии\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"300\" rx=\"16\" fill=\"#eef7fa\"/><rect x=\"45\" y=\"90\" width=\"210\" height=\"80\" rx=\"12\" fill=\"#d1eadd\"/><rect x=\"345\" y=\"65\" width=\"210\" height=\"60\" rx=\"12\" fill=\"#b8e1f2\"/><rect x=\"345\" y=\"150\" width=\"210\" height=\"60\" rx=\"12\" fill=\"#f8dfad\"/><text x=\"150\" y=\"125\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"20\" fill=\"#173449\">Сначала: Eмех<\/text><text x=\"150\" y=\"153\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"22\" fill=\"#173449\">100 Дж<\/text><text x=\"300\" y=\"138\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"35\" fill=\"#173449\">→<\/text><text x=\"450\" y=\"102\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"20\" fill=\"#173449\">Eмех: 70 Дж<\/text><text x=\"450\" y=\"188\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"20\" fill=\"#173449\">ΔU: 30 Дж<\/text><text x=\"300\" y=\"260\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"21\" fill=\"#173449\">100 = 70 + 30. Энергия не исчезла.<\/text><\/svg>", "Внутренняя энергия показана как увеличение ΔU относительно начала, а не абсолютное значение всей внутренней энергии."]],FLOW=["Выбери систему и нулевой уровень высоты", "Запиши начальные энергии", "Проверь: есть ли трение или обмен с окружением?", "Без превращения во внутреннюю используй Eп + Eк = const", "С трением учти ΔU и другие передачи", "Проверь единицы и общий баланс"],KEY='fizika7-energy-v1',app=document.getElementById('app');let failed=false;
function load(){try{let p=JSON.parse(localStorage.getItem(KEY)),ids=new Set(TASKS.map(t=>t.id));return{done:p&&Array.isArray(p.done)?[...new Set(p.done.filter(id=>ids.has(id)))]:[],help:p&&Array.isArray(p.help)?p.help.filter(id=>ids.has(id)):[]}}catch(e){return{done:[],help:[]}}}
let state=load();function save(){try{localStorage.setItem(KEY,JSON.stringify(state));failed=false}catch(e){failed=true}}function notice(){return failed?'<p class="feedback hint" role="status">Прогресс не удалось сохранить в браузере. Задачи доступны.</p>':''}function nav(){return '<nav class="nav" aria-label="Разделы"><a class="link" href="./start.html">Общее меню</a><a class="link" href="./hydraulic.html">Гидравлический пресс</a><a class="link" href="./module3.html">Модуль 3: силы</a></nav>'}
function home(){let basic=TASKS.slice(0,8).filter(t=>state.done.includes(t.id)).length;app.innerHTML=`<section class="card"><span class="tag">Сохранение энергии · Версия 1.0</span><h2>Энергия превращается, но не исчезает</h2><p>Восемь основных и четыре дополнительных расчётных задания. Формулы кинетической энергии и скорости помечены как расширение.</p><div class="bar" role="progressbar" aria-label="Основные задания" aria-valuemin="0" aria-valuemax="8" aria-valuenow="${basic}"><div style="width:${basic/8*100}%"></div></div><p class="muted">Основные: ${basic} из 8. Всего: ${state.done.length} из 12. Это не школьная оценка.</p><button id="memo" class="primary">Объяснение, рисунки и схема</button><button id="model">Модель: спуск с горки</button><button id="continue">Начать / продолжить задачи</button>${notice()}</section><div id="groups"></div>${nav()}<details class="card" style="margin-top:20px"><summary>Источники и ограничения</summary><p class="muted">Сверка: <a href="https://openstax.org/books/university-physics-volume-1/pages/8-3-conservation-of-energy" target="_blank" rel="noopener noreferrer">OpenStax: сохранение механической энергии</a>; <a href="https://www.bbc.co.uk/bitesize/guides/zq2csrd/revision/6" target="_blank" rel="noopener noreferrer">BBC Bitesize: превращения энергии</a>.</p><p class="muted">Это отдельный раздел, не весь модуль 6. Модели не предназначены для расчёта безопасности реальных горок, прыжков и транспорта. Не бросай тяжёлые предметы и не разгоняй настоящую технику.</p><p class="muted">Прогресс только в этом браузере; очистка данных может удалить его. Между устройствами автоматически не переносится.</p></details>`;let groups=document.getElementById('groups');[...new Set(TASKS.map(t=>t.group))].forEach(group=>{let section=document.createElement('section');section.className='card';let title=document.createElement('h2');title.textContent=group;section.appendChild(title);TASKS.forEach((t,i)=>{if(t.group!==group)return;let b=document.createElement('button');b.textContent=(i+1)+'. '+t.title+(state.done.includes(t.id)?(state.help.includes(t.id)?' — с помощью':' — выполнено'):'');b.onclick=()=>task(i);section.appendChild(b)});groups.appendChild(section)});document.getElementById('memo').onclick=memo;document.getElementById('model').onclick=model;document.getElementById('continue').onclick=()=>{let i=TASKS.findIndex(t=>!state.done.includes(t.id));task(i<0?0:i)};window.scrollTo(0,0)}
function memo(){app.innerHTML='<button id="back">← К задачам</button>'+THEORY+DIAGRAMS.map(d=>'<section class="card"><h2>Рассмотри рисунок</h2><figure>'+d[0]+'<figcaption>'+d[1]+'</figcaption></figure></section>').join('')+'<section class="card"><h2>Схема решения</h2><ol class="flow">'+FLOW.map(s=>'<li>'+s+'</li>').join('')+'</ol><button id="first" class="primary">Первая задача</button></section>'+nav();document.getElementById('back').onclick=home;document.getElementById('first').onclick=()=>task(0);window.scrollTo(0,0)}
function model(){app.innerHTML=`<button id="back">← К задачам</button><section class="card" style="margin-top:18px"><span class="tag">Учебная модель · не реальная горка</span><h2>Потенциальная → кинетическая</h2><p>Груз начинает спуск из покоя. Вращение отсутствует, направляющая неподвижна, g = 10 Н/кг. Система включает груз, направляющую и Землю; внешним обменом энергией пренебрегаем. Внизу h = 0.</p><label for="mass">Масса: <span id="mass-label">2</span> кг</label><input id="mass" type="range" min="0.5" max="5" step="0.5" value="2"><label for="height">Начальная высота H: <span id="height-label">5</span> м</label><input id="height" type="range" min="1" max="10" step="1" value="5"><label for="descent">Положение на спуске: <span id="descent-label">0</span>%</label><input id="descent" type="range" min="0" max="100" step="5" value="0"><label for="loss">Доля уменьшения Eп, переходящая во внутреннюю энергию</label><select id="loss"><option value="0">0% — без трения</option><option value="0.2">20% — условное рассеяние</option><option value="0.4">40% — условное рассеяние</option></select><figure><div id="model-svg"></div><figcaption>Ползунок задаёт положение, не время. Показан скользящий груз без вращения. Размеры условны.</figcaption></figure><div id="bars"></div><div id="calculation" class="feedback good" role="status" aria-live="polite"></div><p class="muted">Здесь заданная доля уменьшения Eп превращается в ΔU на каждом участке спуска. Это упрощённая модель рассеяния, не универсальный закон трения. Скорость рассчитывается по Eк = mv²/2 и относится к расчётному расширению.</p></section>${nav()}`;document.getElementById('back').onclick=home;const mass=document.getElementById('mass'),height=document.getElementById('height'),descent=document.getElementById('descent'),loss=document.getElementById('loss');function fmt(n){return String(Math.round(n*1000)/1000).replace('.',',')}function draw(){let m=Number(mass.value),H=Number(height.value),f=Number(descent.value)/100,alpha=Number(loss.value),h=H*(1-f),initial=m*10*H,pot=m*10*h,drop=initial-pot,internal=alpha*drop,kin=drop-internal,total=pot+kin+internal,v=Math.sqrt(2*kin/m),x=85+410*f,y=70+170*f;document.getElementById('mass-label').textContent=fmt(m);document.getElementById('height-label').textContent=fmt(H);document.getElementById('descent-label').textContent=fmt(f*100);document.getElementById('model-svg').innerHTML=`<svg viewBox="0 0 600 300" role="img" aria-label="Груз на спуске: текущая высота ${fmt(h)} метра" xmlns="http://www.w3.org/2000/svg"><rect width="600" height="300" rx="16" fill="#eef7fa"/><path d="M85 70L495 240H85Z" fill="#d8e9df"/><path d="M85 70L495 240" stroke="#31566c" stroke-width="5"/><rect x="${x-12}" y="${y-25}" width="24" height="24" rx="4" fill="#f5c876"/><path d="M45 240H550" stroke="#8298a5" stroke-dasharray="6 4"/><text x="300" y="35" text-anchor="middle" font-size="20" font-family="Arial" fill="#173449">H = ${fmt(H)} м; h = ${fmt(h)} м</text><text x="300" y="282" text-anchor="middle" font-size="18" font-family="Arial" fill="#173449">Нулевой уровень высоты — линия основания</text></svg>`;document.getElementById('bars').innerHTML=[['Eп',pot,'#237f62'],['Eк',kin,'#287eb4'],['ΔU',internal,'#d58b27']].map(a=>'<p class="muted">'+a[0]+': '+fmt(a[1])+' Дж</p><div class="energybar" role="img" aria-label="'+a[0]+' '+fmt(a[1])+' джоулей"><div style="width:'+(a[1]/initial*100)+'%;background:'+a[2]+'"></div></div>').join('');document.getElementById('calculation').textContent='Начальная учитываемая энергия: '+fmt(initial)+' Дж. Eп = '+fmt(pot)+' Дж; Eк = '+fmt(kin)+' Дж; ΔU = '+fmt(internal)+' Дж. Сумма Eп + Eк + ΔU = '+fmt(total)+' Дж. Механическая часть Eп + Eк = '+fmt(pot+kin)+' Дж. Скорость v ≈ '+fmt(v)+' м/с.'}mass.oninput=draw;height.oninput=draw;descent.oninput=draw;loss.onchange=draw;draw();window.scrollTo(0,0)}
function parse(value){let s=value.trim().replace(',','.');return /^\d+(?:\.\d+)?$/.test(s)?Number(s):null}
function task(i){let t=TASKS[i],solved=false,helped=false,h=0;app.innerHTML=`<button id="back">← К задачам</button><section class="card" style="margin-top:18px"><span class="tag">Задача ${i+1} из 12 · ${t.group}</span><h2>${t.title}</h2><p>${t.q}</p>${t.type==='number'?'<form id="answer-form" novalidate><label for="answer">Ответ, '+t.unit+'</label><input id="answer" type="text" inputmode="decimal" autocomplete="off" aria-describedby="note"><p id="note" class="muted">Только число. Запятая и точка принимаются одинаково.</p><button id="check" class="primary" type="submit">Проверить</button></form>':'<div id="choices"></div>'}<button id="hint">Подсказка</button><div id="feedback" role="status" aria-live="polite" hidden></div><div id="hint-text" class="feedback hint" role="status" hidden></div><details id="solution" hidden><summary>Открыть разбор</summary><p>${t.solution}</p></details><button id="next" class="primary" hidden>${i<TASKS.length-1?'Следующая задача →':'Завершить тренажёр'}</button><button id="memo">Вернуться к объяснению</button><div id="storage-status"></div></section>`;document.getElementById('back').onclick=home;document.getElementById('memo').onclick=memo;let fb=document.getElementById('feedback');function message(s,ok){fb.hidden=false;fb.className='feedback '+(ok?'good':'hint');fb.textContent=s}function verify(value){if(solved)return;if(value===null||!Number.isFinite(value)){message('Введи число, например 20 или 0,5.',false);return}if(Math.abs(value-t.answer)>1e-8){helped=true;message('Пока не совпало. Проверь систему, условия сохранения и единицы. Можно открыть подсказку.',false);return}solved=true;if(!state.done.includes(t.id))state.done.push(t.id);if(helped&&!state.help.includes(t.id))state.help.push(t.id);save();message('Верно! '+t.solution,true);if(t.type==='number'){document.getElementById('answer').disabled=true;document.getElementById('check').disabled=true}else document.getElementById('choices').querySelectorAll('button').forEach(b=>b.disabled=true);document.getElementById('hint').hidden=true;document.getElementById('next').hidden=false;document.getElementById('storage-status').innerHTML=notice()}
if(t.type==='number')document.getElementById('answer-form').onsubmit=e=>{e.preventDefault();verify(parse(document.getElementById('answer').value))};else{let box=document.getElementById('choices');t.options.forEach((s,k)=>{let b=document.createElement('button');b.textContent=s;b.onclick=()=>verify(k);box.appendChild(b)})}document.getElementById('hint').onclick=function(){helped=true;let box=document.getElementById('hint-text');box.hidden=false;box.textContent=t.hints[Math.min(h,t.hints.length-1)];h++;this.textContent='Ещё подсказка';if(h>=t.hints.length){this.disabled=true;this.textContent='Подсказки открыты';document.getElementById('solution').hidden=false}};document.getElementById('solution').ontoggle=function(){if(this.open)helped=true};document.getElementById('next').onclick=()=>i<TASKS.length-1?task(i+1):home();window.scrollTo(0,0)}
try{home()}catch(e){app.innerHTML='<section class="card"><h2>Не удалось открыть раздел</h2><pre id="error"></pre></section>';document.getElementById('error').textContent=String(e.message||e)}
})();
</script></body></html>
