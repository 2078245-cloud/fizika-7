<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142638"><title>Физика — наглядный учебник</title><style>*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}[hidden]{display:none!important}body{margin:0;background:#eef3f7;color:#172c3e;font:18px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow-wrap:anywhere}.wrap{max-width:900px;margin:auto}header{background:linear-gradient(130deg,#142638,#21564f);color:white;padding:35px 20px}header p{color:#dce9f1}.label{font-size:14px;color:#a4ebcf;letter-spacing:1px}h1{font-size:clamp(30px,7vw,46px);line-height:1.2;margin:12px 0}main{padding:24px 16px}h2{font-size:26px;line-height:1.35;margin-top:0}h3{font-size:21px}p{margin:0 0 16px}.card{background:white;border:1px solid #dce5ed;border-radius:20px;padding:25px;margin:0 0 20px}.tag{display:inline-block;font-size:14px;color:#176344;background:#e5f6ef;border-radius:22px;padding:5px 12px;margin-bottom:15px}.muted,figcaption{color:#526879;font-size:15px}button,.linkbtn{width:100%;min-height:50px;padding:15px;margin:10px 0 0;border:2px solid #dce5ed;border-radius:13px;background:#f7fafc;color:#172c3e;font:inherit;line-height:1.5;text-align:left;cursor:pointer;touch-action:manipulation}.primary{background:#237f62;color:white;border-color:#237f62;text-align:center}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #237f62;outline-offset:3px}button:disabled{opacity:.7;cursor:default}.feedback{padding:16px;margin-top:16px;border-radius:12px}.good{background:#e5f6ef;color:#15583e}.hint{background:#fff3d8;color:#704d10}figure{margin:0}svg{display:block;width:100%;height:auto}figcaption{margin-top:10px}.flow{list-style:none;padding:0;margin:0;counter-reset:flow}.flow li{counter-increment:flow;padding:14px;background:#eff7fa;border:1px solid #dce5ed;border-radius:12px;text-align:center}.flow li:before{content:counter(flow) ". ";font-weight:bold;color:#176344}.arrow{text-align:center;color:#237f62;line-height:1.5;font-size:25px}.bar{height:10px;background:#e4ecf0;border-radius:10px;overflow:hidden;margin:16px 0}.bar div{height:100%;background:#237f62}footer{padding:0 20px 30px;text-align:center;color:#526879;font-size:14px}details{margin-top:14px}summary{cursor:pointer}a{color:#176344}@media(max-width:480px){.card{padding:19px}main{padding:18px 12px}body{font-size:17px}}@media print{header{background:white;color:black}header p,.label{color:#333}body{background:white}button{display:none}.card{break-inside:avoid}}</style></head><body><header><div class="wrap"><div class="label">ФИЗИКА · 7 КЛАСС</div><h1>Пойми, как устроен мир</h1><p>Через игры, LEGO, природу и маленькие открытия.</p></div></header><main id="app" class="wrap"><section class="card"><h2>Загрузка занятий…</h2><p>Если сообщение не исчезает, обновите страницу.</p></section></main><noscript>Для занятий нужно включить JavaScript.</noscript><footer>Версия 0.3 · Рисунки и блок-схемы встроены в сайт</footer><script>const DATA=[{"id": "intro-1", "group": "Вводный блок", "title": "Предмет и материал", "body": "<p>Из одного кусочка пластилина можно слепить шар или лодочку. Шар и лодочка — разные предметы. В физике отдельный предмет называют <strong>физическим телом<\/strong>.<\/p><p>Пластилин — материал этих предметов. При изменении формы материал не обязательно становится другим. Деталь LEGO — предмет, пластмасса — материал.<\/p>", "diagram": "<svg viewBox=\"0 0 600 260\" role=\"img\" aria-label=\"Деталь LEGO как предмет и пластмасса как материал\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"260\" rx=\"18\" fill=\"#eff7fa\"/><rect x=\"65\" y=\"88\" width=\"180\" height=\"85\" rx=\"12\" fill=\"#239676\"/><ellipse cx=\"110\" cy=\"86\" rx=\"22\" ry=\"9\" fill=\"#50c5a2\"/><ellipse cx=\"197\" cy=\"86\" rx=\"22\" ry=\"9\" fill=\"#50c5a2\"/><path d=\"M280 125h65m-15-12 15 12-15 12\" fill=\"none\" stroke=\"#31556b\" stroke-width=\"4\"/><text x=\"155\" y=\"220\" font-size=\"18\" fill=\"#173449\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Предмет: деталь<\/text><text x=\"455\" y=\"112\" font-size=\"18\" fill=\"#173449\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Материал:<\/text><text x=\"455\" y=\"143\" font-size=\"18\" fill=\"#173449\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">пластмасса<\/text><\/svg>", "caption": "Рисунок помогает различить предмет и материал. Это не изображение молекул.", "flow": ["Выбери предмет", "Назови его материал", "Найди другой предмет из того же материала"], "activity": "Найди два разных предмета из одного материала и назови их вслух.", "questions": [{"q": "Из шара слепили лодочку. Что изменилось?", "a": ["Форма предмета, материал остался пластилином", "Пластилин превратился в воду"], "c": 0, "h": "Лодочка всё ещё пластилиновая. Раздели форму и материал.", "why": "Да: форма другая, материал прежний."}]}, {"id": "intro-2", "group": "Вводный блок", "title": "Измеряем, а не угадываем", "body": "<p>Предположи длину карандаша или постройки. Затем измерь линейкой: совмести начало предмета с нулевой отметкой, а не с краем линейки.<\/p><p>Запиши число и единицу. Например, «8 см». Это пример, не готовый результат твоего измерения.<\/p>", "diagram": "<svg viewBox=\"0 0 600 260\" role=\"img\" aria-label=\"Линейка и предмет длиной 8 сантиметров\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"260\" rx=\"18\" fill=\"#eff7fa\"/><rect x=\"45\" y=\"85\" width=\"510\" height=\"70\" rx=\"5\" fill=\"#ffe1a0\"/><path d=\"M65 85v28\" stroke=\"#173449\" stroke-width=\"2\"/><text x=\"65\" y=\"142\" font-size=\"16\" fill=\"#173449\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">0<\/text><path d=\"M112 85v18\" stroke=\"#173449\" stroke-width=\"2\"/><text x=\"112\" y=\"142\" font-size=\"16\" fill=\"#173449\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">1<\/text><path d=\"M159 85v28\" stroke=\"#173449\" stroke-width=\"2\"/><text x=\"159\" y=\"142\" font-size=\"16\" fill=\"#173449\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">2<\/text><path d=\"M206 85v18\" stroke=\"#173449\" stroke-width=\"2\"/><text x=\"206\" y=\"142\" font-size=\"16\" fill=\"#173449\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">3<\/text><path d=\"M253 85v28\" stroke=\"#173449\" stroke-width=\"2\"/><text x=\"253\" y=\"142\" font-size=\"16\" fill=\"#173449\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">4<\/text><path d=\"M300 85v18\" stroke=\"#173449\" stroke-width=\"2\"/><text x=\"300\" y=\"142\" font-size=\"16\" fill=\"#173449\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">5<\/text><path d=\"M347 85v28\" stroke=\"#173449\" stroke-width=\"2\"/><text x=\"347\" y=\"142\" font-size=\"16\" fill=\"#173449\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">6<\/text><path d=\"M394 85v18\" stroke=\"#173449\" stroke-width=\"2\"/><text x=\"394\" y=\"142\" font-size=\"16\" fill=\"#173449\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">7<\/text><path d=\"M441 85v28\" stroke=\"#173449\" stroke-width=\"2\"/><text x=\"441\" y=\"142\" font-size=\"16\" fill=\"#173449\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">8<\/text><path d=\"M488 85v18\" stroke=\"#173449\" stroke-width=\"2\"/><text x=\"488\" y=\"142\" font-size=\"16\" fill=\"#173449\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">9<\/text><path d=\"M535 85v28\" stroke=\"#173449\" stroke-width=\"2\"/><text x=\"535\" y=\"142\" font-size=\"16\" fill=\"#173449\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">10<\/text><path d=\"M65 68h376\" stroke=\"#237f62\" stroke-width=\"10\"/><text x=\"260\" y=\"45\" font-size=\"18\" fill=\"#173449\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Предмет от 0 до 8 см<\/text><text x=\"300\" y=\"210\" font-size=\"18\" fill=\"#173449\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Начало совмещаем с нулём<\/text><\/svg>", "caption": "Учебная картинка, не линейка для измерения предметов на экране.", "flow": ["Предположи длину", "Совмести начало с нулём", "Считай значение у конца", "Запиши число и единицу"], "activity": "Если есть линейка, измерь один предмет. Если нет — объясни по рисунку порядок действий.", "questions": [{"q": "Предмет начинается на 0 см и заканчивается на 8 см. Какова длина?", "a": ["8", "8 см"], "c": 1, "h": "Одного числа недостаточно: 8 метров и 8 сантиметров — не одно и то же.", "why": "Верно: число 8 и единица см."}]}, {"id": "intro-3", "group": "Вводный блок", "title": "Минуты и секунды", "body": "<p>Перед походом договорились выйти через две минуты. В одной минуте 60 секунд. Значит, две минуты — 60 + 60 = 120 секунд.<\/p><p>Для нескольких целых минут берём 60 столько раз, сколько минут. Три минуты — 3 × 60 = 180 секунд.<\/p>", "diagram": "<svg viewBox=\"0 0 600 260\" role=\"img\" aria-label=\"Три минуты как три промежутка по 60 секунд\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"260\" rx=\"18\" fill=\"#eff7fa\"/><circle cx=\"110\" cy=\"105\" r=\"52\" fill=\"white\" stroke=\"#237f62\" stroke-width=\"4\"/><path d=\"M110 105V68m0 37 25 15\" stroke=\"#173449\" stroke-width=\"4\" fill=\"none\"/><text x=\"110\" y=\"190\" font-size=\"17\" fill=\"#173449\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">60 секунд<\/text><circle cx=\"300\" cy=\"105\" r=\"52\" fill=\"white\" stroke=\"#237f62\" stroke-width=\"4\"/><path d=\"M300 105V68m0 37 25 15\" stroke=\"#173449\" stroke-width=\"4\" fill=\"none\"/><text x=\"300\" y=\"190\" font-size=\"17\" fill=\"#173449\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">60 секунд<\/text><circle cx=\"490\" cy=\"105\" r=\"52\" fill=\"white\" stroke=\"#237f62\" stroke-width=\"4\"/><path d=\"M490 105V68m0 37 25 15\" stroke=\"#173449\" stroke-width=\"4\" fill=\"none\"/><text x=\"490\" y=\"190\" font-size=\"17\" fill=\"#173449\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">60 секунд<\/text><text x=\"205\" y=\"115\" font-size=\"26\" fill=\"#173449\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">+<\/text><text x=\"395\" y=\"115\" font-size=\"26\" fill=\"#173449\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">+<\/text><text x=\"300\" y=\"238\" font-size=\"21\" fill=\"#173449\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">3 минуты = 180 секунд<\/text><\/svg>", "caption": "Три одинаковых промежутка по одной минуте.", "flow": ["Узнай число минут", "Умножь на 60", "Запиши секунды"], "activity": "Объясни, как перевести пять минут в секунды. Если трудно, нарисуй пять одинаковых отрезков.", "questions": [{"q": "Сколько секунд в четырёх минутах?", "a": ["240 секунд", "64 секунды", "40 секунд"], "c": 0, "h": "Возьми 60 четыре раза: 60 + 60 + 60 + 60.", "why": "Верно: 4 × 60 = 240 секунд."}]}, {"id": "m1-1", "group": "Модуль 1 · Измерения и вещество", "title": "Величины и цена деления", "body": "<p>Длина, время, масса и объём — физические величины. Их измеряют и записывают с единицами: м, с, кг, мл. Разные приборы измеряют разные величины.<\/p><p><strong>Цена деления<\/strong> показывает, какое изменение величины соответствует одному промежутку шкалы. Сначала разность двух подписанных значений, затем деление на число промежутков.<\/p><p>На рисунке между 10 и 20 мл пять промежутков: (20 − 10) ÷ 5 = 2 мл. Считай промежутки между штрихами, а не сами штрихи.<\/p><p>Измерения не абсолютно точны. Не нужно приписывать прибору точность, которой у него нет. Половина деления — возможная школьная оценка ошибки отсчёта по условию, но не универсальная погрешность любого прибора.<\/p>", "diagram": "<svg viewBox=\"0 0 600 260\" role=\"img\" aria-label=\"Шкала между 10 и 20 миллилитрами с пятью промежутками\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"260\" rx=\"18\" fill=\"#eff7fa\"/><rect x=\"55\" y=\"85\" width=\"490\" height=\"65\" rx=\"8\" fill=\"white\" stroke=\"#31556b\" stroke-width=\"2\"/><path d=\"M80 85v30\" stroke=\"#31556b\" stroke-width=\"3\"/><text x=\"80\" y=\"175\" font-size=\"18\" fill=\"#173449\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">10 мл<\/text><text x=\"124\" y=\"128\" font-size=\"17\" fill=\"#237f62\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">1<\/text><path d=\"M168 85v30\" stroke=\"#31556b\" stroke-width=\"3\"/><text x=\"212\" y=\"128\" font-size=\"17\" fill=\"#237f62\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">2<\/text><path d=\"M256 85v30\" stroke=\"#31556b\" stroke-width=\"3\"/><text x=\"300\" y=\"128\" font-size=\"17\" fill=\"#237f62\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">3<\/text><path d=\"M344 85v30\" stroke=\"#31556b\" stroke-width=\"3\"/><text x=\"388\" y=\"128\" font-size=\"17\" fill=\"#237f62\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">4<\/text><path d=\"M432 85v30\" stroke=\"#31556b\" stroke-width=\"3\"/><text x=\"476\" y=\"128\" font-size=\"17\" fill=\"#237f62\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">5<\/text><path d=\"M520 85v30\" stroke=\"#31556b\" stroke-width=\"3\"/><text x=\"520\" y=\"175\" font-size=\"18\" fill=\"#173449\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">20 мл<\/text><text x=\"300\" y=\"45\" font-size=\"18\" fill=\"#173449\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Пять промежутков между 10 и 20 мл<\/text><text x=\"300\" y=\"226\" font-size=\"21\" fill=\"#173449\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">(20 − 10) ÷ 5 = 2 мл за деление<\/text><\/svg>", "caption": "Числа 1–5 внутри шкалы показывают промежутки, а не объём.", "flow": ["Найди два подписанных значения", "Вычти меньшее из большего", "Посчитай промежутки", "Раздели разность на их число"], "activity": "Посмотри на линейку или мерную ёмкость. Назови величину и единицу. Опыты с горячей водой не нужны.", "questions": [{"q": "Между 20 и 40 мл четыре равных промежутка. Какова цена деления?", "a": ["20 мл", "5 мл", "4 мл"], "c": 1, "h": "Разность 40 − 20 = 20 мл. Раздели её на 4 промежутка.", "why": "20 ÷ 4 = 5 мл за деление."}, {"q": "Цена деления 5 мл. Уровень на два деления выше 20 мл. Какой объём?", "a": ["22 мл", "25 мл", "30 мл"], "c": 2, "h": "Два шага по 5 мл — это ещё 10 мл после 20 мл.", "why": "20 + 2 × 5 = 30 мл."}]}, {"id": "m1-2", "group": "Модуль 1 · Измерения и вещество", "title": "Частицы и диффузия", "body": "<p>Вещество состоит из частиц: атомов, молекул или ионов. Вода, например, состоит из молекул. Частицы непрерывно движутся и взаимодействуют.<\/p><p>На рисунке частицы показаны крупными цветными кружками. Реальные молекулы обычным глазом не видны. Условные цвета различают два вида частиц.<\/p><p><strong>Диффузия<\/strong> — перемешивание веществ вследствие теплового движения их частиц. Перемешивание ложкой и перенос запаха ветром — другие механизмы переноса: их нельзя целиком называть диффузией.<\/p><p>Броуновское движение — беспорядочное движение маленькой взвешенной частицы под ударами молекул. Наблюдаемая частица — не сама молекула.<\/p><p>LEGO может помочь представить множество частиц, но детали сами не движутся как молекулы и соединяются иначе.<\/p>", "diagram": "<svg viewBox=\"0 0 600 260\" role=\"img\" aria-label=\"Модель диффузии: частицы двух видов постепенно перемешиваются\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"260\" rx=\"18\" fill=\"#eff7fa\"/><rect x=\"25\" y=\"65\" width=\"230\" height=\"120\" rx=\"12\" fill=\"white\" stroke=\"#6f8e9f\"/><rect x=\"345\" y=\"65\" width=\"230\" height=\"120\" rx=\"12\" fill=\"white\" stroke=\"#6f8e9f\"/><circle cx=\"50\" cy=\"90\" r=\"8\" fill=\"#2479b7\"/><circle cx=\"50\" cy=\"120\" r=\"8\" fill=\"#2479b7\"/><circle cx=\"50\" cy=\"150\" r=\"8\" fill=\"#2479b7\"/><circle cx=\"75\" cy=\"90\" r=\"8\" fill=\"#2479b7\"/><circle cx=\"75\" cy=\"120\" r=\"8\" fill=\"#2479b7\"/><circle cx=\"75\" cy=\"150\" r=\"8\" fill=\"#2479b7\"/><circle cx=\"100\" cy=\"90\" r=\"8\" fill=\"#2479b7\"/><circle cx=\"100\" cy=\"120\" r=\"8\" fill=\"#2479b7\"/><circle cx=\"100\" cy=\"150\" r=\"8\" fill=\"#2479b7\"/><circle cx=\"155\" cy=\"90\" r=\"8\" fill=\"#e88d3a\"/><circle cx=\"155\" cy=\"120\" r=\"8\" fill=\"#e88d3a\"/><circle cx=\"155\" cy=\"150\" r=\"8\" fill=\"#e88d3a\"/><circle cx=\"180\" cy=\"90\" r=\"8\" fill=\"#e88d3a\"/><circle cx=\"180\" cy=\"120\" r=\"8\" fill=\"#e88d3a\"/><circle cx=\"180\" cy=\"150\" r=\"8\" fill=\"#e88d3a\"/><circle cx=\"205\" cy=\"90\" r=\"8\" fill=\"#e88d3a\"/><circle cx=\"205\" cy=\"120\" r=\"8\" fill=\"#e88d3a\"/><circle cx=\"205\" cy=\"150\" r=\"8\" fill=\"#e88d3a\"/><circle cx=\"365\" cy=\"90\" r=\"8\" fill=\"#2479b7\"/><circle cx=\"413\" cy=\"90\" r=\"8\" fill=\"#2479b7\"/><circle cx=\"461\" cy=\"90\" r=\"8\" fill=\"#2479b7\"/><circle cx=\"509\" cy=\"90\" r=\"8\" fill=\"#2479b7\"/><circle cx=\"365\" cy=\"120\" r=\"8\" fill=\"#2479b7\"/><circle cx=\"413\" cy=\"120\" r=\"8\" fill=\"#2479b7\"/><circle cx=\"461\" cy=\"120\" r=\"8\" fill=\"#2479b7\"/><circle cx=\"509\" cy=\"120\" r=\"8\" fill=\"#2479b7\"/><circle cx=\"365\" cy=\"150\" r=\"8\" fill=\"#2479b7\"/><circle cx=\"413\" cy=\"150\" r=\"8\" fill=\"#2479b7\"/><circle cx=\"461\" cy=\"150\" r=\"8\" fill=\"#2479b7\"/><circle cx=\"509\" cy=\"150\" r=\"8\" fill=\"#2479b7\"/><circle cx=\"389\" cy=\"90\" r=\"8\" fill=\"#e88d3a\"/><circle cx=\"437\" cy=\"90\" r=\"8\" fill=\"#e88d3a\"/><circle cx=\"485\" cy=\"90\" r=\"8\" fill=\"#e88d3a\"/><circle cx=\"533\" cy=\"90\" r=\"8\" fill=\"#e88d3a\"/><circle cx=\"389\" cy=\"120\" r=\"8\" fill=\"#e88d3a\"/><circle cx=\"437\" cy=\"120\" r=\"8\" fill=\"#e88d3a\"/><circle cx=\"485\" cy=\"120\" r=\"8\" fill=\"#e88d3a\"/><circle cx=\"533\" cy=\"120\" r=\"8\" fill=\"#e88d3a\"/><circle cx=\"389\" cy=\"150\" r=\"8\" fill=\"#e88d3a\"/><circle cx=\"437\" cy=\"150\" r=\"8\" fill=\"#e88d3a\"/><circle cx=\"485\" cy=\"150\" r=\"8\" fill=\"#e88d3a\"/><circle cx=\"533\" cy=\"150\" r=\"8\" fill=\"#e88d3a\"/><path d=\"M270 123h57m-12-10 12 10-12 10\" fill=\"none\" stroke=\"#31556b\" stroke-width=\"3\"/><text x=\"140\" y=\"40\" font-size=\"18\" fill=\"#173449\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Сначала<\/text><text x=\"460\" y=\"40\" font-size=\"18\" fill=\"#173449\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Позже<\/text><text x=\"300\" y=\"228\" font-size=\"17\" fill=\"#173449\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Условная модель перемешивания частиц<\/text><\/svg>", "caption": "Условная схема двух моментов времени. Не изображение реального размера частиц и не эксперимент.", "flow": ["Частицы непрерывно движутся", "Переходят в соседние области", "Вещества постепенно перемешиваются"], "activity": "Нарисуй два вида частиц до и после перемешивания. Поясни, что кружки — модель, а не видимые молекулы.", "questions": [{"q": "На рисунке цветные кружки — это…", "a": ["Модель частиц, а не их реальный вид и размер", "Настоящие молекулы, видимые без прибора"], "c": 0, "h": "Схема специально увеличена и упрощена.", "why": "Правильно. Модель помогает думать, но не равна самому объекту."}, {"q": "Запах перенёс сильный ветер. Достаточно ли объяснить это только диффузией?", "a": ["Да, ветер и есть диффузия", "Нет: поток воздуха тоже переносит вещество"], "c": 1, "h": "Ветер движет воздух как поток. Сравни это с самостоятельным перемешиванием частиц.", "why": "Верно: перенос потоком и диффузия различаются."}]}, {"id": "m1-3", "group": "Модуль 1 · Измерения и вещество", "title": "Твёрдое тело, жидкость и газ", "body": "<p>При обычных условиях твёрдое тело обычно сохраняет форму и объём без заметного внешнего воздействия. Жидкость сохраняет объём, но принимает форму сосуда. Газ заполняет доступный объём.<\/p><p>В твёрдом теле частицы расположены близко и колеблются около своих положений. На рисунке показана упорядоченная модель кристалла, но не каждое твёрдое вещество имеет строгую решётку.<\/p><p>В жидкости частицы тоже близки, но могут менять взаимное положение. В газе расстояния между частицами обычно намного больше.<\/p><p>Пластилин меняет форму под действием рук: это деформация. Она сама по себе не доказывает превращения пластилина в жидкость.<\/p><p>Взаимодействие частиц помогает объяснить сопротивление сжатию и растяжению. Смачивание проявляется в поведении жидкости на поверхности: на разных материалах капля растекается по-разному.<\/p>", "diagram": "<svg viewBox=\"0 0 600 260\" role=\"img\" aria-label=\"Модели частиц в кристаллическом твёрдом теле, жидкости и газе\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"260\" rx=\"18\" fill=\"#eff7fa\"/><rect x=\"15\" y=\"65\" width=\"170\" height=\"130\" rx=\"12\" fill=\"white\" stroke=\"#6f8e9f\"/><text x=\"100\" y=\"40\" font-size=\"18\" fill=\"#173449\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Твёрдое<\/text><rect x=\"215\" y=\"65\" width=\"170\" height=\"130\" rx=\"12\" fill=\"white\" stroke=\"#6f8e9f\"/><text x=\"300\" y=\"40\" font-size=\"18\" fill=\"#173449\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Жидкость<\/text><rect x=\"415\" y=\"65\" width=\"170\" height=\"130\" rx=\"12\" fill=\"white\" stroke=\"#6f8e9f\"/><text x=\"500\" y=\"40\" font-size=\"18\" fill=\"#173449\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Газ<\/text><circle cx=\"45\" cy=\"95\" r=\"8\" fill=\"#237f62\"/><circle cx=\"75\" cy=\"95\" r=\"8\" fill=\"#237f62\"/><circle cx=\"105\" cy=\"95\" r=\"8\" fill=\"#237f62\"/><circle cx=\"135\" cy=\"95\" r=\"8\" fill=\"#237f62\"/><circle cx=\"45\" cy=\"125\" r=\"8\" fill=\"#237f62\"/><circle cx=\"75\" cy=\"125\" r=\"8\" fill=\"#237f62\"/><circle cx=\"105\" cy=\"125\" r=\"8\" fill=\"#237f62\"/><circle cx=\"135\" cy=\"125\" r=\"8\" fill=\"#237f62\"/><circle cx=\"45\" cy=\"155\" r=\"8\" fill=\"#237f62\"/><circle cx=\"75\" cy=\"155\" r=\"8\" fill=\"#237f62\"/><circle cx=\"105\" cy=\"155\" r=\"8\" fill=\"#237f62\"/><circle cx=\"135\" cy=\"155\" r=\"8\" fill=\"#237f62\"/><circle cx=\"238\" cy=\"150\" r=\"8\" fill=\"#2479b7\"/><circle cx=\"268\" cy=\"155\" r=\"8\" fill=\"#2479b7\"/><circle cx=\"297\" cy=\"150\" r=\"8\" fill=\"#2479b7\"/><circle cx=\"327\" cy=\"160\" r=\"8\" fill=\"#2479b7\"/><circle cx=\"250\" cy=\"122\" r=\"8\" fill=\"#2479b7\"/><circle cx=\"280\" cy=\"126\" r=\"8\" fill=\"#2479b7\"/><circle cx=\"312\" cy=\"120\" r=\"8\" fill=\"#2479b7\"/><circle cx=\"245\" cy=\"180\" r=\"8\" fill=\"#2479b7\"/><circle cx=\"278\" cy=\"180\" r=\"8\" fill=\"#2479b7\"/><circle cx=\"310\" cy=\"180\" r=\"8\" fill=\"#2479b7\"/><circle cx=\"443\" cy=\"90\" r=\"8\" fill=\"#e88d3a\"/><circle cx=\"540\" cy=\"100\" r=\"8\" fill=\"#e88d3a\"/><circle cx=\"480\" cy=\"150\" r=\"8\" fill=\"#e88d3a\"/><circle cx=\"552\" cy=\"178\" r=\"8\" fill=\"#e88d3a\"/><circle cx=\"435\" cy=\"180\" r=\"8\" fill=\"#e88d3a\"/><text x=\"100\" y=\"225\" font-size=\"14\" fill=\"#173449\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Близко, около мест<\/text><text x=\"300\" y=\"225\" font-size=\"14\" fill=\"#173449\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Близко, перемещаются<\/text><text x=\"500\" y=\"225\" font-size=\"14\" fill=\"#173449\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\">Далеко друг от друга<\/text><\/svg>", "caption": "Схема условная: размеры, расстояния и число частиц не в масштабе. Частицы движутся, хотя рисунок неподвижен.", "flow": ["Сравни сохранение формы", "Сравни сохранение объёма", "Объясни через расположение и движение частиц"], "activity": "На подносе сравни каплю воды на бумаге и на безопасном пластиковом предмете. Не используй электронику. Запиши наблюдение, даже если оно отличается от ожидания.", "questions": [{"q": "Воду перелили в другой стакан без потерь. Что произошло?", "a": ["Изменились и количество воды, и её объём", "Форма изменилась, объём сохранился"], "c": 1, "h": "Переливание меняет форму поверхности, но при отсутствии потерь воды не становится меньше.", "why": "Верно: жидкость принимает форму сосуда."}, {"q": "В каком состоянии вещество обычно легче заметно сжать?", "a": ["В газообразном", "В жидком", "В твёрдом"], "c": 0, "h": "Где расстояния между частицами обычно больше?", "why": "В газе между частицами обычно большие расстояния."}]}];
const KEY="fizika7-progress-v1",app=document.getElementById("app");
let warning=false;
function read(){try{let p=JSON.parse(localStorage.getItem(KEY));let ids=new Set(DATA.map(x=>x.id));return{completed:Array.isArray(p?.completed)?[...new Set(p.completed.filter(x=>ids.has(x)))]:[],lastLesson:ids.has(p?.lastLesson)?p.lastLesson:null}}catch{return{completed:[],lastLesson:null}}}
let state=read();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));warning=false}catch{warning=true}}
function notice(){return warning?'<p class="feedback hint" role="status">Браузер не разрешил сохранить результаты. После обновления страницы они могут исчезнуть.</p>':''}
function topPage(){window.scrollTo(0,0)}
function home(){let n=state.completed.length,remaining=DATA.find(x=>!state.completed.includes(x.id));app.innerHTML=`<section class="card"><span class="tag">Версия 0.3 · Наглядный учебник</span><h2>${remaining?'Продолжим маленькими шагами':'Все доступные задания выполнены'}</h2><p>Доступны три вводных занятия и три урока первого модуля. В каждом — рисунок, блок-схема и вопросы.</p><div class="bar" role="progressbar" aria-label="Выполненные занятия" aria-valuemin="0" aria-valuemax="${DATA.length}" aria-valuenow="${n}"><div style="width:${n/DATA.length*100}%"></div></div><p class="muted">Выполнено ${n} из ${DATA.length}. Верный выбор ответа не заменяет объяснение своими словами.</p><button id="continue" class="primary">${remaining?'Начать / продолжить':'Повторить занятия'}</button></section><div id="groups"></div><section class="card"><h2>Как учиться</h2><p>Прочитай объяснение, рассмотри рисунок, пройди по стрелкам схемы, затем ответь на вопросы. Если устал — остановись. Таймера нет.</p><p class="muted">Рисунки условные. Не измеряй предметы экранной линейкой. Масштаб картинки меняется вместе с экраном.</p></section><section class="card"><h2>Прогресс и резервная копия</h2><p class="muted">Прогресс хранится в этом браузере. Очистка данных или приватный режим могут удалить его. Между устройствами автоматически не переносится. Перед обновлением сайта можно сохранить копию.</p><button id="export">Сохранить файл прогресса</button><button id="import">Загрузить файл прогресса</button><input id="file" type="file" accept="application/json,.json" hidden><p id="import-status" role="status"></p>${notice()}</section><details class="card"><summary>Об учебнике и источниках</summary><p class="muted">Учебная адаптация для начала с нуля. Это ещё не весь годовой курс. Основные модули 2–6, отдельный задачник и лабораторные будут добавляться позже. Изображения — встроенные учебные SVG-схемы.</p><p class="muted">Сверка модели частиц: BBC Bitesize, Solids, liquids and gases. <a href="https://www.bbc.co.uk/bitesize/topics/z242m39/articles/z726m39" target="_blank" rel="noopener noreferrer">Источник</a>. Порядок тем и требования нужно сверять со школьным учителем.</p></details>`;
let groups=document.getElementById('groups');for(let group of [...new Set(DATA.map(x=>x.group))]){let section=document.createElement('section');section.className='card';let title=document.createElement('h2');title.textContent=group;section.append(title);DATA.filter(x=>x.group===group).forEach(l=>{let b=document.createElement('button');b.textContent=l.title+(state.completed.includes(l.id)?' — выполнено':'');b.onclick=()=>lesson(l.id);section.append(b)});groups.append(section)}
document.getElementById('continue').onclick=()=>lesson(state.lastLesson||remaining?.id||DATA[0].id);
document.getElementById('export').onclick=()=>{let blob=new Blob([JSON.stringify({version:1,...state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fizika-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
let input=document.getElementById('file');document.getElementById('import').onclick=()=>input.click();input.onchange=async()=>{let status=document.getElementById('import-status');try{let f=input.files[0];if(!f)return;if(f.size>100000)throw Error('Слишком большой файл.');let p=JSON.parse(await f.text());if(!Array.isArray(p.completed))throw Error('Это не файл прогресса.');if(!confirm('Заменить текущий прогресс данными из файла?'))return;let ids=new Set(DATA.map(x=>x.id));state={completed:[...new Set(p.completed.filter(x=>ids.has(x)))],lastLesson:ids.has(p.lastLesson)?p.lastLesson:null};save();home();document.getElementById('import-status').textContent='Прогресс загружен.'}catch(e){status.textContent='Не удалось загрузить: '+e.message}input.value=''};topPage()}
function lesson(id){let idx=DATA.findIndex(x=>x.id===id);if(idx<0)return home();let l=DATA[idx];state.lastLesson=id;save();let steps=l.flow.map((s,i)=>`<li>${s}</li>${i<l.flow.length-1?'<div class="arrow" aria-hidden="true">↓</div>':''}`).join('');app.innerHTML=`<button id="back">← К списку занятий</button><section class="card" style="margin-top:20px"><span class="tag">${l.group}</span><h2>${l.title}</h2>${l.body}</section><section class="card"><h2>Посмотри на рисунок</h2><figure>${l.diagram}<figcaption>${l.caption}</figcaption></figure></section><section class="card"><h2>Пройди по шагам</h2><div class="flow">${steps}</div></section><section class="card" id="quiz"></section><section class="card"><h2>Попробуй вне экрана</h2><p>${l.activity}</p><p class="muted">Используй только безопасные предметы. Измерения не выдумывай. Если материалов нет, объясни порядок действий словами.</p></section>${notice()}`;document.getElementById('back').onclick=home;let qi=0;let helped=false;
function question(){let q=l.questions[qi],box=document.getElementById('quiz');box.innerHTML=`<span class="tag">Вопрос ${qi+1} из ${l.questions.length}</span><h2>${q.q}</h2><div id="answers"></div><button id="hint">Нужна подсказка</button><div id="feedback" class="feedback" role="status" aria-live="polite" hidden></div><button class="primary" id="next" hidden>${qi<l.questions.length-1?'Следующий вопрос':'Завершить занятие'}</button>`;let ans=document.getElementById('answers'),fb=document.getElementById('feedback'),next=document.getElementById('next');let solved=false;function hint(){helped=true;fb.hidden=false;fb.className='feedback hint';fb.textContent=q.h}document.getElementById('hint').onclick=hint;q.a.forEach((t,i)=>{let b=document.createElement('button');b.textContent=t;b.onclick=()=>{if(solved)return;if(i!==q.c){hint();return}solved=true;fb.hidden=false;fb.className='feedback good';fb.textContent=q.why;ans.querySelectorAll('button').forEach(x=>x.disabled=true);document.getElementById('hint').hidden=true;next.hidden=false};ans.append(b)});next.onclick=()=>{if(qi<l.questions.length-1){qi++;question();document.getElementById('quiz').scrollIntoView({block:'start'})}else{if(!state.completed.includes(id))state.completed.push(id);state.lastLesson=DATA[idx+1]?.id||null;save();box.innerHTML=`<h2>Занятие выполнено</h2><p>${helped?'Ты воспользовался подсказками — это нормально во время обучения. Попробуй объяснить главную мысль своими словами.':'Ты ответил на вопросы. Теперь объясни главную мысль своими словами.'}</p><p class="muted">Отметка означает выполнение вопросов, а не подтверждённое освоение всей темы.</p><button class="primary" id="follow">${DATA[idx+1]?'Следующее занятие →':'К списку занятий'}</button>${notice()}`;document.getElementById('follow').onclick=()=>DATA[idx+1]?lesson(DATA[idx+1].id):home();box.scrollIntoView({block:'start'})}}
question();topPage()}
home();</script></body></html>
