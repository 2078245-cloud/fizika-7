<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142638"><title>Физика — наглядный учебник</title><style>*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}[hidden]{display:none!important}body{margin:0;background:#eef3f7;color:#172c3e;font:18px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow-wrap:anywhere}.wrap{max-width:900px;margin:auto}header{padding:35px 20px;background:linear-gradient(130deg,#142638,#21564f);color:white}header p{color:#dce9f1}.label{font-size:14px;color:#a4ebcf;letter-spacing:1px}h1{font-size:clamp(30px,7vw,46px);line-height:1.2;margin:12px 0}main{padding:24px 16px}h2{font-size:26px;line-height:1.35;margin-top:0}h3{font-size:21px}p{margin:0 0 16px}.card{padding:25px;background:white;border:1px solid #dce5ed;border-radius:20px;margin-bottom:20px}.tag{display:inline-block;background:#e5f6ef;color:#176344;border-radius:22px;padding:5px 12px;font-size:14px;margin-bottom:15px}.muted,figcaption{font-size:15px;color:#526879}button{display:block;width:100%;min-height:50px;padding:15px;margin:10px 0 0;border:2px solid #dce5ed;border-radius:13px;background:#f7fafc;color:#172c3e;font:inherit;line-height:1.5;text-align:left;cursor:pointer;touch-action:manipulation}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #237f62;outline-offset:3px}button:disabled{opacity:.7;cursor:default}.primary{background:#237f62;color:white;border-color:#237f62;text-align:center}.feedback{padding:16px;border-radius:12px;margin-top:16px}.good{background:#e5f6ef;color:#15583e}.hint{background:#fff3d8;color:#704d10}figure{margin:0}svg{display:block;width:100%;height:auto}figcaption{margin-top:10px}.flow{list-style:none;padding:0;counter-reset:steps}.flow li{counter-increment:steps;background:#edf7fa;border:1px solid #dce5ed;border-radius:12px;padding:14px;text-align:center}.flow li:before{content:counter(steps) ". ";font-weight:bold;color:#176344}.flow li+li{margin-top:28px;position:relative}.flow li+li:after{content:"↓";position:absolute;top:-32px;left:calc(50% - 8px);color:#237f62;font-size:25px}.bar{height:10px;border-radius:10px;overflow:hidden;background:#e5edf2;margin:16px 0}.bar div{height:100%;background:#237f62}footer{padding:0 20px 30px;text-align:center;font-size:14px;color:#526879}summary{cursor:pointer}a{color:#176344}@media(max-width:480px){.card{padding:19px}main{padding:18px 12px}body{font-size:17px}}</style></head><body><header><div class="wrap"><div class="label">ФИЗИКА · 7 КЛАСС</div><h1>Пойми, как устроен мир</h1><p>Через игры, LEGO, природу и маленькие открытия.</p></div></header><main id="app" class="wrap"><section class="card"><h2>Загрузка занятий…</h2><p>Если сообщение не исчезает, обновите страницу.</p></section></main><noscript>Для занятий нужно включить JavaScript.</noscript><footer>Версия 0.3.1 · Рисунки и блок-схемы встроены в сайт</footer><script>
(function () {
  "use strict";
  const DATA = [{"id": "intro-1", "group": "Вводный блок", "title": "Предмет и материал", "body": "<p>Шар и лодочка из пластилина — разные предметы. В физике отдельный предмет называют <strong>физическим телом<\/strong>.<\/p><p>Пластилин — материал этих предметов. Изменение формы не обязательно меняет материал. Деталь LEGO — предмет, пластмасса — материал.<\/p>", "diagram": "<svg viewBox=\"0 0 600 260\" role=\"img\" aria-label=\"Деталь и материал\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"260\" rx=\"16\" fill=\"#edf7fa\"/><rect x=\"55\" y=\"80\" width=\"180\" height=\"90\" rx=\"12\" fill=\"#269b78\"/><ellipse cx=\"100\" cy=\"77\" rx=\"25\" ry=\"10\" fill=\"#7cdbbc\"/><ellipse cx=\"190\" cy=\"77\" rx=\"25\" ry=\"10\" fill=\"#7cdbbc\"/><text x=\"150\" y=\"220\" font-size=\"19\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Предмет: деталь<\/text><text x=\"425\" y=\"115\" font-size=\"19\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Материал:<\/text><text x=\"425\" y=\"148\" font-size=\"19\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">пластмасса<\/text><\/svg>", "caption": "Это рисунок предмета, а не молекул.", "flow": ["Выбери предмет", "Назови его материал", "Найди другой предмет из того же материала"], "activity": "Найди два разных предмета из одного материала и назови их вслух.", "questions": [{"q": "Из пластилинового шара сделали лодочку. Что изменилось?", "a": ["Форма, а материал остался пластилином", "Пластилин превратился в воду"], "c": 0, "h": "Лодочка всё ещё пластилиновая.", "why": "Верно: форма другая, материал прежний."}]}, {"id": "intro-2", "group": "Вводный блок", "title": "Измеряем, а не угадываем", "body": "<p>Предположи длину постройки или карандаша. Затем приложи линейку: начало предмета совмести с нулевой отметкой, а не с краем.<\/p><p>Прочитай значение у другого конца. Запиши число и единицу, например «8 см». Это пример, не результат твоего измерения.<\/p>", "diagram": "<svg viewBox=\"0 0 600 260\" role=\"img\" aria-label=\"Предмет длиной 8 см на условной линейке\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"260\" rx=\"16\" fill=\"#edf7fa\"/><rect x=\"40\" y=\"95\" width=\"520\" height=\"75\" rx=\"8\" fill=\"#ffe3a5\"/><path d=\"M60 95v25\" stroke=\"#173449\" stroke-width=\"2\"/><text x=\"60\" y=\"153\" font-size=\"16\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">0<\/text><path d=\"M108 95v25\" stroke=\"#173449\" stroke-width=\"2\"/><text x=\"108\" y=\"153\" font-size=\"16\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">1<\/text><path d=\"M156 95v25\" stroke=\"#173449\" stroke-width=\"2\"/><text x=\"156\" y=\"153\" font-size=\"16\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">2<\/text><path d=\"M204 95v25\" stroke=\"#173449\" stroke-width=\"2\"/><text x=\"204\" y=\"153\" font-size=\"16\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">3<\/text><path d=\"M252 95v25\" stroke=\"#173449\" stroke-width=\"2\"/><text x=\"252\" y=\"153\" font-size=\"16\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">4<\/text><path d=\"M300 95v25\" stroke=\"#173449\" stroke-width=\"2\"/><text x=\"300\" y=\"153\" font-size=\"16\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">5<\/text><path d=\"M348 95v25\" stroke=\"#173449\" stroke-width=\"2\"/><text x=\"348\" y=\"153\" font-size=\"16\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">6<\/text><path d=\"M396 95v25\" stroke=\"#173449\" stroke-width=\"2\"/><text x=\"396\" y=\"153\" font-size=\"16\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">7<\/text><path d=\"M444 95v25\" stroke=\"#173449\" stroke-width=\"2\"/><text x=\"444\" y=\"153\" font-size=\"16\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">8<\/text><path d=\"M492 95v25\" stroke=\"#173449\" stroke-width=\"2\"/><text x=\"492\" y=\"153\" font-size=\"16\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">9<\/text><path d=\"M540 95v25\" stroke=\"#173449\" stroke-width=\"2\"/><text x=\"540\" y=\"153\" font-size=\"16\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">10<\/text><path d=\"M60 70h384\" stroke=\"#269b78\" stroke-width=\"10\"/><text x=\"300\" y=\"40\" font-size=\"19\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Предмет от 0 до 8 см<\/text><text x=\"300\" y=\"225\" font-size=\"19\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Начало предмета совмещаем с нулём<\/text><\/svg>", "caption": "Не измеряй предметы этой картинкой: её масштаб меняется вместе с экраном.", "flow": ["Предположи длину", "Совмести начало с нулём", "Прочитай отметку у конца", "Запиши число и единицу"], "activity": "Измерь безопасный небольшой предмет, если есть линейка. Иначе объясни порядок действий по рисунку.", "questions": [{"q": "Предмет начинается на 0 см и заканчивается на 8 см. Какова длина?", "a": ["8", "8 см"], "c": 1, "h": "Нужны и число, и единица.", "why": "Верно: длина 8 сантиметров."}]}, {"id": "intro-3", "group": "Вводный блок", "title": "Минуты и секунды", "body": "<p>В одной минуте 60 секунд. Две минуты — два раза по 60: 60 + 60 = 120 секунд.<\/p><p>Для нескольких целых минут умножаем их число на 60. Три минуты: 3 × 60 = 180 секунд.<\/p>", "diagram": "<svg viewBox=\"0 0 600 260\" role=\"img\" aria-label=\"Три минуты по 60 секунд\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"260\" rx=\"16\" fill=\"#edf7fa\"/><circle cx=\"100\" cy=\"110\" r=\"52\" fill=\"white\" stroke=\"#269b78\" stroke-width=\"4\"/><text x=\"100\" y=\"117\" font-size=\"24\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">60 с<\/text><circle cx=\"300\" cy=\"110\" r=\"52\" fill=\"white\" stroke=\"#269b78\" stroke-width=\"4\"/><text x=\"300\" y=\"117\" font-size=\"24\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">60 с<\/text><circle cx=\"500\" cy=\"110\" r=\"52\" fill=\"white\" stroke=\"#269b78\" stroke-width=\"4\"/><text x=\"500\" y=\"117\" font-size=\"24\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">60 с<\/text><text x=\"200\" y=\"117\" font-size=\"25\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">+<\/text><text x=\"400\" y=\"117\" font-size=\"25\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">+<\/text><text x=\"300\" y=\"220\" font-size=\"19\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">3 минуты = 180 секунд<\/text><\/svg>", "caption": "Каждый круг — один промежуток в 60 секунд.", "flow": ["Узнай число минут", "Умножь на 60", "Запиши секунды"], "activity": "Объясни вслух, как перевести пять минут в секунды. Нарисуй пять одинаковых отрезков, если так проще.", "questions": [{"q": "Сколько секунд в четырёх минутах?", "a": ["240 секунд", "64 секунды", "40 секунд"], "c": 0, "h": "Сложи 60 + 60 + 60 + 60.", "why": "4 × 60 = 240 секунд."}]}, {"id": "m1-1", "group": "Модуль 1 · Измерения и вещество", "title": "Величины и цена деления", "body": "<p>Длина, время, масса и объём — физические величины. Результат измерения записывают числом и единицей: м, с, кг, мл.<\/p><p><strong>Цена деления<\/strong> показывает, какое изменение величины соответствует одному промежутку шкалы.<\/p><p>Между 10 и 20 мл пять промежутков. Разность значений 10 мл. Делим её на 5: получаем 2 мл за деление. Считаем промежутки, не штрихи.<\/p><p>Любое измерение имеет ограничения точности. Половина деления — возможная школьная оценка ошибки отсчёта по условию, но не универсальная полная погрешность любого прибора.<\/p>", "diagram": "<svg viewBox=\"0 0 600 260\" role=\"img\" aria-label=\"Пять промежутков шкалы от 10 до 20 мл\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"260\" rx=\"16\" fill=\"#edf7fa\"/><rect x=\"45\" y=\"85\" width=\"510\" height=\"70\" fill=\"white\" stroke=\"#34566c\"/><path d=\"M65 85v30\" stroke=\"#34566c\" stroke-width=\"3\"/><text x=\"65\" y=\"182\" font-size=\"19\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">10 мл<\/text><text x=\"112\" y=\"135\" font-size=\"16\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">1<\/text><path d=\"M159 85v30\" stroke=\"#34566c\" stroke-width=\"3\"/><text x=\"206\" y=\"135\" font-size=\"16\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">2<\/text><path d=\"M253 85v30\" stroke=\"#34566c\" stroke-width=\"3\"/><text x=\"300\" y=\"135\" font-size=\"16\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">3<\/text><path d=\"M347 85v30\" stroke=\"#34566c\" stroke-width=\"3\"/><text x=\"394\" y=\"135\" font-size=\"16\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">4<\/text><path d=\"M441 85v30\" stroke=\"#34566c\" stroke-width=\"3\"/><text x=\"488\" y=\"135\" font-size=\"16\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">5<\/text><path d=\"M535 85v30\" stroke=\"#34566c\" stroke-width=\"3\"/><text x=\"535\" y=\"182\" font-size=\"19\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">20 мл<\/text><text x=\"300\" y=\"42\" font-size=\"19\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Считаем пять промежутков<\/text><text x=\"300\" y=\"230\" font-size=\"19\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">(20 − 10) ÷ 5 = 2 мл<\/text><\/svg>", "caption": "Маленькие числа 1–5 показывают номера промежутков, а не объём.", "flow": ["Найди два подписанных значения", "Вычти меньшее из большего", "Посчитай промежутки", "Раздели разность на их число"], "activity": "Рассмотри линейку или мерную ёмкость. Назови величину и единицу. Не используй горячую воду.", "questions": [{"q": "Между 20 и 40 мл четыре равных промежутка. Цена деления?", "a": ["20 мл", "5 мл", "4 мл"], "c": 1, "h": "Разность 40 − 20 = 20 мл. Раздели на 4.", "why": "20 ÷ 4 = 5 мл."}, {"q": "Цена деления 5 мл. Уровень на два деления выше 20 мл. Какой объём?", "a": ["22 мл", "25 мл", "30 мл"], "c": 2, "h": "Два деления — это 2 × 5 = 10 мл дополнительно.", "why": "20 + 10 = 30 мл."}]}, {"id": "m1-2", "group": "Модуль 1 · Измерения и вещество", "title": "Частицы и диффузия", "body": "<p>Вещество состоит из частиц: атомов, молекул или ионов. Вода состоит из молекул. Частицы непрерывно движутся и взаимодействуют.<\/p><p>Кружки на схеме — условная модель. Обычным глазом отдельные молекулы не видны.<\/p><p><strong>Диффузия<\/strong> — перемешивание веществ вследствие теплового движения частиц. Перенос запаха ветром нельзя целиком объяснить диффузией: поток воздуха тоже переносит вещество.<\/p><p>Броуновское движение — беспорядочное движение маленькой взвешенной частицы под ударами молекул. Наблюдаемая частица — не отдельная молекула.<\/p><p>LEGO может помочь представить множество частиц, но детали сами не совершают тепловое движение как молекулы и соединяются иначе.<\/p>", "diagram": "<svg viewBox=\"0 0 600 260\" role=\"img\" aria-label=\"Схема диффузии двух видов частиц\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"260\" rx=\"16\" fill=\"#edf7fa\"/><rect x=\"20\" y=\"70\" width=\"230\" height=\"120\" rx=\"10\" fill=\"white\" stroke=\"#819dab\"/><rect x=\"350\" y=\"70\" width=\"230\" height=\"120\" rx=\"10\" fill=\"white\" stroke=\"#819dab\"/><circle cx=\"45\" cy=\"100\" r=\"9\" fill=\"#287ab5\"/><circle cx=\"45\" cy=\"130\" r=\"9\" fill=\"#287ab5\"/><circle cx=\"45\" cy=\"160\" r=\"9\" fill=\"#287ab5\"/><circle cx=\"70\" cy=\"100\" r=\"9\" fill=\"#287ab5\"/><circle cx=\"70\" cy=\"130\" r=\"9\" fill=\"#287ab5\"/><circle cx=\"70\" cy=\"160\" r=\"9\" fill=\"#287ab5\"/><circle cx=\"95\" cy=\"100\" r=\"9\" fill=\"#287ab5\"/><circle cx=\"95\" cy=\"130\" r=\"9\" fill=\"#287ab5\"/><circle cx=\"95\" cy=\"160\" r=\"9\" fill=\"#287ab5\"/><circle cx=\"155\" cy=\"100\" r=\"9\" fill=\"#e99039\"/><circle cx=\"155\" cy=\"130\" r=\"9\" fill=\"#e99039\"/><circle cx=\"155\" cy=\"160\" r=\"9\" fill=\"#e99039\"/><circle cx=\"180\" cy=\"100\" r=\"9\" fill=\"#e99039\"/><circle cx=\"180\" cy=\"130\" r=\"9\" fill=\"#e99039\"/><circle cx=\"180\" cy=\"160\" r=\"9\" fill=\"#e99039\"/><circle cx=\"205\" cy=\"100\" r=\"9\" fill=\"#e99039\"/><circle cx=\"205\" cy=\"130\" r=\"9\" fill=\"#e99039\"/><circle cx=\"205\" cy=\"160\" r=\"9\" fill=\"#e99039\"/><circle cx=\"370\" cy=\"100\" r=\"9\" fill=\"#e99039\"/><circle cx=\"370\" cy=\"130\" r=\"9\" fill=\"#287ab5\"/><circle cx=\"370\" cy=\"160\" r=\"9\" fill=\"#e99039\"/><circle cx=\"396\" cy=\"100\" r=\"9\" fill=\"#287ab5\"/><circle cx=\"396\" cy=\"130\" r=\"9\" fill=\"#e99039\"/><circle cx=\"396\" cy=\"160\" r=\"9\" fill=\"#287ab5\"/><circle cx=\"422\" cy=\"100\" r=\"9\" fill=\"#e99039\"/><circle cx=\"422\" cy=\"130\" r=\"9\" fill=\"#287ab5\"/><circle cx=\"422\" cy=\"160\" r=\"9\" fill=\"#e99039\"/><circle cx=\"448\" cy=\"100\" r=\"9\" fill=\"#287ab5\"/><circle cx=\"448\" cy=\"130\" r=\"9\" fill=\"#e99039\"/><circle cx=\"448\" cy=\"160\" r=\"9\" fill=\"#287ab5\"/><circle cx=\"474\" cy=\"100\" r=\"9\" fill=\"#e99039\"/><circle cx=\"474\" cy=\"130\" r=\"9\" fill=\"#287ab5\"/><circle cx=\"474\" cy=\"160\" r=\"9\" fill=\"#e99039\"/><circle cx=\"500\" cy=\"100\" r=\"9\" fill=\"#287ab5\"/><circle cx=\"500\" cy=\"130\" r=\"9\" fill=\"#e99039\"/><circle cx=\"500\" cy=\"160\" r=\"9\" fill=\"#287ab5\"/><circle cx=\"526\" cy=\"100\" r=\"9\" fill=\"#e99039\"/><circle cx=\"526\" cy=\"130\" r=\"9\" fill=\"#287ab5\"/><circle cx=\"526\" cy=\"160\" r=\"9\" fill=\"#e99039\"/><circle cx=\"552\" cy=\"100\" r=\"9\" fill=\"#287ab5\"/><circle cx=\"552\" cy=\"130\" r=\"9\" fill=\"#e99039\"/><circle cx=\"552\" cy=\"160\" r=\"9\" fill=\"#287ab5\"/><text x=\"135\" y=\"42\" font-size=\"19\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Сначала<\/text><text x=\"465\" y=\"42\" font-size=\"19\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Позже<\/text><text x=\"300\" y=\"135\" font-size=\"38\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">→<\/text><text x=\"300\" y=\"235\" font-size=\"17\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Условная модель перемешивания частиц<\/text><\/svg>", "caption": "Два условных момента времени. Цвет различает виды частиц. Размеры не в масштабе.", "flow": ["Частицы непрерывно движутся", "Переходят в соседние области", "Вещества постепенно перемешиваются"], "activity": "Нарисуй два вида частиц до и после перемешивания. Поясни ограничения своего рисунка.", "questions": [{"q": "Кружки на рисунке — это…", "a": ["Условная модель частиц", "Настоящие молекулы, видимые без прибора"], "c": 0, "h": "Рисунок специально увеличен и упрощён.", "why": "Да, модель помогает объяснить явление."}, {"q": "Сильный ветер перенёс запах. Достаточно объяснения только диффузией?", "a": ["Да, ветер и есть диффузия", "Нет, поток воздуха тоже переносит вещество"], "c": 1, "h": "Ветер перемещает воздух как поток.", "why": "Верно: перенос потоком и диффузия различаются."}]}, {"id": "m1-3", "group": "Модуль 1 · Измерения и вещество", "title": "Твёрдое тело, жидкость и газ", "body": "<p>При обычных условиях твёрдое тело обычно сохраняет форму и объём без заметного внешнего воздействия. Жидкость сохраняет объём, но принимает форму сосуда. Газ заполняет доступный объём.<\/p><p>В твёрдом теле частицы близки и колеблются около своих положений. Схема показывает кристаллическую модель: строгая решётка есть не у всех твёрдых веществ.<\/p><p>В жидкости частицы близки, но меняют взаимное положение. В газе расстояния между частицами обычно намного больше.<\/p><p>Изменение формы пластилина руками — деформация. Это само по себе не доказывает превращения его в жидкость.<\/p><p>Взаимодействие частиц помогает объяснить сопротивление сжатию и растяжению. Смачивание проявляется в поведении капли на поверхности: на разных материалах она растекается по-разному.<\/p>", "diagram": "<svg viewBox=\"0 0 600 260\" role=\"img\" aria-label=\"Схемы частиц в кристалле, жидкости и газе\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"260\" rx=\"16\" fill=\"#edf7fa\"/><rect x=\"15\" y=\"65\" width=\"170\" height=\"130\" rx=\"10\" fill=\"white\" stroke=\"#819dab\"/><text x=\"100\" y=\"40\" font-size=\"19\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Твёрдое<\/text><rect x=\"215\" y=\"65\" width=\"170\" height=\"130\" rx=\"10\" fill=\"white\" stroke=\"#819dab\"/><text x=\"300\" y=\"40\" font-size=\"19\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Жидкость<\/text><rect x=\"415\" y=\"65\" width=\"170\" height=\"130\" rx=\"10\" fill=\"white\" stroke=\"#819dab\"/><text x=\"500\" y=\"40\" font-size=\"19\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Газ<\/text><circle cx=\"45\" cy=\"95\" r=\"9\" fill=\"#269b78\"/><circle cx=\"45\" cy=\"125\" r=\"9\" fill=\"#269b78\"/><circle cx=\"45\" cy=\"155\" r=\"9\" fill=\"#269b78\"/><circle cx=\"75\" cy=\"95\" r=\"9\" fill=\"#269b78\"/><circle cx=\"75\" cy=\"125\" r=\"9\" fill=\"#269b78\"/><circle cx=\"75\" cy=\"155\" r=\"9\" fill=\"#269b78\"/><circle cx=\"105\" cy=\"95\" r=\"9\" fill=\"#269b78\"/><circle cx=\"105\" cy=\"125\" r=\"9\" fill=\"#269b78\"/><circle cx=\"105\" cy=\"155\" r=\"9\" fill=\"#269b78\"/><circle cx=\"135\" cy=\"95\" r=\"9\" fill=\"#269b78\"/><circle cx=\"135\" cy=\"125\" r=\"9\" fill=\"#269b78\"/><circle cx=\"135\" cy=\"155\" r=\"9\" fill=\"#269b78\"/><circle cx=\"238\" cy=\"155\" r=\"9\" fill=\"#287ab5\"/><circle cx=\"270\" cy=\"155\" r=\"9\" fill=\"#287ab5\"/><circle cx=\"301\" cy=\"150\" r=\"9\" fill=\"#287ab5\"/><circle cx=\"330\" cy=\"160\" r=\"9\" fill=\"#287ab5\"/><circle cx=\"250\" cy=\"125\" r=\"9\" fill=\"#287ab5\"/><circle cx=\"282\" cy=\"124\" r=\"9\" fill=\"#287ab5\"/><circle cx=\"314\" cy=\"121\" r=\"9\" fill=\"#287ab5\"/><circle cx=\"245\" cy=\"180\" r=\"9\" fill=\"#287ab5\"/><circle cx=\"280\" cy=\"180\" r=\"9\" fill=\"#287ab5\"/><circle cx=\"313\" cy=\"180\" r=\"9\" fill=\"#287ab5\"/><circle cx=\"440\" cy=\"90\" r=\"9\" fill=\"#e99039\"/><circle cx=\"540\" cy=\"100\" r=\"9\" fill=\"#e99039\"/><circle cx=\"480\" cy=\"145\" r=\"9\" fill=\"#e99039\"/><circle cx=\"553\" cy=\"178\" r=\"9\" fill=\"#e99039\"/><circle cx=\"434\" cy=\"179\" r=\"9\" fill=\"#e99039\"/><text x=\"100\" y=\"229\" font-size=\"14\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Близко, около мест<\/text><text x=\"300\" y=\"229\" font-size=\"14\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Близко, подвижны<\/text><text x=\"500\" y=\"229\" font-size=\"14\" text-anchor=\"middle\" fill=\"#173449\" font-family=\"Arial,sans-serif\">Большие расстояния<\/text><\/svg>", "caption": "Модель не в масштабе. Частицы движутся, хотя рисунок неподвижен.", "flow": ["Сравни сохранение формы", "Сравни сохранение объёма", "Объясни через расположение и движение частиц"], "activity": "На подносе сравни каплю воды на бумаге и безопасном пластиковом предмете. Не используй электронику. Запиши действительное наблюдение.", "questions": [{"q": "Воду перелили в другой стакан без потерь. Что произошло?", "a": ["Изменилось количество воды", "Форма изменилась, объём сохранился"], "c": 1, "h": "При переливании без потерь воды не становится меньше.", "why": "Верно: жидкость принимает форму сосуда."}, {"q": "В каком состоянии вещество обычно легче заметно сжать?", "a": ["В газообразном", "В жидком", "В твёрдом"], "c": 0, "h": "Где расстояния между частицами обычно больше?", "why": "В газе между частицами обычно большие расстояния."}]}];
  const KEY = "fizika7-progress-v1";
  const app = document.getElementById("app");
  let warning = false;

  function read() {
    try {
      const p = JSON.parse(localStorage.getItem(KEY));
      const ids = new Set(DATA.map(function (x) { return x.id; }));
      return {
        completed: p && Array.isArray(p.completed)
          ? Array.from(new Set(p.completed.filter(function (id) { return ids.has(id); }))) : [],
        lastLesson: p && ids.has(p.lastLesson) ? p.lastLesson : null
      };
    } catch (e) { return { completed: [], lastLesson: null }; }
  }
  let state = read();
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); warning = false; }
    catch (e) { warning = true; }
  }
  function notice() {
    return warning ? '<p class="feedback hint" role="status">Браузер не разрешил сохранить прогресс. После обновления результаты могут исчезнуть.</p>' : '';
  }
  function home() {
    const remaining = DATA.find(function (x) { return !state.completed.includes(x.id); });
    const n = state.completed.length;
    app.innerHTML = `
      <section class="card">
        <span class="tag">Версия 0.3.1 · Наглядный учебник</span>
        <h2>${remaining ? 'Продолжим маленькими шагами' : 'Доступные задания выполнены'}</h2>
        <p>Три вводных занятия и три урока первого модуля. В каждом — рисунок, блок-схема и вопросы.</p>
        <div class="bar" role="progressbar" aria-label="Выполненные занятия" aria-valuemin="0" aria-valuemax="6" aria-valuenow="${n}"><div style="width:${n / DATA.length * 100}%"></div></div>
        <p class="muted">Выполнено ${n} из ${DATA.length}. Это отметки о выполнении, а не школьные оценки.</p>
        <button id="continue" class="primary">${remaining ? 'Начать / продолжить' : 'Повторить занятия'}</button>
      </section>
      <div id="groups"></div>
      <section class="card"><h2>Как заниматься</h2><p>Прочитай объяснение, рассмотри рисунок, пройди по шагам схемы и ответь на вопросы. Можно остановиться в любой момент. Таймера нет.</p><p class="muted">Рисунки условные. Не измеряй предметы экранной линейкой.</p></section>
      <section class="card"><h2>Прогресс и резервная копия</h2><p class="muted">Результаты хранятся только в этом браузере. Очистка данных и приватный режим могут удалить их. Для другого устройства используй файл прогресса.</p><button id="export">Сохранить файл прогресса</button><button id="import">Загрузить файл прогресса</button><input id="progress-file" type="file" accept=".json,application/json" hidden><p id="import-status" role="status"></p>${notice()}</section>
      <details class="card"><summary>Об этой версии</summary><p>Доступны вводный блок и первый модуль. Это ещё не весь годовой курс. Основные модули 2–6, отдельный задачник и лабораторные не добавлены.</p><p class="muted">Изображения и схемы встроены в файл. Требования и порядок школьных тем сверяют с учителем. Сверка модели частиц: <a href="https://www.bbc.co.uk/bitesize/topics/z242m39/articles/z726m39" target="_blank" rel="noopener noreferrer">BBC Bitesize</a>.</p></details>`;
    const groups = document.getElementById("groups");
    Array.from(new Set(DATA.map(function (x) { return x.group; }))).forEach(function (group) {
      const section = document.createElement("section");
      section.className = "card";
      const title = document.createElement("h2");
      title.textContent = group;
      section.appendChild(title);
      DATA.filter(function (x) { return x.group === group; }).forEach(function (item) {
        const b = document.createElement("button");
        b.textContent = item.title + (state.completed.includes(item.id) ? ' — выполнено' : '');
        b.onclick = function () { openLesson(item.id); };
        section.appendChild(b);
      });
      groups.appendChild(section);
    });
    document.getElementById("continue").onclick = function () {
      openLesson(state.lastLesson || (remaining && remaining.id) || DATA[0].id);
    };
    document.getElementById("export").onclick = function () {
      const blob = new Blob([JSON.stringify({ version: 1, completed: state.completed, lastLesson: state.lastLesson }, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = 'fizika-progress.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    };
    const input = document.getElementById("progress-file");
    document.getElementById("import").onclick = function () { input.click(); };
    input.onchange = async function () {
      const status = document.getElementById("import-status");
      try {
        const f = input.files[0];
        if (!f) return;
        if (f.size > 100000) throw new Error('Слишком большой файл.');
        const p = JSON.parse(await f.text());
        if (!Array.isArray(p.completed)) throw new Error('Это не файл прогресса.');
        if (!confirm('Заменить текущий прогресс данными из файла?')) return;
        const ids = new Set(DATA.map(function (x) { return x.id; }));
        state = { completed: Array.from(new Set(p.completed.filter(function (id) { return ids.has(id); }))), lastLesson: ids.has(p.lastLesson) ? p.lastLesson : null };
        save(); home();
        document.getElementById("import-status").textContent = 'Прогресс загружен.';
      } catch (e) { status.textContent = 'Не удалось загрузить: ' + e.message; }
      input.value = '';
    };
    window.scrollTo(0, 0);
  }

  function openLesson(id) {
    const index = DATA.findIndex(function (x) { return x.id === id; });
    if (index < 0) { home(); return; }
    const lesson = DATA[index];
    state.lastLesson = id; save();
    app.innerHTML = `<button id="back">← К списку занятий</button><section class="card" style="margin-top:20px"><span class="tag">${lesson.group}</span><h2>${lesson.title}</h2>${lesson.body}</section><section class="card"><h2>Посмотри на рисунок</h2><figure>${lesson.diagram}<figcaption>${lesson.caption}</figcaption></figure></section><section class="card"><h2>Пройди по шагам</h2><ol class="flow">${lesson.flow.map(function (s) { return '<li>' + s + '</li>'; }).join('')}</ol></section><section id="quiz" class="card"></section><section class="card"><h2>Попробуй вне экрана</h2><p>${lesson.activity}</p><p class="muted">Только безопасные предметы. Измерения не выдумывай. Если материалов нет, объясни порядок действий словами.</p></section>${notice()}`;
    document.getElementById("back").onclick = home;
    let questionIndex = 0;
    let usedHelp = false;

    function renderQuestion() {
      const q = lesson.questions[questionIndex];
      const box = document.getElementById("quiz");
      box.innerHTML = `<span class="tag">Вопрос ${questionIndex + 1} из ${lesson.questions.length}</span><h2>${q.q}</h2><div id="answers"></div><button id="hint">Нужна подсказка</button><div id="feedback" class="feedback" role="status" aria-live="polite" hidden></div><button class="primary" id="next" hidden>${questionIndex < lesson.questions.length - 1 ? 'Следующий вопрос' : 'Завершить занятие'}</button>`;
      const answers = document.getElementById("answers");
      const feedback = document.getElementById("feedback");
      const next = document.getElementById("next");
      let solved = false;
      function hint() {
        usedHelp = true;
        feedback.hidden = false;
        feedback.className = 'feedback hint';
        feedback.textContent = q.h;
      }
      document.getElementById("hint").onclick = hint;
      q.a.forEach(function (text, answerIndex) {
        const b = document.createElement("button");
        b.textContent = text;
        b.onclick = function () {
          if (solved) return;
          if (answerIndex !== q.c) { hint(); return; }
          solved = true;
          feedback.hidden = false;
          feedback.className = 'feedback good';
          feedback.textContent = q.why;
          answers.querySelectorAll('button').forEach(function (item) { item.disabled = true; });
          document.getElementById("hint").hidden = true;
          next.hidden = false;
        };
        answers.appendChild(b);
      });
      next.onclick = function () {
        if (questionIndex < lesson.questions.length - 1) {
          questionIndex += 1;
          renderQuestion();
          document.getElementById("quiz").scrollIntoView({ block: 'start' });
          return;
        }
        if (!state.completed.includes(id)) state.completed.push(id);
        state.lastLesson = DATA[index + 1] ? DATA[index + 1].id : null;
        save();
        box.innerHTML = `<h2>Занятие выполнено</h2><p>${usedHelp ? 'Ты воспользовался подсказками — это нормально при обучении.' : 'Ты ответил на вопросы.'} Теперь объясни главную мысль своими словами.</p><p class="muted">Выполнение вопросов ещё не подтверждает освоение всей темы.</p><button class="primary" id="follow">${DATA[index + 1] ? 'Следующее занятие →' : 'К списку занятий'}</button>${notice()}`;
        document.getElementById("follow").onclick = function () {
          if (DATA[index + 1]) openLesson(DATA[index + 1].id); else home();
        };
        box.scrollIntoView({ block: 'start' });
      };
    }

    renderQuestion();
    window.scrollTo(0, 0);
  }

  try { home(); }
  catch (e) {
    app.innerHTML = '<section class="card"><h2>Не удалось открыть занятия</h2><p>Отправьте автору сообщение об ошибке ниже. Прогресс не удалён.</p><pre id="error-detail"></pre></section>';
    document.getElementById('error-detail').textContent = String(e.message || e);
  }
})();
</script></body></html>
