<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142638">
  <title>Физика — начало путешествия</title>

  <style>
    :root {
      --bg: #eef3f7;
      --surface: #fff;
      --text: #172c3e;
      --muted: #526879;
      --accent: #237f62;
      --border: #dce5ed;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-size: 18px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    header {
      background: linear-gradient(135deg, #142638, #214f54);
      color: white;
      padding: 38px 20px;
      padding-top: calc(38px + env(safe-area-inset-top, 0px));
    }

    .container { width: min(100%, 880px); margin: 0 auto; }
    .label { color: #9ce9cc; font-size: 14px; letter-spacing: 1px; }
    h1 { font-size: clamp(32px, 7vw, 48px); line-height: 1.2; margin: 12px 0; }
    header p { color: #dce9f1; margin-bottom: 0; }
    main { padding: 24px 16px 40px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 26px;
      margin-bottom: 20px;
      box-shadow: 0 6px 24px rgb(20 38 56 / 4%);
    }

    h2 { font-size: 27px; line-height: 1.3; margin: 0 0 16px; }
    h3 { font-size: 21px; line-height: 1.4; }
    p { margin: 0 0 16px; }
    .card > :last-child { margin-bottom: 0; }

    .tag {
      display: inline-block;
      background: #e5f6ef;
      color: #176344;
      padding: 5px 12px;
      border-radius: 24px;
      font-size: 14px;
      margin-bottom: 14px;
    }

    .muted { color: var(--muted); font-size: 15px; }

    button {
      width: 100%;
      min-height: 52px;
      padding: 15px 17px;
      margin-top: 12px;
      border: 2px solid var(--border);
      border-radius: 14px;
      background: #f7fafc;
      color: var(--text);
      font: inherit;
      text-align: left;
      line-height: 1.5;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }

    button:disabled { opacity: .7; cursor: default; }

    .primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
      text-align: center;
      font-weight: 600;
    }

    @media (hover: hover) {
      button:not(:disabled):hover { border-color: var(--accent); }
      .primary:not(:disabled):hover { background: #19634b; }
    }

    .feedback { margin-top: 18px; padding: 17px; border-radius: 14px; }
    .correct { background: #e5f6ef; color: #15583e; }
    .hint { background: #fff3d8; color: #704d10; }
    .back { margin: 0 0 20px; background: white; }

    .progress-track {
      height: 10px;
      background: #e5edf2;
      border-radius: 12px;
      margin: 16px 0;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0;
    }

    footer {
      padding: 0 20px 28px;
      padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 480px) {
      .card { padding: 21px; }
      main { padding: 20px 12px 30px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="container">
      <div class="label">ФИЗИКА · 7 КЛАСС</div>
      <h1>Пойми, как устроен мир</h1>
      <p>LEGO, игры, природа и маленькие открытия. Начинаем с нуля.</p>
    </div>
  </header>

  <main id="app" class="container">
    <section class="card">
      <h2>Загрузка занятий…</h2>
      <p>Если сообщение не исчезает, обновите страницу.</p>
    </section>
  </main>

  <noscript>
    Для интерактивных занятий нужно разрешить JavaScript в браузере.
  </noscript>

  <footer>
    Учебник по физике · Вводный блок · Без регистрации
  </footer>

  <script>
    (() => {
      "use strict";

      const KEY = "fizika7-progress-v1";
      const app = document.getElementById("app");

      const lessons = [
        {
          id: "intro-1",
          title: "Предмет и материал",
          subtitle: "LEGO и пластилин",
          content: `
            <p>
              Возьми кусочек пластилина или представь его.
              Из него можно сделать шар, рыбку или лодочку.
            </p>
            <h3>Одна новая мысль</h3>
            <p>
              Шар и лодочка — разные предметы.
              В физике отдельный предмет называют
              <strong>физическим телом</strong>.
            </p>
            <p>
              Пластилин — материал этих предметов.
              Когда меняется форма предмета, материал
              не обязательно становится другим.
            </p>
            <p>
              Ещё пример: деталь LEGO — предмет,
              а пластмасса — материал детали.
            </p>
          `,
          question: "Из пластилинового шара слепили лодочку. Что изменилось?",
          answers: [
            "Форма предмета. Материал остался пластилином.",
            "Пластилин превратился в воду."
          ],
          correct: 0,
          success: "Верно! У предмета другая форма, но материал остался прежним.",
          hint: "Лодочка по-прежнему пластилиновая. Подумай, что изменилось: форма или материал?",
          activity: "Найди два разных предмета из одного материала. Назови предметы и материал вслух.",
          summary: "Я могу различить предмет и материал, из которого он сделан."
        },
        {
          id: "intro-2",
          title: "Измеряем, а не угадываем",
          subtitle: "Длина постройки",
          content: `
            <p>
              Возьми небольшую LEGO-постройку или карандаш.
              Сначала предположи его длину.
              Проверить предположение — интереснее, чем просто угадать.
            </p>
            <h3>Как измерить линейкой</h3>
            <p>
              Совмести начало предмета с нулевой отметкой.
              Ноль не всегда находится на самом краю линейки.
            </p>
            <p>
              Посмотри, возле какой отметки заканчивается предмет.
              Запиши число и единицу измерения.
            </p>
            <p>
              Например: «длина 12 см».
              Это только пример записи, а не результат твоего измерения.
            </p>
            <p>
              Если линейки сейчас нет, представь предмет,
              который начинается на отметке 0 см
              и заканчивается на отметке 8 см.
            </p>
          `,
          question: "Предмет начинается на отметке 0 см и заканчивается на 8 см. Как записать его длину?",
          answers: [
            "8",
            "8 см"
          ],
          correct: 1,
          success: "Верно! В ответе есть число и единица: 8 сантиметров.",
          hint: "Одного числа недостаточно. 8 метров и 8 сантиметров — разные длины.",
          activity: "Измерь один предмет, если есть линейка. Сравни измерение со своим предположением.",
          summary: "Я знаю, что результат измерения записывают числом и единицей."
        },
        {
          id: "intro-3",
          title: "Минуты и секунды",
          subtitle: "Собираемся в поход",
          content: `
            <p>
              Перед походом вы договариваетесь:
              «Через две минуты выходим».
              Как выразить это время в секундах?
            </p>
            <h3>Разбираем на знакомые части</h3>
            <p>
              В одной минуте 60 секунд.
              Две минуты — два промежутка по 60 секунд.
            </p>
            <p>60 + 60 = 120 секунд.</p>
            <p>То же действие можно записать: 2 × 60 = 120.</p>
            <p>
              Теперь попробуй похожий пример.
              Не торопись: скорость ответа здесь не важна.
            </p>
          `,
          question: "Сколько секунд в трёх минутах?",
          answers: [
            "180 секунд",
            "30 секунд",
            "63 секунды"
          ],
          correct: 0,
          success: "Верно! Три раза по 60: 60 + 60 + 60 = 180 секунд.",
          hint: "Нужно взять 60 три раза. Можно сложить 60 + 60 + 60.",
          activity: "Объясни вслух, как перевести четыре минуты в секунды. При необходимости нарисуй четыре отрезка по одной минуте.",
          summary: "Я могу перевести несколько целых минут в секунды."
        }
      ];

      function readProgress() {
        try {
          const saved = JSON.parse(localStorage.getItem(KEY));
          const ids = new Set(lessons.map(lesson => lesson.id));

          if (!saved || typeof saved !== "object") {
            return { completed: [], lastLesson: null };
          }

          return {
            completed: Array.isArray(saved.completed)
              ? [...new Set(saved.completed.filter(id => ids.has(id)))]
              : [],
            lastLesson: ids.has(saved.lastLesson)
              ? saved.lastLesson
              : null
          };
        } catch {
          return { completed: [], lastLesson: null };
        }
      }

      let progress = readProgress();
      let storageFailed = false;

      function saveProgress() {
        try {
          localStorage.setItem(KEY, JSON.stringify(progress));
          storageFailed = false;
        } catch {
          storageFailed = true;
        }
      }

      function topOfPage() {
        window.scrollTo(0, 0);
      }

      function storageMessage() {
        return storageFailed
          ? `<p class="feedback hint" role="status">
               Браузер не разрешил сохранить прогресс.
               Занятия работают, но после обновления страницы
               результаты могут не сохраниться.
             </p>`
          : "";
      }

      function home() {
        const done = progress.completed.length;
        const total = lessons.length;
        const allDone = done === total;

        app.innerHTML = `
          <section class="card">
            <span class="tag">Вводный блок</span>
            <h2>${allDone ? "Первое знакомство завершено" : "Начинаем с понятного"}</h2>
            <p>
              ${allDone
                ? "Ты выполнил три вводных задания. Их можно открыть повторно и спокойно разобрать ещё раз."
                : "Три небольших занятия помогут освоиться. Формулы заранее знать не нужно."}
            </p>
            <div class="progress-track"
                 role="progressbar"
                 aria-label="Выполненные вводные задания"
                 aria-valuemin="0"
                 aria-valuemax="${total}"
                 aria-valuenow="${done}">
              <div class="progress-fill"
                   style="width: ${done / total * 100}%"></div>
            </div>
            <p class="muted">
              Выполнено заданий: ${done} из ${total}.
              Это отметки о выполнении, не школьные оценки.
            </p>
            <button id="continue" type="button" class="primary">
              ${allDone
                ? "Повторить вводные занятия"
                : progress.lastLesson
                  ? "Продолжить занятие"
                  : "Начать с нуля"}
            </button>
          </section>

          <section class="card">
            <h2>Выбери занятие</h2>
            <div id="lesson-list"></div>
          </section>

          <section class="card">
            <h2>Как заниматься</h2>
            <p>
              Прочитай объяснение, попробуй ответить,
              при необходимости воспользуйся подсказкой.
              Таймера нет. Можно остановиться и вернуться позже.
            </p>
            <p class="muted">
              В этой версии доступны только три вводных занятия.
              Основные разделы курса ещё не добавлены.
            </p>
          </section>

          <section class="card">
            <h2>Где хранится прогресс</h2>
            <p class="muted">
              Только в этом браузере на этом устройстве.
              На другом устройстве он автоматически не появится.
              Очистка данных сайта может удалить результаты.
              В приватном режиме сохранение может быть временным.
            </p>
            ${storageMessage()}
          </section>
        `;

        const list = document.getElementById("lesson-list");

        lessons.forEach((lesson, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent =
            `${index + 1}. ${lesson.title}` +
            (progress.completed.includes(lesson.id) ? " — выполнено" : "");

          button.addEventListener("click", () => openLesson(lesson.id));
          list.appendChild(button);
        });

        document.getElementById("continue").addEventListener("click", () => {
          const firstUnfinished = lessons.find(
            lesson => !progress.completed.includes(lesson.id)
          );

          const id = allDone
            ? lessons[0].id
            : progress.lastLesson || firstUnfinished?.id || lessons[0].id;

          openLesson(id);
        });

        topOfPage();
      }

      function openLesson(id) {
        const index = lessons.findIndex(lesson => lesson.id === id);

        if (index < 0) {
          home();
          return;
        }

        const lesson = lessons[index];
        progress.lastLesson = id;
        saveProgress();

        app.innerHTML = `
          <button id="back" type="button" class="back">
            ← К списку занятий
          </button>

          <section class="card">
            <span class="tag">Занятие ${index + 1} из ${lessons.length}</span>
            <h2>${lesson.title}</h2>
            <p class="muted">${lesson.subtitle}</p>
            ${lesson.content}
          </section>

          <section class="card">
            <span class="tag">Попробуй сам</span>
            <h2>${lesson.question}</h2>
            <div id="answers"></div>
            <div id="feedback" role="status" aria-live="polite" hidden></div>

            <div id="completion" hidden>
              <h3>Что ты уже можешь объяснить</h3>
              <p>${lesson.summary}</p>
              <button id="next" type="button" class="primary">
                ${index < lessons.length - 1
                  ? "Следующее занятие →"
                  : "Завершить вводный блок"}
              </button>
            </div>
          </section>

          <section class="card">
            <h2>Попробуй вне экрана</h2>
            <p>${lesson.activity}</p>
          </section>

          <div id="storage-status">${storageMessage()}</div>
        `;

        document.getElementById("back").addEventListener("click", home);

        const answers = document.getElementById("answers");
        const feedback = document.getElementById("feedback");
        let solved = false;

        lesson.answers.forEach((text, answerIndex) => {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = text;

          button.addEventListener("click", () => {
            if (solved) return;

            const correct = answerIndex === lesson.correct;

            feedback.hidden = false;
            feedback.className = correct
              ? "feedback correct"
              : "feedback hint";
            feedback.textContent = correct
              ? lesson.success
              : lesson.hint;

            if (correct) {
              solved = true;

              if (!progress.completed.includes(id)) {
                progress.completed.push(id);
              }

              saveProgress();

              answers.querySelectorAll("button").forEach(item => {
                item.disabled = true;
              });

              document.getElementById("completion").hidden = false;
              document.getElementById("storage-status").innerHTML =
                storageMessage();
            }
          });

          answers.appendChild(button);
        });

        document.getElementById("next").addEventListener("click", () => {
          if (index < lessons.length - 1) {
            openLesson(lessons[index + 1].id);
          } else {
            progress.lastLesson = null;
            saveProgress();
            home();
          }
        });

        topOfPage();
      }

      home();
    })();
  </script>
</body>
</html>
