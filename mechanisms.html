(function(){'use strict';
const TASKS=[{"id": "l1", "title": "Уравновесь LEGO-рычаг", "q": "Лёгкий горизонтальный рычаг: слева 6 Н на плече 10 см, справа неизвестная вертикальная сила вниз на плече 20 см. Найди правую силу для равновесия.", "type": "number", "answer": 3, "unit": "Н", "hints": ["Используй F₁l₁ = F₂l₂.", "F₂ = 6 × 10/20."], "solution": "F₂ = 3 Н. Моменты по 0,6 Н·м.", "group": "Рычаги · 6 задач"}, {"id": "l2", "title": "Найди плечо", "q": "Лёгкий горизонтальный рычаг: F₁ = 10 Н, l₁ = 30 см, F₂ = 15 Н. Силы вертикально вниз по разные стороны опоры. Найди l₂ для равновесия.", "type": "number", "answer": 20, "unit": "см", "hints": ["Вырази l₂ = F₁l₁/F₂.", "10 × 30/15."], "solution": "l₂ = 20 см.", "group": "Рычаги · 6 задач"}, {"id": "l3", "title": "Момент силы", "q": "Сила 8 Н имеет перпендикулярное плечо 0,25 м. Найди момент M = Fl.", "type": "number", "answer": 2, "unit": "Н·м", "hints": ["Умножь силу на плечо в метрах.", "8 × 0,25."], "solution": "M = 8 × 0,25 = 2 Н·м. Момент имеет единицу Н·м, но не является механической работой.", "group": "Рычаги · 6 задач"}, {"id": "l4", "title": "Вся длина — не плечо", "q": "Лёгкая прямая горизонтальная балка длиной 60 см имеет опору между концами в 10 см от левого конца. Слева вертикально вниз действует 20 Н. Какую силу вниз приложить к правому концу для равновесия?", "type": "number", "answer": 4, "unit": "Н", "hints": ["Левое плечо 10 см; правое 60 − 10 = 50 см.", "Fправ = 20 × 10/50."], "solution": "Fправ = 4 Н. Нельзя вместо правого плеча подставить всю длину 60 см.", "group": "Рычаги · 6 задач"}, {"id": "l5", "title": "Изменили силу и плечо", "q": "Силу увеличили вдвое, её перпендикулярное плечо уменьшили вдвое. Что с моментом этой силы?", "type": "choice", "options": ["Не изменился", "Увеличился вдвое", "Уменьшился вчетверо"], "answer": 0, "hints": ["Момент — произведение F на l.", "2F × l/2 = Fl."], "solution": "Момент не изменился. Равновесие всего рычага требует учёта остальных моментов.", "group": "Рычаги · 6 задач"}, {"id": "l6", "title": "Что такое плечо?", "q": "Как правильно определить плечо силы?", "type": "choice", "options": ["Кратчайшее расстояние от оси до линии действия силы", "Всегда вся длина рычага", "Всегда расстояние вдоль изогнутой ручки"], "answer": 0, "hints": ["Расстояние измеряется перпендикулярно линии действия силы.", "Для горизонтальной балки и вертикальной силы оно совпадает с горизонтальным расстоянием до точки приложения."], "solution": "Плечо — перпендикулярное расстояние от оси до линии действия силы.", "group": "Рычаги · 6 задач"}, {"id": "b1", "title": "Неподвижный блок", "q": "Идеальный неподвижный блок равномерно поднимает груз 3 кг. Найди силу на свободном конце верёвки при g = 10 Н/кг.", "type": "number", "answer": 30, "unit": "Н", "hints": ["Этот блок не даёт выигрыша в силе.", "F = mg."], "solution": "F = 3 × 10 = 30 Н.", "group": "Блоки · 6 задач"}, {"id": "b2", "title": "Подвижный блок", "q": "Идеальный подвижный блок с двумя вертикальными несущими ветвями равномерно поднимает груз 4 кг. Массой блока пренебречь. Найди силу на свободном конце при g = 10 Н/кг.", "type": "number", "answer": 20, "unit": "Н", "hints": ["Тяжесть груза 40 Н распределена на две ветви одной верёвки.", "F = mg/2."], "solution": "F = 4 × 10/2 = 20 Н.", "group": "Блоки · 6 задач"}, {"id": "b3", "title": "Длина верёвки", "q": "Груз с идеальным подвижным блоком на двух вертикальных несущих ветвях подняли на 1,5 м. На сколько нужно вытянуть свободный конец относительно закреплённой опоры?", "type": "number", "answer": 3, "unit": "м", "hints": ["Для такой схемы s = 2h.", "Дважды по 1,5 м."], "solution": "s = 2 × 1,5 = 3 м.", "group": "Блоки · 6 задач"}, {"id": "b4", "title": "Ход неподвижного блока", "q": "Идеальный неподвижный блок поднял груз на 2 м. На сколько переместился свободный конец верёвки?", "type": "number", "answer": 2, "unit": "м", "hints": ["Выигрыша ни в силе, ни в пути нет.", "s = h."], "solution": "s = 2 м. Направление движения концов может различаться.", "group": "Блоки · 6 задач"}, {"id": "b5", "title": "Работа при подъёме", "q": "Идеальный подвижный блок с двумя несущими ветвями равномерно поднимает 6 кг на 2 м. Найди полезную работу при g = 10 Н/кг. Формула Aпол = mgh.", "type": "number", "answer": 120, "unit": "Дж", "hints": ["Работа связана с подъёмом груза, а не только с силой натяжения.", "6 × 10 × 2."], "solution": "Aпол = 120 Дж. Натяжение 30 Н, путь свободного конца 4 м: Aзатр = 30 × 4 = 120 Дж.", "group": "Блоки · 6 задач"}, {"id": "b6", "title": "Реальный блок: КПД — дополнительно", "q": "Груз 8 кг равномерно поднят на 2 м подвижным блоком. Свободный конец переместился на 4 м, постоянная сила на нём 50 Н. Найди КПД: η = mgh/(Fs) × 100%, g = 10 Н/кг.", "type": "number", "answer": 80, "unit": "%", "hints": ["Полезная работа 8 × 10 × 2 = 160 Дж.", "Затраченная 50 × 4 = 200 Дж. Раздели и переведи в проценты."], "solution": "η = 160/200 × 100% = 80%. Это реальная схема с потерями, не идеальный блок.", "group": "Блоки · 6 задач"}],THEORY="<section class=\"card\"><h2>Рычаг: сравниваем моменты<\/h2><p>Рычаг — жёсткое тело с опорой, вокруг которой возможно вращение. Для простого горизонтального рычага с вертикальными силами по разные стороны опоры равновесие требует <strong>F₁l₁ = F₂l₂<\/strong>.<\/p><p>Момент силы M = Fl. Плечо l — кратчайшее расстояние от оси до линии действия силы. В общем случае это не вся длина ручки и не расстояние вдоль изогнутого рычага.<\/p><p>Момент измеряют в Н·м. В отношении плеч можно использовать одинаковые единицы, но для момента в СИ нужны метры.<\/p><p>В задачах весом рычага пренебрегаем или считаем его собственный момент уравновешенным. Реакция опоры тоже действует, но её момент относительно оси опоры равен нулю.<\/p><\/section><section class=\"card\"><h2>Блок: сначала рассмотри схему<\/h2><p>Идеальный неподвижный блок меняет направление силы, но не даёт выигрыша: <strong>F = mg; s = h<\/strong>.<\/p><p>Идеальный подвижный блок в показанной схеме поддерживают две вертикальные ветви одной верёвки: <strong>2F = mg; s = 2h<\/strong>. Здесь свободный конец тянут вверх; дополнительного направляющего неподвижного блока на рисунке нет.<\/p><p>В других схемах число несущих ветвей и углы могут отличаться. Нельзя назначать двукратный выигрыш любой системе только потому, что в ней есть подвижный блок.<\/p><p>Идеализация: верёвка невесома, нерастяжима, не проскальзывает, трения нет; массой блока пренебрегаем; груз поднимается равномерно.<\/p><\/section><section class=\"card\"><h2>Выигрыш в силе — не выигрыш в работе<\/h2><p>При постоянной силе вдоль движения A = Fs. Полезная работа равномерного подъёма Aпол = mgh.<\/p><p>В идеальной схеме Aзатр = Aпол. Для подвижного блока сила вдвое меньше, но путь свободного конца вдвое больше. Реальный механизм имеет потери.<\/p><p>КПД: η = Aпол/Aзатр × 100%. Это дополнительная расчётная тема. Нельзя путать момент силы с работой только потому, что размерность обеих величин включает Н·м.<\/p><\/section>",DIAGRAMS=[["<svg viewBox=\"0 0 600 320\" role=\"img\" aria-label=\"Горизонтальный рычаг с вертикальными силами по разные стороны опоры; плечи измерены от опоры до линий действия сил\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"320\" rx=\"16\" fill=\"#eef7fa\"/><path d=\"M75 150H525\" stroke=\"#31566c\" stroke-width=\"10\"/><path d=\"M300 155L265 210H335Z\" fill=\"#839ba8\"/><path d=\"M160 55L160 137M153.76746799814535 125.59142669542516L160 137L166.23253200185465 125.59142669542516\" stroke=\"#237f62\" stroke-width=\"4\" fill=\"none\"/><path d=\"M440 55L440 137M433.7674679981454 125.59142669542516L440 137L446.2325320018546 125.59142669542516\" stroke=\"#237f62\" stroke-width=\"4\" fill=\"none\"/><path d=\"M160 230H300M300 230H440\" stroke=\"#31566c\" stroke-width=\"2\"/><text x=\"160\" y=\"35\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">F₁ вниз<\/text><text x=\"440\" y=\"35\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">F₂ вниз<\/text><text x=\"230\" y=\"259\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">l₁<\/text><text x=\"370\" y=\"259\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">l₂<\/text><text x=\"300\" y=\"298\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"22\" fill=\"#173449\">Равновесие: F₁l₁ = F₂l₂<\/text><\/svg>", "Показаны две силы, создающие моменты. Реакция опоры не нарисована; весом рычага пренебрегаем."], ["<svg viewBox=\"0 0 600 320\" role=\"img\" aria-label=\"Неподвижный блок закреплён сверху, груз висит на левом конце верёвки, правый конец тянут вниз\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"320\" rx=\"16\" fill=\"#eef7fa\"/><path d=\"M180 35H420M300 35V65\" stroke=\"#31566c\" stroke-width=\"6\"/><circle cx=\"300\" cy=\"100\" r=\"35\" fill=\"#c7dbd0\" stroke=\"#31566c\" stroke-width=\"3\"/><circle cx=\"300\" cy=\"100\" r=\"5\" fill=\"#31566c\"/><path d=\"M265 220V100A35 35 0 0 1 335 100V235\" fill=\"none\" stroke=\"#b88632\" stroke-width=\"5\"/><rect x=\"240\" y=\"220\" width=\"50\" height=\"45\" rx=\"6\" fill=\"#f5c876\"/><path d=\"M380 170L380 245M373.7674679981454 233.59142669542516L380 245L386.2325320018546 233.59142669542516\" stroke=\"#237f62\" stroke-width=\"4\" fill=\"none\"/><text x=\"160\" y=\"245\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">Груз<\/text><text x=\"465\" y=\"210\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"17\" fill=\"#173449\">Тянуть вниз<\/text><text x=\"300\" y=\"300\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"20\" fill=\"#173449\">Неподвижный блок: F = mg; s = h<\/text><\/svg>", "Ось закреплена. Один конец верёвки с грузом поднимается, свободный конец тянут вниз."], ["<svg viewBox=\"0 0 600 320\" role=\"img\" aria-label=\"Подвижный блок: один конец верёвки закреплён сверху, две вертикальные ветви поддерживают блок с грузом, свободный конец тянут вверх\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"320\" rx=\"16\" fill=\"#eef7fa\"/><path d=\"M180 35H425\" stroke=\"#31566c\" stroke-width=\"6\"/><circle cx=\"300\" cy=\"170\" r=\"35\" fill=\"#c7dbd0\" stroke=\"#31566c\" stroke-width=\"3\"/><circle cx=\"300\" cy=\"170\" r=\"5\" fill=\"#31566c\"/><path d=\"M265 35V170A35 35 0 0 0 335 170V60\" fill=\"none\" stroke=\"#b88632\" stroke-width=\"5\"/><path d=\"M300 170V230\" stroke=\"#31566c\" stroke-width=\"4\"/><rect x=\"275\" y=\"230\" width=\"50\" height=\"40\" rx=\"6\" fill=\"#f5c876\"/><path d=\"M380 140L380 60M386.2325320018546 71.40857330457484L380 60L373.7674679981454 71.40857330457484\" stroke=\"#237f62\" stroke-width=\"4\" fill=\"none\"/><text x=\"460\" y=\"90\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"17\" fill=\"#173449\">Тянуть вверх<\/text><text x=\"165\" y=\"150\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"16\" fill=\"#173449\">Две несущие<\/text><text x=\"165\" y=\"174\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"16\" fill=\"#173449\">ветви<\/text><text x=\"300\" y=\"305\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"19\" fill=\"#173449\">Подвижный блок: F = mg/2; s = 2h<\/text><\/svg>", "Один конец закреплён сверху, блок и груз движутся вместе. Две вертикальные ветви поддерживают подвижную систему."]],FLOW=["Рычаг: найди ось и перпендикулярные плечи", "Рычаг: сравни F₁l₁ и F₂l₂", "Блок: выясни, закреплена ли ось и сколько несущих ветвей", "Для показанных блоков используй F = mg или F = mg/2", "Согласуй перемещение верёвки и высоту груза", "Проверь работу: меньшая сила требует большего пути"],PULLEYS={"movable": "<svg viewBox=\"0 0 600 320\" role=\"img\" aria-label=\"Подвижный блок: один конец верёвки закреплён сверху, две вертикальные ветви поддерживают блок с грузом, свободный конец тянут вверх\" xmlns=\"http://www.w3.org/2000/s function load(){try{let p=JSON.parse(localStorage.getItem(KEY)),ids=new Set(TASKS.map(t=>t.id));return{done:p&&Array.isArray(p.done)?[...new Set(p.done.filter(id=>ids.has(id)))]:[],help:p&&Array.isArray(p.help)?p.help.filter(id=>ids.has(id)):[]}}catch(e){return{done:[],help:[]}}}
let state=load();function save(){try{localStorage.setItem(KEY,JSON.stringify(state));failed=false}catch(e){failed=true}}function notice(){return failed?'<p class="feedback hint" role="status">Прогресс не удалось сохранить. Задания доступны.</p>':''}function nav(){return '<nav class="nav" aria-label="Разделы"><a class="link" href="./start.html">Общее меню</a><a class="link" href="./energy.html">Сохранение энергии</a><a class="link" href="./hydraulic.html">Гидравлический пресс</a></nav>'}function fmt(n){return String(Math.round(n*1000000)/1000000).replace('.',',')}
function home(){app.innerHTML=`<section class="card"><span class="tag">Блоки и рычаги · Версия 1.0</span><h2>12 задач и две модели</h2><p>Шесть задач о рычагах и шесть о блоках. Последняя задача на КПД дополнительная.</p><div class="bar" role="progressbar" aria-label="Выполненные задания" aria-valuemin="0" aria-valuemax="12" aria-valuenow="${state.done.length}"><div style="width:${state.done.length/12*100}%"></div></div><p class="muted">Выполнено ${state.done.length} из 12. Это не школьная оценка.</p><button id="memo" class="primary">Объяснение, схемы и формулы</button><button id="lever">Модель рычага</button><button id="pulley">Модель блоков</button><button id="continue">Начать / продолжить задачи</button>${notice()}</section><div id="groups"></div>${nav()}<details class="card" style="margin-top:20px"><summary>Источники и ограничения</summary><p class="muted">Сверка: <a href="https://openstax.org/books/college-physics-2e/pages/9-5-simple-machines" target="_blank" rel="noopener noreferrer">OpenStax: простые механизмы</a>. Прогресс только в этом браузере; автоматически между устройствами не переносится и может исчезнуть при очистке данных.</p><p class="muted">Не поднимай тяжёлые грузы, не натягивай верёвки у лица и не используй настоящие лебёдки. Модели не предназначены для проектирования подъёмников и расчёта безопасности.</p></details>`;let groups=document.getElementById('groups');[...new Set(TASKS.map(t=>t.group))].forEach(group=>{let section=document.createElement('section');section.className='card';let title=document.createElement('h2');title.textContent=group;section.appendChild(title);TASKS.forEach((t,i)=>{if(t.group!==group)return;let b=document.createElement('button');b.textContent=(i+1)+'. '+t.title+(state.done.includes(t.id)?(state.help.includes(t.id)?' — с помощью':' — выполнено'):'');b.onclick=()=>task(i);section.appendChild(b)});groups.appendChild(section)});document.getElementById('memo').onclick=memo;document.getElementById('lever').onclick=lever;document.getElementById('pulley').onclick=pulley;document.getElementById('continue').onclick=()=>{let i=TASKS.findIndex(t=>!state.done.includes(t.id));task(i<0?0:i)};window.scrollTo(0,0)}
function memo(){app.innerHTML='<button id="back">← К задачам</button>'+THEORY+DIAGRAMS.map(d=>'<section class="card"><h2>Рассмотри схему</h2><figure>'+d[0]+'<figcaption>'+d[1]+'</figcaption></figure></section>').join('')+'<section class="card"><h2>Схема решения</h2><ol class="flow">'+FLOW.map(s=>'<li>'+s+'</li>').join('')+'</ol><button id="first" class="primary">Первая задача</button></section>'+nav();document.getElementById('back').onclick=home;document.getElementById('first').onclick=()=>task(0);window.scrollTo(0,0)}
function lever(){app.innerHTML=`<button id="back">← К задачам</button><section class="card" style="margin-top:18px"><span class="tag">Проверка равновесия, не анимация движения</span><h2>Рычаг: силы и плечи</h2><p>Балка горизонтальна, силы направлены вертикально вниз по разные стороны оси. Весом балки и трением в опоре пренебрегаем. Сравниваем моменты в этом положении.</p><label for="f1">Сила слева: <span id="f1-label">6</span> Н</label><input id="f1" type="range" min="1" max="20" step="1" value="6"><label for="l1">Левое плечо: <span id="l1-label">10</span> см</label><input id="l1" type="range" min="5" max="30" step="5" value="10"><label for="f2">Сила справа: <span id="f2-label">3</span> Н</label><input id="f2" type="range" min="1" max="20" step="1" value="3"><label for="l2">Правое плечо: <span id="l2-label">20</span> см</label><input id="l2" type="range" min="5" max="30" step="5" value="20"><figure><div id="lever-svg"></div><figcaption>Длины плеч меняются на рисунке. Длины стрелок не задают величины сил. Балка остаётся горизонтальной: модель показывает результат проверки, а не фактическую динамику.</figcaption></figure><div id="lever-result" class="feedback good" role="status" aria-live="polite"></div></section>${nav()}`;document.getElementById('back').onclick=home;let ids=['f1','l1','f2','l2'];function draw(){let F1=Number(document.getElementById('f1').value),L1=Number(document.getElementById('l1').value),F2=Number(document.getElementById('f2').value),L2=Number(document.getElementById('l2').value),M1=F1*L1/100,M2=F2*L2/100,x1=300-6*L1,x2=300+6*L2;[F1,L1,F2,L2].forEach((v,i)=>document.getElementById(ids[i]+'-label').textContent=fmt(v));let balanced=Math.abs(M1-M2)<1e-8;document.getElementById('lever-result').className='feedback '+(balanced?'good':'hint');document.getElementById('lever-result').textContent='Слева M₁ = '+fmt(M1)+' Н·м; справа M₂ = '+fmt(M2)+' Н·м. '+(balanced?'Равновесие по моментам.':M1>M2?'В этом положении левый конец стремится опуститься.':'В этом положении правый конец стремится опуститься.')+' Для равновесия при остальных прежних данных нужна правая сила F₂ = '+fmt(F1*L1/L2)+' Н.';document.getElementById('lever-svg').innerHTML=`<svg viewBox="0 0 600 290" role="img" aria-label="Горизонтальный рычаг с плечами ${L1} и ${L2} сантиметров" xmlns="http://www.w3.org/2000/svg"><rect width="600" height="290" rx="16" fill="#eef7fa"/><path d="M85 145H515" stroke="#31566c" stroke-width="10"/><path d="M300 151L270 198H330Z" fill="#839ba8"/><path d="M${x1} 60V133m-9-12 9 12 9-12M${x2} 60V133m-9-12 9 12 9-12" fill="none" stroke="#237f62" stroke-width="4"/><text x="${x1}" y="40" text-anchor="middle" font-size="18" font-family="Arial" fill="#173449">${F1} Н</text><text x="${x2}" y="40" text-anchor="middle" font-size="18" font-family="Arial" fill="#173449">${F2} Н</text><path d="M${x1} 218H300M300 218H${x2}" stroke="#31566c" stroke-width="2"/><text x="${(x1+300)/2}" y="248" text-anchor="middle" font-size="18" font-family="Arial" fill="#173449">${L1} см</text><text x="${(x2+300)/2}" y="248" text-anchor="middle" font-size="18" font-family="Arial" fill="#173449">${L2} см</text></svg>`}ids.forEach(id=>document.getElementById(id).oninput=draw);draw();window.scrollTo(0,0)}
function pulley(){app.innerHTML=`<button id="back">← К задачам</button><section class="card" style="margin-top:18px"><span class="tag">Идеальная система · равномерный подъём</span><h2>Сравни два блока</h2><p>Невесомая нерастяжимая верёвка, без трения; массой блока пренебрегаем. g = 10 Н/кг. Для подвижного блока здесь две вертикальные несущие ветви.</p><label for="kind">Схема</label><select id="kind"><option value="movable">Подвижный блок: две несущие ветви</option><option value="fixed">Неподвижный блок</option></select><label for="mass">Масса груза: <span id="mass-label">4</span> кг</label><input id="mass" type="range" min="1" max="10" step="1" value="4"><label for="height">Высота подъёма: <span id="height-label">2</span> м</label><input id="height" type="range" min="0.5" max="5" step="0.5" value="2"><figure><div id="pulley-svg"></div><figcaption id="pulley-caption"></figcaption></figure><div id="pulley-result" class="feedback good" role="status" aria-live="polite"></div></section>${nav()}`;document.getElementById('back').onclick=home;let kind=document.getElementById('kind'),mass=document.getElementById('mass'),height=document.getElementById('height');function draw(){let moving=kind.value==='movable',m=Number(mass.value),h=Number(height.value),n=moving?2:1,F=m*10/n,s=n*h,Ain=F*s,Aout=m*10*h;document.getElementById('mass-label').textContent=fmt(m);document.getElementById('height-label').textContent=fmt(h);document.getElementById('pulley-svg').innerHTML=PULLEYS[moving?'movable':'fixed'];document.getElementById('pulley-caption').textContent=moving?'В этой схеме свободный конец тянут вверх. Блок с грузом поддерживают две ветви. Положение рисунка не изображает текущую высоту подъёма.':'Ось закреплена сверху. Свободный конец тянут вниз. Положение рисунка не изображает текущую высоту подъёма.';document.getElementById('pulley-result').textContent='Тяжесть груза mg = '+fmt(m*10)+' Н. Сила на свободном конце F = '+fmt(F)+' Н. Для подъёма на '+fmt(h)+' м нужно переместить свободный конец на '+fmt(s)+' м. Работа входная: '+fmt(Ain)+' Дж; полезная: '+fmt(Aout)+' Дж. Идеальный КПД 100%.'}kind.onchange=draw;mass.oninput=draw;height.oninput=draw;draw();window.scrollTo(0,0)}
function parse(value){let s=value.trim().replace(',','.');return /^\d+(?:\.\d+)?$/.test(s)?Number(s):null}
function task(i){let t=TASKS[i],solved=false,helped=false,h=0;app.innerHTML=`<button id="back">← К задачам</button><section class="card" style="margin-top:18px"><span class="tag">Задача ${i+1} из 12 · ${t.group}</span><h2>${t.title}</h2><p>${t.q}</p>${t.type==='number'?'<form id="answer-form" novalidate><label for="answer">Ответ, '+t.unit+'</label><input id="answer" type="text" inputmode="decimal" autocomplete="off" aria-describedby="note"><p id="note" class="muted">Только число. Запятая и точка принимаются одинаково.</p><button id="check" class="primary" type="submit">Проверить</button></form>':'<div id="choices"></div>'}<button id="hint">Подсказка</button><div id="feedback" role="status" aria-live="polite" hidden></div><div id="hint-text" class="feedback hint" role="status" hidden></div><details id="solution" hidden><summary>Открыть разбор</summary><p>${t.solution}</p></details><button id="next" class="primary" hidden>${i<TASKS.length-1?'Следующая задача →':'Завершить тренажёр'}</button><button id="memo">Вернуться к объяснению</button><div id="storage-status"></div></section>`;document.getElementById('back').onclick=home;document.getElementById('memo').onclick=memo;let fb=document.getElementById('feedback');function message(s,ok){fb.hidden=false;fb.className='feedback '+(ok?'good':'hint');fb.textContent=s}function verify(value){if(solved)return;if(value===null||!Number.isFinite(value)){message('Введи число, например 3 или 0,5.',false);return}if(Math.abs(value-t.answer)>1e-8){helped=true;message('Пока не совпало. Проверь плечи, схему блока и единицы. Можно открыть подсказку.',false);return}solved=true;if(!state.done.includes(t.id))state.done.push(t.id);if(helped&&!state.help.includes(t.id))state.help.push(t.id);save();message('Верно! '+t.solution,true);if(t.type==='number'){document.getElementById('answer').disabled=true;document.getElementById('check').disabled=true}else document.getElementById('choices').querySelectorAll('button').forEach(b=>b.disabled=true);document.getElementById('hint').hidden=true;document.getElementById('next').hidden=false;document.getElementById('storage-status').innerHTML=notice()}
if(t.type==='number')document.getElementById('answer-form').onsubmit=e=>{e.preventDefault();verify(parse(document.getElementById('answer').value))};else{let box=document.getElementById('choices');t.options.forEach((s,k)=>{let b=document.createElement('button');b.textContent=s;b.onclick=()=>verify(k);box.appendChild(b)})}document.getElementById('hint').onclick=function(){helped=true;let box=document.getElementById('hint-text');box.hidden=false;box.textContent=t.hints[Math.min(h,t.hints.length-1)];h++;this.textContent='Ещё подсказка';if(h>=t.hints.length){this.disabled=true;this.textContent='Подсказки открыты';document.getElementById('solution').hidden=false}};document.getElementById('solution').ontoggle=function(){if(this.open)helped=true};document.getElementById('next').onclick=()=>i<TASKS.length-1?task(i+1):home();window.scrollTo(0,0)}
try{home()}catch(e){app.innerHTML='<section class="card"><h2>Не удалось открыть тренажёр</h2><pre id="error"></pre></section>';document.getElementById('error').textContent=String(e.message||e)}
})();
</script></body></html>
