<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142638"><title>Итоговый тест · Физика 7 класс</title><style>*{box-sizing:border-box}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}body{margin:0;background:#eef3f7;color:#172c3e;font:18px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow-wrap:anywhere}.wrap{max-width:950px;margin:auto}header{padding:30px 20px;background:linear-gradient(130deg,#142638,#21564f);color:white}header p{color:#dce9f1}h1{font-size:clamp(28px,7vw,42px);line-height:1.25}h2{font-size:25px;line-height:1.35;margin-top:0}h3{font-size:21px}main{padding:24px 15px}.card{background:white;border:1px solid #dce5ed;border-radius:19px;padding:24px;margin-bottom:20px}p{margin:0 0 16px}.muted{font-size:15px;color:#526879}.tag{display:inline-block;background:#e5f6ef;color:#176344;border-radius:22px;padding:5px 12px;font-size:14px;margin-bottom:14px}button,.link{display:block;width:100%;padding:14px;margin-top:12px;min-height:50px;border:2px solid #dce5ed;border-radius:13px;color:#172c3e;background:#f7fafc;text-decoration:none;text-align:left;font:inherit;line-height:1.5;cursor:pointer;touch-action:manipulation}.primary{background:#237f62;border-color:#237f62;color:white;text-align:center}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #237f62;outline-offset:3px}input[type="text"]{width:100%;padding:14px;border:2px solid #bdced9;border-radius:10px;font:inherit;font-size:19px}label{display:block;margin:14px 0 6px}.option{display:flex;gap:14px;align-items:flex-start;padding:14px;border:2px solid #dce5ed;border-radius:12px;cursor:pointer}.option input{flex:0 0 auto;width:22px;height:22px;margin-top:4px;accent-color:#237f62}.option:has(input:checked){border-color:#237f62;background:#eef9f4}fieldset{margin:0;padding:0;border:0}legend{font-size:15px;color:#526879}.feedback{padding:16px;border-radius:12px;margin-top:16px}.good{background:#e5f6ef;color:#15583e}.hint{background:#fff3d8;color:#704d10}.nav{display:flex;gap:10px;flex-wrap:wrap}.nav>*{flex:1;min-width:150px}.numbers{display:flex;gap:7px;flex-wrap:wrap}.numbers button{width:44px;min-height:44px;padding:5px;text-align:center;margin:0;flex:none}.numbers .answered{background:#e5f6ef;border-color:#90c5ae}.numbers .current{outline:3px solid #237f62;outline-offset:1px}.progress{height:10px;background:#dce5ed;border-radius:8px;overflow:hidden;margin:15px 0}.progress span{display:block;height:100%;background:#237f62}svg{display:block;width:100%;height:auto;max-width:650px;margin:15px auto}figure{margin:0 0 20px}figcaption{font-size:14px;color:#526879}table{width:100%;border-collapse:collapse;font-size:16px}th,td{padding:10px;border:1px solid #dce5ed;text-align:left;vertical-align:top}th{background:#eef7fa}details{border-top:1px solid #dce5ed;padding-top:15px;margin-top:18px}summary{cursor:pointer;padding:8px 0}.answer-line{white-space:pre-wrap}footer{padding:0 20px 28px;text-align:center;font-size:14px;color:#526879}a{color:#176344}#print-text{display:none;white-space:pre-wrap;font:15px/1.6 Arial}#storage-warning:empty{display:none}@media(max-width:480px){.card{padding:18px}body{font-size:17px}.nav>*{min-width:120px}}@media print{body{background:white}header,footer,#app,#storage-warning{display:none!important}#print-text{display:block}}
</style></head><body><header><div class="wrap"><p>ФИЗИКА · 7 КЛАСС</p><h1>Итоговый тест</h1><p>Самопроверка после учебных модулей</p></div></header><div class="wrap"><p id="storage-warning" class="feedback hint" role="status"></p></div><main id="app" class="wrap"><section class="card"><h2>Загрузка теста…</h2></section></main><pre id="print-text"></pre><footer>Итоговый тест · Версия 1.0</footer><noscript>Для прохождения теста включи JavaScript в браузере.</noscript><script>
(function(){'use strict';
const QUESTIONS=[{"id": 1, "group": "m1", "title": "Цена деления", "text": "Между отметками 40 и 60 км/ч — четыре равных промежутка. Чему равна цена деления?", "type": "choice", "options": ["2,5 км/ч", "5 км/ч", "20 км/ч", "80 км/ч"], "answer": 1, "explain": "Цена деления = (60 − 40)/4 = 5 км/ч. Считают промежутки между штрихами, а не сами штрихи.", "diagram": "<svg viewBox=\"0 0 600 240\" role=\"img\" aria-label=\"Шкала с четырьмя равными промежутками между отметками 40 и 60 километров в час\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"240\" rx=\"16\" fill=\"#eef7fa\"/><rect x=\"65\" y=\"70\" width=\"470\" height=\"70\" fill=\"white\" stroke=\"#31566c\"/><path d=\"M100 70v35\" stroke=\"#31566c\" stroke-width=\"2\"/><path d=\"M200 70v35\" stroke=\"#31566c\" stroke-width=\"2\"/><path d=\"M300 70v35\" stroke=\"#31566c\" stroke-width=\"2\"/><path d=\"M400 70v35\" stroke=\"#31566c\" stroke-width=\"2\"/><path d=\"M500 70v35\" stroke=\"#31566c\" stroke-width=\"2\"/><text x=\"100\" y=\"185\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">40 км/ч<\/text><text x=\"500\" y=\"185\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">60 км/ч<\/text><\/svg>"}, {"id": 2, "group": "m1", "title": "Диффузия", "text": "Какое описание соответствует диффузии?", "type": "choice", "options": ["Перемещение тела под действием приложенной силы.", "Переход вещества только из жидкого состояния в газообразное.", "Взаимное проникновение частиц веществ вследствие их беспорядочного теплового движения.", "Увеличение массы замкнутого тела без поступления вещества."], "answer": 2, "explain": "Диффузия — взаимное проникновение частиц соприкасающихся веществ вследствие их теплового движения. Не следует путать её с переносом вещества общим потоком.", "diagram": ""}, {"id": 3, "group": "m2", "title": "Путь поезда", "text": "Поезд движется равномерно со скоростью 54 км/ч в течение 10 минут. Какой путь он проходит? Ответ дай в метрах.", "type": "number", "unit": "м", "answer": 9000, "explain": "54 км/ч = 15 м/с; 10 мин = 600 с. Путь s = vt = 15 × 600 = 9000 м.", "diagram": ""}, {"id": 4, "group": "m2", "title": "Средняя скорость с привалом", "text": "Турист прошёл 6 км за 1,5 ч, отдыхал 30 минут, затем проехал 24 км за 1 ч. Найди среднюю скорость за всё время, включая привал.", "type": "number", "unit": "км/ч", "answer": 10, "explain": "Весь путь: 6 + 24 = 30 км. Всё время: 1,5 + 0,5 + 1 = 3 ч. Средняя скорость = 30/3 = 10 км/ч.", "diagram": ""}, {"id": 5, "group": "m2", "title": "Перевод плотности", "text": "Плотность гранита равна 2,6 г/см³. Вырази её в кг/м³.", "type": "number", "unit": "кг/м³", "answer": 2600, "explain": "1 г/см³ = 1000 кг/м³. Поэтому 2,6 г/см³ = 2600 кг/м³.", "diagram": ""}, {"id": 6, "group": "m2", "title": "Масса стальной детали", "text": "Объём детали 400 см³, плотность стали 7800 кг/м³. Найди массу в килограммах.", "type": "number", "unit": "кг", "answer": 3.12, "explain": "400 см³ = 0,0004 м³. Масса m = ρV = 7800 × 0,0004 = 3,12 кг.", "diagram": ""}, {"id": 7, "group": "m3", "title": "Сила тяжести и вес", "text": "Неподвижная люстра висит на подвесе. К чему приложены сила тяжести люстры и её вес?", "type": "choice", "options": ["Обе силы приложены только к люстре.", "Сила тяжести — к люстре, вес — к подвесу.", "Сила тяжести — к подвесу, вес — к люстре.", "Обе силы приложены только к подвесу."], "answer": 1, "explain": "Сила тяжести действует на люстру со стороны Земли. Вес — сила, с которой люстра действует на свой подвес. Эти силы приложены к разным телам.", "diagram": ""}, {"id": 8, "group": "m3", "title": "Сила тяжести", "text": "Масса детали 3,12 кг. Найди силу тяжести при g = 10 Н/кг.", "type": "number", "unit": "Н", "answer": 31.2, "explain": "Fтяж = mg = 3,12 × 10 = 31,2 Н. Масса и сила — разные величины с разными единицами.", "diagram": ""}, {"id": 9, "group": "m3", "title": "Жёсткость пружины · усложнённое", "text": "Груз массой 3 кг покоится на вертикальной пружине. Удлинение 6 см. Закон Гука выполняется, g = 10 Н/кг. Найди жёсткость пружины.", "type": "number", "unit": "Н/м", "answer": 500, "explain": "F = mg = 30 Н; Δl = 0,06 м. По закону Гука k = F/Δl = 30/0,06 = 500 Н/м.", "diagram": ""}, {"id": 10, "group": "m4", "title": "Давление и форма сосуда", "text": "В открытые сосуды разной формы налита одна и та же вода до одинаковой высоты. Давление воздуха над водой одинаково. Сравни давление воды у дна.", "type": "choice", "options": ["Одинаково: плотность и высота столба воды одинаковы.", "Больше в сосуде с наибольшим объёмом воды.", "Больше в самом узком сосуде.", "Зависит только от формы стенок."], "answer": 0, "explain": "Гидростатическая добавка давления p = ρgh. При одинаковой жидкости и высоте она одинакова; одинаковое давление воздуха не меняет сравнения.", "diagram": ""}, {"id": 11, "group": "m4", "title": "Давление вездехода", "text": "Масса вездехода 6 т. У него две гусеницы с площадью опоры по 1,5 м² каждая. Вес распределён по их общей площади. Найди среднее давление на грунт, g = 10 Н/кг.", "type": "number", "unit": "Па", "answer": 20000, "explain": "Масса 6000 кг; общая площадь 2 × 1,5 = 3 м². F = mg = 60000 Н; p = F/S = 60000/3 = 20000 Па.", "diagram": ""}, {"id": 12, "group": "m4", "title": "Давление на глубине", "text": "Найди избыточное гидростатическое давление воды на глубине 20 см. Плотность воды 1000 кг/м³, g = 10 Н/кг. Атмосферное давление не прибавляй.", "type": "number", "unit": "Па", "answer": 2000, "explain": "h = 0,2 м. p = ρgh = 1000 × 10 × 0,2 = 2000 Па. Это добавка к давлению на поверхности.", "diagram": ""}, {"id": 13, "group": "m5", "title": "Архимедова сила", "text": "Тело объёмом 500 см³ полностью погружено в воду и не касается сосуда. Найди выталкивающую силу. Плотность воды 1000 кг/м³, g = 10 Н/кг.", "type": "number", "unit": "Н", "answer": 5, "explain": "500 см³ = 0,0005 м³. FА = ρводыgV = 1000 × 10 × 0,0005 = 5 Н. Берут плотность жидкости, а не тела.", "diagram": ""}, {"id": 14, "group": "m5", "title": "Разность показаний динамометра", "text": "Неподвижное тонущее тело висит на динамометре: в воздухе показание 2,0 Н, при полном погружении в воду — 1,4 Н. Касания дна и стенок нет. Найди FА, пренебрегая выталкиванием воздуха.", "type": "number", "unit": "Н", "answer": 0.6, "explain": "При указанных условиях FА ≈ Tвоздух − Tвода = 2,0 − 1,4 = 0,6 Н.", "diagram": ""}, {"id": 15, "group": "m5", "title": "Условие всплытия", "text": "При полном погружении тела FА больше силы тяжести. Тело отпускают из покоя; других сил в начальный момент нет. Куда направлено начальное ускорение?", "type": "choice", "options": ["Вниз.", "Ускорение равно нулю.", "Вверх.", "Обязательно горизонтально."], "answer": 2, "explain": "Сила Архимеда направлена вверх, сила тяжести — вниз. Если FА > mg, равнодействующая и начальное ускорение направлены вверх. Это не означает, что при последующем плавании FА останется больше mg.", "diagram": ""}, {"id": 16, "group": "m6", "title": "Идеальные блоки", "text": "Сравни неподвижный блок и один подвижный блок, поддерживаемый двумя вертикальными ветвями нити. Блоки и нить идеальны, подъём равномерный. Какое утверждение верно?", "type": "choice", "options": ["Оба блока дают двукратный выигрыш в силе.", "Неподвижный блок даёт двукратный выигрыш в силе, подвижный — нет.", "Подвижный блок даёт двукратный выигрыш и в силе, и в работе.", "Неподвижный блок не даёт выигрыша в силе; подвижный даёт двукратный. Выигрыша в работе нет."], "answer": 3, "explain": "Неподвижный блок меняет направление силы. У указанного подвижного блока груз поддерживают две ветви: сила вдвое меньше, но путь свободного конца нити вдвое больше. В идеальной модели работа не уменьшается.", "diagram": ""}, {"id": 17, "group": "m6", "title": "Кинетическая энергия · усложнённое", "text": "Два автомобиля одинаковой массы движутся со скоростями 40 и 120 км/ч. Во сколько раз кинетическая энергия второго больше? Введи коэффициент.", "type": "number", "unit": "раз", "answer": 9, "explain": "Eк = mv²/2. Отношение скоростей 120/40 = 3; отношение энергий = 3² = 9.", "diagram": ""}, {"id": 18, "group": "m6", "title": "Полезная мощность крана", "text": "Кран равномерно поднимает груз массой 2 т на высоту 15 м за 30 с. Найди полезную мощность подъёма при g = 10 Н/кг.", "type": "number", "unit": "Вт", "answer": 10000, "explain": "m = 2000 кг. Работа A = mgh = 2000 × 10 × 15 = 300000 Дж. Полезная мощность N = A/t = 300000/30 = 10000 Вт.", "diagram": ""}, {"id": 19, "group": "m6", "title": "Длина рычага", "text": "Лёгким рычагом пренебрегаем по массе. Опора между концами. Вертикальные силы на концах 40 Н и 240 Н уравновешивают горизонтальный рычаг. Плечо силы 40 Н равно 60 см. Найди всю длину рычага в метрах.", "type": "number", "unit": "м", "answer": 0.7, "explain": "40 × 0,6 = 240 × l₂. Правое плечо l₂ = 0,1 м. Вся длина = 0,6 + 0,1 = 0,7 м.", "diagram": "<svg viewBox=\"0 0 600 240\" role=\"img\" aria-label=\"Рычаг: слева сила 40 ньютонов на плече 60 сантиметров, справа сила 240 ньютонов с неизвестным плечом\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"600\" height=\"240\" rx=\"16\" fill=\"#eef7fa\"/><path d=\"M70 100H530\" stroke=\"#31566c\" stroke-width=\"7\"/><path d=\"M420 106L390 156H450Z\" fill=\"#829ba8\"/><path d=\"M90 100v70m-10-12 10 12 10-12M510 100v70m-10-12 10 12 10-12\" stroke=\"#237f62\" stroke-width=\"4\" fill=\"none\"/><text x=\"90\" y=\"205\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">40 Н<\/text><text x=\"510\" y=\"205\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">240 Н<\/text><text x=\"255\" y=\"65\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">60 см<\/text><text x=\"475\" y=\"65\" text-anchor=\"middle\" font-family=\"Arial,sans-serif\" font-size=\"18\" fill=\"#173449\">?<\/text><\/svg>"}, {"id": 20, "group": "m6", "title": "КПД подвижного блока", "text": "Груз массой 36 кг равномерно поднимают на 5 м одним подвижным блоком с двумя поддерживающими вертикальными ветвями нити. Сила на свободном конце 200 Н, g = 10 Н/кг. Нить нерастяжима. Найди КПД.", "type": "number", "unit": "%", "answer": 90, "explain": "Полезная работа = mgh = 36 × 10 × 5 = 1800 Дж. Свободный конец нити проходит 2h = 10 м. Затраченная работа = 200 × 10 = 2000 Дж. КПД = 1800/2000 × 100% = 90%.", "diagram": ""}],GROUPS=[{"id": "m1", "name": "Измерения и строение вещества", "url": "index.html"}, {"id": "m2", "name": "Движение, масса и плотность", "url": "module2.html"}, {"id": "m3", "name": "Силы и взаимодействия", "url": "module3.html"}, {"id": "m4", "name": "Давление", "url": "module4.html"}, {"id": "m5", "name": "Архимедова сила и плавание", "url": "module5.html"}, {"id": "m6", "name": "Механизмы, работа и энергия", "url": "module6.html"}],KEY='fizika7-final-test-v1',VERSION=1,app=document.getElementById('app');
let storageProblem=false;
function fresh(){return {version:VERSION,started:false,done:false,index:0,answers:QUESTIONS.map(()=>''),finishedAt:''}}
function clean(raw){let s=fresh();if(!raw||raw.version!==VERSION||!Array.isArray(raw.answers))return s;s.started=raw.started===true;s.done=s.started&&raw.done===true;s.index=Number.isInteger(raw.index)?Math.max(0,Math.min(QUESTIONS.length-1,raw.index)):0;s.answers=QUESTIONS.map((q,i)=>{let a=raw.answers[i];if(typeof a!=='string')return '';if(q.type==='choice')return q.options.some((_,n)=>String(n)===a)?a:'';return a.slice(0,80)});s.finishedAt=typeof raw.finishedAt==='string'?raw.finishedAt.slice(0,50):'';return s}
function load(){try{let text=localStorage.getItem(KEY);if(!text)return fresh();return clean(JSON.parse(text))}catch(e){storageProblem=true;return fresh()}}
let state=load();
function notice(){let el=document.getElementById('storage-warning');if(el)el.textContent=storageProblem?'Не удалось прочитать или сохранить попытку в браузере. Не закрывай страницу до завершения; готовый результат можно скачать в TXT.':''}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageProblem=false}catch(e){storageProblem=true}notice();let el=document.getElementById('save-status');if(el)el.textContent=storageProblem?'Сохранение недоступно — см. предупреждение выше.':'Ответ сохранён в этом браузере.'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function numeric(raw){let s=String(raw).trim().replace(/\s/g,'').replace(',','.');if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?$/i.test(s))return null;let n=Number(s);return Number.isFinite(n)?n:null}
function supplied(a){return String(a).trim()!==''}
function correct(q,a){if(!supplied(a))return false;if(q.type==='choice')return a===String(q.answer);let n=numeric(a);return n!==null&&Math.abs(n-q.answer)<=Math.max(1e-9,Math.abs(q.answer)*1e-6)}
function score(s){return QUESTIONS.reduce((n,q,i)=>n+(correct(q,s.answers[i])?1:0),0)}
function count(){return state.answers.filter(supplied).length}
function answerText(q,a){if(!supplied(a))return 'Нет ответа';return q.type==='choice'?(q.options[Number(a)]||'Нет ответа'):a+' '+q.unit}
function expectedText(q){return q.type==='choice'?q.options[q.answer]:String(q.answer).replace('.',',')+' '+q.unit}
function groupStats(){return GROUPS.map(g=>({...g,total:QUESTIONS.filter(q=>q.group===g.id).length,right:QUESTIONS.reduce((n,q,i)=>n+(q.group===g.id&&correct(q,state.answers[i])?1:0),0)}))}
function level(n){return n>=18?'Отличный результат этой попытки':n>=14?'Хорошая основа; разбери оставшиеся ошибки':n>=8?'Есть пробелы; повтори отмеченные темы':'Начни с повторения основных тем, затем попробуй снова'}
function home(){app.innerHTML=`<section class="card"><span class="tag">Итоговый тест · Версия 1.0</span><h2>Проверка по всему курсу</h2><p>20 заданий по измерениям, веществу, движению, плотности, силам, давлению, плаванию и механизмам.</p><ul><li>Один вопрос на экране; можно возвращаться и менять ответы до завершения.</li><li>6 заданий с выбором одного ответа и 14 с числовым ответом.</li><li>Каждое задание — 1 балл, максимум 20. Ход решения автоматически не оценивается.</li><li>Без таймера. Можно сделать паузу и продолжить в этом браузере.</li><li>Ответы и разбор открываются только после подтверждения завершения.</li></ul><p>В числовых полях вводи только число в указанной единице. Подходят запятая и точка. Все расчётные ответы можно записать без округления. Где требуется, принимаем g = 10 Н/кг.</p><p class="feedback hint">Это учебная самопроверка, а не школьная отметка или защищённый экзамен. Вопросы и ответы находятся в файле страницы; защита от подсматривания не предусмотрена.</p><p class="muted">Адаптация материалов исходного комплекта контрольных работ. Подробный разбор — после завершения. Имя и другие личные данные не нужны.</p><button id="start" class="primary">${state.done?'Посмотреть результат':state.started?'Продолжить попытку · заполнено '+count()+' из 20':'Начать тест'}</button>${state.started?'<button id="restart">Начать заново — удалить только эту попытку</button>':''}</section><section id="confirmation" class="card" hidden></section><nav class="nav"><a class="link" href="./start.html">Общее меню</a><a class="link" href="./labs.html">Лабораторные</a></nav>`;document.getElementById('start').onclick=()=>{if(state.done)return results();state.started=true;save();question(state.index)};let reset=document.getElementById('restart');if(reset)reset.onclick=restartPrompt;notice();window.scrollTo(0,0)}
function updateProgress(){let n=count(),el=document.getElementById('filled');if(el)el.textContent='Заполнено '+n+' из '+QUESTIONS.length;let bar=document.getElementById('progress-bar');if(bar)bar.style.width=n/QUESTIONS.length*100+'%';let nav=document.getElementById('question-buttons');if(nav)Array.from(nav.children).forEach((b,i)=>{b.className=(supplied(state.answers[i])?'answered ':'')+(i===state.index?'current':'');b.setAttribute('aria-label','Задание '+(i+1)+(supplied(state.answers[i])?', ответ введён':', без ответа'))})}
function question(index){if(state.done)return results();state.index=index;save();let q=QUESTIONS[index],group=GROUPS.find(g=>g.id===q.group);app.innerHTML=`<section class="card"><span class="tag">Задание ${index+1} из ${QUESTIONS.length} · 1 балл</span><p class="muted">${group.name}</p><h2>${q.title}</h2><p>${q.text}</p>${q.diagram?'<figure>'+q.diagram+'<figcaption>Учебная схема условия.</figcaption></figure>':''}${q.type==='choice'?'<fieldset><legend>Выбери один ответ</legend>'+q.options.map((o,i)=>'<label class="option"><input type="radio" name="answer" id="option-'+i+'" value="'+i+'"><span>'+o+'</span></label>').join('')+'</fieldset>':'<label for="answer-number">Ответ, '+q.unit+'</label><input id="answer-number" type="text" inputmode="decimal" maxlength="80" autocomplete="off"><p class="muted">Только число. Единица ответа: '+q.unit+'.</p>'}<button id="clear">Очистить ответ на это задание</button><p id="validation" class="feedback hint" role="alert" hidden></p><p id="save-status" class="muted" role="status"></p><div class="nav"><button id="prev">← Назад</button><button id="next" class="primary">${index===QUESTIONS.length-1?'К завершению':'Дальше →'}</button></div></section><section class="card"><p id="filled"></p><div class="progress" aria-hidden="true"><span id="progress-bar"></span></div><p class="muted">Номер с зелёным фоном означает только введённый ответ, не его правильность.</p><div id="question-buttons" class="numbers" aria-label="Переход к заданию"></div><button id="finish">Завершить и проверить</button><button id="pause">Пауза — к началу теста</button></section>`;
function changed(a){state.answers[index]=a;save();updateProgress();document.getElementById('validation').hidden=true}
if(q.type==='choice')q.options.forEach((_,i)=>{let el=document.getElementById('option-'+i);el.checked=state.answers[index]===String(i);el.onchange=()=>changed(String(i))});else{let el=document.getElementById('answer-number');el.value=state.answers[index];el.oninput=()=>changed(el.value)}
document.getElementById('clear').onclick=()=>{changed('');if(q.type==='choice')q.options.forEach((_,i)=>document.getElementById('option-'+i).checked=false);else document.getElementById('answer-number').value=''};
function validate(){if(q.type==='number'&&supplied(state.answers[index])&&numeric(state.answers[index])===null){let el=document.getElementById('validation');el.hidden=false;el.textContent='Введи число без единиц, например 3,12. Можно очистить поле и вернуться к заданию позже.';document.getElementById('answer-number').focus();return false}return true}
let prev=document.getElementById('prev');prev.disabled=index===0;prev.onclick=()=>question(index-1);document.getElementById('next').onclick=()=>{if(!validate())return;if(index===QUESTIONS.length-1)finishPrompt();else question(index+1)};let buttons=document.getElementById('question-buttons');QUESTIONS.forEach((_,i)=>{let b=document.createElement('button');b.textContent=String(i+1);b.onclick=()=>question(i);buttons.appendChild(b)});document.getElementById('finish').onclick=finishPrompt;document.getElementById('pause').onclick=()=>{save();home()};updateProgress();notice();window.scrollTo(0,0)}
function finishPrompt(){let invalid=QUESTIONS.findIndex((q,i)=>q.type==='number'&&supplied(state.answers[i])&&numeric(state.answers[i])===null);if(invalid>=0){question(invalid);let v=document.getElementById('validation');v.hidden=false;v.textContent='Здесь введено не число. Исправь ответ или очисти поле, чтобы оставить задание без ответа.';return}let n=count();app.innerHTML=`<section class="card"><h2>Завершить попытку?</h2><p>Заполнено ${n} из ${QUESTIONS.length}. Без ответа: ${QUESTIONS.length-n}.</p><p>После подтверждения откроются правильные ответы и разбор. Менять ответы этой попытки уже нельзя. Можно будет начать новую попытку с теми же заданиями.</p>${n<QUESTIONS.length?'<p class="feedback hint">Незаполненные задания дадут 0 баллов. Можно вернуться и дописать ответы.</p>':''}<button id="confirm-finish" class="primary">Да, завершить и проверить</button><button id="cancel-finish">Вернуться к заданиям</button></section>`;document.getElementById('cancel-finish').onclick=()=>question(state.index);document.getElementById('confirm-finish').onclick=()=>{state.done=true;state.finishedAt=new Date().toISOString();save();results()};notice();window.scrollTo(0,0)}
function report(){if(!state.done)return '';let n=score(state),lines=['Итоговый тест по физике · 7 класс','Версия теста: 1.0','Завершено: '+state.finishedAt,'Результат: '+n+' из '+QUESTIONS.length+' ('+Math.round(n/QUESTIONS.length*100)+'%)',level(n),'Учебная самопроверка, не школьная отметка. Проверяются ответы, а не ход решения.','',...groupStats().map(g=>g.name+': '+g.right+' из '+g.total),''];QUESTIONS.forEach((q,i)=>lines.push('Задание '+(i+1)+'. '+q.title,q.text,'Мой ответ: '+answerText(q,state.answers[i]),'Баллы: '+(correct(q,state.answers[i])?'1':'0')+' из 1','Правильный ответ: '+expectedText(q),'Разбор: '+q.explain,''));return lines.join('\n')}
function download(text){let url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='fizika-final-test-result.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function results(){if(!state.done)return home();let n=score(state),stats=groupStats(),weak=stats.filter(g=>g.right<g.total);app.innerHTML=`<section class="card"><span class="tag">Попытка завершена</span><h2>${n} из ${QUESTIONS.length} · ${Math.round(n/QUESTIONS.length*100)}%</h2><p>${level(n)}</p><p class="muted">Каждое задание — 1 балл. Пустой или неправильный ответ — 0. Это учебная шкала, а не школьная отметка; способ решения не оценивается.</p><table><thead><tr><th scope="col">Тема</th><th scope="col">Верно</th><th scope="col">Всего</th></tr></thead><tbody>${stats.map(g=>'<tr><td>'+g.name+'</td><td>'+g.right+'</td><td>'+g.total+'</td></tr>').join('')}</tbody></table><button id="export">Скачать результат и разбор TXT</button><button id="print">Печать / сохранить в PDF средствами браузера</button><button id="restart">Начать заново — удалить только эту попытку</button><a class="link" href="./start.html">Общее меню</a></section><section id="confirmation" class="card" hidden></section><section class="card"><h2>Что повторить</h2>${weak.length?'<p>В этих темах есть ошибки или пропуски:</p>'+weak.map(g=>'<a class="link" href="./'+g.url+'">'+g.name+' — '+g.right+' из '+g.total+'</a>').join(''):'<p>Все ответы этой попытки верны. Для проверки понимания объясни решения своими словами; один тест не подтверждает владение всем курсом.</p>'}</section><section class="card"><h2>Разбор всех заданий</h2><p class="muted">Нажми на задание, чтобы открыть свой ответ и объяснение.</p>${QUESTIONS.map((q,i)=>'<details><summary>'+ (correct(q,state.answers[i])?'Верно':'Ошибка или пропуск')+' · '+(i+1)+'. '+q.title+'</summary><p>'+q.text+'</p><p>Мой ответ: <span class="answer-line">'+esc(answerText(q,state.answers[i]))+'</span></p><p>Правильный ответ: '+expectedText(q)+'</p><p>'+q.explain+'</p></details>').join('')}</section>`;document.getElementById('export').onclick=()=>download(report());document.getElementById('print').onclick=()=>{document.getElementById('print-text').textContent=report();window.print()};document.getElementById('restart').onclick=restartPrompt;notice();window.scrollTo(0,0)}
function restartPrompt(){let box=document.getElementById('confirmation');box.hidden=false;box.innerHTML='<h2>Удалить только текущую попытку теста?</h2><p>Сначала скачай результат, если он нужен. Задания при повторе будут теми же. Лабораторные и другие разделы не затрагиваются.</p><button id="confirm-restart" class="primary">Да, начать заново</button><button id="cancel-restart">Отмена — сохранить попытку</button>';document.getElementById('cancel-restart').onclick=()=>box.hidden=true;document.getElementById('confirm-restart').onclick=()=>{state=fresh();save();home()};box.scrollIntoView({block:'start',behavior:'smooth'})}
try{home()}catch(e){app.innerHTML='<section class="card"><h2>Не удалось открыть тест</h2><p>Попытка не сбрасывается автоматически. Сообщи текст ошибки:</p><pre id="error"></pre></section>';document.getElementById('error').textContent=String(e.message||e)}
})();
</script></body></html>
