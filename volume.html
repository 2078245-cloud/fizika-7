const KEY='fizika7-volume-v1',app=document.getElementById('app');
let storageFailed=false;
function load(){try{const saved=JSON.parse(localStorage.getItem(KEY));const ids=new Set(TASKS.map(t=>t.id));return{done:saved&&Array.isArray(saved.done)?[...new Set(saved.done.filter(id=>ids.has(id)))]:[],help:saved&&Array.isArray(saved.help)?saved.help.filter(id=>ids.has(id)):[]}}catch(e){return{done:[],help:[]}}}
let progress=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(progress));storageFailed=false}catch(e){storageFailed=true}}
function notice(){return storageFailed?'<p class="feedback hint" role="status">Результаты не удалось сохранить в браузере. Задания по-прежнему доступны.</p>':''}
function home(){const n=progress.done.length;app.innerHTML=`<section class="card"><span class="tag">Отдельный тренажёр · Версия 1.0</span><h2>Девять задач на объём</h2><p>Чтение шкалы, переливание, остаток, вместимость и перевод литров в миллилитры. Вводи ответ числом: единица уже указана.</p><div class="bar" role="progressbar" aria-label="Выполненные задачи" aria-valuemin="0" aria-valuemax="9" aria-valuenow="${n}"><div style="width:${n/TASKS.length*100}%"></div></div><p class="muted">Выполнено ${n} из 9. Это не школьная оценка.</p><button id="continue" class="primary">${n===TASKS.length?'Повторить задачи':'Начать / продолжить'}</button></section><section class="card"><h2>Выбери задачу</h2><div id="list"></div></section><section class="card"><h2>Памятка</h2><p>1 л = 1000 мл. Для чтения шкалы сначала найди цену деления. Смотри на поверхность воды на уровне глаз; при заметном вогнутом мениске отсчёт ведут по его нижней части.</p><p class="muted">На рисунках поверхность упрощена до горизонтальной линии. Не измеряй экранной картинкой реальные предметы. Задачи решаются по указанным условиям, не по размеру изображения.</p><p class="muted">Прогресс хранится отдельно от основного учебника в этом браузере. Между устройствами автоматически не переносится.</p>${notice()}</section><a class="link" href="./index.html">← Вернуться в основной учебник</a><details class="card" style="margin-top:20px"><summary>Источники и безопасность</summary><p class="muted">Единицы и приёмы измерения: <a href="https://www.bbc.co.uk/bitesize/articles/z6tcmbk" target="_blank" rel="noopener noreferrer">BBC Bitesize</a>. Условия и рисунки — учебные. Никаких опытов с кипятком, стеклом, неизвестными жидкостями или электроникой. Для домашней проверки достаточно воды комнатной температуры, пластиковой ёмкости и подноса.</p></details>`;const list=document.getElementById('list');TASKS.forEach((t,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'. '+t.title+(progress.done.includes(t.id)?(progress.help.includes(t.id)?' — с подсказкой':' — выполнено'):'');b.onclick=()=>openTask(i);list.appendChild(b)});document.getElementById('continue').onclick=()=>{let i=TASKS.findIndex(t=>!progress.done.includes(t.id));openTask(i<0?0:i)};window.scrollTo(0,0)}
function parseAnswer(value){const s=value.trim().replace(',','.');if(!/^\d+(?:\.\d+)?$/.test(s))return null;const n=Number(s);return Number.isFinite(n)?n:null}
function openTask(index){const t=TASKS[index];let hints=0,helped=false,solved=false;app.innerHTML=`<button id="back">← К списку задач</button><section class="card" style="margin-top:18px"><span class="tag">Задача ${index+1} из ${TASKS.length}</span><h2>${t.title}</h2><p>${t.prompt}</p><figure>${t.diagram}<figcaption>Учебный рисунок. Масштаб экрана не определяет объём.</figcaption></figure></section><section class="card"><h2>Как рассуждать</h2><ol class="flow">${t.steps.map(s=>'<li>'+s+'</li>').join('')}</ol></section><section class="card"><form id="answer-form" novalidate><label for="answer">Твой ответ, мл</label><input id="answer" type="text" inputmode="decimal" autocomplete="off" placeholder="Введи число" aria-describedby="format-note"><p id="format-note" class="muted">Например, 75. Единицу «мл» писать не нужно.</p><button id="check" class="primary" type="submit">Проверить ответ</button></form><button id="hint" type="button">Подсказка</button><div id="feedback" role="status" aria-live="polite" hidden></div><div id="hint-text" class="feedback hint" role="status" hidden></div><details id="worked" hidden><summary>Показать разбор и вернуться к попытке</summary><p>${t.solution}</p></details><button id="next" class="primary" hidden>${index<TASKS.length-1?'Следующая задача →':'Завершить тренажёр'}</button><div id="storage-status"></div></section>`;document.getElementById('back').onclick=home;const input=document.getElementById('answer'),fb=document.getElementById('feedback');function feedback(message,correct){fb.hidden=false;fb.className='feedback '+(correct?'good':'hint');fb.textContent=message}
document.getElementById('answer-form').onsubmit=function(e){e.preventDefault();if(solved)return;const value=parseAnswer(input.value);if(value===null){feedback('Введи только неотрицательное число, например 75. Можно использовать запятую или точку.',false);return}if(Math.abs(value-t.answer)>1e-8){helped=true;feedback('Пока не совпало. Сверь единицы и шаги схемы. Можно открыть подсказку.',false);return}solved=true;feedback('Верно! '+t.solution,true);if(!progress.done.includes(t.id))progress.done.push(t.id);if(helped&&!progress.help.includes(t.id))progress.help.push(t.id);save();input.disabled=true;document.getElementById('check').disabled=true;document.getElementById('hint').hidden=true;document.getElementById('next').hidden=false;document.getElementById('storage-status').innerHTML=notice()};
document.getElementById('hint').onclick=function(){helped=true;const box=document.getElementById('hint-text');box.hidden=false;box.textContent=t.hints[Math.min(hints,t.hints.length-1)];hints++;this.textContent=hints<t.hints.length?'Ещё подсказка':'Подсказки открыты';if(hints>=t.hints.length){this.disabled=true;document.getElementById('worked').hidden=false}};
document.getElementById('worked').ontoggle=function(){if(this.open)helped=true};document.getElementById('next').onclick=()=>index<TASKS.length-1?openTask(index+1):home();window.scrollTo(0,0)}
try{home()}catch(e){app.innerHTML='<section class="card"><h2>Не удалось открыть тренажёр</h2><pre id="error"></pre></section>';document.getElementById('error').textContent=String(e.message||e)}
})();
</script></body></html>
